// ── js/chords.js ──
// Returns all chords playable on this layout, deduped by root + type
function findAllChords(layout) {
  const allNotes = getAllNotes(layout);
  const pcs = allNotes.map(notePC);
  const uniquePCs = [...new Set(pcs)];
  const results = [];
  const seen = new Set();

  for (const rootPC of uniquePCs) {
    for (const type of CHORD_TYPES) {
      const key = `${rootPC}-${type.id}`;
      if (seen.has(key)) continue;

      // Octave dyad: same pitch class, different octave
      if (type.id === 'oct') {
        const rootNotes = allNotes.filter(n => notePC(n) === rootPC);
        if (rootNotes.length >= 2) {
          const sorted = [...rootNotes].sort((a, b) => noteToMidi(a) - noteToMidi(b));
          seen.add(key);
          results.push({
            id: `${getNoteName(sorted[0])}-oct`,
            rootName: getNoteName(sorted[0]),
            rootNote: sorted[0],
            type,
            notes: sorted,
            noteCount: 2,
          });
        }
        continue;
      }

      const requiredPCs = type.intervals.map(i => (rootPC + i) % 12);
      if (!requiredPCs.every(pc => uniquePCs.includes(pc))) continue;

      // Pick one representative note per required PC (lowest pitch on instrument)
      const chordNotes = requiredPCs.map(pc => {
        const matches = allNotes.filter(n => notePC(n) === pc);
        return matches.sort((a, b) => noteToMidi(a) - noteToMidi(b))[0];
      });

      const rootNote = allNotes
        .filter(n => notePC(n) === rootPC)
        .sort((a, b) => noteToMidi(a) - noteToMidi(b))[0];

      seen.add(key);
      results.push({
        id: `${getNoteName(rootNote)}-${type.id}`,
        rootName: getNoteName(rootNote),
        rootNote,
        type,
        notes: chordNotes,
        noteCount: type.intervals.length,
      });
    }
  }

  return results;
}

// Identify which known chord type(s) an arbitrary set of notes forms (Discover mode).
// Tries each selected note as a candidate root and checks the resulting interval
// set against every CHORD_TYPES entry. Returns [] if fewer than 2 distinct
// pitch classes are given, or nothing matches.
function identifyChord(selectedNotes) {
  const byPC = new Map();
  selectedNotes.forEach(n => byPC.set(notePC(n), n)); // last-clicked note wins per pitch class
  const uniqueNotes = [...byPC.values()];
  if (uniqueNotes.length < 2) return [];
  const pcs = uniqueNotes.map(notePC);

  const matches = [];
  for (const rootNote of uniqueNotes) {
    const rootPC = notePC(rootNote);
    const intervals = pcs.map(pc => (pc - rootPC + 12) % 12).sort((a, b) => a - b);
    for (const type of CHORD_TYPES) {
      if (type.id === 'oct') continue;
      const typeIntervals = [...type.intervals].sort((a, b) => a - b);
      if (typeIntervals.length !== intervals.length) continue;
      if (!typeIntervals.every((iv, i) => iv === intervals[i])) continue;
      const notes = type.intervals.map(iv => uniqueNotes.find(n => notePC(n) === (rootPC + iv) % 12));
      matches.push({
        id: `${getNoteName(rootNote)}-${type.id}`,
        rootNote, rootName: getNoteName(rootNote),
        type, notes, noteCount: notes.length,
      });
    }
  }
  return matches;
}

// Returns related chords: same type / other roots, and chords sharing 2+ notes
function getRelatedChords(chord, allChords) {
  const sameType = allChords.filter(c =>
    c.type.id === chord.type.id && c.id !== chord.id
  );

  const chordPCs = new Set(chord.notes.map(notePC));
  const sharedNotes = allChords.filter(c => {
    if (c.id === chord.id || c.type.id === chord.type.id) return false;
    const sharedCount = c.notes.filter(n => chordPCs.has(notePC(n))).length;
    return sharedCount >= 2;
  });

  return { sameType, sharedNotes };
}


// ── js/scalefinder.js ──
// Scale finder: which handpan scale has the notes a player strikes into the
// tuner ("Listen" on Try a scale and in the wizard's handpan step).
//
// The first note collected is taken as the ding. Notes are compared by exact
// MIDI number; a note of the scale in another octave counts for less (the
// tuner can jump an octave on a ringing note).
//
// Pure functions; unit tested in Node.

// Weights of the ranking (see rankScalesByNotes).
const SF_DING_EXACT = 10;   // first note heard = the scale's ding
const SF_DING_OCTAVE = 4;   // ding's pitch class, another octave
const SF_NOTE_EXACT = 3;    // any other heard note in the scale
const SF_NOTE_OCTAVE = 0;   // its pitch class is in the scale, another octave
const SF_NOTE_MISSING = -4; // not in the scale at all
const SF_COVERAGE = 4;      // × the share of the scale's notes heard
const SF_OVERTONE = 0;      // not in the scale, but an overtone of another note heard
// Intervals (semitones) at which a struck note's overtones sound: the
// octave, octave + fifth, two octaves, two octaves + third and + fifth.
const SF_OVERTONE_STEPS = [12, 19, 24, 28, 31];

// 'Bb3' style name of a MIDI number (the spelling SCALES uses most).
function heardNoteName(midi) {
  return FLAT_NAMES[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
}

// Adds a stable reading (fractional MIDI) to the notes collected so far,
// in the order heard. Returns the new list, or null when the reading is not
// a new note: within ±tolCents of a note already collected (a note still
// ringing, heard again) or rounding to one already there. A note an octave
// or two below a collected one and below the ding is ring-over too: two
// notes sounding together (D3 and A3) read as their common lower octave
// (D2), and no handpan scale has a note an octave below its ding.
function addHeardNote(notes, midi, { tolCents = 30 } = {}) {
  if (!Number.isFinite(midi)) return null;
  const m = Math.round(midi);
  if (notes.includes(m)) return null;
  if (notes.some(n => Math.abs(midi - n) * 100 <= tolCents)) return null;
  if (notes.length && m < notes[0] && notes.some(n => n - m === 12 || n - m === 24)) return null;
  return [...notes, m];
}

// Every note of a scale (ding, top, bottom) as MIDI numbers.
function sfScaleMidis(scale) {
  return [scale.top.ding, ...scale.top.notes, ...scale.bottom.notes].map(noteToMidi);
}

// Ranks scales by the notes heard (MIDI numbers, the first is the ding).
// Returns [{ scale, score, matched, total, missing: [midi], octave: [midi], overtone: [midi],
// ding: 'exact' | 'higher' | 'lower' | 'none', reasons: [text] }], best first.
// ding 'higher' means the scale's ding is an octave (or more) above the note
// heard first. name(midi) spells notes in the reasons.
function rankScalesByNotes(heard, scales, { name = heardNoteName } = {}) {
  if (!heard.length) return [];
  const [first] = heard;
  const out = scales.map((scale, order) => {
    const midis = sfScaleMidis(scale);
    const set = new Set(midis);
    const pcs = new Set(midis.map(m => ((m % 12) + 12) % 12));
    const ding = midis[0];
    const pc = m => ((m % 12) + 12) % 12;
    let score = 0;
    const matched = [], octave = [], missing = [], overtone = [];
    let dingMatch = 'none';
    heard.forEach((m, i) => {
      if (i === 0 && m === ding) { dingMatch = 'exact'; score += SF_DING_EXACT; matched.push(m); return; }
      if (i === 0 && pc(m) === pc(ding)) {
        dingMatch = ding > m ? 'higher' : 'lower';
        score += SF_DING_OCTAVE;
        if (set.has(m)) matched.push(m); else octave.push(m);
        return;
      }
      if (set.has(m)) { score += SF_NOTE_EXACT; matched.push(m); return; }
      // A note the scale doesn't have that sits an overtone above one it
      // does (C4 → G5) was most likely heard ringing over: no penalty.
      if (heard.some(h => set.has(h) && SF_OVERTONE_STEPS.includes(m - h))) { score += SF_OVERTONE; overtone.push(m); return; }
      if (pcs.has(pc(m))) { score += SF_NOTE_OCTAVE; octave.push(m); } else { score += SF_NOTE_MISSING; missing.push(m); }
    });
    score += SF_COVERAGE * (matched.length / set.size);
    const reasons = [];
    if (heard.length > 1) {
      reasons.push(matched.length === heard.length ? `all ${heard.length} notes match` : `${matched.length} of ${heard.length} notes match`);
    }
    if (dingMatch === 'exact') reasons.push('ding matches');
    else if (dingMatch !== 'none') reasons.push(`ding ${name(ding)}: an octave ${dingMatch} than ${name(first)}`);
    else if (set.has(first)) reasons.push(`${name(first)} isn't its ding`);
    const oct = octave.filter(m => !(m === first && dingMatch !== 'none'));
    if (missing.length) reasons.push(`not in it: ${missing.map(name).join(', ')}`);
    if (oct.length) reasons.push(`other octave: ${oct.map(name).join(', ')}`);
    if (overtone.length) reasons.push(`overtones: ${overtone.map(name).join(', ')}`);
    if (heard.length > 1 && matched.length === set.size) reasons.push('all its notes heard');
    return { scale, score, matched, total: set.size, octave, missing, overtone, ding: dingMatch, reasons, order };
  });
  out.sort((a, b) => b.score - a.score || a.order - b.order);
  return out.map(({ order, ...r }) => r);
}


// ── js/chordsheet.js ──
// Chord sheets: from a pasted ChordPro or chord-over-lyrics sheet to a timed
// list of chords, fitted to an instrument, and from a chord to a pattern the
// player can strike (docs/ocarina-mode.md, "Next project: songs on any
// instrument" and "From chord sheet to playing").
//
// Pure functions, no DOM: everything here is unit-tested in Node
// (tests/chordsheet.test.mjs). The bundle is one script scope, so every
// top-level name here is unique across js/*.js.

// ── Chord symbols ────────────────────────────────────────────────────────────

const CS_LETTER_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const CS_SHARP_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const CS_FLAT_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

// Quality (normalised suffix) → intervals above the root. A quality whose
// interval set isn't one of CHORD_TYPES (7sus4, 11, 13) is still a chord,
// it just can't be mapped, and is reported as such.
const CS_QUALITIES = {
  '': [0, 4, 7], maj: [0, 4, 7],
  m: [0, 3, 7],
  dim: [0, 3, 6], aug: [0, 4, 8],
  sus2: [0, 2, 7], sus4: [0, 5, 7],
  5: [0, 7],
  6: [0, 4, 7, 9], m6: [0, 3, 7, 9],
  7: [0, 4, 7, 10], maj7: [0, 4, 7, 11], m7: [0, 3, 7, 10], mmaj7: [0, 3, 7, 11],
  dim7: [0, 3, 6, 9], m7b5: [0, 3, 6, 10], augmaj7: [0, 4, 8, 11], aug7: [0, 4, 8, 10],
  add9: [0, 4, 7, 2], madd9: [0, 3, 7, 2],
  9: [0, 4, 7, 10, 2], maj9: [0, 4, 7, 11, 2], m9: [0, 3, 7, 10, 2],
  '7sus4': [0, 5, 7, 10], '7sus2': [0, 2, 7, 10],
  11: [0, 4, 7, 10, 2, 5], m11: [0, 3, 7, 10, 2, 5],
  13: [0, 4, 7, 10, 2, 9], maj13: [0, 4, 7, 11, 2, 9], m13: [0, 3, 7, 10, 2, 9],
};

// The ways sheets write a quality, rewritten to the keys above.
function csNormalizeQuality(raw) {
  let q = raw.replace(/[()]/g, '').replace(/♯/g, '#').replace(/♭/g, 'b');
  q = q.replace(/^Δ7?/, 'maj7').replace(/^M(?=7|9|13)/, 'maj').replace(/^Maj/, 'maj').replace(/^ma(?=7|9|13)/, 'maj');
  q = q.replace(/^ø7?/, 'm7b5').replace(/^°7/, 'dim7').replace(/^°/, 'dim');
  q = q.replace(/^min/, 'm').replace(/^mi(?!n)/, 'm').replace(/^-/, 'm');
  q = q.replace(/^\+/, 'aug').replace(/^aug5?/, 'aug');
  q = q.replace(/^m(maj|M)7/, 'mmaj7');
  q = q.replace(/^maj$/, '').replace(/^M$/, '');
  q = q.replace(/sus$/, 'sus4').replace(/add2$/, 'add9');
  if (q === '2') q = 'sus2';
  if (q === 'm7-5') q = 'm7b5';
  if (q === '7+' || q === '+7') q = 'aug7';
  if (q === 'maj7+5' || q === 'maj7#5') q = 'augmaj7';
  return q;
}

// The CHORD_TYPES entry with exactly these intervals (in any order), or null.
// The octave dyad has no symbol and is never matched.
function chordTypeForIntervals(intervals) {
  if (!intervals) return null;
  const key = [...new Set(intervals.map(i => ((i % 12) + 12) % 12))].sort((a, b) => a - b).join(',');
  return CHORD_TYPES.find(t => t.id !== 'oct'
    && [...new Set(t.intervals)].sort((a, b) => a - b).join(',') === key) ?? null;
}

// Loose shape of a chord symbol: what decides whether a line holds chords.
const CS_CHORDISH = /^[A-G](?:#|b|♯|♭)?(?:maj|min|mi|m|M|Maj|ma|dim|aug|sus|add|alt|no|omit|[0-9]|\+|-|°|ø|Δ|\(|\)|#|b|♯|♭|,)*(?:\/[A-G](?:#|b|♯|♭)?)?$/;

// 'C#m7/G#' → { symbol, root 'C#', rootPC 1, suffix 'm7', quality 'm7',
// intervals, type (a CHORD_TYPES entry or null), bass 'G#', bassPC 8 }.
// null when the text isn't a chord symbol at all. A slash chord is played
// as its chord; the bass note is kept for information.
function parseChordSymbol(text) {
  const s = String(text ?? '').trim();
  if (!CS_CHORDISH.test(s)) return null;
  const m = /^([A-G])(#|b|♯|♭)?([^/]*)(?:\/([A-G])(#|b|♯|♭)?)?$/.exec(s);
  if (!m) return null;
  const acc = (m[2] ?? '').replace('♯', '#').replace('♭', 'b');
  const rootPC = (CS_LETTER_PC[m[1]] + (acc === '#' ? 1 : acc === 'b' ? -1 : 0) + 12) % 12;
  const quality = csNormalizeQuality(m[3]);
  const intervals = CS_QUALITIES[quality] ?? null;
  const bassAcc = (m[5] ?? '').replace('♯', '#').replace('♭', 'b');
  const bass = m[4] ? m[4] + bassAcc : null;
  return {
    symbol: s,
    root: m[1] + acc,
    rootPC,
    suffix: m[3],
    quality,
    intervals,
    type: chordTypeForIntervals(intervals),
    bass,
    bassPC: bass ? (CS_LETTER_PC[m[4]] + (bassAcc === '#' ? 1 : bassAcc === 'b' ? -1 : 0) + 12) % 12 : null,
  };
}

// A root name for a pitch class: sharps when the sheet spelled the chord
// with a sharp, otherwise the app's usual names (Eb, Ab, Bb, but C#, F#).
function csSpell(pc, preferSharp) {
  const p = ((pc % 12) + 12) % 12;
  if (preferSharp) return CS_SHARP_NAMES[p];
  return [1, 6].includes(p) ? CS_SHARP_NAMES[p] : CS_FLAT_NAMES[p];
}

// The symbol moved by `semis` semitones, keeping its suffix and bass.
function transposeChordSymbol(chord, semis) {
  if (!chord) return '';
  if (!semis) return chord.symbol;
  const sharp = chord.root.includes('#');
  const bass = chord.bass ? '/' + csSpell(chord.bassPC + semis, chord.bass.includes('#')) : '';
  return csSpell(chord.rootPC + semis, sharp) + chord.suffix + bass;
}

// ── Sheets ───────────────────────────────────────────────────────────────────

const CS_SECTION_WORDS = /^(intro|verse|chorus|pre-?chorus|bridge|outro|interlude|instrumental|solo|refrain|coda|ending|tag|hook|break|riff|vamp)\b/i;

// "Verse 2:", "[Chorus]", "(Bridge)", "Pre-chorus x2" on a line of its own
// → the section name (without the repeat count).
function csSectionHeading(line) {
  const t = line.trim().replace(/^[[(]\s*/, '').replace(/\s*[\])]\s*:?$/, '').replace(/:$/, '').trim();
  const m = /^([a-z-]+(?:[\s-]*\d+)?)(?:\s*\(?(?:x\s?\d+|\d+\s?x)\)?)?$/i.exec(t);
  if (!m || !CS_SECTION_WORDS.test(m[1])) return null;
  return m[1].charAt(0).toUpperCase() + m[1].slice(1);
}

const CS_IGNORED_TOKEN = /^(?:-|–|—|\/|\.|\.\.\.|…|N\.?C\.?|\(|\)|:)$/i;
const CS_REPEAT_TOKEN = /^\(?(?:x\s?(\d+)|(\d+)\s?x)\)?$/i;

// The chord and bar-line tokens of one line, or null when the line is
// lyrics (or anything else that isn't only chords). ChordPro inline chords
// ([Am]) count wherever they are; the words around them are lyrics.
function csLineTokens(line) {
  const inline = [...line.matchAll(/\[([^\]]*)\]/g)];
  // "| [C] [G] | Am |": brackets on a line of chords are just brackets.
  if (inline.length && inline.every(m => parseChordSymbol(m[1]))) {
    const plain = line.replace(/\[([^\]]*)\]/g, ' $1 ');
    if (plain.trim() !== line.trim() && csLineTokens(plain)) return csLineTokens(plain);
  }
  if (inline.length) {
    const out = [];
    let repeat = 1;
    let rest = line;
    for (const m of inline) {
      const c = parseChordSymbol(m[1]);
      if (c) out.push({ chord: c, at: m.index });
    }
    if (!out.length) return null;
    // Bar lines outside the brackets, in order with the chords.
    rest = line.replace(/\[[^\]]*\]/g, s => ' '.repeat(s.length));
    const bars = [...rest.matchAll(/\|/g)].map(m => ({ bar: true, at: m.index }));
    const rep = /\(?(?:x\s?(\d+)|(\d+)\s?x)\)?\s*$/i.exec(rest.trim());
    if (rep) repeat = parseInt(rep[1] ?? rep[2], 10);
    return { tokens: [...out, ...bars].sort((a, b) => a.at - b.at), repeat };
  }
  const words = line.replace(/\|/g, ' | ').split(/\s+/).filter(Boolean);
  const tokens = [];
  let repeat = 1;
  for (const w of words) {
    if (/^[|:]*\|[|:]*$/.test(w)) { tokens.push({ bar: true }); continue; }
    if (w === '%') { tokens.push({ same: true }); continue; }
    const rep = CS_REPEAT_TOKEN.exec(w);
    if (rep) { repeat = parseInt(rep[1] ?? rep[2], 10); continue; }
    if (CS_IGNORED_TOKEN.test(w)) continue;
    const c = parseChordSymbol(w);
    if (!c) return null;
    tokens.push({ chord: c });
  }
  if (!tokens.some(t => t.chord)) return null;
  return { tokens, repeat };
}

// n chords in one bar of `beatsPerBar` beats: equal shares, any remainder
// going to the first chords (3 chords in 4/4 → 2, 1, 1).
function splitBarBeats(n, beatsPerBar) {
  if (n <= 1) return [beatsPerBar];
  if (n >= beatsPerBar) return Array.from({ length: n }, (_, i) => (i < beatsPerBar ? 1 : 0));
  const base = Math.floor(beatsPerBar / n);
  const extra = beatsPerBar - base * n;
  return Array.from({ length: n }, (_, i) => base + (i < extra ? 1 : 0));
}

// The bars of one chord line: with bar lines (|), each bar holds the chords
// between two of them, sharing its beats; without, one chord per bar. A %
// repeats the bar before.
function csLineBars(tokens) {
  const hasBars = tokens.some(t => t.bar);
  const bars = [];
  if (!hasBars) {
    for (const t of tokens) {
      if (t.chord) bars.push([t.chord]);
      else if (t.same && bars.length) bars.push([...bars[bars.length - 1]]);
    }
    return bars;
  }
  let cur = [];
  let same = false;
  const flush = () => {
    if (cur.length) bars.push(cur);
    else if (same && bars.length) bars.push([...bars[bars.length - 1]]);
    cur = []; same = false;
  };
  for (const t of tokens) {
    if (t.bar) flush();
    else if (t.chord) cur.push(t.chord);
    else if (t.same) same = true;
  }
  flush();
  return bars;
}

// Reads a chord sheet: ChordPro ({title}, {tempo}, {time}, {start_of_chorus}
// … {end_of_chorus}, [Am] inline chords) or plain chord-over-lyrics and
// chord-only lines ("Am  Dm  Am  Bbm", "| Am | Dm | Am | Bbm |"). Lyrics
// are dropped. Returns
//   { title, subtitle, artist, key, bpm (or null), beatsPerBar, beatUnit,
//     steps: [{ symbol, chord, beats, section }], sections, unknown }
// where unknown lists the chord symbols that don't map onto CHORD_TYPES.
// With merge (the default), the same chord in bars that follow each other
// within a section becomes one step.
function parseChordSheet(text, { merge = true } = {}) {
  const out = { title: '', subtitle: '', artist: '', key: '', bpm: null, beatsPerBar: 4, beatUnit: 4, steps: [], sections: [], unknown: [] };
  let section = null;
  let inSkip = false;   // inside {start_of_tab} … {end_of_tab}
  let chorusStart = -1; // first step of the chorus being read
  let lastChorus = [];
  const bars = [];      // { chords: [...], section }

  const setSection = name => {
    section = name || null;
    if (section && !out.sections.includes(section)) out.sections.push(section);
  };

  for (const rawLine of String(text ?? '').replace(/\r\n?/g, '\n').split('\n')) {
    const line = rawLine.replace(/\t/g, '    ');
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('#')) continue;

    // ChordPro directives.
    const dir = /^\{\s*([a-z_]+)\s*(?::\s*(.*?))?\s*\}$/i.exec(trimmed);
    if (dir) {
      const name = dir[1].toLowerCase();
      const value = (dir[2] ?? '').trim();
      if (inSkip) { if (/^(eot|end_of_tab|eog_tab)$/.test(name)) inSkip = false; continue; }
      if (name === 'title' || name === 't') out.title = value;
      else if (name === 'subtitle' || name === 'st') out.subtitle = value;
      else if (name === 'artist') out.artist = value;
      else if (name === 'key') out.key = value;
      else if (name === 'tempo') { const n = parseFloat(value); if (n > 0) out.bpm = Math.round(n); }
      else if (name === 'time') {
        const t = /^(\d+)\s*\/\s*(\d+)$/.exec(value);
        if (t) { out.beatsPerBar = Math.max(1, parseInt(t[1], 10)); out.beatUnit = parseInt(t[2], 10); }
      } else if (name === 'start_of_tab' || name === 'sot') inSkip = true;
      else if (name === 'start_of_chorus' || name === 'soc') { setSection(value || 'Chorus'); chorusStart = bars.length; }
      else if (name === 'end_of_chorus' || name === 'eoc') {
        if (chorusStart >= 0) lastChorus = bars.slice(chorusStart);
        chorusStart = -1;
        section = null;
      } else if (name === 'chorus') {
        // "Chorus again": the last chorus's bars, once more.
        const label = value || lastChorus[0]?.section || 'Chorus';
        for (const b of lastChorus) bars.push({ chords: b.chords, section: label });
        if (lastChorus.length && !out.sections.includes(label)) out.sections.push(label);
      } else if (name === 'start_of_verse' || name === 'sov') setSection(value || 'Verse');
      else if (name === 'start_of_bridge' || name === 'sob') setSection(value || 'Bridge');
      else if (name === 'start_of_grid' || name === 'sog') setSection(value || section);
      else if (/^start_of_/.test(name)) {
        const kind = name.slice(9);
        setSection(value || kind.charAt(0).toUpperCase() + kind.slice(1));
      } else if (/^(end_of_|eo[vbg]$)/.test(name)) section = null;
      else if (['comment', 'c', 'comment_italic', 'ci', 'comment_box', 'cb', 'highlight'].includes(name)) {
        const h = csSectionHeading(value);
        if (h) setSection(h);
      }
      continue;
    }
    if (inSkip) continue;

    // "Verse 1:", "[Chorus]" on its own line.
    const heading = /\[[^\]]*\]/.test(trimmed) && parseChordSymbol(trimmed.replace(/^\[|\]$/g, '')) ? null : csSectionHeading(trimmed);
    if (heading) { setSection(heading); continue; }

    // "Title: …" / "Tempo: 92" / "Time: 3/4" lines in a plain sheet.
    const meta = /^(title|tempo|bpm|time|key|artist)\s*:\s*(.+)$/i.exec(trimmed);
    if (meta) {
      const k = meta[1].toLowerCase(), v = meta[2].trim();
      if (k === 'title') out.title = v;
      else if (k === 'artist') out.artist = v;
      else if (k === 'key') out.key = v;
      else if (k === 'tempo' || k === 'bpm') { const n = parseFloat(v); if (n > 0) out.bpm = Math.round(n); }
      else if (k === 'time') {
        const t = /^(\d+)\s*\/\s*(\d+)$/.exec(v);
        if (t) { out.beatsPerBar = Math.max(1, parseInt(t[1], 10)); out.beatUnit = parseInt(t[2], 10); }
      }
      continue;
    }

    // "Intro: | Am | Dm |": a section name in front of a chord line.
    let chordText = line;
    const lead = /^\s*[[(]?([A-Za-z][A-Za-z -]*?\d*)[\])]?\s*:\s*(.+)$/.exec(line);
    if (lead && csSectionHeading(lead[1]) && csLineTokens(lead[2])) {
      setSection(csSectionHeading(lead[1]));
      chordText = lead[2];
    }
    const parsed = csLineTokens(chordText);
    if (!parsed) continue; // lyrics
    const lineBars = csLineBars(parsed.tokens);
    for (let r = 0; r < Math.max(1, parsed.repeat); r++) {
      for (const chords of lineBars) bars.push({ chords, section });
    }
  }

  // Bars → steps, each chord with its share of the bar.
  const bpb = out.beatsPerBar;
  for (const b of bars) {
    const shares = splitBarBeats(b.chords.length, bpb);
    b.chords.forEach((chord, i) => {
      if (!shares[i]) return;
      out.steps.push({ symbol: chord.symbol, chord, beats: shares[i], section: b.section });
    });
  }
  if (merge) out.steps = mergeRepeatedSteps(out.steps);
  const unknown = new Set();
  for (const s of out.steps) if (!s.chord.type) unknown.add(s.symbol);
  out.unknown = [...unknown];
  return out;
}

// The same chord in steps that follow each other within one section → one
// longer step.
function mergeRepeatedSteps(steps) {
  const out = [];
  for (const s of steps) {
    const prev = out[out.length - 1];
    if (prev && prev.symbol === s.symbol && prev.section === s.section) prev.beats += s.beats;
    else out.push({ ...s });
  }
  return out;
}

// A step's length as stored on a progression step: whole bars as `bars`,
// anything else as `beats` (with bars 1, so older code still reads a bar).
function stepLength(beats, beatsPerBar) {
  return beats % beatsPerBar === 0 ? { bars: beats / beatsPerBar } : { bars: 1, beats };
}

// ── Fitting a sheet to an instrument ─────────────────────────────────────────
// `chords` is findAllChords() of the instrument's layout (a handpan's, or
// ocarinaToLayout() of an ocarina or flute). A sheet chord is playable when
// a chord with the same root pitch class and type is among them.

function chordKey(rootPC, typeId) { return `${((rootPC % 12) + 12) % 12}-${typeId}`; }

// The instrument's chord for a sheet chord moved by `semis`, or null.
function matchSheetChord(chord, chords, semis = 0) {
  if (!chord?.type) return null;
  const key = chordKey(chord.rootPC + semis, chord.type.id);
  return chords.find(c => chordKey(notePC(c.rootNote), c.type.id) === key) ?? null;
}

// How much of the sheet the instrument plays when moved by `semis`:
// { semis, playable, total, score (0–1, share of steps whose chord is
// fully playable), missing (transposed symbols, each once) }.
function sheetCoverage(steps, chords, semis = 0) {
  const missing = [];
  let playable = 0;
  for (const s of steps) {
    if (matchSheetChord(s.chord, chords, semis)) playable += 1;
    else {
      const sym = transposeChordSymbol(s.chord, semis);
      if (!missing.includes(sym)) missing.push(sym);
    }
  }
  const total = steps.length;
  return { semis, playable, total, score: total ? playable / total : 0, missing };
}

// The 12 transpositions (semis from -5 to +6), best first: the highest
// score, then the smallest move, then up before down.
function rankTranspositions(steps, chords) {
  const all = [];
  for (let s = -5; s <= 6; s++) all.push(sheetCoverage(steps, chords, s));
  return all.sort((a, b) => b.score - a.score || Math.abs(a.semis) - Math.abs(b.semis) || b.semis - a.semis);
}

// Badge for a coverage score, as in the docs' "Can I play it?".
function coverageBand(score) {
  if (score >= 0.95) return 'plays';
  if (score >= 0.8) return 'swaps';
  return 'breaks';
}

// ── From a chord to what to strike ───────────────────────────────────────────

// A chord's notes stacked from its root: the lowest root on the instrument,
// then each chord tone (in the type's interval order) at the nearest note
// above the one before; a tone with nothing above comes from below the
// root instead. Returns ascending note names, or null when the root or a
// tone isn't on the instrument. On D Kurd: F → C4 F4 A4, Dm → D3 F4 A4.
function stackVoicing(rootPC, intervals, layoutNotes) {
  const notes = [...new Set(layoutNotes.filter(Boolean))].sort((a, b) => noteToMidi(a) - noteToMidi(b));
  const root = notes.find(n => notePC(n) === ((rootPC % 12) + 12) % 12);
  if (!root) return null;
  const used = [root];
  let prev = noteToMidi(root);
  for (const iv of intervals.slice(1)) {
    const pc = (rootPC + iv) % 12;
    const options = notes.filter(n => notePC(n) === pc && !used.includes(n));
    if (!options.length) {
      if (used.some(n => notePC(n) === pc)) continue;
      return null;
    }
    const above = options.find(n => noteToMidi(n) > prev);
    const below = options.filter(n => noteToMidi(n) < noteToMidi(root));
    const pick = above ?? below[below.length - 1] ?? options[0];
    used.push(pick);
    if (above) prev = noteToMidi(pick);
  }
  return used.sort((a, b) => noteToMidi(a) - noteToMidi(b));
}

const PLAY_LEVELS = [
  { id: 'roots', name: 'Roots' },
  { id: 'arpeggio', name: 'Arpeggio' },
  { id: 'groove', name: 'Groove' },
];

// From this tempo up a pattern plays fewer notes ("fast tempo" in the docs).
const FAST_BPM = 132;

// The bounce over n notes, one per beat: 1-2-3-2 for three notes over four
// beats, 1-2-3-4 for four, 1-2-1-2 for two.
function csBounce(n, length) {
  if (n <= 1) return Array(length).fill(0);
  const cycle = [];
  for (let i = 0; i < n; i++) cycle.push(i);
  for (let i = n - 2; i > 0; i--) cycle.push(i);
  return Array.from({ length }, (_, i) => cycle[i % cycle.length]);
}

// Strong beats of a bar: the first, and the middle one in an even bar of 4
// or more (1 and 3 in 4/4, 1 and 4 in 6/8).
function csStrongBeats(beatsPerBar) {
  return beatsPerBar >= 4 && beatsPerBar % 2 === 0 ? [0, beatsPerBar / 2] : [0];
}

// What to strike for one step, at a level:
//   notes        the chord's notes on the instrument (any order)
//   root         its root note (default: the lowest note of the root's
//                pitch class, else the lowest note)
//   beatsPerBar, beats (the step's length in beats), bpm
//   level        'roots' | 'arpeggio' | 'groove'
//   next         the next chord's notes (the ring rule), section (its name)
// Returns { hits: [{ beat, notes, hand: 'L' | 'R', ghost? }], reduced },
// beats counted from 0 at the step's start, in time order. The docs' rules:
// more than one chord per bar or a fast tempo plays fewer notes (reduced);
// a chorus starts each bar with two notes together; when a pair would ring
// into a next chord that lacks one of its notes, a note the two chords
// share is preferred. Arpeggio keeps the 1-2-3-2 of the docs' table.
function strikePattern({ notes, root = null, beatsPerBar = 4, beats = null, bpm = 80, level = 'arpeggio', next = null, section = null }) {
  const v = [...new Set(notes)].sort((a, b) => noteToMidi(a) - noteToMidi(b));
  const len = beats ?? beatsPerBar;
  if (!v.length || len <= 0) return { hits: [], reduced: false };
  const rootNote = root && v.includes(root) ? root : v[0];
  const others = v.filter(n => n !== rootNote);
  const reduced = bpm >= FAST_BPM || len < beatsPerBar;
  const nextPCs = next?.length ? new Set(next.map(notePC)) : null;
  const hits = [];
  const strike = (beat, ns, hand, extra = {}) => hits.push({ beat, notes: ns, hand, ...extra });

  // Two notes struck together, one per hand, swapped for shared notes when
  // they would ring into the next chord at the step's end.
  const pairAt = (beat, endsStep) => {
    let pair = others.length >= 2 ? [others[0], others[others.length - 1]] : others.length ? [others[0]] : [rootNote];
    if (endsStep && nextPCs) {
      const shared = v.filter(n => nextPCs.has(notePC(n)));
      pair = pair.map(n => {
        if (nextPCs.has(notePC(n))) return n;
        return shared.find(s => !pair.includes(s)) ?? n;
      });
      pair = [...new Set(pair)];
    }
    strike(beat, [pair[0]], 'L');
    if (pair[1]) strike(beat, [pair[1]], 'R');
  };

  const barCount = Math.ceil(len / beatsPerBar);
  for (let b = 0; b < barCount; b++) {
    const start = b * beatsPerBar;
    const inBar = Math.min(beatsPerBar, len - start);
    const lastBar = b === barCount - 1;
    if (level === 'roots') {
      strike(start, [rootNote], 'R');
      continue;
    }
    if (reduced) {
      // Fewer notes: the root, then a pair halfway through when there's room.
      strike(start, [rootNote], 'R');
      if (inBar >= 2 && v.length > 1) pairAt(start + Math.floor(inBar / 2), lastBar);
      continue;
    }
    if (level === 'groove') {
      const strong = csStrongBeats(beatsPerBar);
      for (let i = 0; i < inBar; i++) {
        if (strong.includes(i)) {
          strike(start + i, [rootNote], 'R');
          if (i + 0.5 < inBar) strike(start + i + 0.5, [rootNote], 'L', { ghost: true });
        } else {
          pairAt(start + i, lastBar && i === inBar - 1);
        }
      }
      continue;
    }
    // Arpeggio: one note per beat, hands alternating, R on beat 1.
    const order = csBounce(v.length, inBar);
    const chorus = section && /chorus|refrain|build|pre/i.test(section);
    for (let i = 0; i < inBar; i++) {
      const hand = i % 2 === 0 ? 'R' : 'L';
      if (i === 0 && chorus && v.length > 1) {
        strike(start, [v[0]], 'R');
        strike(start, [v[v.length - 1]], 'L');
        continue;
      }
      strike(start + i, [v[order[i]]], hand);
    }
  }
  hits.sort((a, b) => a.beat - b.beat);
  return { hits, reduced };
}

// Strike numbers for the pan, from the first bar of a pattern: each note
// with the strike numbers (1, 2, … in time order; notes struck together
// share a number) and hands that hit it. Ghost taps aren't numbered.
// Returns [{ note, marks: [{ n, hand }] }].
function strikeNumbers(hits, beatsPerBar = 4) {
  const first = hits.filter(h => !h.ghost && h.beat < beatsPerBar);
  const beats = [...new Set(first.map(h => h.beat))].sort((a, b) => a - b);
  const byNote = new Map();
  for (const h of first) {
    const n = beats.indexOf(h.beat) + 1;
    for (const note of h.notes) {
      if (!byNote.has(note)) byNote.set(note, []);
      byNote.get(note).push({ n, hand: h.hand });
    }
  }
  return [...byNote.entries()].map(([note, marks]) => ({ note, marks }));
}


// ── js/ocarina.js ──
// Ocarina maths: pitch, chamber splitting, hole sizes, body volume, shrinkage,
// generated fingerings and two-note pair checks. See docs/ocarina-mode.md,
// "Maths reference for js/ocarina.js".
//
// Pure functions only: no DOM, no storage, no globals. Everything is unit
// tested in Node (tests/ocarina.test.mjs).
//
// build.py concatenates every js/ file into one <script>, so every top-level
// name here must be unique across the bundle (data.js already has
// midiToFreq, hence midiToHz below).
//
// Units: frequencies in Hz, lengths in mm, volumes in cm³ (= ml).

const OC_DEFAULT_A4 = 440;
const OC_SPEED_OF_SOUND = 343;        // m/s
const OC_DEFAULT_SHRINK = 0.11;       // generic clay shrinkage fraction
const OC_MAX_HOLE_MM = 12;            // larger holes are split in two
const OC_SINGLE_CHAMBER_SPAN = 14;    // semitones
const OC_CHAMBER_SPAN = 12;           // semitones above a chamber's lowest note

// Order in which holes open, lowest note first: right hand pinky → index,
// then left hand pinky → index, thumbs last.
const OC_FINGER_ORDER = ['R4', 'R3', 'R2', 'R1', 'L4', 'L3', 'L2', 'L1', 'LT', 'RT'];
const OC_THUMBS = ['LT', 'RT'];

// ── Pitch ────────────────────────────────────────────────────────────────────

// f = A4 × 2^((midi − 69) / 12)
function midiToHz(midi, a4 = OC_DEFAULT_A4) {
  return a4 * Math.pow(2, (midi - 69) / 12);
}

// Inverse of midiToHz; returns a fractional MIDI number.
function hzToMidi(hz, a4 = OC_DEFAULT_A4) {
  return 69 + 12 * Math.log2(hz / a4);
}

// Cents from `targetHz` to `hz` (positive = sharp, negative = flat).
function centsBetween(hz, targetHz) {
  return 1200 * Math.log2(hz / targetHz);
}

// ── Pitch as text (record fields) ────────────────────────────────────────────

// A measured frequency as the nearest note and how far off it is, in the
// user's notation: { midi, note: 'D4' | 'Re4' | 'Eb4', cents, text: 'D4 −3 ¢' }.
function pitchLabel(hz, { useFlats = false, useSolfege = false, a4 = OC_DEFAULT_A4 } = {}) {
  const exact = hzToMidi(hz, a4);
  const midi = Math.round(exact);
  const cents = Math.round((exact - midi) * 100);
  const name = SHARP_NAMES[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
  const note = displayNote(name, useFlats, useSolfege);
  const off = cents === 0 ? '' : ` ${cents > 0 ? '+' : '−'}${Math.abs(cents)} ¢`;
  return { midi, note, cents, text: note + off };
}

// What a person types into a record field, as a frequency in Hz, or null.
// Accepts a frequency ("293.7", "293,7 Hz") or a note in letters or solfège
// with an optional octave (default 4) and cents: "D4", "Eb4", "d#3",
// "Re4", "Sib3", "D4 -3", "Re4 +12 ¢".
function parsePitch(text, a4 = OC_DEFAULT_A4) {
  const t = String(text ?? '').trim().replace(',', '.').replace(/[−–]/g, '-');
  if (!t) return null;
  const num = t.match(/^(\d+(?:\.\d+)?)\s*(hz)?$/i);
  if (num) { const hz = parseFloat(num[1]); return hz > 0 ? hz : null; }
  const m = t.match(/^(do|re|mi|fa|sol|la|si|ti|[a-g])\s*([#♯b♭]?)\s*(-?\d)?\s*(?:([+-]\s*\d+(?:\.\d+)?)\s*(?:¢|c|cents?)?)?$/i);
  if (!m) return null;
  const solf = { do: 0, re: 2, mi: 4, fa: 5, sol: 7, la: 9, si: 11, ti: 11 };
  const letter = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
  const base = m[1].toLowerCase();
  let pc = base.length > 1 ? solf[base] : letter[base];
  if (m[2] === '#' || m[2] === '♯') pc += 1;
  if (m[2] === 'b' || m[2] === '♭') pc -= 1;
  const octave = m[3] != null ? parseInt(m[3], 10) : 4;
  const midi = (octave + 1) * 12 + pc;
  const cents = m[4] ? parseFloat(m[4].replace(/\s/g, '')) : 0;
  return midiToHz(midi + cents / 100, a4);
}

// ── Scale → notes ────────────────────────────────────────────────────────────

// MIDI notes of a handpan scale from data.js (ding + ring, plus gu notes
// unless includeGu is false), transposed and sorted ascending, no duplicates.
function scaleToMidis(scale, { transpose = 0, includeGu = true } = {}) {
  const names = [scale.top.ding, ...scale.top.notes];
  if (includeGu) names.push(...(scale.bottom?.notes ?? []));
  const midis = names.filter(Boolean).map(n => noteToMidi(n) + transpose);
  return [...new Set(midis)].sort((a, b) => a - b);
}

// ── Chamber splitting ────────────────────────────────────────────────────────

// Splits ascending notes into chambers (arrays of MIDI numbers). Each
// chamber's first note is its all-holes-closed note.
//
// Notes spanning ≤ 14 semitones → one chamber. Otherwise walk up and start a
// new chamber whenever a note is more than 12 semitones above the current
// chamber's lowest note. Then, from the top chamber down, any chamber with
// fewer than 2 notes takes the top notes of the chamber below; if the chamber
// below can't spare them (it would drop under 2 notes), the two are merged.
function splitChambers(midis) {
  const notes = [...new Set(midis)].sort((a, b) => a - b);
  if (notes.length === 0) return [];
  if (notes[notes.length - 1] - notes[0] <= OC_SINGLE_CHAMBER_SPAN) return [notes];

  const chambers = [[notes[0]]];
  for (const n of notes.slice(1)) {
    const cur = chambers[chambers.length - 1];
    if (n - cur[0] > OC_CHAMBER_SPAN) chambers.push([n]);
    else cur.push(n);
  }

  for (let i = chambers.length - 1; i >= 1; i--) {
    const upper = chambers[i];
    const lower = chambers[i - 1];
    while (upper.length < 2 && lower.length > 2) upper.unshift(lower.pop());
    if (upper.length < 2) {
      chambers[i - 1] = [...lower, ...upper];
      chambers.splice(i, 1);
    }
  }
  return chambers;
}

// ── Fingerings ───────────────────────────────────────────────────────────────

// Finger assignment for a chamber with `holeCount` holes, in opening order.
// Up to 8 holes use the fingers only; with more than 8, the two highest-note
// holes go underneath under the thumbs (LT, then RT).
function fingersForHoleCount(holeCount) {
  if (holeCount > OC_FINGER_ORDER.length) {
    throw new RangeError(`A chamber can have at most ${OC_FINGER_ORDER.length} holes (got ${holeCount})`);
  }
  if (holeCount <= 8) return OC_FINGER_ORDER.slice(0, holeCount);
  return [...OC_FINGER_ORDER.slice(0, holeCount - 2), ...OC_THUMBS];
}

// One chamber of a scale-built ocarina: holes in opening order and a
// cumulative fingering per note (note k = first k holes open).
// Hole positions (x, y) and sizes are filled in later by the UI / builder.
function buildChamber(notes) {
  const sorted = [...notes].sort((a, b) => a - b);
  const fingers = fingersForHoleCount(sorted.length - 1);
  const holes = fingers.map(f => ({
    id: f,
    finger: f,
    side: OC_THUMBS.includes(f) ? 'bottom' : 'top',
    x: null,
    y: null,
    sizeMm: null,
  }));
  const fingerings = {};
  sorted.forEach((midi, k) => {
    fingerings[midi] = holes.map((_, h) => (h < k ? 'o' : 'c'));
  });
  return { notes: sorted, holes, fingerings };
}

// Chambers, holes and fingerings for a scale-built ocarina from MIDI notes.
function buildScaleChambers(midis) {
  return splitChambers(midis).map(buildChamber);
}

// ── Hole sizes ───────────────────────────────────────────────────────────────

// Window equivalent hole size from the tuning readings:
// W = d / ((f1/f0)² − 1)
function windowEquivalent(f0, d, f1) {
  const r = (f1 / f0) ** 2 - 1;
  if (!(r > 0)) throw new RangeError('f1 must be higher than f0');
  return d / r;
}

// Total open hole diameter for a note at fn: D = W × ((fn/f0)² − 1)
function totalOpenDiameter(W, f0, fn) {
  return W * ((fn / f0) ** 2 - 1);
}

// Per-hole diameters (mm) for a cumulative fingering.
//   f0       measured closed pitch
//   d, f1    test hole diameter and pitch with it open
//   targets  target frequencies of the open notes, ascending (notes[1..])
// Returns { W, totals, holes, testHoleIndex } where holes[n] = D_n − D_(n−1)
// and testHoleIndex is the first hole whose size is at least d (−1 if none).
function holeSizes({ f0, d, f1, targets }) {
  const W = windowEquivalent(f0, d, f1);
  const totals = targets.map(fn => totalOpenDiameter(W, f0, fn));
  const holes = totals.map((D, i) => D - (i === 0 ? 0 : totals[i - 1]));
  const testHoleIndex = holes.findIndex(h => h >= d);
  return { W, totals, holes, testHoleIndex };
}

// Before readings exist: relative hole sizes only, as fractions of the
// largest hole (largest = 1). Uses the chamber's closed note as f0; W cancels.
function relativeHoleSizes(closedHz, targets) {
  const totals = targets.map(fn => (fn / closedHz) ** 2 - 1);
  const holes = totals.map((D, i) => D - (i === 0 ? 0 : totals[i - 1]));
  const max = Math.max(...holes);
  return holes.map(h => h / max);
}

// A hole over 12 mm becomes two holes of half the diameter, opened together
// (the brief's rule). A hole over 24 mm would still leave halves over 12 mm,
// so it becomes as many equal holes as it takes to stay at or under 12 mm.
// Returns the diameters.
function splitHole(diameter, maxMm = OC_MAX_HOLE_MM) {
  const n = Math.ceil(diameter / maxMm);
  return n <= 1 ? [diameter] : Array.from({ length: n }, () => diameter / n);
}

// Applies diameters (one per hole, opening order) to a chamber from
// buildChamber, splitting holes over 12 mm into holes 'R4a', 'R4b', …
// that share the finger and the state in every fingering.
function applyHoleSizes(chamber, diameters, maxMm = OC_MAX_HOLE_MM) {
  const holes = [];
  const source = []; // index of the original hole for each new hole
  chamber.holes.forEach((hole, i) => {
    const parts = splitHole(diameters[i], maxMm);
    parts.forEach((size, p) => {
      holes.push({ ...hole, id: parts.length > 1 ? hole.id + 'abcd'[p] : hole.id, sizeMm: size });
      source.push(i);
    });
  });
  const fingerings = {};
  for (const [midi, states] of Object.entries(chamber.fingerings)) {
    fingerings[midi] = source.map(i => states[i]);
  }
  return { ...chamber, holes, fingerings };
}

// ── Window and body volume ───────────────────────────────────────────────────

// Window area (mm²) by shape. For 'round', `w` is the diameter.
function windowArea({ shape, w, l }) {
  switch (shape) {
    case 'rect': case 'rectangle': return w * l;
    case 'round': return Math.PI * w * w / 4;
    case 'oval': return Math.PI * w * l / 4;
    default: throw new RangeError(`Unknown window shape: ${shape}`);
  }
}

// Default window for a chamber whose closed note is f Hz:
// width = 10 × √(262/f), clamped to 6–16 mm and rounded; length = 0.75 × width;
// wall 4 mm.
function defaultWindow(f) {
  const w = Math.round(Math.min(16, Math.max(6, 10 * Math.sqrt(262 / f))));
  return { shape: 'rect', w, l: 0.75 * w, t: 4 };
}

// Helmholtz volume (cm³) for a window of area A (mm²), wall t (mm) and
// frequency f (Hz):
//   a = √(A/π), K = A / (t + 1.5a), V = K c² / (4π² f²)
function helmholtzVolume(areaMm2, tMm, f, c = OC_SPEED_OF_SOUND) {
  const A = areaMm2 * 1e-6;             // m²
  const t = tMm * 1e-3;                 // m
  const a = Math.sqrt(A / Math.PI);     // m
  const K = A / (t + 1.5 * a);          // m
  const V = K * c * c / (4 * Math.PI ** 2 * f * f); // m³
  return V * 1e6;                       // cm³
}

// Diameter (mm) of a ball with volume V (cm³): ∛(6V/π)
function ballDiameter(volumeCm3) {
  return Math.cbrt(6 * volumeCm3 * 1000 / Math.PI);
}

// Inside volume to form a chamber around, for concert closed pitch f.
// Uses the leather-hard target f × (1 − s).
// Returns { area, leatherHz, volume, firedVolume, ballDiameter }.
function chamberVolume({ shape = 'rect', w, l, t }, f, shrink = OC_DEFAULT_SHRINK) {
  const area = windowArea({ shape, w, l });
  const leatherHz = leatherTarget(f, shrink);
  const volume = helmholtzVolume(area, t, leatherHz);
  return {
    area,
    leatherHz,
    volume,
    firedVolume: volume * (1 - shrink) ** 3,
    ballDiameter: ballDiameter(volume),
  };
}

// ── Shrinkage ────────────────────────────────────────────────────────────────

// Leather-hard target for a concert pitch: f × (1 − s)
function leatherTarget(f, shrink = OC_DEFAULT_SHRINK) {
  return f * (1 - shrink);
}

// Pitch after firing for a leather-hard pitch: f / (1 − s)
function firedPitch(fLeather, shrink = OC_DEFAULT_SHRINK) {
  return fLeather / (1 - shrink);
}

// Learned shrinkage from two sets of readings ({ [midi]: hz }): the mean of
// 1 − f_leather / f_final over notes measured at both stages. Null if none.
function learnedShrinkage(leather, final) {
  const keys = Object.keys(leather).filter(k => final[k] > 0 && leather[k] > 0);
  if (keys.length === 0) return null;
  const sum = keys.reduce((acc, k) => acc + (1 - leather[k] / final[k]), 0);
  return sum / keys.length;
}

// ── Two-note pairs ───────────────────────────────────────────────────────────

const OC_ON = { c: true, h: true, o: false };

// Can `midiA` on chamber A and `midiB` on chamber B sound together? Yes when
// no finger is asked to be on a hole ('c' or 'h') in one fingering and off a
// hole ('o') in the other. Holes are matched by their finger assignment.
function canPlayTogether(chamberA, midiA, chamberB, midiB) {
  if (chamberA === chamberB) return false;
  const fa = chamberA.fingerings[midiA];
  const fb = chamberB.fingerings[midiB];
  if (!fa || !fb) return false;
  const need = {}; // finger → Set of on/off
  const add = (holes, states) => holes.forEach((hole, i) => {
    (need[hole.finger] ??= new Set()).add(OC_ON[states[i]]);
  });
  add(chamberA.holes, fa);
  add(chamberB.holes, fb);
  return Object.values(need).every(s => s.size === 1);
}

// Every pair of `midis` (e.g. a chord's notes) playable together on a
// multi-chamber ocarina: [{ a: { chamber, midi }, b: { chamber, midi } }],
// with chamber as an index into `chambers`. Notes present in several
// chambers are tried in each.
function playablePairs(chambers, midis) {
  const where = midis.flatMap(m =>
    chambers.flatMap((ch, ci) => (ch.fingerings[m] ? [{ chamber: ci, midi: m }] : [])));
  const pairs = [];
  for (let i = 0; i < where.length; i++) {
    for (let j = i + 1; j < where.length; j++) {
      const a = where[i], b = where[j];
      if (a.chamber === b.chamber || a.midi === b.midi) continue;
      if (canPlayTogether(chambers[a.chamber], a.midi, chambers[b.chamber], b.midi)) {
        pairs.push(a.midi <= b.midi ? { a, b } : { a: b, b: a });
      }
    }
  }
  return pairs;
}

// ── Building fewer chambers than the full scale needs ───────────────────────

// How many chambers the full set of notes needs.
function chambersNeeded(midis) {
  return splitChambers(midis).length;
}

// Every way to keep a run of consecutive scale notes that fits in
// `chambers` chambers, longest runs only: for each starting note, the most
// notes upward that still split into at most `chambers` chambers. Runs that
// sit wholly inside a longer run are dropped. Lowest start first.
//   e.g. F Low Pygmy (17), 1 chamber → Ab2–Bb3, …, F3–Gb4 (starts on the ding), …
// Returns [{ start, notes }] with start = MIDI of the lowest kept note.
function noteWindows(midis, chambers = 1) {
  const notes = [...new Set(midis)].sort((a, b) => a - b);
  const runs = [];
  for (let i = 0; i < notes.length; i++) {
    let end = i;
    while (end + 1 < notes.length && chambersNeeded(notes.slice(i, end + 2)) <= chambers) end++;
    runs.push({ i, end });
  }
  return runs
    .filter(r => !runs.some(o => o !== r && o.i <= r.i && o.end >= r.end && (o.end - o.i) > (r.end - r.i)))
    .map(r => ({ start: notes[r.i], notes: notes.slice(r.i, r.end + 1) }));
}

// ── Calibration: fingerings from the instrument itself ──────────────────────
//
// For an ocarina whose maker chart is unknown. The pitch of a vessel flute
// depends on the total open hole size, not on where the holes are:
//   f = f0 × √(1 + Σ wᵢ·rᵢ)
// where f0 is the all-closed pitch, rᵢ = Dᵢ / W is hole i's size relative to
// the window, and wᵢ is 1 for an open hole, 0 for a covered one and about ½
// for a half-covered one (an approximation; the tuner confirms it). Measure a
// few fingerings, solve for r, then predict every fingering.

const OC_STATE_WEIGHT = { c: 0, o: 1, h: 0.5 };

// Pitch of any fingering (states, one per hole) from the hole ratios.
function predictFingeringHz(f0, ratios, states) {
  const sum = states.reduce((acc, s, i) => acc + OC_STATE_WEIGHT[s] * ratios[i], 0);
  return f0 * Math.sqrt(1 + sum);
}

// Hole ratios rᵢ from measurements [{ states, hz }] by least squares on
// (hz/f0)² − 1 = Σ wᵢ rᵢ. The simplest calibration is one measurement per
// hole with only that hole open, which gives rᵢ = (fᵢ/f0)² − 1 directly.
// Throws if the measurements don't pin down every hole.
function solveHoleRatios(f0, measurements) {
  const n = measurements[0].states.length;
  const AtA = Array.from({ length: n }, () => new Array(n).fill(0));
  const Atb = new Array(n).fill(0);
  for (const { states, hz } of measurements) {
    const w = states.map(s => OC_STATE_WEIGHT[s]);
    const y = (hz / f0) ** 2 - 1;
    for (let i = 0; i < n; i++) {
      Atb[i] += w[i] * y;
      for (let j = 0; j < n; j++) AtA[i][j] += w[i] * w[j];
    }
  }
  // Gaussian elimination with partial pivoting.
  const M = AtA.map((row, i) => [...row, Atb[i]]);
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    if (Math.abs(M[p][c]) < 1e-12) throw new RangeError(`Hole ${c} is not covered by the measurements`);
    [M[c], M[p]] = [M[p], M[c]];
    for (let r = 0; r < n; r++) {
      if (r === c) continue;
      const k = M[r][c] / M[c][c];
      for (let j = c; j <= n; j++) M[r][j] -= k * M[c][j];
    }
  }
  return M.map((row, i) => row[n] / row[i]);
}

// How awkward a fingering is: 10 per half-holed hole, plus 1 for every open
// hole that comes after a covered one in opening order (holes are listed in
// opening order, so the standard scale scores 0).
function fingeringAwkwardness(states) {
  let score = 0;
  let seenClosed = false;
  for (const s of states) {
    if (s === 'h') score += 10;
    if (s === 'o' && seenClosed) score += 1;
    if (s !== 'o') seenClosed = true;
  }
  return score;
}

// Fingerings that give `targetHz` within `toleranceCents`, easiest first
// (least awkward, then closest). At most `maxHalf` half-holed holes.
// Returns [{ states, hz, cents }].
function findFingerings(f0, ratios, targetHz, { toleranceCents = 20, maxHalf = 1, limit = 3 } = {}) {
  const n = ratios.length;
  const found = [];
  const consider = states => {
    const hz = predictFingeringHz(f0, ratios, states);
    const cents = centsBetween(hz, targetHz);
    if (Math.abs(cents) <= toleranceCents) found.push({ states, hz, cents });
  };
  for (let mask = 0; mask < (1 << n); mask++) {
    const base = Array.from({ length: n }, (_, i) => (mask >> i & 1 ? 'o' : 'c'));
    consider(base);
    if (maxHalf >= 1) {
      base.forEach((s, i) => {
        if (s === 'c') { const h = [...base]; h[i] = 'h'; consider(h); }
      });
    }
  }
  found.sort((a, b) =>
    fingeringAwkwardness(a.states) - fingeringAwkwardness(b.states) ||
    Math.abs(a.cents) - Math.abs(b.cents));
  return found.slice(0, limit);
}

// A full chromatic fingering chart predicted from calibration: for every
// semitone from the all-closed note to the all-open note, the easiest
// fingering within tolerance. Notes with no fingering in tolerance are left
// out. Returns { [midi]: { states, hz, cents } }.
function calibratedChart(f0, ratios, { a4 = OC_DEFAULT_A4, toleranceCents = 20, maxHalf = 1 } = {}) {
  const top = predictFingeringHz(f0, ratios, ratios.map(() => 'o'));
  const chart = {};
  for (let midi = Math.ceil(hzToMidi(f0, a4) - toleranceCents / 100);
       midi <= Math.floor(hzToMidi(top, a4) + toleranceCents / 100); midi++) {
    const [best] = findFingerings(f0, ratios, midiToHz(midi, a4), { toleranceCents, maxHalf, limit: 1 });
    if (best) chart[midi] = best;
  }
  return chart;
}

// ── Traditional charts ───────────────────────────────────────────────────────
// Moved to js/charts.js (sourced charts only). Ocarinas of unknown make are
// charted by calibration (calibratedChart above, js/builder.js).


// ── js/tuner.js ──
// Tuner: microphone → AnalyserNode → YIN pitch detection. See
// docs/ocarina-mode.md, "Tuner".
//
// yinPitch() and createStabilityTracker() are pure and unit tested in Node
// with synthetic tones; startTuner() is the browser part. Microphone access
// needs HTTPS (Vercel provides it) or localhost.

// YIN (de Cheveigné & Kawahara, 2002) on one window of samples. Returns
// { hz, clarity } (clarity 0–1, higher is cleaner) or null when no pitch is
// found. Ocarinas are close to pure sine tones, so a plain YIN is enough;
// the 4096-sample window covers bass notes down to ~70 Hz at 48 kHz.
function yinPitch(buf, sampleRate, { threshold = 0.15, minHz = 70, maxHz = 2500, minRms = 0.01 } = {}) {
  const n = buf.length;
  let rms = 0;
  for (let i = 0; i < n; i++) rms += buf[i] * buf[i];
  if (Math.sqrt(rms / n) < minRms) return null;

  const tauMin = Math.max(2, Math.floor(sampleRate / maxHz));
  const tauMax = Math.min(Math.floor(n / 2), Math.ceil(sampleRate / minHz));
  const w = n - tauMax;
  const d = new Float32Array(tauMax + 1);
  for (let tau = 1; tau <= tauMax; tau++) {
    let sum = 0;
    for (let i = 0; i < w; i++) {
      const delta = buf[i] - buf[i + tau];
      sum += delta * delta;
    }
    d[tau] = sum;
  }
  // Cumulative mean normalised difference.
  const cmnd = new Float32Array(tauMax + 1);
  cmnd[0] = 1;
  let running = 0;
  for (let tau = 1; tau <= tauMax; tau++) {
    running += d[tau];
    cmnd[tau] = running > 0 ? d[tau] * tau / running : 1;
  }
  let tau = -1;
  for (let t = tauMin; t <= tauMax; t++) {
    if (cmnd[t] < threshold) {
      while (t + 1 <= tauMax && cmnd[t + 1] < cmnd[t]) t++;
      tau = t;
      break;
    }
  }
  if (tau < 0) return null;
  // Parabolic interpolation around the minimum.
  let better = tau;
  if (tau > 1 && tau < tauMax) {
    const a = cmnd[tau - 1], b = cmnd[tau], c = cmnd[tau + 1];
    const denom = a - 2 * b + c;
    if (denom !== 0) better = tau + (a - c) / (2 * denom);
  }
  return { hz: sampleRate / better, clarity: 1 - cmnd[tau] };
}

// Reports a note only after it has held for `holdMs` within `toleranceCents`.
// push(hz | null, timeMs) → { hz, midi, stable, since } where midi is
// fractional and `since` is when the current stable stretch began.
function createStabilityTracker({ holdMs = 200, toleranceCents = 35, a4 = 440 } = {}) {
  let anchor = null; // { midi, since }
  let lastHz = null;
  return {
    push(hz, t) {
      if (!hz) { anchor = null; lastHz = null; return { hz: null, midi: null, stable: false, since: null }; }
      const midi = 69 + 12 * Math.log2(hz / a4);
      if (!anchor || Math.abs(midi - anchor.midi) * 100 > toleranceCents) anchor = { midi, since: t };
      else anchor.midi = anchor.midi * 0.7 + midi * 0.3; // smooth
      lastHz = hz;
      return { hz: lastHz, midi: anchor.midi, stable: t - anchor.since >= holdMs, since: anchor.since };
    },
    reset() { anchor = null; lastHz = null; },
  };
}

// Starts listening. onReading({ hz, midi, stable, since }) is called about
// 20 times a second. Returns a promise of a stop() function; rejects if the
// microphone can't be opened (no permission, no HTTPS, no device).
async function startTuner(onReading, { a4 = 440 } = {}) {
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('This browser has no microphone access');
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
  });
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx();
  const source = ctx.createMediaStreamSource(stream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 4096;
  source.connect(analyser);
  const buf = new Float32Array(analyser.fftSize);
  const tracker = createStabilityTracker({ a4 });
  const timer = setInterval(() => {
    analyser.getFloatTimeDomainData(buf);
    const res = yinPitch(buf, ctx.sampleRate);
    onReading(tracker.push(res && res.clarity > 0.8 ? res.hz : null, performance.now()));
  }, 50);
  return () => {
    clearInterval(timer);
    stream.getTracks().forEach(t => t.stop());
    source.disconnect();
    ctx.close();
  };
}


// ── js/charts.js ──
// Traditional fingering charts: bought ocarinas and flutes whose fingerings
// are fixed by the instrument type. See docs/ocarina-mode.md, "Ocarinas and
// flutes", and CLAUDE.md: every chart comes from a published source, noted
// with its URL; nothing is filled in from memory.
//
// A chart is written once, relative to its lowest note, and serves every key
// of that type: concert pitch = the key's lowest note + offset.
//
//   {
//     id, family: 'ocarina' | 'flute', name, source: [urls], notes: '…',
//     sourceName: 'High Spirits Flutes booklet',   // shown to users as plain text ("Chart: …")
//     holes: [{ id, finger, side: 'top' | 'bottom', sub? }],   // flutes: mouthpiece first
//     keys: [{ id, name, lowest: 'D4' }],                       // lowest sounding note per key
//     fingerings: [{ offset, states: ['c'|'o'|'h', …], alt?: true, overblow?: true }],
//     octaves?: [3, 4, 5],   // any-key charts: keys are every root × these octaves
//     defaultKey?, shortName?,  // and the key picked first, and the name before " in G"
//     writtenKey?, tonicOffset?, lowestOctaves?,  // transposing charts (below)
//   }
//
// A transposing chart is published for one key (writtenKey) and serves every
// key by shifting it: the key is named by its tonic, tonicOffset semitones
// above the lowest note, and its id is `${tonic}-${lowest}` (e.g. 'G-E4').
//
// Charts with readings taken from images (High Spirits, STL) were read at
// high resolution; their `notes` say so where something looked doubtful.
//
// Pure data and functions; unit tested in Node.

// Row strings list one symbol per hole in the chart's `holes` order:
// X covered, O open, H half-covered (½ in the sources).
function rows(list) {
  return list.map(([offset, row, extra = {}]) => ({
    offset,
    states: [...row.replace(/[\s|]/g, '')].map(ch => (ch === 'X' ? 'c' : ch === 'O' ? 'o' : 'h')),
    ...extra,
  }));
}

// Flutes list holes from the mouthpiece down; ocarinas by finger.
const WHISTLE_HOLES = ['L1', 'L2', 'L3', 'R1', 'R2', 'R3'].map(f => ({ id: f, finger: f, side: 'top' }));
// High Spirits doesn't name fingers; these are the usual upper/lower-hand ones.
const NAF6_HOLES = ['L1', 'L2', 'L3', 'R1', 'R2', 'R3'].map(f => ({ id: f, finger: f, side: 'top' }));
const NAF5_HOLES = ['L1', 'L2', 'R1', 'R2', 'R3'].map(f => ({ id: f, finger: f, side: 'top' }));

// Octave choice where the source doesn't say which octave the flute sounds in.
const octaves = (note, name) => [
  { id: `${note}4`, name: `${name}, lowest note ${name}4` },
  { id: `${note}3`, name: `${name}, lowest note ${name}3 (low flute)` },
  { id: `${note}5`, name: `${name}, lowest note ${name}5 (high flute)` },
].map(k => ({ ...k, lowest: k.id }));

// Every root in every octave a chart lists (charts whose fingerings are the
// same in any key). Key ids are the lowest note with sharps, e.g. 'F#3'.
const CHART_ROOTS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const anyKey = (octs = [3, 4, 5]) => octs.flatMap(o => CHART_ROOTS.map(r => ({
  id: `${r}${o}`, name: `${r}, lowest note ${r}${o}`, lowest: `${r}${o}`, root: r, octave: o,
})));

// Every lowest note in these octaves, named by the tonic tonicOffset
// semitones above it: tonicKeys(3, [4]) has { id: 'G-E4', name: 'G (lowest E4)' }.
const tonicKeys = (tonicOffset, octs) => octs.flatMap(o => CHART_ROOTS.map((r, pc) => {
  const tonic = CHART_ROOTS[(pc + tonicOffset) % 12];
  return { id: `${tonic}-${r}${o}`, name: `${tonic} (lowest ${r}${o})`, lowest: `${r}${o}`, root: tonic, octave: o };
}));

function getChart(id) {
  return TRADITIONAL_CHARTS.find(c => c.id === id) ?? null;
}

function chartsForFamily(family) {
  return TRADITIONAL_CHARTS.filter(c => c.family === family);
}

// The key a chart starts on in the wizard.
function chartDefaultKey(chart) {
  return chart.keys.find(k => k.id === chart.defaultKey)?.id ?? chart.keys[0].id;
}

// Key of an any-key chart from a root ('G', 'Gb' or 'F#' spelling) and an
// octave; null if the chart has no such key.
function chartKeyFor(chart, root, octave) {
  const pc = CHART_ROOTS.indexOf(root) >= 0 ? CHART_ROOTS.indexOf(root)
    : ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'].indexOf(root);
  if (pc < 0) return null;
  return chart.keys.find(k => k.id === `${CHART_ROOTS[pc]}${octave}`) ?? null;
}

// An instrument of a traditional type in a key. Each note keeps its main
// fingering (the first listed for its offset); alternates are kept in
// `alternates` for display.
function instrumentFromChart(chartId, keyId, { name, now = new Date().toISOString() } = {}) {
  const chart = getChart(chartId);
  if (!chart) throw new RangeError(`Unknown chart: ${chartId}`);
  const key = chart.keys.find(k => k.id === keyId) ?? chart.keys[0];
  const base = noteToMidi(key.lowest);
  const fingerings = {};
  const alternates = {};
  const overblow = [];
  for (const f of chart.fingerings) {
    const midi = base + f.offset;
    if (!fingerings[midi] && !f.alt) {
      fingerings[midi] = f.states;
      if (f.overblow) overblow.push(midi);
    } else (alternates[midi] ??= []).push(f.states);
  }
  const notes = Object.keys(fingerings).map(Number).sort((a, b) => a - b);
  return {
    id: (chart.family === 'flute' ? 'fl-' : 'oc-') + Math.random().toString(36).slice(2, 10),
    family: chart.family,
    kind: 'traditional',
    type: chart.id,
    key: key.id,
    name: name || (chart.tonicOffset != null ? `${chart.name.replace(` in ${chart.writtenKey}`, ` in ${key.root}`)} (${key.lowest})`
      : chart.octaves ? `${chart.shortName ?? chart.name} in ${key.root} (${key.lowest})`
      : chart.keys.length > 1 ? `${chart.name} (${key.lowest})` : chart.name),
    chambers: [{ notes, holes: chart.holes.map(h => ({ ...h, x: null, y: null, sizeMm: null })), fingerings, alternates, overblow }],
    createdAt: now,
    updatedAt: now,
    lastPlayedAt: now,
  };
}

// The key and octave of an any-key chart from the pitch heard with every
// hole closed: the nearest note's pitch class and octave. An octave outside
// the chart's octaves is moved to the nearest one (outOfRange: true).
// cents: how far the reading is from that note (positive = sharp).
function detectChartKey(hz, { octaves: octs = [3, 4, 5], a4 = 440 } = {}) {
  if (!(hz > 0)) return null;
  const exact = 69 + 12 * Math.log2(hz / a4);
  const midi = Math.round(exact);
  const heardOctave = Math.floor(midi / 12) - 1;
  const octave = octs.reduce((best, o) => (Math.abs(o - heardOctave) < Math.abs(best - heardOctave) ? o : best), octs[0]);
  return {
    midi,
    root: CHART_ROOTS[((midi % 12) + 12) % 12],
    heardOctave,
    octave,
    cents: Math.round((exact - midi) * 100),
    outOfRange: octave !== heardOctave,
  };
}

// The key of a chart whose lowest note is the one heard (every hole closed,
// sub-holes too): the nearest note, moved to the nearest octave the chart
// offers when it is outside them (outOfRange). Works for any-key charts
// (key = lowest note) and transposing ones (key named by its tonic).
// Returns detectChartKey's fields plus { key, lowest } or null.
function detectLowestKey(chart, hz, { a4 = 440 } = {}) {
  const octs = chart?.lowestOctaves ?? chart?.octaves;
  if (!octs) return null;
  const r = detectChartKey(hz, { octaves: octs, a4 });
  if (!r) return null;
  const lowest = `${r.root}${r.octave}`;
  const key = chart.keys.find(k => k.lowest === lowest) ?? null;
  return key ? { ...r, lowest, key } : null;
}

// instruments, so existing users get one instrument per saved layout and
// nothing about layouts or playlists changes.

// ── Pure helpers ─────────────────────────────────────────────────────────────

// 62 → 'D4' (flat-preferring spelling from data.js; displayNote re-spells it).
function midiToNoteName(midi) {
  return NOTE_NAMES[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
}

function nowIso() { return new Date().toISOString(); }

function handpanInstrumentId(layoutId) { return 'hp-' + layoutId; }

// Adds a handpan instrument for every saved layout that has none, keeps names
// in step, and soft-deletes handpan instruments whose layout is gone.
// Pure: returns { instruments, changed }.
function reconcileInstruments(instruments, savedLayouts, now = nowIso()) {
  const list = instruments.map(i => ({ ...i }));
  let changed = false;
  const live = new Set();
  for (const saved of savedLayouts) {
    const id = handpanInstrumentId(saved.id);
    live.add(id);
    const existing = list.find(i => i.id === id);
    if (!existing) {
      list.push({
        id,
        family: 'handpan',
        kind: saved.layout?.isCustom ? 'custom' : 'scale',
        layoutId: saved.id,
        name: saved.name,
        createdAt: now,
        updatedAt: now,
        lastPlayedAt: saved.savedAt ? new Date(saved.savedAt).toISOString() : null,
      });
      changed = true;
    } else if (existing.deletedAt || existing.name !== saved.name) {
      delete existing.deletedAt;
      existing.name = saved.name;
      existing.updatedAt = now;
      changed = true;
    }
  }
  for (const inst of list) {
    if (inst.family === 'handpan' && !inst.deletedAt && !live.has(inst.id)) {
      inst.deletedAt = now;
      inst.updatedAt = now;
      changed = true;
    }
  }
  return { instruments: list, changed };
}

// Most recently played first; never-played ones by creation, newest first.
function sortInstruments(instruments) {
  const key = i => i.lastPlayedAt || i.createdAt || '';
  return [...instruments].sort((a, b) => (key(b) > key(a) ? 1 : key(b) < key(a) ? -1 : 0));
}

// A scale-built ocarina from a handpan scale. `notes` (MIDI) is the chosen
// subset when building fewer chambers than the full scale needs; defaults to
// every note.
function createScaleOcarina({ scaleId, transpose = 0, includeGu = true, notes = null, name }, now = nowIso()) {
  const scale = SCALES.find(s => s.id === scaleId);
  if (!scale) throw new RangeError(`Unknown scale: ${scaleId}`);
  const all = scaleToMidis(scale, { transpose, includeGu });
  const chosen = (notes ?? all).filter(m => all.includes(m)).sort((a, b) => a - b);
  return {
    id: 'oc-' + Math.random().toString(36).slice(2, 10),
    family: 'ocarina',
    kind: 'scale',
    name: name || `${scale.name} ocarina`,
    scaleId,
    transpose,
    includeGu,
    notes: chosen,
    fullChambers: chambersNeeded(all),
    chambers: buildScaleChambers(chosen),
    build: { stage: 'design', clayBody: null, shrinkPct: 11, a4: 440, perChamber: [] },
    createdAt: now,
    updatedAt: now,
    lastPlayedAt: now,
  };
}

// An ocarina the user owns whose fingering chart is unknown. It is set up
// later by calibration with the tuner (docs/ocarina-mode.md, "Calibrated
// charts"); until then it only has a name and a hole count.
function createCustomOcarina({ name, holeCount }, now = nowIso()) {
  return {
    id: 'oc-' + Math.random().toString(36).slice(2, 10),
    family: 'ocarina',
    kind: 'custom',

    holeCount,
    chambers: [],
    calibration: null,

    updatedAt: now,

}

// A flute that isn't in js/charts.js. Its chart comes from recording its
// notes on Set up: all holes closed, then the holes lifted one by one from
// the bottom (fluteChamberFromReadings in js/builder.js).
function createCustomFlute({ name, holeCount }, now = nowIso()) {

    id: 'fl-' + Math.random().toString(36).slice(2, 10),
    family: 'flute',
    kind: 'custom',
    name: name || 'My flute',
    holeCount,
    chambers: [],
    calibration: null,

    updatedAt: now,
    lastPlayedAt: now,
