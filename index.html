// ── Sharing and sync ─────────────────────────────────────────────────────────

// 6-character public ID without look-alike characters (no 0/O, 1/I/L).
const PUBLIC_ID_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function newPublicId(random = Math.random) {
  let id = '';
  for (let i = 0; i < 6; i++) id += PUBLIC_ID_CHARS[Math.floor(random() * PUBLIC_ID_CHARS.length)];
  return id;
}

// Instruments that sync through the instruments table: everything except
// handpans, which are rebuilt from the saved layouts (synced already).
function syncableInstruments(list) {
  return list.filter(i => i.family !== 'handpan');
}

// Two-way merge of local instruments with cloud rows ({ id, data,
// updated_at, deleted_at }): newest updatedAt wins per instrument, deletes
// included. Pure. Returns { local, toPush, changed } where toPush lists the
// local instruments the cloud lacks or has older.
function mergeInstruments(localList, rows) {
  const local = localList.map(i => ({ ...i }));
  let changed = false;
  const cloudById = new Map(rows.map(r => [r.id, r]));
  for (const row of rows) {
    const remote = { ...row.data, deletedAt: row.deleted_at ?? row.data?.deletedAt ?? undefined };
    if (!remote.deletedAt) delete remote.deletedAt;
    const idx = local.findIndex(i => i.id === row.id);
    if (idx < 0) { local.push(remote); changed = true; continue; }
    if ((remote.updatedAt || '') > (local[idx].updatedAt || '')) {
      local[idx] = { ...remote, lastPlayedAt: local[idx].lastPlayedAt ?? remote.lastPlayedAt };
      changed = true;
    }
  }
  const toPush = syncableInstruments(local).filter(i => {
    const row = cloudById.get(i.id);
    return !row || (i.updatedAt || '') > (row.data?.updatedAt || '');
  });
  return { local, toPush, changed };
}

// A shared instrument opened from a link or QR code, ready to add to My
// instruments: a fresh id, no public ID (that belongs to the owner's copy),
// no build readings.
function copySharedInstrument(shared, now = nowIso()) {
  const { publicId, build, setup, deletedAt, ...rest } = shared;
  return {
    ...rest,
    id: (shared.family === 'handpan' ? 'hp-' : 'oc-') + Math.random().toString(36).slice(2, 10),
    copiedFrom: publicId ?? null,
    build: build ? { ...build, stage: 'done', perChamber: [] } : undefined,
    createdAt: now, updatedAt: now, lastPlayedAt: now,
  };
}


// ── js/builder.js ──
// Builder logic: the seven stages of making a clay ocarina, clay bodies with
// learned shrinkage, and calibrating a bought ocarina from tuner readings.
// See docs/ocarina-mode.md, "Builder" and "Calibrated charts".
//
// Pure functions only (no DOM, no storage), unit tested in Node. The screens
// are in app.js; the clay body list is stored by instruments.js.

const STAGE_ORDER = ['design', 'body', 'leather', 'boneDry', 'bisque', 'final', 'done'];
const STAGE_TITLES = {
  design: 'Design', body: 'Body', leather: 'Voice and drill (leather-hard)',
  boneDry: 'Bone-dry check', bisque: 'Bisque check', final: 'Final check', done: 'Done',
};

const DEFAULT_CLAY_BODIES = [
  { id: 'generic', name: 'Generic clay (11%)', shrinkPct: 11, builds: 0 },
];

// Shrinkage fraction for a build (from its clay body), e.g. 0.11.
function buildShrink(inst) {
  return (inst.build?.shrinkPct ?? 11) / 100;
}

// Per-chamber build record, created on demand.
function chamberBuild(inst, ci) {
  const per = inst.build.perChamber[ci] ?? {};
  return {
    window: per.window ?? defaultWindow(midiToHz(inst.chambers[ci].notes[0], inst.build.a4 ?? 440)),
    readings: per.readings ?? {},
    holesDone: per.holesDone ?? [],
    testHoleMm: per.testHoleMm ?? 6,
  };
}

// Target frequency of every note of a chamber at a stage. Leather-hard
// targets are lowered for shrinkage (f × (1 − s)); bone-dry is compared
// with the leather-hard readings; bisque and final use concert pitch.
function stageTargets(chamber, stage, shrink, a4 = 440) {
  const out = {};
  for (const m of chamber.notes) {
    const concert = midiToHz(m, a4);
    out[m] = stage === 'leather' ? concert * (1 - shrink) : concert;
  }
  return out;
}

// What to do about a note measured at a stage. Returns { cents, status, text }
// with status 'ok' | 'flat' | 'sharp'. In tune means within ±10 cents.
function noteAdvice(stage, measuredHz, targetHz) {
  const cents = Math.round(centsBetween(measuredHz, targetHz));
  if (Math.abs(cents) <= 10) return { cents, status: 'ok', text: 'in tune' };
  const flat = cents < 0;
  const amount = `${Math.abs(cents)} cents ${flat ? 'flat' : 'sharp'}`;
  if (stage === 'leather') {
    return { cents, status: flat ? 'flat' : 'sharp', text: flat ? `${amount}: open it slightly` : `${amount}: make the hole a little smaller with clay` };
  }
  if (stage === 'boneDry') {
    return { cents, status: flat ? 'flat' : 'sharp', text: flat ? `${amount}: file this hole carefully` : `${amount}: leave it, it can't be lowered now` };
  }
  return { cents, status: flat ? 'flat' : 'sharp', text: flat ? `${amount}: file this hole a little larger` : `${amount}: can't be lowered by filing` };
}

// Hole diameters at leather-hard from the tuner readings, in drilling order
// (the opening order). Returns null until f0, d and f1 are all recorded.
// Each hole: { index, finger, mm, parts } where parts is [mm] or two halves
// or several equal ones for a hole over 12 mm; testHoleIndex is the hole the test hole becomes.
function leatherHolePlan(chamber, reading, shrink, a4 = 440) {
  if (!(reading?.f0 > 0 && reading?.d > 0 && reading?.f1 > reading?.f0)) return null;
  const targets = stageTargets(chamber, 'leather', shrink, a4);
  const { W, holes, testHoleIndex } = holeSizes({
    f0: reading.f0, d: reading.d, f1: reading.f1,
    targets: chamber.notes.slice(1).map(m => targets[m]),
  });
  return {
    W,
    testHoleIndex,
    holes: holes.map((mm, i) => ({
      index: i, finger: chamber.holes[i].finger, mm,
      parts: splitHole(mm),
    })),
  };
}

// Inside volume and ball size for each chamber's window (leather-hard target).
function bodyPlan(inst) {
  const shrink = buildShrink(inst);
  return inst.chambers.map((ch, ci) => {
    const win = chamberBuild(inst, ci).window;
    return { window: win, ...chamberVolume(win, midiToHz(ch.notes[0], inst.build.a4 ?? 440), shrink) };
  });
}

function nextStage(stage, { unglazed = false } = {}) {
  const i = STAGE_ORDER.indexOf(stage);
  const next = STAGE_ORDER[Math.min(i + 1, STAGE_ORDER.length - 1)];
  return next === 'final' && unglazed ? 'done' : next;
}

// Finishes a build: stores the drilled hole sizes on the chambers, the
// measured pitches, and the shrinkage learned from leather-hard vs final
// (or bisque, if unglazed) readings. Returns { inst, learned } where learned
// is the shrinkage fraction (null if no note was measured at both stages).
function finishBuild(inst) {
  const shrink = buildShrink(inst);
  const a4 = inst.build.a4 ?? 440;
  const leatherAll = {}, finalAll = {};
  const chambers = inst.chambers.map((ch, ci) => {
    const b = chamberBuild(inst, ci);
    const lr = b.readings.leather ?? {};
    Object.assign(leatherAll, lr.notes ?? {});
    Object.assign(finalAll, (b.readings.final ?? b.readings.bisque ?? {}).notes ?? {});
    const plan = leatherHolePlan(ch, { ...lr, d: lr.d ?? b.testHoleMm }, shrink, a4);
    return plan ? applyHoleSizes(ch, plan.holes.map(h => h.mm)) : ch;
  });
  const learned = learnedShrinkage(leatherAll, finalAll);
  return {
    inst: {
      ...inst,
      chambers,
      measured: finalAll,
      build: { ...inst.build, stage: 'done', learnedShrink: learned },
    },
    learned,
  };
}

// Folds a new learned shrinkage into a clay body: the average over the
// builds made with it so far.
function updateClayBody(body, learned) {
  if (learned == null) return body;
  const n = body.builds ?? 0;
  const pct = ((body.shrinkPct * n) + learned * 100) / (n + 1);
  return { ...body, shrinkPct: Math.round(pct * 10) / 10, builds: n + 1 };
}

// ── Bought ocarinas: calibration ─────────────────────────────────────────────

// Default finger for each hole of an ocarina with `count` holes: the
// standard opening order, thumbs underneath above 8 holes; holes beyond 10
// are sub-holes (on a 12-hole ocarina, small holes next to a finger hole).
// The user checks and changes these.
function defaultCustomHoles(count) {
  const main = fingersForHoleCount(Math.min(count, OC_FINGER_ORDER.length));
  const holes = main.map(f => ({ id: f, finger: f, side: f.endsWith('T') ? 'bottom' : 'top' }));
  const subFingers = ['R4', 'L4', 'R3'];
  for (let i = 0; holes.length < count; i++) {
    const f = subFingers[i % subFingers.length];
    holes.push({ id: f + 's' + (i + 1), finger: f, side: 'top', sub: true });
  }
  return holes;
}

// A playable chamber from calibration readings: f0 with every hole closed,
// singles[i] with only hole i open. Returns { notes, holes, fingerings,
// calibration } or null until every reading is in.
function calibrateChamber(holes, f0, singles, { a4 = 440, toleranceCents = 20 } = {}) {
  if (!(f0 > 0) || singles.length !== holes.length || !singles.every(hz => hz > f0)) return null;
  const measurements = singles.map((hz, i) => ({ states: holes.map((_, j) => (j === i ? 'o' : 'c')), hz }));
  const ratios = solveHoleRatios(f0, measurements);
  const chart = calibratedChart(f0, ratios, { a4, toleranceCents });
  const max = Math.max(...ratios);
  const notes = Object.keys(chart).map(Number).sort((a, b) => a - b);
  const fingerings = {};
  for (const m of notes) fingerings[m] = chart[m].states;
  return {
    notes,
    holes: holes.map((h, i) => ({ ...h, rel: ratios[i] / max })),
    fingerings,
    calibration: { f0, singles, ratios, cents: Object.fromEntries(notes.map(m => [m, Math.round(chart[m].cents)])) },
  };
}


// ── js/audio.js ──
let ctx = null;
let masterGain = null;
let reverbSend = null; // set after reverb setup; null = reverb not ready, use masterGain

function buildReverb() {
  // ~1.8 s exponentially-decaying white-noise impulse response
  const len = Math.floor(ctx.sampleRate * 1.8);
  const ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c);
    for (let i = 0; i < len; i++) {
      const t = i / ctx.sampleRate;
      d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 3.5);
    }
  }
  const conv = ctx.createConvolver();
  conv.buffer = ir;
  return conv;
}

function setupReverb() {
  const conv = buildReverb();

  const dryGain = ctx.createGain();
  dryGain.gain.value = 0.7;
  dryGain.connect(masterGain);

  const reverbReturn = ctx.createGain();
  reverbReturn.gain.value = 0.25;
  conv.connect(reverbReturn);
  reverbReturn.connect(masterGain);

  reverbSend = ctx.createGain();
  reverbSend.gain.value = 1;
  reverbSend.connect(dryGain);
  reverbSend.connect(conv);
}

function initAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();

  masterGain = ctx.createGain();
  masterGain.gain.value = 0.7;

  // iOS routes Web Audio through the earpiece (AVAudioSessionCategoryAmbient) by default.
  // Routing masterGain → MediaStreamDestinationNode → <audio playsinline> forces iOS to
  // use AVAudioSessionCategoryPlayback, which outputs through the main speaker.
  // Falls back to ctx.destination if the MediaStream API is unavailable.
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (isIOS && ctx.createMediaStreamDestination) {
    try {
      const streamDest = ctx.createMediaStreamDestination();
      masterGain.connect(streamDest);
      const routingEl = document.createElement('audio');
      routingEl.setAttribute('playsinline', '');
      routingEl.srcObject = streamDest.stream;
      document.body.appendChild(routingEl);
      routingEl.play().catch(() => {
        masterGain.connect(ctx.destination); // fallback if stream play rejected
      });
    } catch (_) {
      masterGain.connect(ctx.destination);
    }
  } else {
    masterGain.connect(ctx.destination);
  }

  // iOS unlock: play a silent buffer + resume() synchronously in the gesture handler
  const buf = ctx.createBuffer(1, 1, ctx.sampleRate);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  src.start(0);
  ctx.resume();

  // Reverb is non-critical — build it asynchronously so it never blocks
  // the gesture window or kills audio if buildReverb() throws on some browser.
  setTimeout(() => {
    try { setupReverb(); } catch (_) {}
  }, 0);
}

// Wait for the context to actually be running before scheduling audio.
// On iOS Chrome the context can still be 'suspended' right after resume() is called;
// scheduling on a suspended context drops the audio silently.
function whenRunning(fn) {
  if (!ctx) initAudio();
  if (ctx.state === 'running') {
    fn();
  } else {
    ctx.resume().then(() => fn());
  }
}

const START_OFFSET = 0.05;

function playFreq(freq, startTime) {
  if (!ctx) return;
  const now = startTime ?? ctx.currentTime;
  const sink = reverbSend ?? masterGain; // fall back if reverb not ready yet

  const harmonics = [
    { mult: 1,   gain: 0.52, decay: 5.5 },
    { mult: 2,   gain: 0.34, decay: 3.2 },
    { mult: 3,   gain: 0.11, decay: 2.0 },
    { mult: 4,   gain: 0.05, decay: 1.3 },
  ];

  harmonics.forEach(({ mult, gain, decay }) => {
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq * mult;
    osc.detune.value = (Math.random() - 0.5) * 4;

    env.gain.setValueAtTime(0, now);
    env.gain.linearRampToValueAtTime(gain, now + 0.004);
    env.gain.exponentialRampToValueAtTime(gain * 0.55, now + 0.18);
    env.gain.exponentialRampToValueAtTime(0.0001, now + decay);

    osc.connect(env);
    env.connect(sink);
    osc.start(now);
    osc.stop(now + decay + 0.1);
    osc.onended = () => { osc.disconnect(); env.disconnect(); };
  });
}

function playNote(noteName) {
  initAudio();
  whenRunning(() => playFreq(noteToFreq(noteName), ctx.currentTime + START_OFFSET));
}

function playChord(noteNames, onArp, onTogether) {
  initAudio();
  const sorted = [...noteNames].sort((a, b) => noteToMidi(a) - noteToMidi(b));
  const ARP = 0.3;
  const togetherOffset = sorted.length * ARP + 0.35;
  whenRunning(() => {
    const now = ctx.currentTime + START_OFFSET;
    sorted.forEach((n, i) => {
      playFreq(noteToFreq(n), now + i * ARP);
      if (onArp) setTimeout(() => onArp(n), Math.round(i * ARP * 1000));
    });
    sorted.forEach(n => playFreq(noteToFreq(n), now + togetherOffset));
    if (onTogether) setTimeout(() => onTogether(sorted), Math.round(togetherOffset * 1000));
  });
}

function playScale(noteNames, onNote) {
  initAudio();
  const asc = [...noteNames].sort((a, b) => noteToMidi(a) - noteToMidi(b));
  const desc = asc.slice(0, -1).reverse();
  const all = [...asc, ...desc];
  const INTERVAL = 0.4;
  whenRunning(() => {
    const now = ctx.currentTime + START_OFFSET;
    all.forEach((n, i) => {
      playFreq(noteToFreq(n), now + i * INTERVAL);
      if (onNote) setTimeout(() => onNote(n), Math.round(i * INTERVAL * 1000));
    });
  });
}

// Notes one after another in the order given, no final chord: an arpeggio
// on an instrument that sounds one note at a time (ocarina, flute).
function playSequence(noteNames, onNote, interval = 0.4) {
  initAudio();
  whenRunning(() => {
    const now = ctx.currentTime + START_OFFSET;
    noteNames.forEach((n, i) => {
      playFreq(noteToFreq(n), now + i * interval);
      if (onNote) setTimeout(() => onNote(n, i), Math.round(i * interval * 1000));
    });
  });
}


// ── js/pan.js ──
const PAN_SVG_ID = 'handpan-svg';

// Physical handpan ring layout (confirmed from klangzeug.de for all scales).
// Notes sorted ascending (n1=lowest, nN=highest) placed clockwise from 12 o'clock.
// For 10-ring instruments, n9+n10 go on a separate inner ring (see renderPan).
function physicalOrder(n) {
  if (n === 7)  return [6,4,2,0,1,3,5];
  if (n === 8)  return [7,6,4,2,0,1,3,5];
  if (n === 9)  return [8,6,4,2,0,1,3,5,7];
  return null;
}

// Outer ring physical order for 10-ring instruments (n1-n8, same as 8-ring).
const OUTER_8_ORDER = [7,6,4,2,0,1,3,5];

// Inner ring note positions. 1-2 notes: symmetric at ±45° from top, r=100.
// 3-5 notes: evenly spread across an arc from -140° to -40°, r=95.
function innerRingPositions(cx, cy, count) {
  if (count <= 2) {
    const r = 100;
    const angles = [-Math.PI * 3 / 4, -Math.PI / 4]; // -135°, -45°
    return angles.slice(0, count).map(a => ({
      x: Math.round(cx + r * Math.cos(a)),
      y: Math.round(cy + r * Math.sin(a)),
    }));
  }
  const r = 95;
  const start = (-140 * Math.PI) / 180;
  const end   = (-40 * Math.PI) / 180;
  const step  = (end - start) / (count - 1);
  return Array.from({ length: count }, (_, i) => {
    const a = start + i * step;
    return { x: Math.round(cx + r * Math.cos(a)), y: Math.round(cy + r * Math.sin(a)) };
  });
}

function circlePositions(count, cx, cy, r, rotationOffset = 0) {
  return Array.from({ length: count }, (_, i) => {
    const angle = (i * 2 * Math.PI / count) - Math.PI / 2 + rotationOffset;
    return {
      x: Math.round(cx + r * Math.cos(angle)),
      y: Math.round(cy + r * Math.sin(angle)),
    };
  });
}

// All tone fields are circles. r controls size; lower notes get larger circles.
function noteSlotSvg(x, y, note, extraClasses, noteId, r = 24, useFlats = false, useSolfege = false) {
  const isEmpty = !note;
  const allClasses = ['pan-note', ...extraClasses.split(' ').filter(Boolean)].join(' ');
  const noteAttr = note ? ` data-note="${note}"` : '';

  let textHtml;
  if (isEmpty) {
    textHtml = `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central"
      font-family="system-ui,sans-serif" font-size="${Math.round(r * 0.7)}" font-weight="600"
      fill="var(--note-rest-text)">+</text>`;
  } else {
    const displayed = displayNote(note, useFlats, useSolfege);
    const name = displayed.replace(/\d+$/, '');
    const oct = (displayed.match(/\d+$/) ?? [''])[0];
    const nameFontSize = Math.max(8, Math.round((name.length > 1 ? 12 : 14) * r / 26));
    const octFontSize  = Math.max(6, Math.round(9 * r / 26));
    const nameY = y - Math.round(r * 0.14);
    const octY  = y + Math.round(r * 0.40);
    textHtml = `<text x="${x}" y="${nameY}" text-anchor="middle" dominant-baseline="auto"
      font-family="system-ui,sans-serif" font-size="${nameFontSize}" font-weight="600"
      fill="var(--note-rest-text)">${name}</text>
<text x="${x}" y="${octY}" text-anchor="middle" dominant-baseline="auto"
      font-family="system-ui,sans-serif" font-size="${octFontSize}" font-weight="400"
      fill="var(--note-rest-text)" opacity="0.5">${oct}</text>`;
  }

  return `<g class="${allClasses}" data-note-id="${noteId}"${noteAttr}>
  <circle cx="${x}" cy="${y}" r="${r}" fill="var(--note-rest-bg)" stroke="var(--border)" stroke-width="1.5"/>
  ${textHtml}
</g>`;
}

// Radius for a ring note at sorted index i (0=lowest, n-1=highest).
// Lower notes are physically larger on a real handpan.
function ringNoteRadius(sortedIndex, total) {
  // 10+ ring instruments: keep smaller notes to avoid inner-ring overlap
  const minR = total >= 10 ? 18 : 22;
  const maxR = total >= 10 ? 26 : 30;
  const t = total <= 1 ? 0 : sortedIndex / (total - 1);
  return Math.round(maxR - (maxR - minR) * t);
}

// Bottom notes now rendered as outer ring in unified renderPan — this function is kept
// only for callers that may reference it directly (shellMode='bottom' handled inline).

function renderPan(layout, opts = {}) {
  const { shellMode = 'both', highlightNotes = [], altHighlightNotes = [], rotated = false, useFlats = false, useSolfege = false } = opts;

  const cx = 250, cy = 250;
  const hlSet = new Set(highlightNotes);
  const altSet = new Set(altHighlightNotes);

  // Assign each unique pitch class in the chord its own color (0-3, root first),
  // cycling for chords with more than 4 distinct pitch classes.
  const pcColorIndex = new Map();
  highlightNotes.forEach(n => {
    const pc = notePC(n);
    if (!pcColorIndex.has(pc)) pcColorIndex.set(pc, pcColorIndex.size % 4);
  });

  const dimTop = shellMode === 'bottom';
  const dimBottom = shellMode === 'top';

  function noteClass(note, isTopShell) {
    const classes = [];
    if (!note) classes.push('empty');
    else if (hlSet.has(note)) classes.push(`highlight highlight-${pcColorIndex.get(notePC(note))}`);
    else if (altSet.has(note)) classes.push(`alt-highlight alt-highlight-${pcColorIndex.get(notePC(note))}`);
    if (isTopShell && dimTop) classes.push('dimmed');
    if (!isTopShell && dimBottom) classes.push('dimmed');
    return classes.join(' ');
  }

  const totalRingSlots = layout.top.slots.length;
  const hasInnerRing = totalRingSlots >= 10 && totalRingSlots <= 13;
  const guCount = Math.max(layout.bottom.capacity, layout.bottom.slots.length);

  let svg = `<svg id="${PAN_SVG_ID}" viewBox="0 0 500 500" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="panGrad" cx="38%" cy="32%">
      <stop offset="0%" stop-color="#1a3828"/>
      <stop offset="60%" stop-color="#0d2018"/>
      <stop offset="100%" stop-color="#060f0c"/>
    </radialGradient>
    <radialGradient id="innerGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#183028"/>
      <stop offset="100%" stop-color="#0d1e18"/>
    </radialGradient>
  </defs>

  <!-- Pan body -->
  <circle cx="${cx}" cy="${cy}" r="193" fill="url(#panGrad)" stroke="#2a5040" stroke-width="2"/>
  <!-- Outer groove ring -->
  <circle cx="${cx}" cy="${cy}" r="173" fill="none" stroke="#1c3828" stroke-width="1" stroke-dasharray="3 7"/>
  <!-- Inner center dome -->
  <circle cx="${cx}" cy="${cy}" r="66" fill="url(#innerGrad)" stroke="#1c3828" stroke-width="1.5"/>
  <!-- Tone field guide ring -->
  <circle cx="${cx}" cy="${cy}" r="142" fill="none" stroke="#183028" stroke-width="1" opacity="0.5"/>
  ${hasInnerRing ? `<circle cx="${cx}" cy="${cy}" r="${totalRingSlots >= 12 ? 95 : 100}" fill="none" stroke="#183028" stroke-width="1" stroke-dasharray="3 5" opacity="0.4"/>` : ''}
`;

  // Ding (center)
  const dingNote = layout.top.ding;
  const dingHighlighted = dingNote && hlSet.has(dingNote);
  const dingClass = [
    !dingNote ? 'empty' : '',
    dingHighlighted ? `highlight highlight-${pcColorIndex.get(notePC(dingNote))}` : '',
    dimTop ? 'dimmed' : '',
  ].filter(Boolean).join(' ');
  svg += noteSlotSvg(cx, cy, dingNote, `ding ${dingClass}`, 'ding', 36, useFlats, useSolfege);

  if (hasInnerRing) {
    const outerSlots = OUTER_8_ORDER.map(i => layout.top.slots[i] ?? { note: null });
    const rotationRad = rotated ? Math.PI * (8 - 9) / 8 : 0;
    const outerPos = circlePositions(8, cx, cy, 142, rotationRad);
    for (let i = 0; i < 8; i++) {
      const slot = outerSlots[i];
      const sortedIdx = OUTER_8_ORDER[i];
      const r = ringNoteRadius(sortedIdx, totalRingSlots);
      svg += noteSlotSvg(outerPos[i].x, outerPos[i].y, slot.note,
        `ring ${noteClass(slot.note, true)}`, `ring-${sortedIdx}`, r, useFlats, useSolfege);
    }
    const innerCount = Math.min(5, totalRingSlots - 8);
    const innerPos = innerRingPositions(cx, cy, innerCount);
    for (let i = 0; i < innerCount; i++) {
      const sortedIdx = 8 + i;
      const slot = layout.top.slots[sortedIdx] ?? { note: null };
      const r = ringNoteRadius(sortedIdx, totalRingSlots);
      svg += noteSlotSvg(innerPos[i].x, innerPos[i].y, slot.note,
        `ring ${noteClass(slot.note, true)}`, `ring-${sortedIdx}`, r, useFlats, useSolfege);
    }
  } else {
    const ringCount = Math.max(layout.top.capacity, totalRingSlots);
    const rotationRad = rotated ? Math.PI * (ringCount - 9) / ringCount : 0;
    const ringPos = circlePositions(ringCount, cx, cy, 142, rotationRad);

    let ringSlots = layout.top.slots;
    let sortedIndices = null;
    if (!layout.isCustom) {
      const order = physicalOrder(totalRingSlots);
      if (order) {
        ringSlots = order.map(i => layout.top.slots[i] ?? { note: null });
        sortedIndices = order;
      }
    }

    for (let i = 0; i < ringCount; i++) {
      const slot = ringSlots[i] ?? { note: null };
      const pos = ringPos[i];
      const r = sortedIndices ? ringNoteRadius(sortedIndices[i], totalRingSlots) : 22;
      svg += noteSlotSvg(pos.x, pos.y, slot.note, `ring ${noteClass(slot.note, true)}`, `ring-${i}`, r, useFlats, useSolfege);
    }
  }

  // Bottom shell — outer orbit circles around the pan body
  if (guCount > 0) {
    const guPos = circlePositions(guCount, cx, cy, 228, 0);
    for (let i = 0; i < guCount; i++) {
      const slot = layout.bottom.slots[i] ?? { note: null };
      svg += noteSlotSvg(guPos[i].x, guPos[i].y, slot.note,
        `gu ${noteClass(slot.note, false)}`, `gu-${i}`, 16, useFlats, useSolfege);
    }
  }

  svg += '</svg>';
  return svg;
}

// Update highlight using full note strings (with octave)
function updatePanHighlight(noteNames, altNoteNames = []) {
  const svg = document.getElementById(PAN_SVG_ID);
  if (!svg) return;
  const nameSet = new Set(noteNames);
  const altSet = new Set(altNoteNames);
  svg.querySelectorAll('.pan-note').forEach(el => {
    if (el.classList.contains('empty')) return;
    const note = el.dataset.note;
    el.classList.toggle('highlight', !!(note && nameSet.has(note)));
    el.classList.toggle('alt-highlight', !!(note && !nameSet.has(note) && altSet.has(note)));
  });
}

function updatePanShellMode(mode) {
  const svg = document.getElementById(PAN_SVG_ID);
  if (!svg) return;
  svg.querySelectorAll('.pan-note').forEach(el => {
    const isTop = el.classList.contains('ding') || el.classList.contains('ring');
    const isBottom = el.classList.contains('gu');
    if (mode === 'top') el.classList.toggle('dimmed', isBottom);
    else if (mode === 'bottom') el.classList.toggle('dimmed', isTop);
    else el.classList.remove('dimmed');
  });
}

// Highlight the currently playing note(s). Clears any previous playing state
// so only the most-recently-requested notes are lit. Auto-clears after 2.2s.
let _playTimer = null;
function updatePanPlaying(noteNames) {
  const svg = document.getElementById(PAN_SVG_ID);
  if (!svg) return;
  if (_playTimer !== null) { clearTimeout(_playTimer); _playTimer = null; }
  svg.querySelectorAll('.pan-note.playing').forEach(el => el.classList.remove('playing'));
  const nameSet = new Set(noteNames);
  svg.querySelectorAll('.pan-note').forEach(el => {
    if (el.classList.contains('empty')) return;
    const note = el.dataset.note;
    if (note && nameSet.has(note)) el.classList.add('playing');
  });
  _playTimer = setTimeout(() => {
    svg.querySelectorAll('.pan-note.playing').forEach(el => el.classList.remove('playing'));
    _playTimer = null;
  }, 2200);
}


// ── js/ocarina-ui.js ──
// The fingering diagram: one SVG component that draws every ocarina (and
// later flute) fingering in the app, at three sizes. See docs/ocarina-mode.md,
// "The fingering diagram".
//
// renderFingering() returns an SVG string, like renderPan() does. The helpers
// above it (fingeringFor, fingeringMoves, describeFingering) are pure and unit
// tested in Node.

const FINGER_NAMES = {
  L1: 'left index', L2: 'left middle', L3: 'left ring', L4: 'left pinky', LT: 'left thumb',
  R1: 'right index', R2: 'right middle', R3: 'right ring', R4: 'right pinky', RT: 'right thumb',
};

// ── Pure helpers ─────────────────────────────────────────────────────────────

// Every note the instrument can play, ascending, with no duplicates.
function playableMidis(inst) {
  const set = new Set();
  for (const ch of inst.chambers ?? []) for (const m of Object.keys(ch.fingerings)) set.add(Number(m));
  return [...set].sort((a, b) => a - b);
}

// The chamber and hole states for a note: { chamberIndex, chamber, states }
// or null if the instrument can't play it. Lowest chamber wins if several can.
function fingeringFor(inst, midi) {
  const chambers = inst.chambers ?? [];
  for (let i = 0; i < chambers.length; i++) {
    const states = chambers[i].fingerings[midi];
    if (states) return { chamberIndex: i, chamber: chambers[i], states };
  }
  return null;
}

// What a hole is called in instructions: its finger, or "R2 sub-hole" for
// the small extra hole a finger covers by sliding forward.
function fgHoleName(h) { return h.sub ? `${h.finger} sub-hole` : h.finger; }

// Per finger (sub-holes separately), whether it is on a hole ('c' or 'h').
function fgFingersDown(chamber, states) {
  const down = {};
  chamber.holes.forEach((h, i) => {
    const k = fgHoleName(h);
    down[k] = (down[k] ?? false) || states[i] !== 'o';
  });
  return down;
}

function fgJoinFingers(list) {
  if (list.length <= 1) return list.join('');
  return list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1];
}

// What moves from one note to the next: fingers to lift and to cover, a
// sentence for under the diagram ("Lift R3 and R2", "Cover L1, lift R4"), and
// whether the player switches chamber. Fingers that stay put aren't listed.
function fingeringMoves(inst, fromMidi, toMidi) {
  const a = fingeringFor(inst, fromMidi);
  const b = fingeringFor(inst, toMidi);
  if (!a || !b) return { lift: [], cover: [], switchChamber: false, text: '' };
  const before = fgFingersDown(a.chamber, a.states);
  const after = fgFingersDown(b.chamber, b.states);
  const fingers = Object.keys(after);
  const lift = fingers.filter(f => before[f] === true && after[f] === false);
  const cover = fingers.filter(f => before[f] !== true && after[f] === true);
  const switchChamber = a.chamberIndex !== b.chamberIndex;
  const parts = [];
  if (switchChamber) parts.push(`Blow chamber ${b.chamberIndex + 1}`);
  if (cover.length) parts.push(`cover ${fgJoinFingers(cover)}`);
  if (lift.length) parts.push(`lift ${fgJoinFingers(lift)}`);
  let text = parts.join(', ');
  text = text ? text[0].toUpperCase() + text.slice(1) : 'No change';
  return { lift, cover, switchChamber, text };
}

// Accessible label: "D4: R4 and R3 open, all others closed".
function describeFingering(inst, midi, noteLabel = midiToNoteName(midi)) {
  const f = fingeringFor(inst, midi);
  if (!f) return `${noteLabel}: not on this instrument`;
  const open = [], half = [];
  f.chamber.holes.forEach((h, i) => {
    const k = fgHoleName(h);
    if (f.states[i] === 'o' && !open.includes(k)) open.push(k);
    if (f.states[i] === 'h' && !half.includes(k)) half.push(k);
  });
  const chamber = (inst.chambers.length > 1) ? ` (chamber ${f.chamberIndex + 1})` : '';
  const parts = [];
  if (open.length) parts.push(`${fgJoinFingers(open)} open`);
  if (half.length) parts.push(`${fgJoinFingers(half)} half-covered`);
  const blow = f.chamber.overblow?.includes(midi) ? ', blow harder' : '';
  if (!parts.length) return `${noteLabel}${chamber}: all holes closed${blow}`;
  const rest = (open.length + half.length) < new Set(f.chamber.holes.map(fgHoleName)).size ? ', all others closed' : '';
  return `${noteLabel}${chamber}: ${parts.join(', ')}${rest}${blow}`;
}

// Hole sizes relative to the largest hole of the chamber (1 = largest).
// Uses calibrated or measured sizes when stored, otherwise (if fromNotes)
// the proportions from the target notes, otherwise all the same.
function relativeSizes(chamber, a4 = 440, { fromNotes = true } = {}) {
  if (chamber.holes.length && chamber.holes.every(h => h.rel > 0)) return chamber.holes.map(h => h.rel);
  const mm = chamber.holes.map(h => h.sizeMm);
  if (mm.every(x => x > 0)) {
    const max = Math.max(...mm);
    return mm.map(x => x / max);
  }
  if (fromNotes && chamber.notes?.length === chamber.holes.length + 1) {
    const [closed, ...rest] = chamber.notes;
    return relativeHoleSizes(midiToHz(closed, a4), rest.map(m => midiToHz(m, a4)));
  }
  return chamber.holes.map(() => 1);
}

// ── Chords ───────────────────────────────────────────────────────────────────

// The layout shape findAllChords() expects, from an ocarina's playable notes:
// lowest note as the "ding", the rest as ring notes. With a pitch-class set
// (a scale filter), only notes in it are kept.
function ocarinaToLayout(inst, pcs = null) {
  const names = playableMidis(inst)
    .filter(m => !pcs || pcs.has(((m % 12) + 12) % 12))
    .map(midiToNoteName);
  return {
    id: 'oc:' + inst.id,
    name: inst.name,
    isCustom: true,
    top: { ding: names[0] ?? null, slots: names.slice(1).map(note => ({ note })), capacity: Math.max(0, names.length - 1) },
    bottom: { slots: [], capacity: 0 },
  };
}

// A chord's notes in arpeggio order: the root first, then upward, then the
// notes below the root (still ascending). Returns MIDI numbers.
function arpeggioOrder(noteNames, rootNote) {
  const midis = noteNames.map(noteToMidi).sort((a, b) => a - b);
  const root = rootNote ? noteToMidi(rootNote) : midis[0];
  const rootIdx = Math.max(0, midis.indexOf(root));
  return [...midis.slice(rootIdx), ...midis.slice(0, rootIdx)];
}

// Fits a chord (note names, e.g. from a handpan scale) onto the instrument:
// each note as written if playable, else the nearest octave of the same
// pitch class that is. Returns { midis, missing } where missing lists the
// note names with no playable octave at all.
function fitChordToInstrument(inst, noteNames) {
  const playable = playableMidis(inst);
  const midis = [], missing = [];
  for (const n of noteNames) {
    const m = noteToMidi(n);
    if (playable.includes(m)) { midis.push(m); continue; }
    const same = playable.filter(p => ((p - m) % 12 + 12) % 12 === 0 && !midis.includes(p));
    if (same.length) midis.push(same.sort((a, b) => Math.abs(a - m) - Math.abs(b - m))[0]);
    else missing.push(n);
  }
  return { midis: midis.sort((a, b) => a - b), missing };
}

// Voicing swap: moves chord note `midi` to the next higher octave of the same
// pitch class the instrument has (wrapping to the lowest), skipping octaves
// the chord already uses. Returns the new ascending MIDI list.
function nextVoicing(inst, midis, midi) {
  const options = playableMidis(inst).filter(p => ((p - midi) % 12 + 12) % 12 === 0 && (p === midi || !midis.includes(p)));
  if (options.length < 2) return [...midis];
  const next = options[(options.indexOf(midi) + 1) % options.length];
  return midis.map(m => (m === midi ? next : m)).sort((a, b) => a - b);
}

// ── Geometry ─────────────────────────────────────────────────────────────────
// Diagram coordinates (viewBox units). A transverse ocarina is drawn the way
// printed charts show it: seen from above, lying on a diagonal with the head
// (mouthpiece) at the top left and the tail at the bottom right. The holes
// run in one line from head to tail: the left hand covers the head end, the
// right hand the tail end. Thumb holes are underneath, so they are drawn as
// dots outside the body: the left thumb's beside the head, the right
// thumb's below the belly.
//
// Positions are in the body's own frame (x along the body from the head,
// y across it), then turned by FG_TILT degrees onto the page.

const FG_W = 300;
const FG_TILT = 15;
const FG_TRANSVERSE = {
  bodyH: 162,
  pos: {
    L1: [48, -6], L2: [75, -6], L3: [101, -4], L4: [126, 6],
    R1: [152, 2], R2: [178, 2], R3: [204, 3], R4: [229, 2],
  },
  thumbs: { LT: [-14, 58], RT: [96, 64] },
};

// Body outlines in the body's frame. Sweet potato for soprano to tenor;
// bass chambers (closed note below C3) get the fatter, aubergine-like head.
const FG_SWEET_POTATO = 'M -4 2 C -4 -38, 34 -48, 74 -38 C 128 -26, 204 -18, 262 -8 C 274 -6, 274 8, 262 10 C 204 20, 128 34, 78 42 C 36 50, -4 40, -4 2 Z';
const FG_AUBERGINE = 'M -12 2 C -12 -60, 54 -62, 94 -40 C 132 -22, 204 -18, 262 -8 C 274 -6, 274 8, 262 10 C 204 20, 138 26, 102 46 C 58 70, -12 62, -12 2 Z';

function fgBodyPath(chamber) {
  return (chamber.notes?.[0] ?? 60) < 48 ? FG_AUBERGINE : FG_SWEET_POTATO;
}

// Half the body's width at distance x from the head, so holes always fit.
function fgHalfWidth(x) {
  return x <= 70 ? 40 : Math.max(9, 40 - (x - 70) * (31 / 192));
}

// Body frame → page coordinates for a chamber whose block starts at y0.
function fgToPage(lx, ly, y0) {
  const t = FG_TILT * Math.PI / 180;
  return [48 + lx * Math.cos(t) - ly * Math.sin(t), y0 + 60 + lx * Math.sin(t) + ly * Math.cos(t)];
}

const FG_PENDANT = {
  bodyH: 170,
  pos: {
    L1: [112, 58], L2: [96, 92], L3: [96, 126], L4: [112, 156],
    R1: [188, 58], R2: [204, 92], R3: [204, 126], R4: [188, 156],
  },
};
const FG_THUMB_X = { LT: 100, RT: 200 };
// Flutes: a tube seen from above, mouthpiece on the left, holes evenly
// along it in the order the chart lists them (mouthpiece first), with a
// gap between the two hands.
const FG_TUBE = { bodyH: 70, pos: {} };

function fgTubePositions(holes, y0) {
  const top = holes.map((h, i) => ({ h, i })).filter(x => x.h.side !== 'bottom');
  const xs = {};
  top.forEach((x, k) => {
    const t = top.length === 1 ? 0.5 : k / (top.length - 1);
    const handGap = x.h.finger.startsWith('R') ? 14 : 0;
    xs[x.i] = [96 + t * 150 + handGap, y0 + 40];
  });
  return xs;
}
const FG_STRIP_H = 34;

// Round pendant body only for small single-chamber ocarinas (4 holes or
// fewer, like the English-system pendants); everything else is transverse.
function fgIsPendant(inst) {
  const chambers = inst.chambers ?? [];
  const holes = Math.max(0, ...chambers.map(c => c.holes.length));
  return chambers.length === 1 && holes <= 4;
}

// ── Render ───────────────────────────────────────────────────────────────────

function fgHoleShape(x, y, r, state, cls) {
  if (state === 'c') return `<circle class="fg-hole fg-c ${cls}" cx="${x}" cy="${y}" r="${r}"/>`;
  if (state === 'o') return `<circle class="fg-hole fg-o ${cls}" cx="${x}" cy="${y}" r="${r}"/>`;
  // Half: ring with the lower half filled.
  return `<g class="fg-hole fg-h ${cls}">
    <circle class="fg-o" cx="${x}" cy="${y}" r="${r}"/>
    <path class="fg-c" d="M ${x - r} ${y} A ${r} ${r} 0 0 0 ${x + r} ${y} Z"/>
  </g>`;
}

function fgArrow(x, y, r, dir) {
  // Up arrow above the hole for "lift", down arrow for "cover".
  const top = y - r - 16, bot = y - r - 4;
  const [tip, tail] = dir === 'up' ? [top, bot] : [bot, top];
  const head = dir === 'up' ? tip + 5 : tip - 5;
  return `<g class="fg-arrow fg-arrow-${dir}">
    <line x1="${x}" y1="${tail}" x2="${x}" y2="${tip}"/>
    <polyline points="${x - 4},${head} ${x},${tip} ${x + 4},${head}"/>
  </g>`;
}

// renderFingering(instrument, midi, { size, previousMidi, showFingers, showSizes, useFlats, useSolfege, blowBoth })
//   size: 'large' | 'medium' | 'mini'
//   previousMidi: note played before, to mark the holes that change
//   blowBoth: a second MIDI note, on another chamber, for two-note harmony
function renderFingering(inst, midi, opts = {}) {
  const {
    size = 'medium', previousMidi = null, showFingers = false, showSizes = false,
    useFlats = false, useSolfege = false, blowBoth = null, a4 = 440, nextMidi = null,
  } = opts;
  const tube = inst.family === 'flute';
  const geo = tube ? FG_TUBE : fgIsPendant(inst) ? FG_PENDANT : FG_TRANSVERSE;
  const chambers = inst.chambers ?? [];
  const main = fingeringFor(inst, midi);
  const second = blowBoth != null ? fingeringFor(inst, blowBoth) : null;
  // Arrows show either how this note was reached (previousMidi) or, in
  // practice mode, what to change next (nextMidi).
  const moves = nextMidi != null && nextMidi !== midi ? fingeringMoves(inst, midi, nextMidi)
    : previousMidi != null && previousMidi !== midi ? fingeringMoves(inst, previousMidi, midi) : null;
  const label = displayNote(midiToNoteName(midi), useFlats, useSolfege);
  const aria = describeFingering(inst, midi, label);
  const hasThumbs = chambers.some(c => c.holes.some(h => h.side === 'bottom'));
  const pad = 22; // room for arrows and the mouthpiece
  const transverse = geo === FG_TRANSVERSE;
  const chamberH = geo.bodyH + (hasThumbs && !transverse ? FG_STRIP_H : 0) + 14;
  const labelH = size === 'mini' ? 26 : 30;
  const H = pad + chambers.length * chamberH + labelH;

  const parts = [];
  chambers.forEach((ch, ci) => {
    const y0 = pad + ci * chamberH;
    const blown = main?.chamberIndex === ci || second?.chamberIndex === ci;
    const f = main?.chamberIndex === ci ? main : second?.chamberIndex === ci ? second : null;
    const states = f ? f.states : ch.holes.map(() => 'c');
    // Proportions from target notes only make sense for scale-built vessel
    // ocarinas; charts (and flutes, where position sets pitch) draw equal holes.
    const rel = relativeSizes(ch, a4, { fromNotes: inst.kind === 'scale' });
    const g = [];
    // Body
    const tubeXY = tube ? fgTubePositions(ch.holes, y0) : null;
    if (tube) {
      g.push(`<rect class="fg-body" x="38" y="${y0 + 22}" width="${FG_W - 52}" height="36" rx="18"/>`);
    } else if (geo === FG_PENDANT) {
      g.push(`<ellipse class="fg-body" cx="${FG_W / 2}" cy="${y0 + geo.bodyH / 2}" rx="${FG_W / 2 - 60}" ry="${geo.bodyH / 2}"/>`);
    } else {
      g.push(`<g transform="translate(48 ${y0 + 60}) rotate(${FG_TILT})"><path class="fg-body" d="${fgBodyPath(ch)}"/>`
        + `<rect class="fg-mouth ${blown ? 'fg-blow' : ''}" x="-34" y="-34" width="40" height="20" rx="5" transform="rotate(-28 -14 -24)"/></g>`);
    }
    // Mouthpiece, marked when this chamber is blown
    if (tube) g.push(`<rect class="fg-mouth ${blown ? 'fg-blow' : ''}" x="8" y="${y0 + 27}" width="34" height="26" rx="6"/>`);
    else if (geo === FG_PENDANT) g.push(`<rect class="fg-mouth ${blown ? 'fg-blow' : ''}" x="${FG_W / 2 - 13}" y="${y0 - 4}" width="26" height="18" rx="4"/>`);
    // (Transverse mouthpiece is drawn with the body, at the head.)
    if (blown && chambers.length > 1) {
      const lx = geo === FG_PENDANT ? FG_W / 2 + 22 : 64;
      const ly = geo === FG_PENDANT ? y0 + 9 : y0 + 14;
      g.push(`<text class="fg-blow-label" x="${lx}" y="${ly}">${second ? 'blow both' : 'blow'}</text>`);
    }
    // Underside strip for thumb holes (pendants; transverse draws them as dots)
    if (hasThumbs && !transverse) {
      const sy = y0 + geo.bodyH + 6;
      g.push(`<rect class="fg-strip" x="60" y="${sy}" width="${FG_W - 120}" height="${FG_STRIP_H - 6}" rx="6"/>`);
      if (size === 'large') g.push(`<text class="fg-strip-label" x="${FG_W / 2}" y="${sy + FG_STRIP_H / 2 - 2}">underside</text>`);
    }
    // Holes
    const seen = {};
    ch.holes.forEach((h, i) => {
      // k numbers the holes under one finger; a sub-hole gets its own arrow.
      const k = h.sub ? 0 : (seen[h.finger] = (seen[h.finger] ?? -1) + 1);
      // Holes a finger shares because one was split (over 12 mm); a sub-hole
      // is not a split, it sits on its own beside its main hole.
      const sameFinger = ch.holes.filter(x => x.finger === h.finger && !x.sub);
      const split = !h.sub && sameFinger.length > 1;
      let x, y;
      let maxR = Infinity;
      if (transverse) {
        let [lx, ly] = h.side === 'bottom'
          ? (FG_TRANSVERSE.thumbs[h.finger] ?? [100, 64])
          : (geo.pos[h.finger] ?? [150, 0]);
        const n = sameFinger.length;
        if (split) ly += (sameFinger.indexOf(h) - (n - 1) / 2) * (16 / Math.max(1, n - 1));
        if (h.sub) { lx += 8; ly += 16; }
        if (h.side !== 'bottom') maxR = fgHalfWidth(lx) - Math.abs(ly) - 3;
        [x, y] = fgToPage(lx, ly, y0);
      } else if (h.side === 'bottom') {
        x = FG_THUMB_X[h.finger] ?? FG_W / 2;
        y = y0 + geo.bodyH + 6 + (FG_STRIP_H - 6) / 2;
      } else if (tube) {
        [x, y] = tubeXY[i];
      } else {
        [x, y] = geo.pos[h.finger] ?? [FG_W / 2, y0 + geo.bodyH / 2];
        y += y0;
      }
      if (h.x != null && h.y != null) { x = h.x; y = y0 + h.y; }
      const count = sameFinger.length;
      if (!transverse) {
        if (split) y += (sameFinger.indexOf(h) - (count - 1) / 2) * (16 / Math.max(1, count - 1));
        if (h.sub) { x += 13; y += 15; }
      }
      // Transverse holes sit about 26 units apart, so 11 keeps a gap between them.
      const base = transverse ? 11 : 13;
      const r = Math.max(4, Math.min(maxR, (split ? 18 / count : base) * rel[i] * (h.sub && !(h.rel > 0) ? 0.5 : 1)));
      const hk = fgHoleName(h);
      const changed = moves && (moves.lift.includes(hk) || moves.cover.includes(hk)) && f;
      const cls = `${changed ? 'fg-changed' : ''}`;
      g.push(fgHoleShape(x, y, r, states[i], cls));
      if (changed && size !== 'mini' && k === 0) {
        g.push(fgArrow(x, y, r, moves.lift.includes(hk) ? 'up' : 'down'));
      }
      if (showFingers && size !== 'mini' && k === 0) {
        g.push(`<text class="fg-finger ${states[i] === 'c' ? 'on-dark' : ''}" x="${x}" y="${y}">${h.finger}</text>`);
      }
      if (showSizes && size !== 'mini' && h.sizeMm > 0) {
        g.push(`<text class="fg-size" x="${x}" y="${y + r + 9}">${h.sizeMm.toFixed(1)}</text>`);
      }
    });
    parts.push(`<g class="fg-chamber ${blown ? '' : 'fg-dim'}">${g.join('')}</g>`);
  });

  const noteY = pad + chambers.length * chamberH + (size === 'mini' ? 14 : 16);
  const overblow = main && main.chamber.overblow?.includes(midi);
  parts.push(`<text class="fg-note" x="${FG_W / 2}" y="${noteY}">${main ? label : label + ' ✕'}${overblow ? '<tspan class="fg-overblow" dx="6">↑ blow harder</tspan>' : ''}</text>`);

  return `<svg class="fingering fingering-${size}" viewBox="0 0 ${FG_W} ${H}" role="img"
    aria-label="${aria.replace(/"/g, '&quot;')}" data-midi="${midi}">${parts.join('')}</svg>`;
}

// Two hands as the player holds the instrument, each finger named.
function renderHandLegend() {
  const hand = (cx, side) => {
    // Seen from behind the hands: index fingers and thumbs face the middle.
    const s = side === 'L' ? -1 : 1;
    const fingers = [1, 2, 3, 4].map(n => {
      const x = cx - s * (2.5 - n) * 22;
      const len = [44, 50, 46, 36][n - 1];
      return `<rect class="hand-finger" x="${x - 9}" y="${70 - len}" width="18" height="${len + 14}" rx="9"/>
        <text class="hand-label" x="${x}" y="${70 - len + 14}">${side}${n}</text>`;
    }).join('');
    const tx = cx - s * 62;
    return `<rect class="hand-palm" x="${cx - 48}" y="70" width="96" height="62" rx="18"/>${fingers}
      <rect class="hand-finger" x="${tx - 26}" y="96" width="44" height="18" rx="9" transform="rotate(${s * 25} ${tx} 105)"/>
      <text class="hand-label" x="${tx - 4}" y="109">${side}T</text>
      <text class="hand-name" x="${cx}" y="152">${side === 'L' ? 'Left hand' : 'Right hand'}</text>`;
  };
  return `<svg class="hand-legend" viewBox="0 0 400 160" role="img"
    aria-label="Finger names: L1 to L4 are the left index to pinky, R1 to R4 the right index to pinky, LT and RT the thumbs">
    ${hand(100, 'L')}${hand(300, 'R')}</svg>`;
}


// ── js/storage.js ──
const LAYOUTS_KEY = 'hp-layouts';
const FAVS_KEY = 'hp-favorites'; // legacy, migrated into hp-playlists on first access
const PLAYLISTS_KEY = 'hp-playlists';

function safeParse(key) {
  try { return JSON.parse(localStorage.getItem(key) || '[]'); }
  catch { return []; }
}

function now() { return new Date().toISOString(); }

// ── Saved layouts ────────────────────────────────────────────────────────────

// Raw: includes soft-deleted entries (needed for cloud sync)
function getAllLayoutsRaw() { return safeParse(LAYOUTS_KEY); }

function getSavedLayouts() {
  return getAllLayoutsRaw().filter(l => !l.deletedAt);
}

function saveLayout(entry) {
  const all = getAllLayoutsRaw();
  const idx = all.findIndex(l => l.id === entry.id);
  const stamped = { ...entry, updatedAt: now() };
  if (idx >= 0) all[idx] = stamped;
  else all.unshift(stamped);
  localStorage.setItem(LAYOUTS_KEY, JSON.stringify(all));
}

function deleteLayout(id) {
  const all = getAllLayoutsRaw();
  const layout = all.find(l => l.id === id);
  if (layout) {
    const ts = now();
    layout.deletedAt = ts;
    layout.updatedAt = ts;
    localStorage.setItem(LAYOUTS_KEY, JSON.stringify(all));
  }
}

// ── Playlists ────────────────────────────────────────────────────────────────

// Raw: includes soft-deleted entries (needed for cloud sync)
function getAllPlaylistsRaw() {
  const raw = localStorage.getItem(PLAYLISTS_KEY);
  if (raw !== null) {
    try { return JSON.parse(raw); } catch { /* fall through */ }
  }
  // First run: create default Favorites playlist, migrate old favorites if any
  const old = safeParse(FAVS_KEY);
  const playlists = [{ id: 'favorites', name: 'Favorites', chords: old, updatedAt: now() }];
  localStorage.setItem(PLAYLISTS_KEY, JSON.stringify(playlists));
  return playlists;
}

function getPlaylists() {
  return getAllPlaylistsRaw().filter(p => !p.deletedAt);
}

function addPlaylist(name) {
  const playlists = getAllPlaylistsRaw();
  const id = 'pl-' + Date.now();
  playlists.push({ id, name, chords: [], updatedAt: now() });
  localStorage.setItem(PLAYLISTS_KEY, JSON.stringify(playlists));
  return id;
}

function renamePlaylist(id, name) {
  const playlists = getAllPlaylistsRaw();
  const pl = playlists.find(p => p.id === id);
  if (pl) { pl.name = name; pl.updatedAt = now(); localStorage.setItem(PLAYLISTS_KEY, JSON.stringify(playlists)); }
}

function deletePlaylist(id) {
  if (id === 'favorites') return;
  const playlists = getAllPlaylistsRaw();
  const pl = playlists.find(p => p.id === id);
  if (pl) {
    const ts = now();
    pl.deletedAt = ts;
    pl.updatedAt = ts;
    localStorage.setItem(PLAYLISTS_KEY, JSON.stringify(playlists));
  }
}

function addChordToPlaylist(playlistId, chord) {
  const playlists = getAllPlaylistsRaw();
  const pl = playlists.find(p => p.id === playlistId && !p.deletedAt);
  if (!pl || pl.chords.some(c => c.id === chord.id)) return false;
  pl.chords.unshift(chord);
  pl.updatedAt = now();
  localStorage.setItem(PLAYLISTS_KEY, JSON.stringify(playlists));
  return true;
}

// Overwrites an existing entry's voicing in place (same array position),
// rather than adding a new one. Used when a chord opened from a playlist
// gets its notes swapped and the user wants to save that change back.
function updatePlaylistChordVoicing(playlistId, oldFavId, updates) {
  const playlists = getAllPlaylistsRaw();
  const pl = playlists.find(p => p.id === playlistId);
  if (!pl) return false;
  const idx = pl.chords.findIndex(c => c.id === oldFavId);
  if (idx < 0) return false;
  pl.chords[idx] = { ...pl.chords[idx], ...updates };
  pl.updatedAt = now();
  localStorage.setItem(PLAYLISTS_KEY, JSON.stringify(playlists));
  return true;
}

function removeChordFromPlaylist(playlistId, chordFavId) {
  const playlists = getAllPlaylistsRaw();
  const pl = playlists.find(p => p.id === playlistId);
  if (!pl) return;
  pl.chords = pl.chords.filter(c => c.id !== chordFavId);
  pl.updatedAt = now();
  localStorage.setItem(PLAYLISTS_KEY, JSON.stringify(playlists));
}

function reorderChordInPlaylist(playlistId, fromIdx, toIdx) {
  const playlists = getAllPlaylistsRaw();
  const pl = playlists.find(p => p.id === playlistId);
  if (!pl || fromIdx === toIdx || toIdx < 0 || toIdx >= pl.chords.length) return;
  const [item] = pl.chords.splice(fromIdx, 1);
  pl.chords.splice(toIdx, 0, item);
  pl.updatedAt = now();
  localStorage.setItem(PLAYLISTS_KEY, JSON.stringify(playlists));
}

function isChordInPlaylist(playlistId, chordFavId) {
  const pl = getPlaylists().find(p => p.id === playlistId);
  return !!(pl && pl.chords.some(c => c.id === chordFavId));
}

function isChordInAnyPlaylist(chordFavId) {
  return getPlaylists().some(p => p.chords.some(c => c.id === chordFavId));
}

// Whether ANY voicing of this chord (same layout+chordId, any notes) is
// bookmarked anywhere. Used for the heart glance-indicator, which should stay
// filled regardless of which specific voicing is currently being viewed —
// unlike the exact-id match above, which the playlist picker needs to decide
// whether to add or remove THIS specific voicing.
function isChordBookmarkedAnyVoicing(layoutId, chordId) {
  return getPlaylists().some(p => p.chords.some(c => c.layoutId === layoutId && c.chordId === chordId));
}

// Legacy compat — keep old callers working
function getFavorites() {
  return getPlaylists().find(p => p.id === 'favorites')?.chords ?? [];
}
function toggleFavorite(fav) {
  if (isChordInPlaylist('favorites', fav.id)) {
    removeChordFromPlaylist('favorites', fav.id);
    return false;
  }
  return addChordToPlaylist('favorites', fav);
}
function isFavorite(id) { return isChordInPlaylist('favorites', id); }

let _lastScreen = null;
function render() {
  const app = document.getElementById('app');
  const screen = [state.view, state.wizard?.step, state.wizard?.oc?.path, state.view === 'instrument' ? state.oc.tab : '', state.currentInstrumentId].join('|');
  if (screen !== _lastScreen && !_toastFresh) hideToast();
  _lastScreen = screen;
  const prevSheet = app.querySelector('.sheet-root')?.dataset.sheet ?? null;
  const focusKey = focusKeyOf(document.activeElement);
  let html = '';
  if (state.view === 'home') html = viewHome();
  else if (state.view === 'wizard') html = viewWizard();
  else if (state.view === 'instrument') html = viewInstrument();
  else if (state.view === 'selector') html = viewSelector();
  else if (state.view === 'editor') html = viewEditor();
  else if (state.view === 'chords') html = viewChords();
  else if (state.view === 'hp-playlists') html = viewHandpanPlaylists();
  else if (state.view === 'playlist') html = viewPlaylist();
  else if (state.view === 'settings') html = viewSettings();
  else if (state.view === 'clay') html = viewClayBodies();
  // Everything after the app bar goes into <main>, the page's content column.
  const cut = html.indexOf('<!--appbar-end-->');
  app.innerHTML = cut < 0 ? `<main class="main">${html}</main>`
    : `${html.slice(0, cut)}<main class="main">${html.slice(cut)}</main>`;
  if (state.tuner.on) app.insertAdjacentHTML('beforeend', tunerStripHtml());
  app.insertAdjacentHTML('beforeend', sheetHtml());
  document.body.classList.toggle('has-tabbar', !!app.querySelector('.tabbar'));
  document.body.classList.toggle('tuner-on', state.tuner.on);
  document.body.classList.toggle('has-actionbar', !!app.querySelector('.actionbar'));
  // A record field stays armed only while it is on screen.
  if (state.rec.armed && !app.querySelector('.rec-field.is-armed')) disarmRecord();
  settleFocus(app, prevSheet, focusKey);
}

// ── Focus across re-renders ──────────────────────────────────────────────────
// Every render replaces the DOM, so focus is put back on the equivalent
// element afterwards. A sheet that opens takes focus; when it closes, focus
// returns to the control that opened it.
let _lastTrigger = null;     // focus key of the last clicked control
let _sheetReturnFocus = null;

function focusKeyOf(el) {
  if (!el || el === document.body || !el.closest?.('#app')) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  if (!el.dataset?.action) return null;
  const scope = el.closest('.sheet') ? '.sheet ' : el.closest('.appbar') ? '.appbar ' : '.main ';
  return scope + Object.entries(el.dataset)
    .map(([k, v]) => `[data-${k.replace(/[A-Z]/g, c => '-' + c.toLowerCase())}="${CSS.escape(v)}"]`).join('');
}

function focusByKey(key) {
  if (!key) return false;
  const el = document.querySelector(key);
  if (!el) return false;
  el.focus({ preventScroll: true });
  return true;
}

function settleFocus(app, prevSheet, focusKey) {
  const root = app.querySelector('.sheet-root');
  const sheet = root?.dataset.sheet ?? null;
  if (sheet && sheet !== prevSheet) {
    root.classList.add('is-entering');
    if (!prevSheet) _sheetReturnFocus = _lastTrigger;
    const first = ['.sheet-body [data-action]:not([disabled])', '.sheet-foot .btn-primary', '.sheet-body input', '.sheet-foot .btn']
      .map(sel => root.querySelector(sel)).find(Boolean);
    (first ?? root.querySelector('.sheet')).focus({ preventScroll: true });
    return;
  }
  if (!sheet && prevSheet) {
    focusByKey(_sheetReturnFocus);
    _sheetReturnFocus = null;
    return;
  }
  const active = document.activeElement;
  if (focusKey && (!active || active === document.body) && !/^#/.test(focusKey)) focusByKey(focusKey);
}

// ── Navigation ───────────────────────────────────────────────────────────────
// Entries the app pushes carry { hp: 1 }, so the app bar's back button knows
// it can step back through the browser history; without one (a deep link)
// it goes to the screen's logical parent instead.
function navPush(url) { history.pushState({ hp: 1 }, '', url); }
function navReplace(url, extra = {}) { history.replaceState({ ...(history.state ?? {}), ...extra }, '', url); }

function goHome() {
  stopAutoplay();
  Object.assign(state, {
    view: 'home', layout: null, selectedChord: null, pendingSlot: null,
    sourcePlaylistId: null, sourceEntryId: null, currentInstrumentId: null,
    wizard: null, discoverMode: false, discoverNotes: [], shared: null, sharedStatus: null, shareModal: null,
    menu: false, confirm: null, pickerChordFavId: null, pickerChordObj: null, hpFilters: false, hpMore: false,
  });
  refreshInstruments();
  navPush(location.pathname);
  render();
}

function goSelector() {
  stopAutoplay();
  state.view = 'selector';
  state.layout = null;
  state.selectedChord = null;
  state.pendingSlot = null;
  state.sourcePlaylistId = null;
  state.sourceEntryId = null;
  state.currentInstrumentId = null;
  navPush('#scales');
  render();
}

function openSettings({ push = true } = {}) {
  stopAutoplay();
  Object.assign(state, { view: 'settings', clayEdit: null, menu: false });
  state.oc.handLegend = false;
  if (push) navPush('#settings'); else navReplace('#settings');
  render();
}

// Removes an instrument once confirmed. A handpan instrument is its saved
// layout, so removing one removes both. Leaves the instrument if it is open.
function removeInstrument(id) {
  const inst = getInstrument(id);
  if (!inst) { render(); return; }
  if (inst.family === 'handpan') {
    deleteLayout(inst.layoutId);
    state.savedLayouts = getSavedLayouts();
    scheduleSave();
  } else {
    deleteInstrument(inst.id);
  }
  refreshInstruments();
  if (state.currentInstrumentId === id) { goHome(); return; }
  render();
}

function removePlaylist(id) {
  if (id === 'favorites') { render(); return; }
  deletePlaylist(id);
  state.playlists = getPlaylists();
  if (state.view === 'playlist' && state.activePlaylistId === id) {
    state.view = 'home';
    state.activePlaylistId = null;
    navPush(location.pathname);
  }
  scheduleSave();
  render();
}
