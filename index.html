    max-height: var(--hp-list-h); overflow-y: auto; overscroll-behavior: contain;
  }
  .hp-list-head { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-bottom: var(--space-3); margin-bottom: 0; }
  .hp-filter-row { flex-direction: column; align-items: stretch; }
  .hp-filter-btn { align-self: flex-start; }
  .hp-roots { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
  .hp-stage {
    grid-column: 2; grid-row: 1; top: var(--hp-top); z-index: 1;
    margin: 0; padding: 0; border: 0; background: none; gap: var(--space-4);
    /* Taller than the window (a small window, many related chords): it scrolls. */
    max-height: var(--hp-list-h); overflow-y: auto; overscroll-behavior: contain;
  }
  .hp-pan svg { width: min(100%, 60dvh); }
  .hp-card { padding: var(--space-4); }
  .hp-card-head { flex-wrap: wrap; }
  .hp-card-title { font-size: var(--fs-20); line-height: var(--lh-20); }
}
@media (min-width: 1024px) {
  .hp-chords {
    --hp-list-h: calc(100dvh - var(--hp-top) - var(--space-4));
    grid-template-columns: 340px minmax(0, 1fr); gap: var(--space-6);
  }
  body.tuner-on .hp-chords { --hp-list-h: calc(100dvh - var(--hp-top) - var(--tuner-h) - var(--space-8)); }
  /* The pan leaves room for the chord card and its related chords below it. */
  .hp-pan svg { width: min(100%, 64dvh, max(240px, calc(100dvh - 400px))); }
  .hp-card { padding: var(--space-5); }
}
/* Short landscape (phone on its side): list | chord card | pan */
@media (max-height: 500px) and (min-width: 620px) {
  .main { padding-top: 6px; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  body.has-tabbar .main { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 6px); }
  .hp-chords { --hp-top: calc(var(--appbar-h) + env(safe-area-inset-top) + 6px); grid-template-columns: 220px minmax(0, 1fr); gap: var(--space-2); }
  .hp-stage { display: grid; grid-template-columns: minmax(170px, 240px) minmax(0, 1fr); gap: var(--space-2); align-items: start; }
  .hp-stage .hp-card { grid-column: 1; grid-row: 1; padding: var(--space-3); }
  .hp-stage .hp-pan { grid-column: 2; grid-row: 1; }
  .hp-pan svg { width: min(100%, var(--hp-list-h)); }
  .hp-card-title { font-size: var(--fs-17); line-height: var(--lh-17); }
  /* The list head scrolls away with the list, roots on one scrolling line. */
  .hp-list-head { position: static; gap: var(--space-2); }
  .hp-filter-row { flex-direction: row; align-items: center; }

// Note name → semitone offset (0–11)
const NOTE_TO_SEMI = {
  'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'F':5,
  'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11
};

// Normalize to preferred flat/sharp spelling
const ENHARMONIC = { 'D#':'Eb','A#':'Bb','G#':'Ab','Db':'C#','Gb':'F#' };

const SHARP_NAMES   = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_NAMES    = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const SOLFEGE_SHARP = ['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const SOLFEGE_FLAT  = ['Do','Reb','Re','Mib','Mi','Fa','Solb','Sol','Lab','La','Sib','Si'];

// Display a note. Accepts 'G#3' or 'G#'. useFlats picks flat/sharp spelling;
// useSolfege switches to fixed-do solfège (Do/Re/Mi…) instead of letters.
function displayNote(note, useFlats, useSolfege = false) {
  const m = note.match(/^([A-G][#b]?)(\d*)$/);
  if (!m) return note;
  const pc = NOTE_TO_SEMI[m[1]];
  if (pc === undefined) return note;
  if (useSolfege) return (useFlats ? SOLFEGE_FLAT : SOLFEGE_SHARP)[pc] + m[2];
  return (useFlats ? FLAT_NAMES : SHARP_NAMES)[pc] + m[2];
}

function normalizeNote(note) {
  const m = note.match(/^([A-G][#b]?)(\d)$/);
  if (!m) return note;
  const name = ENHARMONIC[m[1]] ?? m[1];
  return name + m[2];
}

function noteToMidi(note) {
  const m = note.match(/^([A-G][#b]?)(\d)$/);
  if (!m) return 0;
  return (parseInt(m[2]) + 1) * 12 + NOTE_TO_SEMI[m[1]];
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function noteToFreq(note) { return midiToFreq(noteToMidi(note)); }

function getNoteName(note) {
  const m = note.match(/^([A-G][#b]?)/);
  return m ? m[1] : note;
}

function notePC(note) { return noteToMidi(note) % 12; }

// Build a mutable Layout from a Scale (deep copy with slot wrapping)
function createLayoutFromScale(scale) {
  return {
    id: scale.id,
    name: scale.name,
    isCustom: false,
    top: {
      ding: scale.top.ding,
      slots: scale.top.notes.map(n => ({ note: n })),
      capacity: scale.top.capacity,
    },
    bottom: {
      slots: Array.from({ length: scale.bottom.capacity }, (_, i) => ({
        note: scale.bottom.notes[i] ?? null,
      })),
      capacity: scale.bottom.capacity,
    },
  };
}

// Collect all non-null notes from a layout (ding + ring + gu)
function getAllNotes(layout) {
  const notes = [layout.top.ding];
  layout.top.slots.forEach(s => { if (s.note) notes.push(s.note); });
  layout.bottom.slots.forEach(s => { if (s.note) notes.push(s.note); });
  return notes;
}

// ── js/chords.js ──
// Returns all chords playable on this layout, deduped by root + type
function findAllChords(layout) {
  const allNotes = getAllNotes(layout);
  const pcs = allNotes.map(notePC);
  const uniquePCs = [...new Set(pcs)];
  const results = [];
  const seen = new Set();

  for (const rootPC of uniquePCs) {
    for (const type of CHORD_TYPES) {
      const key = `${rootPC}-${type.id}`;
      if (seen.has(key)) continue;

      // Octave dyad: same pitch class, different octave
      if (type.id === 'oct') {
        const rootNotes = allNotes.filter(n => notePC(n) === rootPC);
        if (rootNotes.length >= 2) {
          const sorted = [...rootNotes].sort((a, b) => noteToMidi(a) - noteToMidi(b));
          seen.add(key);
          results.push({
            id: `${getNoteName(sorted[0])}-oct`,
            rootName: getNoteName(sorted[0]),
            rootNote: sorted[0],
            type,
            notes: sorted,
            noteCount: 2,
          });
        }
        continue;
      }

      const requiredPCs = type.intervals.map(i => (rootPC + i) % 12);
      if (!requiredPCs.every(pc => uniquePCs.includes(pc))) continue;

      // Pick one representative note per required PC (lowest pitch on instrument)
      const chordNotes = requiredPCs.map(pc => {
        const matches = allNotes.filter(n => notePC(n) === pc);
        return matches.sort((a, b) => noteToMidi(a) - noteToMidi(b))[0];
      });

      const rootNote = allNotes
        .filter(n => notePC(n) === rootPC)
        .sort((a, b) => noteToMidi(a) - noteToMidi(b))[0];

      seen.add(key);
      results.push({
        id: `${getNoteName(rootNote)}-${type.id}`,
        rootName: getNoteName(rootNote),
        rootNote,
        type,
        notes: chordNotes,
        noteCount: type.intervals.length,
      });
    }
  }

  return results;
}

// Identify which known chord type(s) an arbitrary set of notes forms (Discover mode).
// Tries each selected note as a candidate root and checks the resulting interval
// set against every CHORD_TYPES entry. Returns [] if fewer than 2 distinct
// pitch classes are given, or nothing matches.
function identifyChord(selectedNotes) {
  const byPC = new Map();
  selectedNotes.forEach(n => byPC.set(notePC(n), n)); // last-clicked note wins per pitch class
  const uniqueNotes = [...byPC.values()];
  if (uniqueNotes.length < 2) return [];
  const pcs = uniqueNotes.map(notePC);

  const matches = [];
  for (const rootNote of uniqueNotes) {
    const rootPC = notePC(rootNote);
    const intervals = pcs.map(pc => (pc - rootPC + 12) % 12).sort((a, b) => a - b);
    for (const type of CHORD_TYPES) {
      if (type.id === 'oct') continue;
      const typeIntervals = [...type.intervals].sort((a, b) => a - b);
      if (typeIntervals.length !== intervals.length) continue;
      if (!typeIntervals.every((iv, i) => iv === intervals[i])) continue;
      const notes = type.intervals.map(iv => uniqueNotes.find(n => notePC(n) === (rootPC + iv) % 12));
      matches.push({
        id: `${getNoteName(rootNote)}-${type.id}`,
        rootNote, rootName: getNoteName(rootNote),
        type, notes, noteCount: notes.length,
      });
    }
  }
  return matches;
}

// Returns related chords: same type / other roots, and chords sharing 2+ notes
function getRelatedChords(chord, allChords) {
  const sameType = allChords.filter(c =>
    c.type.id === chord.type.id && c.id !== chord.id
  );

  const chordPCs = new Set(chord.notes.map(notePC));
  const sharedNotes = allChords.filter(c => {
    if (c.id === chord.id || c.type.id === chord.type.id) return false;
    const sharedCount = c.notes.filter(n => chordPCs.has(notePC(n))).length;
    return sharedCount >= 2;
  });

  return { sameType, sharedNotes };
}


// ── js/ocarina.js ──
// Ocarina maths: pitch, chamber splitting, hole sizes, body volume, shrinkage,
// generated fingerings and two-note pair checks. See docs/ocarina-mode.md,
// "Maths reference for js/ocarina.js".
//
// Pure functions only: no DOM, no storage, no globals. Everything is unit
// tested in Node (tests/ocarina.test.mjs).
//
// build.py concatenates every js/ file into one <script>, so every top-level
// name here must be unique across the bundle (data.js already has
// midiToFreq, hence midiToHz below).
//
// Units: frequencies in Hz, lengths in mm, volumes in cm³ (= ml).

const OC_DEFAULT_A4 = 440;
const OC_SPEED_OF_SOUND = 343;        // m/s
const OC_DEFAULT_SHRINK = 0.11;       // generic clay shrinkage fraction
const OC_MAX_HOLE_MM = 12;            // larger holes are split in two
const OC_SINGLE_CHAMBER_SPAN = 14;    // semitones
const OC_CHAMBER_SPAN = 12;           // semitones above a chamber's lowest note

// Order in which holes open, lowest note first: right hand pinky → index,
// then left hand pinky → index, thumbs last.
const OC_FINGER_ORDER = ['R4', 'R3', 'R2', 'R1', 'L4', 'L3', 'L2', 'L1', 'LT', 'RT'];
const OC_THUMBS = ['LT', 'RT'];

// ── Pitch ────────────────────────────────────────────────────────────────────

// f = A4 × 2^((midi − 69) / 12)
function midiToHz(midi, a4 = OC_DEFAULT_A4) {
  return a4 * Math.pow(2, (midi - 69) / 12);
}

// Inverse of midiToHz; returns a fractional MIDI number.
function hzToMidi(hz, a4 = OC_DEFAULT_A4) {
  return 69 + 12 * Math.log2(hz / a4);
}

// Cents from `targetHz` to `hz` (positive = sharp, negative = flat).
function centsBetween(hz, targetHz) {
  return 1200 * Math.log2(hz / targetHz);
}

// ── Scale → notes ────────────────────────────────────────────────────────────

// MIDI notes of a handpan scale from data.js (ding + ring, plus gu notes
// unless includeGu is false), transposed and sorted ascending, no duplicates.
function scaleToMidis(scale, { transpose = 0, includeGu = true } = {}) {
  const names = [scale.top.ding, ...scale.top.notes];
  if (includeGu) names.push(...(scale.bottom?.notes ?? []));
  const midis = names.filter(Boolean).map(n => noteToMidi(n) + transpose);
  return [...new Set(midis)].sort((a, b) => a - b);
}

// ── Chamber splitting ────────────────────────────────────────────────────────

// Splits ascending notes into chambers (arrays of MIDI numbers). Each
// chamber's first note is its all-holes-closed note.
//
// Notes spanning ≤ 14 semitones → one chamber. Otherwise walk up and start a
// new chamber whenever a note is more than 12 semitones above the current
// chamber's lowest note. Then, from the top chamber down, any chamber with
// fewer than 2 notes takes the top notes of the chamber below; if the chamber
// below can't spare them (it would drop under 2 notes), the two are merged.
function splitChambers(midis) {
  const notes = [...new Set(midis)].sort((a, b) => a - b);
  if (notes.length === 0) return [];
  if (notes[notes.length - 1] - notes[0] <= OC_SINGLE_CHAMBER_SPAN) return [notes];

  const chambers = [[notes[0]]];
  for (const n of notes.slice(1)) {
    const cur = chambers[chambers.length - 1];
    if (n - cur[0] > OC_CHAMBER_SPAN) chambers.push([n]);
    else cur.push(n);
  }

  for (let i = chambers.length - 1; i >= 1; i--) {
    const upper = chambers[i];
    const lower = chambers[i - 1];
    while (upper.length < 2 && lower.length > 2) upper.unshift(lower.pop());
    if (upper.length < 2) {
      chambers[i - 1] = [...lower, ...upper];
      chambers.splice(i, 1);
    }
  }
  return chambers;
}

// ── Fingerings ───────────────────────────────────────────────────────────────

// Finger assignment for a chamber with `holeCount` holes, in opening order.
// Up to 8 holes use the fingers only; with more than 8, the two highest-note
// holes go underneath under the thumbs (LT, then RT).
function fingersForHoleCount(holeCount) {
  if (holeCount > OC_FINGER_ORDER.length) {
    throw new RangeError(`A chamber can have at most ${OC_FINGER_ORDER.length} holes (got ${holeCount})`);
  }
  if (holeCount <= 8) return OC_FINGER_ORDER.slice(0, holeCount);
  return [...OC_FINGER_ORDER.slice(0, holeCount - 2), ...OC_THUMBS];
}

// One chamber of a scale-built ocarina: holes in opening order and a
// cumulative fingering per note (note k = first k holes open).
// Hole positions (x, y) and sizes are filled in later by the UI / builder.
function buildChamber(notes) {
  const sorted = [...notes].sort((a, b) => a - b);
  const fingers = fingersForHoleCount(sorted.length - 1);
  const holes = fingers.map(f => ({
    id: f,
    finger: f,
    side: OC_THUMBS.includes(f) ? 'bottom' : 'top',
    x: null,
    y: null,
    sizeMm: null,
  }));
  const fingerings = {};
  sorted.forEach((midi, k) => {
    fingerings[midi] = holes.map((_, h) => (h < k ? 'o' : 'c'));
  });
  return { notes: sorted, holes, fingerings };
}

// Chambers, holes and fingerings for a scale-built ocarina from MIDI notes.
function buildScaleChambers(midis) {
  return splitChambers(midis).map(buildChamber);
}

// ── Hole sizes ───────────────────────────────────────────────────────────────

// Window equivalent hole size from the tuning readings:
// W = d / ((f1/f0)² − 1)
function windowEquivalent(f0, d, f1) {
  const r = (f1 / f0) ** 2 - 1;
  if (!(r > 0)) throw new RangeError('f1 must be higher than f0');
  return d / r;
}

// Total open hole diameter for a note at fn: D = W × ((fn/f0)² − 1)
function totalOpenDiameter(W, f0, fn) {
  return W * ((fn / f0) ** 2 - 1);
}

// Per-hole diameters (mm) for a cumulative fingering.
//   f0       measured closed pitch
//   d, f1    test hole diameter and pitch with it open
//   targets  target frequencies of the open notes, ascending (notes[1..])
// Returns { W, totals, holes, testHoleIndex } where holes[n] = D_n − D_(n−1)
// and testHoleIndex is the first hole whose size is at least d (−1 if none).
function holeSizes({ f0, d, f1, targets }) {
  const W = windowEquivalent(f0, d, f1);
  const totals = targets.map(fn => totalOpenDiameter(W, f0, fn));
  const holes = totals.map((D, i) => D - (i === 0 ? 0 : totals[i - 1]));
  const testHoleIndex = holes.findIndex(h => h >= d);
  return { W, totals, holes, testHoleIndex };
}

// Before readings exist: relative hole sizes only, as fractions of the
// largest hole (largest = 1). Uses the chamber's closed note as f0; W cancels.
function relativeHoleSizes(closedHz, targets) {
  const totals = targets.map(fn => (fn / closedHz) ** 2 - 1);
  const holes = totals.map((D, i) => D - (i === 0 ? 0 : totals[i - 1]));
  const max = Math.max(...holes);
  return holes.map(h => h / max);
}

// A hole over 12 mm becomes two holes of half the diameter, opened together
// (the brief's rule). A hole over 24 mm would still leave halves over 12 mm,
// so it becomes as many equal holes as it takes to stay at or under 12 mm.
// Returns the diameters.
function splitHole(diameter, maxMm = OC_MAX_HOLE_MM) {
  const n = Math.ceil(diameter / maxMm);
  return n <= 1 ? [diameter] : Array.from({ length: n }, () => diameter / n);
}

// Applies diameters (one per hole, opening order) to a chamber from
// buildChamber, splitting holes over 12 mm into holes 'R4a', 'R4b', …
// that share the finger and the state in every fingering.
function applyHoleSizes(chamber, diameters, maxMm = OC_MAX_HOLE_MM) {
  const holes = [];
  const source = []; // index of the original hole for each new hole
  chamber.holes.forEach((hole, i) => {
    const parts = splitHole(diameters[i], maxMm);
    parts.forEach((size, p) => {
      holes.push({ ...hole, id: parts.length > 1 ? hole.id + 'abcd'[p] : hole.id, sizeMm: size });
      source.push(i);
    });
  });
  const fingerings = {};
  for (const [midi, states] of Object.entries(chamber.fingerings)) {
    fingerings[midi] = source.map(i => states[i]);
  }
  return { ...chamber, holes, fingerings };
}

// ── Window and body volume ───────────────────────────────────────────────────

// Window area (mm²) by shape. For 'round', `w` is the diameter.
function windowArea({ shape, w, l }) {
  switch (shape) {
    case 'rect': case 'rectangle': return w * l;
    case 'round': return Math.PI * w * w / 4;
    case 'oval': return Math.PI * w * l / 4;
    default: throw new RangeError(`Unknown window shape: ${shape}`);
  }
}

// Default window for a chamber whose closed note is f Hz:
// width = 10 × √(262/f), clamped to 6–16 mm and rounded; length = 0.75 × width;
// wall 4 mm.
function defaultWindow(f) {
  const w = Math.round(Math.min(16, Math.max(6, 10 * Math.sqrt(262 / f))));
  return { shape: 'rect', w, l: 0.75 * w, t: 4 };
}

// Helmholtz volume (cm³) for a window of area A (mm²), wall t (mm) and
// frequency f (Hz):
//   a = √(A/π), K = A / (t + 1.5a), V = K c² / (4π² f²)
function helmholtzVolume(areaMm2, tMm, f, c = OC_SPEED_OF_SOUND) {
  const A = areaMm2 * 1e-6;             // m²
  const t = tMm * 1e-3;                 // m
  const a = Math.sqrt(A / Math.PI);     // m
  const K = A / (t + 1.5 * a);          // m
  const V = K * c * c / (4 * Math.PI ** 2 * f * f); // m³
  return V * 1e6;                       // cm³
}

// Diameter (mm) of a ball with volume V (cm³): ∛(6V/π)
function ballDiameter(volumeCm3) {
  return Math.cbrt(6 * volumeCm3 * 1000 / Math.PI);
}

// Inside volume to form a chamber around, for concert closed pitch f.
// Uses the leather-hard target f × (1 − s).
// Returns { area, leatherHz, volume, firedVolume, ballDiameter }.
function chamberVolume({ shape = 'rect', w, l, t }, f, shrink = OC_DEFAULT_SHRINK) {
  const area = windowArea({ shape, w, l });
  const leatherHz = leatherTarget(f, shrink);
  const volume = helmholtzVolume(area, t, leatherHz);
  return {
    area,
    leatherHz,
    volume,
    firedVolume: volume * (1 - shrink) ** 3,
    ballDiameter: ballDiameter(volume),
  };
}

// ── Shrinkage ────────────────────────────────────────────────────────────────

// Leather-hard target for a concert pitch: f × (1 − s)
function leatherTarget(f, shrink = OC_DEFAULT_SHRINK) {
  return f * (1 - shrink);
}

// Pitch after firing for a leather-hard pitch: f / (1 − s)
function firedPitch(fLeather, shrink = OC_DEFAULT_SHRINK) {
  return fLeather / (1 - shrink);
}

// Learned shrinkage from two sets of readings ({ [midi]: hz }): the mean of
// 1 − f_leather / f_final over notes measured at both stages. Null if none.
function learnedShrinkage(leather, final) {
  const keys = Object.keys(leather).filter(k => final[k] > 0 && leather[k] > 0);
  if (keys.length === 0) return null;
  const sum = keys.reduce((acc, k) => acc + (1 - leather[k] / final[k]), 0);
  return sum / keys.length;
}

// ── Two-note pairs ───────────────────────────────────────────────────────────

const OC_ON = { c: true, h: true, o: false };

// Can `midiA` on chamber A and `midiB` on chamber B sound together? Yes when
// no finger is asked to be on a hole ('c' or 'h') in one fingering and off a
// hole ('o') in the other. Holes are matched by their finger assignment.
function canPlayTogether(chamberA, midiA, chamberB, midiB) {
  if (chamberA === chamberB) return false;
  const fa = chamberA.fingerings[midiA];
  const fb = chamberB.fingerings[midiB];
  if (!fa || !fb) return false;
  const need = {}; // finger → Set of on/off
  const add = (holes, states) => holes.forEach((hole, i) => {
    (need[hole.finger] ??= new Set()).add(OC_ON[states[i]]);
  });
  add(chamberA.holes, fa);
  add(chamberB.holes, fb);
  return Object.values(need).every(s => s.size === 1);
}

// Every pair of `midis` (e.g. a chord's notes) playable together on a
// multi-chamber ocarina: [{ a: { chamber, midi }, b: { chamber, midi } }],
// with chamber as an index into `chambers`. Notes present in several
// chambers are tried in each.
function playablePairs(chambers, midis) {
  const where = midis.flatMap(m =>
    chambers.flatMap((ch, ci) => (ch.fingerings[m] ? [{ chamber: ci, midi: m }] : [])));
  const pairs = [];
  for (let i = 0; i < where.length; i++) {
    for (let j = i + 1; j < where.length; j++) {
      const a = where[i], b = where[j];
      if (a.chamber === b.chamber || a.midi === b.midi) continue;
      if (canPlayTogether(chambers[a.chamber], a.midi, chambers[b.chamber], b.midi)) {
        pairs.push(a.midi <= b.midi ? { a, b } : { a: b, b: a });
      }
    }
  }
  return pairs;
}

// ── Building fewer chambers than the full scale needs ───────────────────────

// How many chambers the full set of notes needs.
function chambersNeeded(midis) {
  return splitChambers(midis).length;
}

// Every way to keep a run of consecutive scale notes that fits in
// `chambers` chambers, longest runs only: for each starting note, the most
// notes upward that still split into at most `chambers` chambers. Runs that
// sit wholly inside a longer run are dropped. Lowest start first.
//   e.g. F Low Pygmy (17), 1 chamber → Ab2–Bb3, …, F3–Gb4 (starts on the ding), …
// Returns [{ start, notes }] with start = MIDI of the lowest kept note.
function noteWindows(midis, chambers = 1) {
  const notes = [...new Set(midis)].sort((a, b) => a - b);
  const runs = [];
  for (let i = 0; i < notes.length; i++) {
    let end = i;
    while (end + 1 < notes.length && chambersNeeded(notes.slice(i, end + 2)) <= chambers) end++;
    runs.push({ i, end });
  }
  return runs
    .filter(r => !runs.some(o => o !== r && o.i <= r.i && o.end >= r.end && (o.end - o.i) > (r.end - r.i)))
    .map(r => ({ start: notes[r.i], notes: notes.slice(r.i, r.end + 1) }));
}

// ── Calibration: fingerings from the instrument itself ──────────────────────
//
// For an ocarina whose maker chart is unknown. The pitch of a vessel flute
// depends on the total open hole size, not on where the holes are:
//   f = f0 × √(1 + Σ wᵢ·rᵢ)
// where f0 is the all-closed pitch, rᵢ = Dᵢ / W is hole i's size relative to
// the window, and wᵢ is 1 for an open hole, 0 for a covered one and about ½
// for a half-covered one (an approximation; the tuner confirms it). Measure a
// few fingerings, solve for r, then predict every fingering.

const OC_STATE_WEIGHT = { c: 0, o: 1, h: 0.5 };

// Pitch of any fingering (states, one per hole) from the hole ratios.
function predictFingeringHz(f0, ratios, states) {
  const sum = states.reduce((acc, s, i) => acc + OC_STATE_WEIGHT[s] * ratios[i], 0);
  return f0 * Math.sqrt(1 + sum);
}

// Hole ratios rᵢ from measurements [{ states, hz }] by least squares on
// (hz/f0)² − 1 = Σ wᵢ rᵢ. The simplest calibration is one measurement per
// hole with only that hole open, which gives rᵢ = (fᵢ/f0)² − 1 directly.
// Throws if the measurements don't pin down every hole.
function solveHoleRatios(f0, measurements) {
  const n = measurements[0].states.length;
  const AtA = Array.from({ length: n }, () => new Array(n).fill(0));
  const Atb = new Array(n).fill(0);
  for (const { states, hz } of measurements) {
    const w = states.map(s => OC_STATE_WEIGHT[s]);
    const y = (hz / f0) ** 2 - 1;
    for (let i = 0; i < n; i++) {
      Atb[i] += w[i] * y;
      for (let j = 0; j < n; j++) AtA[i][j] += w[i] * w[j];
    }
  }
  // Gaussian elimination with partial pivoting.
  const M = AtA.map((row, i) => [...row, Atb[i]]);
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    if (Math.abs(M[p][c]) < 1e-12) throw new RangeError(`Hole ${c} is not covered by the measurements`);
    [M[c], M[p]] = [M[p], M[c]];
    for (let r = 0; r < n; r++) {
      if (r === c) continue;
      const k = M[r][c] / M[c][c];
      for (let j = c; j <= n; j++) M[r][j] -= k * M[c][j];
    }
  }
  return M.map((row, i) => row[n] / row[i]);
}

// How awkward a fingering is: 10 per half-holed hole, plus 1 for every open
// hole that comes after a covered one in opening order (holes are listed in
// opening order, so the standard scale scores 0).
function fingeringAwkwardness(states) {
  let score = 0;
  let seenClosed = false;
  for (const s of states) {
    if (s === 'h') score += 10;
    if (s === 'o' && seenClosed) score += 1;
    if (s !== 'o') seenClosed = true;
  }
  return score;
}

// Fingerings that give `targetHz` within `toleranceCents`, easiest first
// (least awkward, then closest). At most `maxHalf` half-holed holes.
// Returns [{ states, hz, cents }].
function findFingerings(f0, ratios, targetHz, { toleranceCents = 20, maxHalf = 1, limit = 3 } = {}) {
  const n = ratios.length;
  const found = [];
  const consider = states => {
    const hz = predictFingeringHz(f0, ratios, states);
    const cents = centsBetween(hz, targetHz);
    if (Math.abs(cents) <= toleranceCents) found.push({ states, hz, cents });
  };
  for (let mask = 0; mask < (1 << n); mask++) {
    const base = Array.from({ length: n }, (_, i) => (mask >> i & 1 ? 'o' : 'c'));
    consider(base);
    if (maxHalf >= 1) {
      base.forEach((s, i) => {
        if (s === 'c') { const h = [...base]; h[i] = 'h'; consider(h); }
      });
    }
  }
  found.sort((a, b) =>
    fingeringAwkwardness(a.states) - fingeringAwkwardness(b.states) ||
    Math.abs(a.cents) - Math.abs(b.cents));
  return found.slice(0, limit);
}

// A full chromatic fingering chart predicted from calibration: for every
// semitone from the all-closed note to the all-open note, the easiest
// fingering within tolerance. Notes with no fingering in tolerance are left
// out. Returns { [midi]: { states, hz, cents } }.
function calibratedChart(f0, ratios, { a4 = OC_DEFAULT_A4, toleranceCents = 20, maxHalf = 1 } = {}) {
  const top = predictFingeringHz(f0, ratios, ratios.map(() => 'o'));
  const chart = {};
  for (let midi = Math.ceil(hzToMidi(f0, a4) - toleranceCents / 100);
       midi <= Math.floor(hzToMidi(top, a4) + toleranceCents / 100); midi++) {
    const [best] = findFingerings(f0, ratios, midiToHz(midi, a4), { toleranceCents, maxHalf, limit: 1 });
    if (best) chart[midi] = best;
  }
  return chart;
}

// ── Traditional charts ───────────────────────────────────────────────────────
// Moved to js/charts.js (sourced charts only). Ocarinas of unknown make are
// charted by calibration (calibratedChart above, js/builder.js).


// ── js/tuner.js ──
// Tuner: microphone → AnalyserNode → YIN pitch detection. See
// docs/ocarina-mode.md, "Tuner".
//
// yinPitch() and createStabilityTracker() are pure and unit tested in Node
// with synthetic tones; startTuner() is the browser part. Microphone access
// needs HTTPS (Vercel provides it) or localhost.

// YIN (de Cheveigné & Kawahara, 2002) on one window of samples. Returns
// { hz, clarity } (clarity 0–1, higher is cleaner) or null when no pitch is
// found. Ocarinas are close to pure sine tones, so a plain YIN is enough;
// the 4096-sample window covers bass notes down to ~70 Hz at 48 kHz.
function yinPitch(buf, sampleRate, { threshold = 0.15, minHz = 70, maxHz = 2500, minRms = 0.01 } = {}) {
  const n = buf.length;
  let rms = 0;
  for (let i = 0; i < n; i++) rms += buf[i] * buf[i];
  if (Math.sqrt(rms / n) < minRms) return null;

  const tauMin = Math.max(2, Math.floor(sampleRate / maxHz));
  const tauMax = Math.min(Math.floor(n / 2), Math.ceil(sampleRate / minHz));
  const w = n - tauMax;
  const d = new Float32Array(tauMax + 1);
  for (let tau = 1; tau <= tauMax; tau++) {
    let sum = 0;
    for (let i = 0; i < w; i++) {
      const delta = buf[i] - buf[i + tau];
      sum += delta * delta;
    }
    d[tau] = sum;
  }
  // Cumulative mean normalised difference.
  const cmnd = new Float32Array(tauMax + 1);
  cmnd[0] = 1;
  let running = 0;
  for (let tau = 1; tau <= tauMax; tau++) {
    running += d[tau];
    cmnd[tau] = running > 0 ? d[tau] * tau / running : 1;
  }
  let tau = -1;
  for (let t = tauMin; t <= tauMax; t++) {
    if (cmnd[t] < threshold) {
      while (t + 1 <= tauMax && cmnd[t + 1] < cmnd[t]) t++;
      tau = t;
      break;
    }
  }
  if (tau < 0) return null;
  // Parabolic interpolation around the minimum.
  let better = tau;
  if (tau > 1 && tau < tauMax) {
    const a = cmnd[tau - 1], b = cmnd[tau], c = cmnd[tau + 1];
    const denom = a - 2 * b + c;
    if (denom !== 0) better = tau + (a - c) / (2 * denom);
  }
  return { hz: sampleRate / better, clarity: 1 - cmnd[tau] };
}

// Reports a note only after it has held for `holdMs` within `toleranceCents`.
// push(hz | null, timeMs) → { hz, midi, stable, since } where midi is
// fractional and `since` is when the current stable stretch began.
function createStabilityTracker({ holdMs = 200, toleranceCents = 35, a4 = 440 } = {}) {
  let anchor = null; // { midi, since }
  let lastHz = null;
  return {
    push(hz, t) {
      if (!hz) { anchor = null; lastHz = null; return { hz: null, midi: null, stable: false, since: null }; }
      const midi = 69 + 12 * Math.log2(hz / a4);
      if (!anchor || Math.abs(midi - anchor.midi) * 100 > toleranceCents) anchor = { midi, since: t };
      else anchor.midi = anchor.midi * 0.7 + midi * 0.3; // smooth
      lastHz = hz;
      return { hz: lastHz, midi: anchor.midi, stable: t - anchor.since >= holdMs, since: anchor.since };
    },
    reset() { anchor = null; lastHz = null; },
  };
}

// Starts listening. onReading({ hz, midi, stable, since }) is called about
// 20 times a second. Returns a promise of a stop() function; rejects if the
// microphone can't be opened (no permission, no HTTPS, no device).
async function startTuner(onReading, { a4 = 440 } = {}) {
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('This browser has no microphone access');
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
  });
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx();
  const source = ctx.createMediaStreamSource(stream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 4096;
  source.connect(analyser);
  const buf = new Float32Array(analyser.fftSize);
  const tracker = createStabilityTracker({ a4 });
  const timer = setInterval(() => {
    analyser.getFloatTimeDomainData(buf);
    const res = yinPitch(buf, ctx.sampleRate);
    onReading(tracker.push(res && res.clarity > 0.8 ? res.hz : null, performance.now()));
  }, 50);
  return () => {
    clearInterval(timer);
    stream.getTracks().forEach(t => t.stop());
    source.disconnect();
    ctx.close();
  };
}


// ── js/charts.js ──
// Traditional fingering charts: bought ocarinas and flutes whose fingerings
// are fixed by the instrument type. See docs/ocarina-mode.md, "Ocarinas and
// flutes", and CLAUDE.md: every chart comes from a published source, noted
// with its URL; nothing is filled in from memory.
//
// A chart is written once, relative to its lowest note, and serves every key
// of that type: concert pitch = the key's lowest note + offset.
//
//   {
//     id, family: 'ocarina' | 'flute', name, source: [urls], notes: '…',
//     holes: [{ id, finger, side: 'top' | 'bottom', sub? }],   // flutes: mouthpiece first
//     keys: [{ id, name, lowest: 'D4' }],                       // lowest sounding note per key
//     fingerings: [{ offset, states: ['c'|'o'|'h', …], alt?: true, overblow?: true }],
//   }
//
// Charts with readings taken from images (High Spirits, STL) were read at
// high resolution; their `notes` say so where something looked doubtful.
//
// Pure data and functions; unit tested in Node.

// Row strings list one symbol per hole in the chart's `holes` order:
// X covered, O open, H half-covered (½ in the sources).
function rows(list) {
  return list.map(([offset, row, extra = {}]) => ({
    offset,
    states: [...row.replace(/[\s|]/g, '')].map(ch => (ch === 'X' ? 'c' : ch === 'O' ? 'o' : 'h')),
    ...extra,
  }));
}

// Flutes list holes from the mouthpiece down; ocarinas by finger.
const WHISTLE_HOLES = ['L1', 'L2', 'L3', 'R1', 'R2', 'R3'].map(f => ({ id: f, finger: f, side: 'top' }));
// High Spirits doesn't name fingers; these are the usual upper/lower-hand ones.
const NAF6_HOLES = ['L1', 'L2', 'L3', 'R1', 'R2', 'R3'].map(f => ({ id: f, finger: f, side: 'top' }));
const NAF5_HOLES = ['L1', 'L2', 'R1', 'R2', 'R3'].map(f => ({ id: f, finger: f, side: 'top' }));

// Octave choice where the source doesn't say which octave the flute sounds in.
const octaves = (note, name) => [
  { id: `${note}4`, name: `${name}, lowest note ${name}4` },
  { id: `${note}3`, name: `${name}, lowest note ${name}3 (low flute)` },
  { id: `${note}5`, name: `${name}, lowest note ${name}5 (high flute)` },
].map(k => ({ ...k, lowest: k.id }));

const TRADITIONAL_CHARTS = [
  {
    id: 'tin-whistle-d',
    family: 'flute',
    name: 'Tin whistle in D',
    source: [
      'https://www.wfg.woodwind.org/tinwhistle/tw_bas_1.html',
      'https://www.wfg.woodwind.org/tinwhistle/tw_bas_2.html',
      'https://www.wfg.woodwind.org/tinwhistle/tw_bas_3.html',
    ],
    notes: 'Woodwind Fingering Guide basic chart (tin whistle chart credited to Eoin McAuley). Holes top to bottom: left index, middle, ring, right index, middle, ring. The second octave uses the same fingerings blown harder.',
    holes: WHISTLE_HOLES,
    keys: [{ id: 'D', name: 'D (lowest note D4)', lowest: 'D4' }],
    fingerings: rows([
      [0, 'XXX|XXX'], [1, 'XXX|XXH'], [2, 'XXX|XXO'], [3, 'XXX|XHO'], [4, 'XXX|XOO'],

function getChart(id) {
  return TRADITIONAL_CHARTS.find(c => c.id === id) ?? null;
}

function chartsForFamily(family) {
  return TRADITIONAL_CHARTS.filter(c => c.family === family);
}

// An instrument of a traditional type in a key. Each note keeps its main
// fingering (the first listed for its offset); alternates are kept in
// `alternates` for display.
function instrumentFromChart(chartId, keyId, { name, now = new Date().toISOString() } = {}) {
  const chart = getChart(chartId);
  if (!chart) throw new RangeError(`Unknown chart: ${chartId}`);
  const key = chart.keys.find(k => k.id === keyId) ?? chart.keys[0];
  const base = noteToMidi(key.lowest);
  const fingerings = {};
  const alternates = {};
  const overblow = [];
  for (const f of chart.fingerings) {
    const midi = base + f.offset;
    if (!fingerings[midi] && !f.alt) {
      fingerings[midi] = f.states;
      if (f.overblow) overblow.push(midi);
    } else (alternates[midi] ??= []).push(f.states);
  }
  const notes = Object.keys(fingerings).map(Number).sort((a, b) => a - b);
  return {
    id: (chart.family === 'flute' ? 'fl-' : 'oc-') + Math.random().toString(36).slice(2, 10),
    family: chart.family,
    kind: 'traditional',
    type: chart.id,
    key: key.id,
    name: name || (chart.keys.length > 1 ? `${chart.name} (${key.lowest})` : chart.name),
    chambers: [{ notes, holes: chart.holes.map(h => ({ ...h, x: null, y: null, sizeMm: null })), fingerings, alternates, overblow }],
    createdAt: now,
    updatedAt: now,
    lastPlayedAt: now,
  };
}

// My instruments: the saved instruments a user plays (handpans, ocarinas,
// later flutes). See docs/ocarina-mode.md, "Instruments first".

// Not synced to Supabase yet (phase 7).
//
// Handpan instruments mirror the saved layouts in hp-layouts one to one
// (id 'hp-' + layoutId). The layouts stay where they are and keep syncing
// as before; reconcileInstruments() adds or removes the matching handpan
// instruments, so existing users get one instrument per saved layout and
// nothing about layouts or playlists changes.

const INSTRUMENTS_KEY = 'hp-instruments';
const ONBOARDED_KEY = 'hp-onboarded';

const INSTRUMENT_FAMILIES = [
  { id: 'handpan', name: 'Handpan' },
  { id: 'ocarina', name: 'Ocarina' },
  { id: 'flute', name: 'Flute' }, // offered when js/charts.js has a sourced flute chart
];

const BUILD_STAGES = [
  { id: 'design', name: 'Design' },
  { id: 'body', name: 'Body' },
  { id: 'leather', name: 'Voice and drill' },
  { id: 'boneDry', name: 'Drying' },
  { id: 'bisque', name: 'Bisque check' },
  { id: 'final', name: 'Final check' },
  { id: 'done', name: 'Done' },
];

// ── Pure helpers ─────────────────────────────────────────────────────────────

// 62 → 'D4' (flat-preferring spelling from data.js; displayNote re-spells it).
function midiToNoteName(midi) {
  return NOTE_NAMES[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
}

function nowIso() { return new Date().toISOString(); }

function handpanInstrumentId(layoutId) { return 'hp-' + layoutId; }

// Adds a handpan instrument for every saved layout that has none, keeps names
// in step, and soft-deletes handpan instruments whose layout is gone.
// Pure: returns { instruments, changed }.
function reconcileInstruments(instruments, savedLayouts, now = nowIso()) {
  const list = instruments.map(i => ({ ...i }));
  let changed = false;
  const live = new Set();
  for (const saved of savedLayouts) {
    const id = handpanInstrumentId(saved.id);
    live.add(id);
    const existing = list.find(i => i.id === id);
    if (!existing) {
      list.push({
        id,
        family: 'handpan',
        kind: saved.layout?.isCustom ? 'custom' : 'scale',
        layoutId: saved.id,
        name: saved.name,
        createdAt: now,
        updatedAt: now,
        lastPlayedAt: saved.savedAt ? new Date(saved.savedAt).toISOString() : null,
      });
      changed = true;
    } else if (existing.deletedAt || existing.name !== saved.name) {
      delete existing.deletedAt;
      existing.name = saved.name;
      existing.updatedAt = now;
      changed = true;
    }
  }
  for (const inst of list) {
    if (inst.family === 'handpan' && !inst.deletedAt && !live.has(inst.id)) {
      inst.deletedAt = now;
      inst.updatedAt = now;
      changed = true;
    }
  }
  return { instruments: list, changed };
}

// Most recently played first; never-played ones by creation, newest first.
function sortInstruments(instruments) {
  const key = i => i.lastPlayedAt || i.createdAt || '';
  return [...instruments].sort((a, b) => (key(b) > key(a) ? 1 : key(b) < key(a) ? -1 : 0));
}

// A scale-built ocarina from a handpan scale. `notes` (MIDI) is the chosen
// subset when building fewer chambers than the full scale needs; defaults to
// every note.
function createScaleOcarina({ scaleId, transpose = 0, includeGu = true, notes = null, name }, now = nowIso()) {
  const scale = SCALES.find(s => s.id === scaleId);
  if (!scale) throw new RangeError(`Unknown scale: ${scaleId}`);
  const all = scaleToMidis(scale, { transpose, includeGu });
  const chosen = (notes ?? all).filter(m => all.includes(m)).sort((a, b) => a - b);
  return {
    id: 'oc-' + Math.random().toString(36).slice(2, 10),
    family: 'ocarina',
    kind: 'scale',
    name: name || `${scale.name} ocarina`,
    scaleId,
    transpose,
    includeGu,
    notes: chosen,
    fullChambers: chambersNeeded(all),
    chambers: buildScaleChambers(chosen),
    build: { stage: 'design', clayBody: null, shrinkPct: 11, a4: 440, perChamber: [] },
    createdAt: now,
    updatedAt: now,
    lastPlayedAt: now,
  };
}

// An ocarina the user owns whose fingering chart is unknown. It is set up
// later by calibration with the tuner (docs/ocarina-mode.md, "Calibrated
// charts"); until then it only has a name and a hole count.
function createCustomOcarina({ name, holeCount }, now = nowIso()) {
  return {
    id: 'oc-' + Math.random().toString(36).slice(2, 10),
    family: 'ocarina',
    kind: 'custom',
    name: name || 'My ocarina',
    holeCount,
    chambers: [],
    calibration: null,
    createdAt: now,
    updatedAt: now,
    lastPlayedAt: now,
  };
}

// One line under the instrument's name on its card.
function instrumentStatus(inst) {
  if (inst.family === 'handpan') return inst.kind === 'custom' ? 'Custom handpan' : 'Handpan';
  if (inst.kind === 'traditional') {
    const notes = inst.chambers?.[0]?.notes ?? [];
    return notes.length ? `${notes.length} notes, ${midiToNoteName(notes[0])} to ${midiToNoteName(notes[notes.length - 1])}` : '';
  }
  if (inst.kind === 'custom') {
    return inst.calibration ? `${inst.holeCount} holes` : `${inst.holeCount} holes · not set up yet`;
  }
  if (inst.kind === 'scale') {
    const stage = inst.build?.stage ?? 'done';
    const chambers = inst.chambers.length;
    const size = `${inst.notes.length} notes · ${chambers} chamber${chambers !== 1 ? 's' : ''}`;
    if (stage === 'done') return size;
    const idx = BUILD_STAGES.findIndex(s => s.id === stage);
    return `${BUILD_STAGES[idx].name}, step ${idx + 1} of ${BUILD_STAGES.length} · ${size}`;
  }
  return '';
}

// ── Storage ──────────────────────────────────────────────────────────────────

function getAllInstrumentsRaw() {
  try { return JSON.parse(localStorage.getItem(INSTRUMENTS_KEY) || '[]'); }
  catch { return []; }
}

function writeInstruments(list) {
  localStorage.setItem(INSTRUMENTS_KEY, JSON.stringify(list));
  // Lets the app schedule a cloud sync without every caller remembering to.
  if (typeof window !== 'undefined') window.dispatchEvent(new Event('hp-instruments-changed'));
}

// Raw list including soft deletes, for sync.
function getInstrumentsRaw() { return getAllInstrumentsRaw(); }
function writeInstrumentsRaw(list) { writeInstruments(list); }

function getInstruments() {
  return sortInstruments(getAllInstrumentsRaw().filter(i => !i.deletedAt));
}

function getInstrument(id) {
  return getAllInstrumentsRaw().find(i => i.id === id && !i.deletedAt) || null;
}

function saveInstrument(inst) {
  const all = getAllInstrumentsRaw();
  const idx = all.findIndex(i => i.id === inst.id);
  const stamped = { ...inst, updatedAt: nowIso() };
  if (idx >= 0) all[idx] = stamped; else all.push(stamped);
  writeInstruments(all);
}

function deleteInstrument(id) {
  const all = getAllInstrumentsRaw();
  const inst = all.find(i => i.id === id);
  if (inst) { inst.deletedAt = inst.updatedAt = nowIso(); writeInstruments(all); }
}

// Marks an instrument as just played (orders My instruments). Doesn't touch
// updatedAt, so it never wins a sync merge on its own.
function touchInstrument(id) {
  const all = getAllInstrumentsRaw();
  const inst = all.find(i => i.id === id);
  if (inst) { inst.lastPlayedAt = nowIso(); writeInstruments(all); }
}

// Brings handpan instruments in step with the saved layouts.
function syncHandpanInstruments(savedLayouts) {
  const { instruments, changed } = reconcileInstruments(getAllInstrumentsRaw(), savedLayouts);
  if (changed) writeInstruments(instruments);
}

function isOnboarded() { return localStorage.getItem(ONBOARDED_KEY) === '1'; }
function setOnboarded() { localStorage.setItem(ONBOARDED_KEY, '1'); }
