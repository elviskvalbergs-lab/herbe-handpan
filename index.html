<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Handpan Chords</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Handpan">
  <meta name="theme-color" content="#1a3828">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

:root {
  --bg: #090f0d;
  --surface: #0d1a16;
  --card: #112018;
  --border: #1c3828;
  --muted: #4d7560;
  --text: #b8d0c4;
  --heading: #dff0e8;
  --primary: #CD4C38;
  --primary-hover: #d85a44;
  --primary-light: rgba(205,76,56,0.12);
  --note-rest-bg: #162c22;
  --note-rest-text: #5a9878;
  --note-active-bg: #CD4C38;
  --note-active-text: #fff;
  --note-playing-bg: #e8703a;
  --note-empty-border: #224838;
  --radius: 4px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Poppins', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  min-height: 100vh;
}

#app { max-width: 1100px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }

/* Header */
.app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.app-title { font-size: 20px; font-weight: 700; color: var(--heading); letter-spacing: -0.02em; }
.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.breadcrumb a { color: var(--primary); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { color: var(--primary-hover); text-decoration: underline; }

/* Buttons */
.btn {
  padding: 8px 16px; border-radius: var(--radius); border: none;
  font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.12s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary {
  background: var(--card); color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon {
  padding: 4px 10px; background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer; color: var(--text);
  font-family: inherit; font-size: 16px; line-height: 1.4;
}
.btn-icon:hover { border-color: var(--primary); color: var(--primary); }

/* Filter chips — square-first (herbe design system) */
.pills { display: flex; flex-wrap: wrap; gap: 5px; }
.pill {
  padding: 4px 10px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--card); color: var(--muted); font-family: inherit; font-size: 12px;
  font-weight: 500; cursor: pointer; transition: all 0.12s;
}
.pill:hover { border-color: var(--primary); color: var(--primary); }
.pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }

/* Search input */
.scale-search {
  width: 100%; padding: 8px 12px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  font-family: inherit; font-size: 13px; outline: none; margin-bottom: 12px;
}
.scale-search:focus { border-color: var(--primary); }
.scale-search::placeholder { color: var(--muted); }

/* Scale selector */
.selector-controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
.scale-count { font-size: 12px; color: var(--muted); margin-top: 4px; }

.scale-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
}
.scale-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s;
}
.scale-card:hover {
  border-color: var(--primary);
  box-shadow: 0 2px 12px rgba(205,76,56,0.1);
}
.scale-card-name { font-size: 14px; font-weight: 600; color: var(--heading); margin-bottom: 2px; }
.scale-card-meta { font-size: 11px; color: var(--primary); margin-bottom: 6px; font-weight: 500; }
.scale-card-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }

/* Family badge */
.family-badge {
  display: inline-block; padding: 1px 6px; border-radius: 2px;
  background: var(--surface); border: 1px solid var(--border);
  font-size: 10px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
}

/* Layout editor */
.editor-layout {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 24px;
  align-items: start;
}
@media (max-width: 720px) {
  body { min-height: 0; }
  #app { padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)); }
  .editor-layout { grid-template-columns: 1fr; }
  .editor-sidebar { gap: 7px; }
  .editor-shells { gap: 7px; }
  .editor-section { padding: 10px; }
  .editor-section-title { margin-bottom: 7px; }
}

.editor-sidebar { display: flex; flex-direction: column; gap: 10px; }
.editor-secondary-actions { display: flex; gap: 6px; }
.editor-shells { display: flex; gap: 10px; }
.editor-shells .editor-section { flex: 1; min-width: 0; }
.editor-section {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px;
}
.editor-section-title {
  font-size: 10px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 10px;
}
.capacity-control { display: flex; align-items: center; gap: 8px; }
.capacity-val { font-size: 18px; font-weight: 700; color: var(--heading); min-width: 24px; text-align: center; }

/* Pan SVG container */
.pan-wrap { display: flex; justify-content: center; }
.pan-wrap svg { max-width: min(100%, 65vh); height: auto; }
.pan-col { display: flex; align-items: flex-start; justify-content: flex-start; }
/* In the chord explorer, let the pan fill the full column width (capped by viewport height) */
.pan-col .pan-wrap { width: 100%; }
.pan-col .pan-wrap svg { max-width: min(100%, calc(100dvh - 80px)); }

/* SVG pan note base styles */
.pan-note { cursor: pointer; }
.pan-note rect, .pan-note circle, .pan-note ellipse { transition: fill 0.12s, opacity 0.12s; }
.pan-note text { pointer-events: none; transition: fill 0.12s; }
.pan-note.dimmed { opacity: 0.2; pointer-events: none; }

/* Empty slot */
.pan-note.empty rect, .pan-note.empty circle {
  fill: transparent !important;
  stroke: var(--note-empty-border) !important;
  stroke-dasharray: 5 4;
  stroke-width: 1.5;
}
.pan-note.empty text { fill: var(--note-empty-border) !important; font-size: 18px !important; }

/* Highlighted (in chord) */
.pan-note.highlight rect, .pan-note.highlight circle {
  fill: var(--note-active-bg) !important;
  stroke: #e8906e !important;
  stroke-width: 2;
}
.pan-note.highlight text { fill: var(--note-active-text) !important; font-weight: 700; }

/* Alt-highlight (same pitch class as a chord note, but not in the chord itself) */
.pan-note.alt-highlight circle {
  fill: rgba(232, 144, 110, 0.1) !important;
  stroke: rgba(232, 144, 110, 0.35) !important;
  stroke-width: 1.5;
  stroke-dasharray: 3 3;
}
.pan-note.alt-highlight text { fill: rgba(232, 190, 160, 0.65) !important; }

/* Playing animation */
@keyframes noteplay { 0%,100% { opacity:1; } 50% { opacity:0.55; } }
.pan-note.playing rect, .pan-note.playing circle {
  fill: var(--note-playing-bg) !important;
  stroke: #fff !important;
  stroke-width: 2;
  filter: drop-shadow(0 0 8px rgba(232,112,58,0.6));
}
.pan-note.playing { animation: noteplay 0.3s ease-in-out 5; }
.pan-note.playing text { fill: #0a1510 !important; font-weight: 700; }

/* Chord explorer — 3-column landscape layout */
.explorer-layout {
  display: grid;
  grid-template-columns: 250px minmax(200px, 280px) 1fr;
  gap: 12px;
  align-items: start;
}

/* Medium: 2-column — chord-list left, chord-panel+pan stacked right */
@media (max-width: 900px) {
  .explorer-layout {
    grid-template-columns: 260px 1fr;
    grid-template-rows: auto auto;
    gap: 14px;
  }
  .explorer-layout .chord-list  { grid-column: 1; grid-row: 1 / 3; }
  .explorer-layout .chord-panel { grid-column: 2; grid-row: 1; }
  .explorer-layout .pan-col     { grid-column: 2; grid-row: 2; }
}

/* Mobile: vertical stack — pan, chord-list, chord-panel */
@media (max-width: 620px) {
  .explorer-layout {
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  .explorer-layout .chord-list  { order: 2; max-height: 45dvh; }
  .explorer-layout .pan-col     { order: 1; }
  .explorer-layout .chord-panel { order: 3; }
  .pan-wrap svg { max-width: 100%; }
}

.chord-list {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  max-height: calc(100dvh - 120px); overflow-y: auto; min-height: 0;
}
.chord-list-header {
  padding: 8px 10px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--card); z-index: 1;
}
.chord-item {
  padding: 9px 14px; display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.1s;
}
.chord-item:last-child { border-bottom: none; }
.chord-item:hover { background: var(--surface); }
.chord-item.selected {
  background: var(--primary-light);
  border-left: 3px solid var(--primary);
  padding-left: 11px;
}
.chord-item-name { font-weight: 600; color: var(--heading); font-size: 13px; }
.chord-item-type { font-size: 10px; color: var(--muted); margin-top: 1px; text-transform: uppercase; letter-spacing: 0.05em; }
.chord-count {
  font-size: 11px; background: var(--surface); color: var(--muted);
  padding: 2px 7px; border-radius: 2px; flex-shrink: 0;
}

.chord-panel {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px;
}
.chord-panel-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px;
}
.chord-panel-title { font-size: 18px; font-weight: 700; color: var(--heading); margin-bottom: 2px; letter-spacing: -0.02em; }
.chord-panel-sub { font-size: 11px; color: var(--muted); }
.chord-play-btns { display: flex; gap: 6px; flex-shrink: 0; }
.chord-panel-empty { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chord-actions { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }

.related-section { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
.related-title {
  font-size: 10px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 7px;
}
.related-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.related-chip {
  padding: 3px 9px; border-radius: var(--radius); font-size: 11px; font-weight: 600;
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.1s;
}
.related-chip:hover { border-color: var(--primary); color: var(--primary); }

/* Note picker modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 24px; max-width: 420px; width: 94%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.modal-title { font-size: 15px; font-weight: 700; color: var(--heading); margin-bottom: 4px; }
.modal-sub { font-size: 11px; color: var(--muted); margin-bottom: 14px; }
.note-octave-row { display: flex; align-items: center; gap: 4px; margin-bottom: 5px; }
.octave-label { font-size: 10px; color: var(--muted); width: 18px; text-align: right; flex-shrink: 0; }
.note-btn {
  flex: 1; padding: 6px 2px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-family: inherit; font-size: 11px; font-weight: 600;
  cursor: pointer; text-align: center; transition: all 0.1s; min-width: 0;
}
.note-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.note-btn.in-use { opacity: 0.25; cursor: not-allowed; }
.modal-actions { display: flex; justify-content: flex-end; margin-top: 14px; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--primary); color: #fff;
  padding: 9px 18px; border-radius: var(--radius);
  font-family: inherit; font-size: 13px; font-weight: 600;
  opacity: 0; transition: opacity 0.18s;
  pointer-events: none; z-index: 200;
}
.toast.show { opacity: 1; }

/* Custom name input */
.name-input {
  background: transparent; border: none; border-bottom: 1px solid var(--border);
  color: var(--heading); font-family: inherit; font-size: 14px; font-weight: 600;
  padding: 2px 4px; outline: none; min-width: 160px; max-width: 260px;
}
.name-input:focus { border-bottom-color: var(--primary); }

/* Select dropdown */
.select-input {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); font-family: inherit; font-size: 12px; padding: 5px 10px;
  cursor: pointer; outline: none;
}
.select-input:focus { border-color: var(--primary); }

/* Utility */
.flex-row { display: flex; align-items: center; gap: 8px; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.empty-state { text-align: center; padding: 32px 20px; color: var(--muted); line-height: 1.6; }
.hint { font-size: 11px; color: var(--muted); }

/* ── PWA: Saved Layouts + Favorites ──────────────────────────────────────── */
.pwa-section { margin-bottom: 20px; }
.pwa-section-title {
  font-size: 10px; font-weight: 600; color: var(--muted);
  letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px;
}
.pwa-scroll {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.pwa-scroll::-webkit-scrollbar { height: 3px; }
.pwa-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.saved-card {
  flex-shrink: 0; position: relative; min-width: 130px; max-width: 180px;
  padding: 9px 28px 9px 11px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer; transition: border-color 0.12s;
}
.saved-card:hover { border-color: var(--primary); }
.saved-card-name {
  font-size: 12px; font-weight: 600; color: var(--heading);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.saved-card-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
.saved-del {
  position: absolute; top: 5px; right: 5px;
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 13px; line-height: 1; padding: 2px 4px; border-radius: 2px;
  transition: color 0.1s;
}
.saved-del:hover { color: var(--primary); }

/* Playlist cards on home screen */
.playlist-card {
  flex-shrink: 0; padding: 8px 12px 8px 12px; min-width: 100px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer; transition: border-color 0.12s; position: relative;
}
.playlist-card:hover { border-color: var(--primary); }
.playlist-card-name { font-size: 12px; font-weight: 600; color: var(--heading); white-space: nowrap; padding-right: 18px; }
.playlist-card-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
.playlist-card-edit {
  position: absolute; top: 6px; right: 7px;
  font-size: 11px; color: var(--muted); cursor: pointer; opacity: 0.5;
  transition: opacity 0.1s; padding: 2px;
}
.playlist-card-edit:hover { opacity: 1; color: var(--primary); }

/* Filter dropdowns row in chord explorer */
.chord-filter-dropdowns {
  display: flex; align-items: center; gap: 5px; margin-bottom: 5px; flex-wrap: wrap;
}
.chord-filter-dropdowns .select-input { flex: 1; min-width: 0; font-size: 11px; padding: 4px 6px; }
.count-pills { display: flex; gap: 3px; flex-shrink: 0; }
.count-pill { padding: 3px 6px; font-size: 11px; }
/* Compact pills inside chord list header */
.chord-list .pill { padding: 3px 7px; font-size: 11px; }
.chord-list .pills { gap: 3px; margin-bottom: 3px; }
.chord-list .hint { line-height: 1.6; }

/* Playlist view */
.playlist-view { padding: 0 0 40px; }
.playlist-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
}
.playlist-header .name-input { flex: 1; }

.playlist-item {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.playlist-item-reorder { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
.playlist-item-reorder .btn-icon { font-size: 11px; padding: 2px 5px; }
.playlist-item-info {
  flex: 1; cursor: pointer; min-width: 0;
}
.playlist-item-info:hover .playlist-item-name { color: var(--primary); }
.playlist-item-name { font-size: 14px; font-weight: 600; color: var(--heading); }
.playlist-item-scale { font-size: 11px; color: var(--muted); margin-top: 1px; }
.playlist-item-notes { font-size: 11px; margin-top: 2px; }
.playlist-item-remove {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 16px; padding: 4px 6px; line-height: 1; flex-shrink: 0;
  transition: color 0.1s;
}
.playlist-item-remove:hover { color: var(--primary); }

/* Playlist picker popup */
.picker-modal { max-width: 300px; padding: 0; overflow: hidden; }
.picker-title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
  color: var(--muted); padding: 12px 16px 8px; text-transform: uppercase;
}
.picker-row {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 16px; cursor: pointer; transition: background 0.1s;
}
.picker-row:hover { background: rgba(255,255,255,0.04); }
.picker-row.in-playlist { background: rgba(232,144,110,0.07); }
.picker-check { width: 16px; text-align: center; font-size: 13px; color: var(--primary); flex-shrink: 0; }
.picker-name { flex: 1; font-size: 13px; color: var(--heading); }
.picker-count { font-size: 11px; color: var(--muted); flex-shrink: 0; }
.picker-create { border-top: 1px solid var(--border); margin-top: 2px; }
.picker-new-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px 12px; border-top: 1px solid var(--border);
}
.picker-new-input { flex: 1; }
.picker-new-row .btn { flex-shrink: 0; }

/* Heart button in chord list */
.chord-item-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.fav-btn {
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 13px; padding: 3px; line-height: 1;
  transition: color 0.12s; flex-shrink: 0; opacity: 0.5;
}
.fav-btn:hover { color: var(--primary); opacity: 1; }
.fav-btn.active { color: var(--primary); opacity: 1; }

/* iOS auto-zooms when focusing inputs with font-size < 16px. Force 16px on iOS only. */
@supports (-webkit-touch-callout: none) {
  .scale-search, .name-input, .select-input {
    font-size: 16px !important;
  }
}

</head>
<body>
  <div id="app"></div>
  <script>
// ── js/data.js ──
// Note name → semitone offset (0–11)
const NOTE_TO_SEMI = {
  'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'F':5,
  'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11
};

// Normalize to preferred flat/sharp spelling
const ENHARMONIC = { 'D#':'Eb','A#':'Bb','G#':'Ab','Db':'C#','Gb':'F#' };

const SHARP_NAMES   = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_NAMES    = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const SOLFEGE_SHARP = ['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const SOLFEGE_FLAT  = ['Do','Reb','Re','Mib','Mi','Fa','Solb','Sol','Lab','La','Sib','Si'];

// Display a note. Accepts 'G#3' or 'G#'. useFlats picks flat/sharp spelling;
// useSolfege switches to fixed-do solfège (Do/Re/Mi…) instead of letters.
function displayNote(note, useFlats, useSolfege = false) {
  const m = note.match(/^([A-G][#b]?)(\d*)$/);
  if (!m) return note;
  const pc = NOTE_TO_SEMI[m[1]];
  if (pc === undefined) return note;
  if (useSolfege) return (useFlats ? SOLFEGE_FLAT : SOLFEGE_SHARP)[pc] + m[2];
  return (useFlats ? FLAT_NAMES : SHARP_NAMES)[pc] + m[2];
}

function normalizeNote(note) {
  const m = note.match(/^([A-G][#b]?)(\d)$/);
  if (!m) return note;
  const name = ENHARMONIC[m[1]] ?? m[1];
  return name + m[2];
}

function noteToMidi(note) {
  const m = note.match(/^([A-G][#b]?)(\d)$/);
  if (!m) return 0;
  return (parseInt(m[2]) + 1) * 12 + NOTE_TO_SEMI[m[1]];
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function noteToFreq(note) { return midiToFreq(noteToMidi(note)); }

function getNoteName(note) {
  const m = note.match(/^([A-G][#b]?)/);
  return m ? m[1] : note;
}

function notePC(note) { return noteToMidi(note) % 12; }

// Build a mutable Layout from a Scale (deep copy with slot wrapping)
function createLayoutFromScale(scale) {
  return {
    id: scale.id,
    name: scale.name,
    isCustom: false,
    top: {
      ding: scale.top.ding,
      slots: scale.top.notes.map(n => ({ note: n })),
      capacity: scale.top.capacity,
    },
    bottom: {
      slots: Array.from({ length: scale.bottom.capacity }, (_, i) => ({
        note: scale.bottom.notes[i] ?? null,
      })),
      capacity: scale.bottom.capacity,
    },
  };
}

// Collect all non-null notes from a layout (ding + ring + gu)
function getAllNotes(layout) {
  const notes = [layout.top.ding];
  layout.top.slots.forEach(s => { if (s.note) notes.push(s.note); });
  layout.bottom.slots.forEach(s => { if (s.note) notes.push(s.note); });
  return notes;
}


// ── js/chords.js ──
// Returns all chords playable on this layout, deduped by root + type
function findAllChords(layout) {
  const allNotes = getAllNotes(layout);
  const pcs = allNotes.map(notePC);
  const uniquePCs = [...new Set(pcs)];
  const results = [];
  const seen = new Set();

  for (const rootPC of uniquePCs) {
    for (const type of CHORD_TYPES) {
      const key = `${rootPC}-${type.id}`;
      if (seen.has(key)) continue;

      // Octave dyad: same pitch class, different octave
      if (type.id === 'oct') {
        const rootNotes = allNotes.filter(n => notePC(n) === rootPC);
        if (rootNotes.length >= 2) {
          const sorted = [...rootNotes].sort((a, b) => noteToMidi(a) - noteToMidi(b));
          seen.add(key);
          results.push({
            id: `${getNoteName(sorted[0])}-oct`,
            rootName: getNoteName(sorted[0]),
            rootNote: sorted[0],
            type,
            notes: sorted,
            noteCount: 2,
          });
        }
        continue;
      }

      const requiredPCs = type.intervals.map(i => (rootPC + i) % 12);
      if (!requiredPCs.every(pc => uniquePCs.includes(pc))) continue;

      // Pick one representative note per required PC (lowest pitch on instrument)
      const chordNotes = requiredPCs.map(pc => {
        const matches = allNotes.filter(n => notePC(n) === pc);
        return matches.sort((a, b) => noteToMidi(a) - noteToMidi(b))[0];
      });

      const rootNote = allNotes
        .filter(n => notePC(n) === rootPC)
        .sort((a, b) => noteToMidi(a) - noteToMidi(b))[0];

      seen.add(key);
      results.push({
        id: `${getNoteName(rootNote)}-${type.id}`,
        rootName: getNoteName(rootNote),
        rootNote,
        type,
        notes: chordNotes,
        noteCount: type.intervals.length,
      });
    }
  }

  return results;
}

// Returns related chords: same type / other roots, and chords sharing 2+ notes
function getRelatedChords(chord, allChords) {
  const sameType = allChords.filter(c =>
    c.type.id === chord.type.id && c.id !== chord.id
  );

  const chordPCs = new Set(chord.notes.map(notePC));
  const sharedNotes = allChords.filter(c => {
    if (c.id === chord.id || c.type.id === chord.type.id) return false;
    const sharedCount = c.notes.filter(n => chordPCs.has(notePC(n))).length;
    return sharedCount >= 2;
  });

  return { sameType, sharedNotes };
}


// ── js/audio.js ──
let ctx = null;
let masterGain = null;
let reverbSend = null; // set after reverb setup; null = reverb not ready, use masterGain

function buildReverb() {
  // ~1.8 s exponentially-decaying white-noise impulse response
  const len = Math.floor(ctx.sampleRate * 1.8);
  const ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c);
    for (let i = 0; i < len; i++) {
      const t = i / ctx.sampleRate;
      d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 3.5);
    }
  }
  const conv = ctx.createConvolver();
  conv.buffer = ir;
  return conv;
}

function setupReverb() {
  const conv = buildReverb();

  const dryGain = ctx.createGain();
  dryGain.gain.value = 0.7;
  dryGain.connect(masterGain);

  const reverbReturn = ctx.createGain();
  reverbReturn.gain.value = 0.25;
  conv.connect(reverbReturn);
  reverbReturn.connect(masterGain);

  reverbSend = ctx.createGain();
  reverbSend.gain.value = 1;
  reverbSend.connect(dryGain);
  reverbSend.connect(conv);
}

function initAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();

  masterGain = ctx.createGain();
  masterGain.gain.value = 0.7;

  // iOS routes Web Audio through the earpiece (AVAudioSessionCategoryAmbient) by default.
  // Routing masterGain → MediaStreamDestinationNode → <audio playsinline> forces iOS to
  // use AVAudioSessionCategoryPlayback, which outputs through the main speaker.
  // Falls back to ctx.destination if the MediaStream API is unavailable.
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (isIOS && ctx.createMediaStreamDestination) {
    try {
      const streamDest = ctx.createMediaStreamDestination();
      masterGain.connect(streamDest);
      const routingEl = document.createElement('audio');
      routingEl.setAttribute('playsinline', '');
      routingEl.srcObject = streamDest.stream;
      document.body.appendChild(routingEl);
      routingEl.play().catch(() => {
        masterGain.connect(ctx.destination); // fallback if stream play rejected
      });
    } catch (_) {
      masterGain.connect(ctx.destination);
    }
  } else {
    masterGain.connect(ctx.destination);
  }

  // iOS unlock: play a silent buffer + resume() synchronously in the gesture handler
  const buf = ctx.createBuffer(1, 1, ctx.sampleRate);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  src.start(0);
  ctx.resume();

  // Reverb is non-critical — build it asynchronously so it never blocks
  // the gesture window or kills audio if buildReverb() throws on some browser.
  setTimeout(() => {
    try { setupReverb(); } catch (_) {}
  }, 0);
}

// Wait for the context to actually be running before scheduling audio.
// On iOS Chrome the context can still be 'suspended' right after resume() is called;
// scheduling on a suspended context drops the audio silently.
function whenRunning(fn) {
  if (!ctx) initAudio();
  if (ctx.state === 'running') {
    fn();
  } else {
    ctx.resume().then(() => fn());
  }
}

const START_OFFSET = 0.05;

function playFreq(freq, startTime) {
  if (!ctx) return;
  const now = startTime ?? ctx.currentTime;
  const sink = reverbSend ?? masterGain; // fall back if reverb not ready yet

  const harmonics = [
    { mult: 1,   gain: 0.52, decay: 5.5 },
    { mult: 2,   gain: 0.34, decay: 3.2 },
    { mult: 3,   gain: 0.11, decay: 2.0 },
    { mult: 4,   gain: 0.05, decay: 1.3 },
  ];

  harmonics.forEach(({ mult, gain, decay }) => {
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq * mult;
    osc.detune.value = (Math.random() - 0.5) * 4;

    env.gain.setValueAtTime(0, now);
    env.gain.linearRampToValueAtTime(gain, now + 0.004);
    env.gain.exponentialRampToValueAtTime(gain * 0.55, now + 0.18);
    env.gain.exponentialRampToValueAtTime(0.0001, now + decay);

    osc.connect(env);
    env.connect(sink);
    osc.start(now);
    osc.stop(now + decay + 0.1);
    osc.onended = () => { osc.disconnect(); env.disconnect(); };
  });
}

function playNote(noteName) {
  initAudio();
  whenRunning(() => playFreq(noteToFreq(noteName), ctx.currentTime + START_OFFSET));
}

function playChord(noteNames, onArp, onTogether) {
  initAudio();
  const sorted = [...noteNames].sort((a, b) => noteToMidi(a) - noteToMidi(b));
  const ARP = 0.3;
  const togetherOffset = sorted.length * ARP + 0.35;
  whenRunning(() => {
    const now = ctx.currentTime + START_OFFSET;
    sorted.forEach((n, i) => {
      playFreq(noteToFreq(n), now + i * ARP);
      if (onArp) setTimeout(() => onArp(n), Math.round(i * ARP * 1000));
    });
    sorted.forEach(n => playFreq(noteToFreq(n), now + togetherOffset));
    if (onTogether) setTimeout(() => onTogether(sorted), Math.round(togetherOffset * 1000));
  });
}

function playScale(noteNames, onNote) {
  initAudio();
  const asc = [...noteNames].sort((a, b) => noteToMidi(a) - noteToMidi(b));
  const desc = asc.slice(0, -1).reverse();
  const all = [...asc, ...desc];
  const INTERVAL = 0.4;
  whenRunning(() => {
    const now = ctx.currentTime + START_OFFSET;
    all.forEach((n, i) => {
      playFreq(noteToFreq(n), now + i * INTERVAL);
      if (onNote) setTimeout(() => onNote(n), Math.round(i * INTERVAL * 1000));
    });
  });
}


// ── js/pan.js ──
const PAN_SVG_ID = 'handpan-svg';

// Physical handpan ring layout (confirmed from klangzeug.de for all scales).
// Notes sorted ascending (n1=lowest, nN=highest) placed clockwise from 12 o'clock.
// For 10-ring instruments, n9+n10 go on a separate inner ring (see renderPan).
function physicalOrder(n) {
  if (n === 7)  return [6,4,2,0,1,3,5];
  if (n === 8)  return [7,6,4,2,0,1,3,5];
  if (n === 9)  return [8,6,4,2,0,1,3,5,7];
  return null;
}

// Outer ring physical order for 10-ring instruments (n1-n8, same as 8-ring).
const OUTER_8_ORDER = [7,6,4,2,0,1,3,5];

// Inner ring note positions. 1-2 notes: symmetric at ±45° from top, r=100.
// 3-5 notes: evenly spread across an arc from -140° to -40°, r=95.
function innerRingPositions(cx, cy, count) {
  if (count <= 2) {
    const r = 100;
    const angles = [-Math.PI * 3 / 4, -Math.PI / 4]; // -135°, -45°
    return angles.slice(0, count).map(a => ({
      x: Math.round(cx + r * Math.cos(a)),
      y: Math.round(cy + r * Math.sin(a)),
    }));
  }
  const r = 95;
  const start = (-140 * Math.PI) / 180;
  const end   = (-40 * Math.PI) / 180;
  const step  = (end - start) / (count - 1);
  return Array.from({ length: count }, (_, i) => {
    const a = start + i * step;
    return { x: Math.round(cx + r * Math.cos(a)), y: Math.round(cy + r * Math.sin(a)) };
  });
}

function circlePositions(count, cx, cy, r, rotationOffset = 0) {
  return Array.from({ length: count }, (_, i) => {
    const angle = (i * 2 * Math.PI / count) - Math.PI / 2 + rotationOffset;
    return {
      x: Math.round(cx + r * Math.cos(angle)),
      y: Math.round(cy + r * Math.sin(angle)),
    };
  });
}

// All tone fields are circles. r controls size; lower notes get larger circles.
function noteSlotSvg(x, y, note, extraClasses, noteId, r = 24, useFlats = false, useSolfege = false) {
  const isEmpty = !note;
  const allClasses = ['pan-note', ...extraClasses.split(' ').filter(Boolean)].join(' ');
  const noteAttr = note ? ` data-note="${note}"` : '';

  let textHtml;
  if (isEmpty) {
    textHtml = `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central"
      font-family="system-ui,sans-serif" font-size="${Math.round(r * 0.7)}" font-weight="600"
      fill="var(--note-rest-text)">+</text>`;
  } else {
    const displayed = displayNote(note, useFlats, useSolfege);
    const name = displayed.replace(/\d+$/, '');
    const oct = (displayed.match(/\d+$/) ?? [''])[0];
    const nameFontSize = Math.max(8, Math.round((name.length > 1 ? 12 : 14) * r / 26));
    const octFontSize  = Math.max(6, Math.round(9 * r / 26));
    const nameY = y - Math.round(r * 0.14);
    const octY  = y + Math.round(r * 0.40);
    textHtml = `<text x="${x}" y="${nameY}" text-anchor="middle" dominant-baseline="auto"
      font-family="system-ui,sans-serif" font-size="${nameFontSize}" font-weight="600"
      fill="var(--note-rest-text)">${name}</text>
<text x="${x}" y="${octY}" text-anchor="middle" dominant-baseline="auto"
      font-family="system-ui,sans-serif" font-size="${octFontSize}" font-weight="400"
      fill="var(--note-rest-text)" opacity="0.5">${oct}</text>`;
  }

  return `<g class="${allClasses}" data-note-id="${noteId}"${noteAttr}>
  <circle cx="${x}" cy="${y}" r="${r}" fill="var(--note-rest-bg)" stroke="var(--border)" stroke-width="1.5"/>
  ${textHtml}
</g>`;
}

// Radius for a ring note at sorted index i (0=lowest, n-1=highest).
// Lower notes are physically larger on a real handpan.
function ringNoteRadius(sortedIndex, total) {
  // 10+ ring instruments: keep smaller notes to avoid inner-ring overlap
  const minR = total >= 10 ? 18 : 22;
  const maxR = total >= 10 ? 26 : 30;
  const t = total <= 1 ? 0 : sortedIndex / (total - 1);
  return Math.round(maxR - (maxR - minR) * t);
}

function renderBottomShell(layout, opts = {}) {
  const { highlightNotes = [], useFlats = false, useSolfege = false } = opts;
  const cx = 250, cy = 240;
  const hlSet = new Set(highlightNotes);
  const guCount = Math.max(layout.bottom.capacity, layout.bottom.slots.length);

  let svg = `<svg id="${PAN_SVG_ID}" viewBox="0 0 500 490" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="panGrad" cx="38%" cy="32%">
      <stop offset="0%" stop-color="#1a3828"/>
      <stop offset="60%" stop-color="#0d2018"/>
      <stop offset="100%" stop-color="#060f0c"/>
    </radialGradient>
  </defs>
  <!-- Pan body -->
  <circle cx="${cx}" cy="${cy}" r="220" fill="url(#panGrad)" stroke="#2a5040" stroke-width="2"/>
  <!-- Outer groove ring -->
  <circle cx="${cx}" cy="${cy}" r="195" fill="none" stroke="#1c3828" stroke-width="1" stroke-dasharray="3 7"/>
  <!-- Gu ring guide -->
  <circle cx="${cx}" cy="${cy}" r="145" fill="none" stroke="#183028" stroke-width="1" opacity="0.5"/>
  <!-- Inner groove ring -->
  <circle cx="${cx}" cy="${cy}" r="80" fill="none" stroke="#1c3828" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/>
  <!-- Center hole -->
  <circle cx="${cx}" cy="${cy}" r="50" fill="#030a06" stroke="#1c3828" stroke-width="2"/>
  <circle cx="${cx}" cy="${cy}" r="47" fill="none" stroke="#0a1a12" stroke-width="2" opacity="0.7"/>
`;

  if (guCount > 0) {
    const guPos = circlePositions(guCount, cx, cy, 145, 0);
    for (let i = 0; i < guCount; i++) {
      const slot = layout.bottom.slots[i] ?? { note: null };
      const isHighlighted = !!(slot.note && hlSet.has(slot.note));
      const cls = ['gu', !slot.note ? 'empty' : '', isHighlighted ? 'highlight' : ''].filter(Boolean).join(' ');
      svg += noteSlotSvg(guPos[i].x, guPos[i].y, slot.note, cls, `gu-${i}`, 24, useFlats, useSolfege);
    }
  }

  svg += '</svg>';
  return svg;
}

function renderPan(layout, opts = {}) {
  const { shellMode = 'both', highlightNotes = [], altHighlightNotes = [], rotated = false, useFlats = false, useSolfege = false } = opts;

  // Bottom shell gets its own dedicated view.
  if (shellMode === 'bottom') return renderBottomShell(layout, opts);

  const cx = 250, cy = 240;
  const hlSet = new Set(highlightNotes);
  const altSet = new Set(altHighlightNotes);

  const dimTop = shellMode === 'bottom';
  const dimBottom = shellMode === 'top';

  function noteClass(note, isTopShell) {
    const classes = [];
    if (!note) classes.push('empty');
    else if (hlSet.has(note)) classes.push('highlight');
    else if (altSet.has(note)) classes.push('alt-highlight');
    if (isTopShell && dimTop) classes.push('dimmed');
    if (!isTopShell && dimBottom) classes.push('dimmed');
    return classes.join(' ');
  }

  // 10-13 ring scales split into outer (n1-n8) + inner (n9+) rings.
  const totalRingSlots = layout.top.slots.length;
  const hasInnerRing = totalRingSlots >= 10 && totalRingSlots <= 13;

  const guCount = Math.max(layout.bottom.capacity, layout.bottom.slots.length);
  const svgHeight = guCount > 0 ? 548 : 480;

  let svg = `<svg id="${PAN_SVG_ID}" viewBox="0 0 500 ${svgHeight}" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="panGrad" cx="38%" cy="32%">
      <stop offset="0%" stop-color="#1a3828"/>
      <stop offset="60%" stop-color="#0d2018"/>
      <stop offset="100%" stop-color="#060f0c"/>
    </radialGradient>
    <radialGradient id="innerGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#183028"/>
      <stop offset="100%" stop-color="#0d1e18"/>
    </radialGradient>
    <clipPath id="panClip">
      <circle cx="${cx}" cy="${cy}" r="198"/>
    </clipPath>
  </defs>

  <!-- Pan body -->
  <circle cx="${cx}" cy="${cy}" r="200" fill="url(#panGrad)" stroke="#2a5040" stroke-width="2"/>
  <!-- Outer groove ring -->
  <circle cx="${cx}" cy="${cy}" r="178" fill="none" stroke="#1c3828" stroke-width="1" stroke-dasharray="3 7"/>
  <!-- Gu separator groove -->
  <path d="M ${cx - 90},${cy + 158} A 178,178 0 0,1 ${cx + 90},${cy + 158}"
    fill="none" stroke="#2a5040" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.9"/>
  <!-- Inner center dome -->
  <circle cx="${cx}" cy="${cy}" r="68" fill="url(#innerGrad)" stroke="#1c3828" stroke-width="1.5"/>
  <!-- Outer tone field guide ring -->
  <circle cx="${cx}" cy="${cy}" r="145" fill="none" stroke="#183028" stroke-width="1" opacity="0.5"/>
  ${hasInnerRing ? `<!-- Inner tone field guide ring -->
  <circle cx="${cx}" cy="${cy}" r="${totalRingSlots >= 12 ? 95 : 100}" fill="none" stroke="#183028" stroke-width="1" stroke-dasharray="3 5" opacity="0.4"/>` : ''}
`;

  // Ding (center)
  const dingNote = layout.top.ding;
  const dingClass = [
    !dingNote ? 'empty' : '',
    dingNote && hlSet.has(dingNote) ? 'highlight' : '',
    dimTop ? 'dimmed' : '',
  ].filter(Boolean).join(' ');
  svg += noteSlotSvg(cx, cy, dingNote, `ding ${dingClass}`, 'ding', 36, useFlats, useSolfege);

  if (hasInnerRing) {
    // 10-ring: outer ring gets 8 lower notes (n1-n8), inner ring gets n9 and n10.
    const outerSlots = OUTER_8_ORDER.map(i => layout.top.slots[i] ?? { note: null });
    const rotationRad = rotated ? Math.PI * (8 - 9) / 8 : 0;
    const outerPos = circlePositions(8, cx, cy, 145, rotationRad);
    for (let i = 0; i < 8; i++) {
      const slot = outerSlots[i];
      const sortedIdx = OUTER_8_ORDER[i]; // position in original slots array (0-7)
      const r = ringNoteRadius(sortedIdx, totalRingSlots);
      svg += noteSlotSvg(outerPos[i].x, outerPos[i].y, slot.note,
        `ring ${noteClass(slot.note, true)}`, `ring-${sortedIdx}`, r, useFlats, useSolfege);
    }
    // Inner ring: slots 8+ (up to 5 for 13-ring instruments)
    const innerCount = Math.min(5, totalRingSlots - 8);
    const innerPos = innerRingPositions(cx, cy, innerCount);
    for (let i = 0; i < innerCount; i++) {
      const sortedIdx = 8 + i;
      const slot = layout.top.slots[sortedIdx] ?? { note: null };
      const r = ringNoteRadius(sortedIdx, totalRingSlots);
      svg += noteSlotSvg(innerPos[i].x, innerPos[i].y, slot.note,
        `ring ${noteClass(slot.note, true)}`, `ring-${sortedIdx}`, r, useFlats, useSolfege);
    }
  } else {
    // Standard: all ring slots on one ring.
    const ringCount = Math.max(layout.top.capacity, totalRingSlots);
    const rotationRad = rotated ? Math.PI * (ringCount - 9) / ringCount : 0;
    const ringPos = circlePositions(ringCount, cx, cy, 145, rotationRad);

    let ringSlots = layout.top.slots;
    let sortedIndices = null;
    if (!layout.isCustom) {
      const order = physicalOrder(totalRingSlots);
      if (order) {
        ringSlots = order.map(i => layout.top.slots[i] ?? { note: null });
        sortedIndices = order;
      }
    }

    for (let i = 0; i < ringCount; i++) {
      const slot = ringSlots[i] ?? { note: null };
      const pos = ringPos[i];
      const r = sortedIndices
        ? ringNoteRadius(sortedIndices[i], totalRingSlots)
        : 22;
      svg += noteSlotSvg(pos.x, pos.y, slot.note, `ring ${noteClass(slot.note, true)}`, `ring-${i}`, r, useFlats, useSolfege);
    }
  }

  // Gu (bottom shell) — small circular mini-pan overlapping bottom-right of main pan
  if (guCount > 0) {
    const mCx = 390, mCy = 465;
    const mOuter = 52, mNoteR = 34, mNoteCircle = 16;

    svg += `
  <circle cx="${mCx}" cy="${mCy}" r="${mOuter}" fill="url(#panGrad)" stroke="#2a5040" stroke-width="1.5"/>
  <circle cx="${mCx}" cy="${mCy}" r="${mOuter - 14}" fill="none" stroke="#1c3828" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.5"/>
  <text x="${mCx}" y="${mCy + mOuter + 11}" text-anchor="middle" font-family="system-ui,sans-serif"
    font-size="8" font-weight="600" letter-spacing="0.08em"
    fill="var(--note-empty-border)" opacity="0.5">BOTTOM SHELL</text>`;

    const guPos = circlePositions(guCount, mCx, mCy, mNoteR, 0);
    for (let i = 0; i < guCount; i++) {
      const slot = layout.bottom.slots[i] ?? { note: null };
      svg += noteSlotSvg(guPos[i].x, guPos[i].y, slot.note, `gu ${noteClass(slot.note, false)}`, `gu-${i}`, mNoteCircle, useFlats, useSolfege);
    }
  }

  svg += '</svg>';
  return svg;
}

// Update highlight using full note strings (with octave)
function updatePanHighlight(noteNames, altNoteNames = []) {
  const svg = document.getElementById(PAN_SVG_ID);
  if (!svg) return;
  const nameSet = new Set(noteNames);
  const altSet = new Set(altNoteNames);
  svg.querySelectorAll('.pan-note').forEach(el => {
    if (el.classList.contains('empty')) return;
    const note = el.dataset.note;
    el.classList.toggle('highlight', !!(note && nameSet.has(note)));
    el.classList.toggle('alt-highlight', !!(note && !nameSet.has(note) && altSet.has(note)));
  });
}

function updatePanShellMode(mode) {
  const svg = document.getElementById(PAN_SVG_ID);
  if (!svg) return;
  svg.querySelectorAll('.pan-note').forEach(el => {
    const isTop = el.classList.contains('ding') || el.classList.contains('ring');
    const isBottom = el.classList.contains('gu');
    if (mode === 'top') el.classList.toggle('dimmed', isBottom);
    else if (mode === 'bottom') el.classList.toggle('dimmed', isTop);
    else el.classList.remove('dimmed');
  });
}

// Highlight the currently playing note(s). Clears any previous playing state
// so only the most-recently-requested notes are lit. Auto-clears after 2.2s.
let _playTimer = null;
function updatePanPlaying(noteNames) {
  const svg = document.getElementById(PAN_SVG_ID);
  if (!svg) return;
  if (_playTimer !== null) { clearTimeout(_playTimer); _playTimer = null; }
  svg.querySelectorAll('.pan-note.playing').forEach(el => el.classList.remove('playing'));
  const nameSet = new Set(noteNames);
  svg.querySelectorAll('.pan-note').forEach(el => {
    if (el.classList.contains('empty')) return;
    const note = el.dataset.note;
    if (note && nameSet.has(note)) el.classList.add('playing');
  });
  _playTimer = setTimeout(() => {
    svg.querySelectorAll('.pan-note.playing').forEach(el => el.classList.remove('playing'));
    _playTimer = null;
  }, 2200);
}


// ── js/storage.js ──
const LAYOUTS_KEY = 'hp-layouts';
const FAVS_KEY = 'hp-favorites'; // legacy, migrated into hp-playlists on first access
const PLAYLISTS_KEY = 'hp-playlists';

function safeParse(key) {
  try { return JSON.parse(localStorage.getItem(key) || '[]'); }
  catch { return []; }
}

// ── Saved layouts ────────────────────────────────────────────────────────────

function getSavedLayouts() { return safeParse(LAYOUTS_KEY); }

function saveLayout(entry) {
  const all = getSavedLayouts();
  const idx = all.findIndex(l => l.id === entry.id);
  if (idx >= 0) all[idx] = entry;
  else all.unshift(entry);
  localStorage.setItem(LAYOUTS_KEY, JSON.stringify(all));
}

function deleteLayout(id) {
  localStorage.setItem(LAYOUTS_KEY, JSON.stringify(getSavedLayouts().filter(l => l.id !== id)));
}

// ── Playlists ────────────────────────────────────────────────────────────────

function setPlaylists(playlists) {
  localStorage.setItem(PLAYLISTS_KEY, JSON.stringify(playlists));
}

function getPlaylists() {
  const raw = localStorage.getItem(PLAYLISTS_KEY);
  if (raw !== null) {
    try { return JSON.parse(raw); } catch { /* fall through */ }
  }
  // First run: create default Favorites playlist, migrate old favorites if any
  const old = safeParse(FAVS_KEY);
  const playlists = [{ id: 'favorites', name: 'Favorites', chords: old }];
  setPlaylists(playlists);
  return playlists;
}

function addPlaylist(name) {
  const playlists = getPlaylists();
  const id = 'pl-' + Date.now();
  playlists.push({ id, name, chords: [] });
  setPlaylists(playlists);
  return id;
}

function renamePlaylist(id, name) {
  const playlists = getPlaylists();
  const pl = playlists.find(p => p.id === id);
  if (pl) { pl.name = name; setPlaylists(playlists); }
}

function deletePlaylist(id) {
  if (id === 'favorites') return;
  setPlaylists(getPlaylists().filter(p => p.id !== id));
}

function addChordToPlaylist(playlistId, chord) {
  const playlists = getPlaylists();
  const pl = playlists.find(p => p.id === playlistId);
  if (!pl || pl.chords.some(c => c.id === chord.id)) return false;
  pl.chords.unshift(chord);
  setPlaylists(playlists);
  return true;
}

function removeChordFromPlaylist(playlistId, chordFavId) {
  const playlists = getPlaylists();
  const pl = playlists.find(p => p.id === playlistId);
  if (!pl) return;
  pl.chords = pl.chords.filter(c => c.id !== chordFavId);
  setPlaylists(playlists);
}

function reorderChordInPlaylist(playlistId, fromIdx, toIdx) {
  const playlists = getPlaylists();
  const pl = playlists.find(p => p.id === playlistId);
  if (!pl || fromIdx === toIdx || toIdx < 0 || toIdx >= pl.chords.length) return;
  const [item] = pl.chords.splice(fromIdx, 1);
  pl.chords.splice(toIdx, 0, item);
  setPlaylists(playlists);
}

function isChordInPlaylist(playlistId, chordFavId) {
  const pl = getPlaylists().find(p => p.id === playlistId);
  return !!(pl && pl.chords.some(c => c.id === chordFavId));
}

function isChordInAnyPlaylist(chordFavId) {
  return getPlaylists().some(p => p.chords.some(c => c.id === chordFavId));
}

// Legacy compat — keep old callers working
function getFavorites() {
  return getPlaylists().find(p => p.id === 'favorites')?.chords ?? [];
}
function toggleFavorite(fav) {
  if (isChordInPlaylist('favorites', fav.id)) {
    removeChordFromPlaylist('favorites', fav.id);
    return false;
  }
  return addChordToPlaylist('favorites', fav);
}
function isFavorite(id) { return isChordInPlaylist('favorites', id); }

  const allNotes = new Set(getAllNotes(state.layout));

      return `<button class="note-btn ${inUse ? 'in-use' : ''}"
        data-action="pick-note" data-note="${noteStr}"

  const slotLabel = state.pendingSlot.shell === 'ding'
    ? 'ding (center)'
