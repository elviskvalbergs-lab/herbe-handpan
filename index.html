}

// One line under the instrument's name on its card.
function instrumentStatus(inst) {
  if (inst.family === 'handpan') return inst.kind === 'custom' ? 'Custom handpan' : 'Handpan';
  if (inst.kind === 'traditional') {
    const notes = inst.chambers?.[0]?.notes ?? [];
    return notes.length ? `${notes.length} notes, ${midiToNoteName(notes[0])} to ${midiToNoteName(notes[notes.length - 1])}` : '';
  }
  if (inst.kind === 'custom') {
    if (!inst.calibration) return `${inst.holeCount} holes · not set up yet`;
    const notes = inst.chambers?.[0]?.notes ?? [];
    return inst.family === 'flute' && notes.length
      ? `${inst.holeCount} holes · ${notes.length} notes, ${midiToNoteName(notes[0])} to ${midiToNoteName(notes[notes.length - 1])}`
      : `${inst.holeCount} holes`;
  }
  if (inst.kind === 'scale') {
    const stage = inst.build?.stage ?? 'done';
    const chambers = inst.chambers.length;
    const size = `${inst.notes.length} notes · ${chambers} chamber${chambers !== 1 ? 's' : ''}`;
    if (stage === 'done') return size;
    const idx = BUILD_STAGES.findIndex(s => s.id === stage);
    return `${BUILD_STAGES[idx].name}, step ${idx + 1} of ${BUILD_STAGES.length} · ${size}`;
  }
  return '';
}

// ── Storage ──────────────────────────────────────────────────────────────────

function getAllInstrumentsRaw() {
  try { return JSON.parse(localStorage.getItem(INSTRUMENTS_KEY) || '[]'); }
  catch { return []; }
}

function writeInstruments(list) {
  localStorage.setItem(INSTRUMENTS_KEY, JSON.stringify(list));
  // Lets the app schedule a cloud sync without every caller remembering to.
  if (typeof window !== 'undefined') window.dispatchEvent(new Event('hp-instruments-changed'));
}

// Raw list including soft deletes, for sync.
function getInstrumentsRaw() { return getAllInstrumentsRaw(); }
function writeInstrumentsRaw(list) { writeInstruments(list); }

function getInstruments() {
  return sortInstruments(getAllInstrumentsRaw().filter(i => !i.deletedAt));
}

function getInstrument(id) {
  return getAllInstrumentsRaw().find(i => i.id === id && !i.deletedAt) || null;
}

function saveInstrument(inst) {
  const all = getAllInstrumentsRaw();
  const idx = all.findIndex(i => i.id === inst.id);
  const stamped = { ...inst, updatedAt: nowIso() };
  if (idx >= 0) all[idx] = stamped; else all.push(stamped);
  writeInstruments(all);
}

function deleteInstrument(id) {
  const all = getAllInstrumentsRaw();
  const inst = all.find(i => i.id === id);
  if (inst) { inst.deletedAt = inst.updatedAt = nowIso(); writeInstruments(all); }
}

// Marks an instrument as just played (orders My instruments). Doesn't touch
// updatedAt, so it never wins a sync merge on its own.
function touchInstrument(id) {
  const all = getAllInstrumentsRaw();
  const inst = all.find(i => i.id === id);
  if (inst) { inst.lastPlayedAt = nowIso(); writeInstruments(all); }
}

// Brings handpan instruments in step with the saved layouts.
function syncHandpanInstruments(savedLayouts) {
  const { instruments, changed } = reconcileInstruments(getAllInstrumentsRaw(), savedLayouts);
  if (changed) writeInstruments(instruments);
}

function isOnboarded() { return localStorage.getItem(ONBOARDED_KEY) === '1'; }
function setOnboarded() { localStorage.setItem(ONBOARDED_KEY, '1'); }

// ── Clay bodies ──────────────────────────────────────────────────────────────
// The named list of clays a user builds with, each carrying the shrinkage
// learned from finished builds. Local only for now.

const CLAY_KEY = 'hp-clay-bodies';

function getClayBodies() {
  try {
    const list = JSON.parse(localStorage.getItem(CLAY_KEY) || 'null');
    if (Array.isArray(list) && list.length) return list;
  } catch { /* fall through */ }
  return [{ id: 'generic', name: 'Generic clay', shrinkPct: 11, builds: 0 }];
}

function saveClayBodies(list) {
  localStorage.setItem(CLAY_KEY, JSON.stringify(list));
}

// ── Sharing and sync ─────────────────────────────────────────────────────────

// 6-character public ID without look-alike characters (no 0/O, 1/I/L).
const PUBLIC_ID_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function newPublicId(random = Math.random) {
  let id = '';
  for (let i = 0; i < 6; i++) id += PUBLIC_ID_CHARS[Math.floor(random() * PUBLIC_ID_CHARS.length)];
  return id;
}

// Instruments that sync through the instruments table: everything except
// handpans, which are rebuilt from the saved layouts (synced already).
function syncableInstruments(list) {
  return list.filter(i => i.family !== 'handpan');
}

// Two-way merge of local instruments with cloud rows ({ id, data,
// updated_at, deleted_at }): newest updatedAt wins per instrument, deletes
// included. Pure. Returns { local, toPush, changed } where toPush lists the
// local instruments the cloud lacks or has older.
function mergeInstruments(localList, rows) {
  const local = localList.map(i => ({ ...i }));
  let changed = false;
  const cloudById = new Map(rows.map(r => [r.id, r]));
  for (const row of rows) {
    const remote = { ...row.data, deletedAt: row.deleted_at ?? row.data?.deletedAt ?? undefined };
    if (!remote.deletedAt) delete remote.deletedAt;
    const idx = local.findIndex(i => i.id === row.id);
    if (idx < 0) { local.push(remote); changed = true; continue; }
    if ((remote.updatedAt || '') > (local[idx].updatedAt || '')) {
      local[idx] = { ...remote, lastPlayedAt: local[idx].lastPlayedAt ?? remote.lastPlayedAt };
      changed = true;
    }
  }
  const toPush = syncableInstruments(local).filter(i => {
    const row = cloudById.get(i.id);
    return !row || (i.updatedAt || '') > (row.data?.updatedAt || '');
  });
  return { local, toPush, changed };
}

// A shared instrument opened from a link or QR code, ready to add to My
// instruments: a fresh id, no public ID (that belongs to the owner's copy),
// no build readings.
function copySharedInstrument(shared, now = nowIso()) {
  const { publicId, build, setup, deletedAt, ...rest } = shared;
  return {
    ...rest,
    id: (shared.family === 'handpan' ? 'hp-' : 'oc-') + Math.random().toString(36).slice(2, 10),
    copiedFrom: publicId ?? null,
    build: build ? { ...build, stage: 'done', perChamber: [] } : undefined,
    createdAt: now, updatedAt: now, lastPlayedAt: now,
  };
}


// ── js/builder.js ──
// Builder logic: the seven stages of making a clay ocarina, clay bodies with
// learned shrinkage, and calibrating a bought ocarina from tuner readings.
// See docs/ocarina-mode.md, "Builder" and "Calibrated charts".
//
// Pure functions only (no DOM, no storage), unit tested in Node. The screens
// are in app.js; the clay body list is stored by instruments.js.

const STAGE_ORDER = ['design', 'body', 'leather', 'boneDry', 'bisque', 'final', 'done'];
const STAGE_TITLES = {
  design: 'Design', body: 'Body', leather: 'Voice and drill (leather-hard)',
  boneDry: 'Bone-dry check', bisque: 'Bisque check', final: 'Final check', done: 'Done',
};

const DEFAULT_CLAY_BODIES = [
  { id: 'generic', name: 'Generic clay (11%)', shrinkPct: 11, builds: 0 },
];

// Shrinkage fraction for a build (from its clay body), e.g. 0.11.
function buildShrink(inst) {
  return (inst.build?.shrinkPct ?? 11) / 100;
}

// Per-chamber build record, created on demand.
function chamberBuild(inst, ci) {
  const per = inst.build.perChamber[ci] ?? {};
  return {
    window: per.window ?? defaultWindow(midiToHz(inst.chambers[ci].notes[0], inst.build.a4 ?? 440)),
    readings: per.readings ?? {},
    holesDone: per.holesDone ?? [],
    testHoleMm: per.testHoleMm ?? 6,
  };
}

// Target frequency of every note of a chamber at a stage. Leather-hard
// targets are lowered for shrinkage (f × (1 − s)); bone-dry is compared
// with the leather-hard readings; bisque and final use concert pitch.
function stageTargets(chamber, stage, shrink, a4 = 440) {
  const out = {};
  for (const m of chamber.notes) {
    const concert = midiToHz(m, a4);
    out[m] = stage === 'leather' ? concert * (1 - shrink) : concert;
  }
  return out;
}

// What to do about a note measured at a stage. Returns { cents, status, text }
// with status 'ok' | 'flat' | 'sharp'. In tune means within ±10 cents.
function noteAdvice(stage, measuredHz, targetHz) {
  const cents = Math.round(centsBetween(measuredHz, targetHz));
  if (Math.abs(cents) <= 10) return { cents, status: 'ok', text: 'in tune' };
  const flat = cents < 0;
  const amount = `${Math.abs(cents)} cents ${flat ? 'flat' : 'sharp'}`;
  if (stage === 'leather') {
    return { cents, status: flat ? 'flat' : 'sharp', text: flat ? `${amount}: open it slightly` : `${amount}: make the hole a little smaller with clay` };
  }
  if (stage === 'boneDry') {
    return { cents, status: flat ? 'flat' : 'sharp', text: flat ? `${amount}: file this hole carefully` : `${amount}: leave it, it can't be lowered now` };
  }
  return { cents, status: flat ? 'flat' : 'sharp', text: flat ? `${amount}: file this hole a little larger` : `${amount}: can't be lowered by filing` };
}

// Hole diameters at leather-hard from the tuner readings, in drilling order
// (the opening order). Returns null until f0, d and f1 are all recorded.
// Each hole: { index, finger, mm, parts } where parts is [mm] or two halves
// or several equal ones for a hole over 12 mm; testHoleIndex is the hole the test hole becomes.
function leatherHolePlan(chamber, reading, shrink, a4 = 440) {
  if (!(reading?.f0 > 0 && reading?.d > 0 && reading?.f1 > reading?.f0)) return null;
  const targets = stageTargets(chamber, 'leather', shrink, a4);
  const { W, holes, testHoleIndex } = holeSizes({
    f0: reading.f0, d: reading.d, f1: reading.f1,
    targets: chamber.notes.slice(1).map(m => targets[m]),
  });
  return {
    W,
    testHoleIndex,
    holes: holes.map((mm, i) => ({
      index: i, finger: chamber.holes[i].finger, mm,
      parts: splitHole(mm),
    })),
  };
}

// Inside volume and ball size for each chamber's window (leather-hard target).
function bodyPlan(inst) {
  const shrink = buildShrink(inst);
  return inst.chambers.map((ch, ci) => {
    const win = chamberBuild(inst, ci).window;
    return { window: win, ...chamberVolume(win, midiToHz(ch.notes[0], inst.build.a4 ?? 440), shrink) };
  });
}

function nextStage(stage, { unglazed = false } = {}) {
  const i = STAGE_ORDER.indexOf(stage);
  const next = STAGE_ORDER[Math.min(i + 1, STAGE_ORDER.length - 1)];
  return next === 'final' && unglazed ? 'done' : next;
}

// Finishes a build: stores the drilled hole sizes on the chambers, the
// measured pitches, and the shrinkage learned from leather-hard vs final
// (or bisque, if unglazed) readings. Returns { inst, learned } where learned
// is the shrinkage fraction (null if no note was measured at both stages).
function finishBuild(inst) {
  const shrink = buildShrink(inst);
  const a4 = inst.build.a4 ?? 440;
  const leatherAll = {}, finalAll = {};
  const chambers = inst.chambers.map((ch, ci) => {
    const b = chamberBuild(inst, ci);
    const lr = b.readings.leather ?? {};
    Object.assign(leatherAll, lr.notes ?? {});
    Object.assign(finalAll, (b.readings.final ?? b.readings.bisque ?? {}).notes ?? {});
    const plan = leatherHolePlan(ch, { ...lr, d: lr.d ?? b.testHoleMm }, shrink, a4);
    return plan ? applyHoleSizes(ch, plan.holes.map(h => h.mm)) : ch;
  });
  const learned = learnedShrinkage(leatherAll, finalAll);
  return {
    inst: {
      ...inst,
      chambers,
      measured: finalAll,
      build: { ...inst.build, stage: 'done', learnedShrink: learned },
    },
    learned,
  };
}

// Folds a new learned shrinkage into a clay body: the average over the
// builds made with it so far.
function updateClayBody(body, learned) {
  if (learned == null) return body;
  const n = body.builds ?? 0;
  const pct = ((body.shrinkPct * n) + learned * 100) / (n + 1);
  return { ...body, shrinkPct: Math.round(pct * 10) / 10, builds: n + 1 };
}

// ── Bought ocarinas: calibration ─────────────────────────────────────────────

// First guess at which finger covers each hole of a bought ocarina with
// `count` holes, by the hands: the holes are split between them, the right
// hand taking the odd one (3 → R1 R2 + L1, 5 → R1–R3 + L1 L2, 7 → R1–R4 +
// L1–L3, 8 → both hands), each hand counted out from the index finger; then
// the thumbs (left first) and, past ten, sub-holes beside the right then the
// left middle finger (as on the STL 12-hole chart in charts.js). Stored in
// opening order (each hand's outer finger first, the right hand before the
// left), which the fingering choices rely on. The user checks and changes it.
function defaultCustomHoles(count) {
  const fingers = Math.min(count, 8);
  const right = Math.min(4, Math.ceil(fingers / 2)), left = fingers - right;
  const holes = [];
  for (let k = right; k >= 1; k--) holes.push({ id: `R${k}`, finger: `R${k}`, side: 'top' });
  for (let k = left; k >= 1; k--) holes.push({ id: `L${k}`, finger: `L${k}`, side: 'top' });
  for (const t of ['LT', 'RT'].slice(0, Math.max(0, Math.min(2, count - 8)))) holes.push({ id: t, finger: t, side: 'bottom' });
  const subFingers = ['R2', 'L2'];
  for (let i = 0; holes.length < count; i++) {
    const f = subFingers[i % subFingers.length];
    holes.push({ id: f + 's' + (i + 1), finger: f, side: 'top', sub: true });
  }
  return holes;
}

// A playable chamber from calibration readings: f0 with every hole closed,
// singles[i] with only hole i open. Returns { notes, holes, fingerings,
// calibration } or null until every reading is in.
// extra: further readings the owner took of other fingerings ([{ states,
// hz }], from changing a fingering by hand); they refine the fit and, like
// the set-up readings, win the note they land on.
function calibrateChamber(holes, f0, singles, { a4 = 440, toleranceCents = 20, extra = [] } = {}) {
  if (!(f0 > 0) || singles.length !== holes.length || !singles.every(hz => hz > f0)) return null;
  const measurements = [
    ...singles.map((hz, i) => ({ states: holes.map((_, j) => (j === i ? 'o' : 'c')), hz })),
    ...extra.filter(x => x?.hz > 0 && x.states?.length === holes.length),
  ];
  const ratios = solveHoleRatios(f0, measurements);
  const chart = calibratedChart(f0, ratios, { a4, toleranceCents });
  const max = Math.max(...ratios);
  // A note blown during set-up is a measurement, not a prediction: when a
  // reading lands on a note, its fingering (all closed, or that one hole
  // open) is the one shown for that note.
  const measured = [{ states: holes.map(() => 'c'), hz: f0 }, ...measurements];
  for (const { states, hz } of measured) {
    const midi = Math.round(hzToMidi(hz, a4));
    const cents = centsBetween(hz, midiToHz(midi, a4));
    if (Math.abs(cents) > Math.max(toleranceCents, 30)) continue;
    const prev = chart[midi];
    if (prev?.measured && Math.abs(prev.cents) <= Math.abs(cents)) continue;
    chart[midi] = { states, hz, cents, measured: true };
  }
  const notes = Object.keys(chart).map(Number).sort((a, b) => a - b);
  const fingerings = {};
  for (const m of notes) fingerings[m] = chart[m].states;
  return {
    notes,
    holes: holes.map((h, i) => ({ ...h, rel: ratios[i] / max })),
    fingerings,
    calibration: { f0, singles, ratios, cents: Object.fromEntries(notes.map(m => [m, Math.round(chart[m].cents)])) },
  };
}

// ── Other flutes: recording their notes ──────────────────────────────────────

// Fingers of a flute with `count` holes (3–8), from the mouthpiece down. Six
// holes are the usual L1 L2 L3 R1 R2 R3. Fewer holes drop fingers from the
// top of the left hand (5: L2 L3 R1 R2 R3 … 3: R1 R2 R3). Seven add the right
// little finger at the bottom (R4); eight also the left little finger (L4,
// after L3). The fingers are only labels: the chart comes from the readings.
function fluteHoles(count) {
  const n = Math.max(3, Math.min(8, count));
  const six = ['L1', 'L2', 'L3', 'R1', 'R2', 'R3'];
  const fingers = n <= 6 ? six.slice(6 - n)
    : n === 7 ? [...six, 'R4'] : ['L1', 'L2', 'L3', 'L4', 'R1', 'R2', 'R3', 'R4'];
  return fingers.map(f => ({ id: f, finger: f, side: 'top' }));
}

// Hole states for recorded step k of a flute with n holes: step 0 all
// closed, step k the k lowest holes open (holes listed from the mouthpiece
// down, so the last k).
function fluteStepStates(n, k) {
  return Array.from({ length: n }, (_, i) => (i >= n - k ? 'o' : 'c'));
}

// A playable chamber from a flute's recorded notes: readings[0] with every
// hole closed, readings[k] with the k lowest holes open. Each reading is
// rounded to the nearest note; its cents off that note are kept for display.
// When two readings round to the same note the first one is kept and the
// later one listed in `dropped`. Returns null until every reading is in.
function fluteChamberFromReadings(holes, readings, { a4 = 440 } = {}) {
  const n = holes.length;
  if (readings.length !== n + 1 || !readings.every(hz => hz > 0)) return null;
  const fingerings = {};
  const cents = {};
  const dropped = [];
  readings.forEach((hz, k) => {
    const exact = hzToMidi(hz, a4);
    const midi = Math.round(exact);
    if (fingerings[midi]) { dropped.push({ step: k, midi, keptStep: cents[midi].step }); return; }
    fingerings[midi] = fluteStepStates(n, k);
    cents[midi] = { step: k, cents: Math.round((exact - midi) * 100) };
  });
  const notes = Object.keys(fingerings).map(Number).sort((a, b) => a - b);
  return {
    notes,
    holes: holes.map(h => ({ ...h })),
    fingerings,
    calibration: {
      readings: [...readings],
      cents: Object.fromEntries(notes.map(m => [m, cents[m].cents])),
      dropped,
    },
  };
}

// ── Editing a bought instrument ──────────────────────────────────────────────

// A custom (bought) ocarina or flute with a different number of holes, as a
// new object. An ocarina keeps the fingers and the single-hole readings of
// the holes it still has and the spots marked on its photo; a flute's
// readings depend on the count, so they start again. Either way the chart
// is cleared: it came from readings that no longer match.
function withHoleCount(inst, count) {
  const flute = inst.family === 'flute';
  const n = flute ? Math.max(3, Math.min(8, count)) : Math.max(1, Math.min(13, count));
  if (n === inst.holeCount) return inst;
  const out = { ...inst, holeCount: n, chambers: [], calibration: null };
  if (flute) {
    out.setup = { holes: fluteHoles(n), readings: [] };
  } else {
    const old = inst.setup ?? { holes: defaultCustomHoles(inst.holeCount), f0: null, singles: [] };
    const holes = defaultCustomHoles(n).map((h, i) => (old.holes[i] ? { ...old.holes[i] } : h));
    out.setup = { holes, f0: old.f0 ?? null, singles: (old.singles ?? []).slice(0, n) };
    if (inst.holeMap) out.holeMap = Array.from({ length: n }, (_, i) => inst.holeMap[i] ?? null);
  }
  return out;
}

// Where hole i sits on the instrument's photo: { x, y } as fractions of the
// photo's width and height, or null when it isn't marked or is underneath
// (thumb holes can't be seen from the top).
function holeSpot(inst, i) {
  const s = inst.holeMap?.[i];
  const hole = inst.setup?.holes?.[i] ?? inst.chambers?.[0]?.holes?.[i];
  if (!s || hole?.side === 'bottom') return null;
  return s;
}

// Whether the fingering diagrams draw this ocarina from its own photo: one
// set up by the owner or from a published chart, with every top hole marked.
function usesHoleMap(inst) {
  if (inst.family !== 'ocarina' || !['custom', 'traditional'].includes(inst.kind) || !inst.holeMap) return false;
  const holes = inst.setup?.holes ?? inst.chambers?.[0]?.holes ?? [];
  return holes.length > 0 && holes.every((h, i) => h.side === 'bottom' || inst.holeMap[i]);
}

// Fingerings the owner set by hand ({ midi: states }) on top of a worked-out
// chart: they replace the predicted ones and add notes the chart missed.
function withFixedFingerings(chamber, fixed) {
  if (!fixed || !Object.keys(fixed).length) return chamber;
  const fingerings = { ...chamber.fingerings };
  for (const [m, states] of Object.entries(fixed)) {
    if (Array.isArray(states) && states.length === chamber.holes.length) fingerings[m] = states;
  }
  const notes = Object.keys(fingerings).map(Number).sort((a, b) => a - b);
  return { ...chamber, notes, fingerings };
}

// The holes with one hand's fingers in the opposite order, among the
// fingers that hand uses (R1–R4: R1 ↔ R4, R2 ↔ R3; a flute's L1–L3:
// L1 ↔ L3): for when they were set up the wrong way round. Thumbs and
// sub-hole flags stay; returns new hole objects.
function reverseHandFingers(holes, hand) {
  const re = new RegExp(`^${hand}([1-4])$`);
  const used = [...new Set(holes.map(h => re.exec(h.finger)?.[1]).filter(Boolean))].sort();
  const swap = Object.fromEntries(used.map((d, i) => [d, used[used.length - 1 - i]]));
  return holes.map(h => {
    const m = re.exec(h.finger);
    return m ? { ...h, finger: `${hand}${swap[m[1]]}` } : { ...h };
  });
}

// ── How holes are shown ──────────────────────────────────────────────────────
// A bought ocarina's holes are stored in the order they open going up the
// scale (the right little finger first): fingering choices rely on that.
// On screen they are listed and named by finger instead: right hand R1–R4,
// left hand L1–L4, the thumbs, each sub-hole after its finger's hole.
const HOLE_FINGER_RANK = { R1: 0, R2: 1, R3: 2, R4: 3, L1: 4, L2: 5, L3: 6, L4: 7, RT: 8, LT: 9 };

// Indexes of `holes` in the order they are shown.
function holeDisplayOrder(holes) {
  const rank = h => (HOLE_FINGER_RANK[h.finger] ?? 10) + (h.sub ? 0.5 : 0);
  return holes.map((h, i) => i).sort((a, b) => rank(holes[a]) - rank(holes[b]) || a - b);
}

// What hole i is called: its finger ("R1", "R2 sub-hole"), numbered when a
// finger covers more than one ("R4 (2)").
function holeLabel(holes, i) {
  const h = holes[i];
  const name = h.sub ? `${h.finger} sub-hole` : h.finger;
  const same = holes.map((x, k) => k).filter(k => holes[k].finger === h.finger && !!holes[k].sub === !!h.sub);
  return same.length > 1 ? `${name} (${same.indexOf(i) + 1})` : name;
}

// ── Cropping an instrument photo ─────────────────────────────────────────────
// The part of an iw × ih image inside a frame of width/height `ratio`, at
// zoom ≥ 1 (1: the frame as large as the image allows) and centred on
// (cx, cy) as fractions of the image, kept inside the image. Image pixels.
function cropRect({ iw, ih, ratio, zoom = 1, cx = 0.5, cy = 0.5 }) {
  const z = Math.max(1, zoom);
  let sw, sh;
  if (iw / ih > ratio) { sh = ih / z; sw = sh * ratio; } else { sw = iw / z; sh = sw / ratio; }
  const sx = Math.min(Math.max(cx * iw - sw / 2, 0), iw - sw);
  const sy = Math.min(Math.max(cy * ih - sh / 2, 0), ih - sh);
  return { sx, sy, sw, sh };
}


// ── js/audio.js ──
let ctx = null;
let masterGain = null;
let reverbSend = null; // set after reverb setup; null = reverb not ready, use masterGain
let routingEl = null;  // iOS: the <audio> element that carries Web Audio to the main speaker
let speed = 1;         // time multiplier for arpeggios, scales and sequences (1 = normal)
let voice = 'handpan'; // which instrument the next notes sound like, see setVoice()

// Playback speed: 'slow' | 'normal' | 'fast'. Normal keeps the original
// timings exactly; slow stretches them by half again, fast shortens them.
const PLAYBACK_SPEEDS = { slow: 1.5, normal: 1, fast: 0.7 };
function setPlaybackSpeed(name) { speed = PLAYBACK_SPEEDS[name] ?? 1; }

// iOS pauses the routing <audio> element whenever the microphone is used
// (the tuner switches the audio session to recording) or after an
// interruption, and then every sound goes nowhere. Called from a tap, this
// restarts it and the context; harmless everywhere else.
function ensureAudioOutput() {
  if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {});
  if (routingEl && routingEl.paused) routingEl.play().catch(() => {});
}

function buildReverb() {
  // ~1.8 s exponentially-decaying white-noise impulse response
  const len = Math.floor(ctx.sampleRate * 1.8);
  const ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c);
    for (let i = 0; i < len; i++) {
      const t = i / ctx.sampleRate;
      d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 3.5);
    }
  }
  const conv = ctx.createConvolver();
  conv.buffer = ir;
  return conv;
}

function setupReverb() {
  const conv = buildReverb();

  const dryGain = ctx.createGain();
  dryGain.gain.value = 0.7;
  dryGain.connect(masterGain);

  const reverbReturn = ctx.createGain();
  reverbReturn.gain.value = 0.25;
  conv.connect(reverbReturn);
  reverbReturn.connect(masterGain);

  reverbSend = ctx.createGain();
  reverbSend.gain.value = 1;
  reverbSend.connect(dryGain);
  reverbSend.connect(conv);
}

function initAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();

  masterGain = ctx.createGain();
  masterGain.gain.value = 0.7;

  // iOS routes Web Audio through the earpiece (AVAudioSessionCategoryAmbient) by default.
  // Routing masterGain → MediaStreamDestinationNode → <audio playsinline> forces iOS to
  // use AVAudioSessionCategoryPlayback, which outputs through the main speaker.
  // Falls back to ctx.destination if the MediaStream API is unavailable.
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (isIOS && ctx.createMediaStreamDestination) {
    try {
      const streamDest = ctx.createMediaStreamDestination();
      masterGain.connect(streamDest);
      routingEl = document.createElement('audio'); // module-level, see ensureAudioOutput()
      routingEl.setAttribute('playsinline', '');
      routingEl.srcObject = streamDest.stream;
      document.body.appendChild(routingEl);
      routingEl.play().catch(() => {
        masterGain.connect(ctx.destination); // fallback if stream play rejected
      });
    } catch (_) {
      masterGain.connect(ctx.destination);
    }
  } else {
    masterGain.connect(ctx.destination);
  }

  // iOS unlock: play a silent buffer + resume() synchronously in the gesture handler
  const buf = ctx.createBuffer(1, 1, ctx.sampleRate);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  src.start(0);
  ctx.resume();

  // Reverb is non-critical — build it asynchronously so it never blocks
  // the gesture window or kills audio if buildReverb() throws on some browser.
  setTimeout(() => {
    try { setupReverb(); } catch (_) {}
  }, 0);
}

// Wait for the context to actually be running before scheduling audio.
// On iOS Chrome the context can still be 'suspended' right after resume() is called;
// scheduling on a suspended context drops the audio silently.
function whenRunning(fn) {
  if (!ctx) initAudio();
  ensureAudioOutput();
  if (ctx.state === 'running') {
    fn();
  } else {
    ctx.resume().then(() => fn());
  }
}

const START_OFFSET = 0.05;

// Wind voices: ocarina, wooden (Native American style) flute, tin whistle.
// Each is a sustained tone with a soft breathy attack, built from a few
// harmonics (one PeriodicWave), a little breath noise and a slow vibrato
// that comes in after the attack. Handpan keeps its own struck sound.
const VOICES = ['handpan', 'ocarina', 'flute', 'whistle'];
function setVoice(name) { voice = VOICES.includes(name) ? name : 'handpan'; }

const WIND = {
  //            harmonics (1st, 2nd, …)      attack  breath  breath band   vibrato depth/rate  level
  ocarina: { h: [1, 0.06, 0.035, 0.01],        a: 0.045, n: 0.05, nf: 2.2, nq: 1.2, vd: 4, vr: 5.0, g: 0.34 },
  flute:   { h: [1, 0.22, 0.12, 0.05, 0.02],   a: 0.07,  n: 0.11, nf: 1.6, nq: 0.9, vd: 6, vr: 4.6, g: 0.33 },
  whistle: { h: [1, 0.42, 0.24, 0.13, 0.07, 0.04], a: 0.025, n: 0.07, nf: 3.0, nq: 1.4, vd: 7, vr: 5.6, g: 0.3 },
};
const windWaves = {};
let noiseBuf = null;

function windWave(name) {
  if (!windWaves[name]) {
    const h = WIND[name].h;
    const real = new Float32Array(h.length + 1), imag = new Float32Array(h.length + 1);
    h.forEach((v, i) => { imag[i + 1] = v; });
    windWaves[name] = ctx.createPeriodicWave(real, imag);
  }
  return windWaves[name];
}

function breathNoise() {
  if (!noiseBuf) {
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = ctx.createBufferSource();
  src.buffer = noiseBuf;
  src.loop = true;
  return src;
}

function playWind(freq, now, dur, sink) {
  const v = WIND[voice];
  const hold = Math.max(0.12, dur);
  const end = now + hold, release = 0.09;

  const out = ctx.createGain();
  out.gain.setValueAtTime(0, now);
  out.gain.linearRampToValueAtTime(v.g * 1.15, now + v.a);          // a slight push on the breath
  out.gain.linearRampToValueAtTime(v.g, now + v.a + 0.08);
  out.gain.setValueAtTime(v.g, end);
  out.gain.exponentialRampToValueAtTime(0.0001, end + release);
  out.connect(sink);

  const osc = ctx.createOscillator();
  osc.setPeriodicWave(windWave(voice));
  osc.frequency.setValueAtTime(freq * 0.985, now);                   // blown notes settle up into pitch
  osc.frequency.exponentialRampToValueAtTime(freq, now + v.a + 0.03);
  const vib = ctx.createOscillator(), vibGain = ctx.createGain();
  vib.frequency.value = v.vr;
  vibGain.gain.setValueAtTime(0, now);
  vibGain.gain.linearRampToValueAtTime(0, now + 0.25);
  vibGain.gain.linearRampToValueAtTime(v.vd, now + 0.6);            // cents
  vib.connect(vibGain);
  vibGain.connect(osc.detune);
  osc.connect(out);

  // Breath: band-passed noise, strongest on the attack (the "chiff").
  const noise = breathNoise(), bp = ctx.createBiquadFilter(), ng = ctx.createGain();
  bp.type = 'bandpass';
  bp.frequency.value = Math.min(freq * v.nf, 9000);
  bp.Q.value = v.nq;
  ng.gain.setValueAtTime(0, now);
  ng.gain.linearRampToValueAtTime(v.n * 3, now + v.a * 0.6);
  ng.gain.linearRampToValueAtTime(v.n, now + v.a + 0.1);
  ng.gain.setValueAtTime(v.n, end);
  ng.gain.exponentialRampToValueAtTime(0.0001, end + release);
  noise.connect(bp); bp.connect(ng); ng.connect(out);

  const stop = end + release + 0.05;
  [osc, vib, noise].forEach(n => { n.start(now); n.stop(stop); });
  osc.onended = () => [osc, vib, vibGain, noise, bp, ng, out].forEach(n => n.disconnect());
}

function playFreq(freq, startTime, dur = 0.9) {
  if (!ctx) return;
  const now = startTime ?? ctx.currentTime;
  const sink = reverbSend ?? masterGain; // fall back if reverb not ready yet
  if (voice !== 'handpan') { playWind(freq, now, dur, sink); return; }

  const harmonics = [
    { mult: 1,   gain: 0.52, decay: 5.5 },
    { mult: 2,   gain: 0.34, decay: 3.2 },
    { mult: 3,   gain: 0.11, decay: 2.0 },
    { mult: 4,   gain: 0.05, decay: 1.3 },
  ];

  harmonics.forEach(({ mult, gain, decay }) => {
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq * mult;
    osc.detune.value = (Math.random() - 0.5) * 4;

    env.gain.setValueAtTime(0, now);
    env.gain.linearRampToValueAtTime(gain, now + 0.004);
    env.gain.exponentialRampToValueAtTime(gain * 0.55, now + 0.18);
    env.gain.exponentialRampToValueAtTime(0.0001, now + decay);

    osc.connect(env);
    env.connect(sink);
    osc.start(now);
    osc.stop(now + decay + 0.1);
    osc.onended = () => { osc.disconnect(); env.disconnect(); };
  });
}

function playNote(noteName) {
  initAudio();
  whenRunning(() => playFreq(noteToFreq(noteName), ctx.currentTime + START_OFFSET));
}

function playChord(noteNames, onArp, onTogether) {
  initAudio();
  const sorted = [...noteNames].sort((a, b) => noteToMidi(a) - noteToMidi(b));
  const ARP = 0.3 * speed;
  const togetherOffset = sorted.length * ARP + 0.35 * speed;
  whenRunning(() => {
    const now = ctx.currentTime + START_OFFSET;
    sorted.forEach((n, i) => {
      playFreq(noteToFreq(n), now + i * ARP, ARP * 0.92);
      if (onArp) setTimeout(() => onArp(n), Math.round(i * ARP * 1000));
    });
    sorted.forEach(n => playFreq(noteToFreq(n), now + togetherOffset, 1.4 * speed));
    if (onTogether) setTimeout(() => onTogether(sorted), Math.round(togetherOffset * 1000));
  });
}

function playScale(noteNames, onNote) {
  initAudio();
  const asc = [...noteNames].sort((a, b) => noteToMidi(a) - noteToMidi(b));
  const desc = asc.slice(0, -1).reverse();
  const all = [...asc, ...desc];
  const INTERVAL = 0.4 * speed;
  whenRunning(() => {
    const now = ctx.currentTime + START_OFFSET;
    all.forEach((n, i) => {
      playFreq(noteToFreq(n), now + i * INTERVAL, INTERVAL * 0.92);
      if (onNote) setTimeout(() => onNote(n), Math.round(i * INTERVAL * 1000));
    });
  });
}

// Notes one after another in the order given, no final chord: an arpeggio
// on an instrument that sounds one note at a time (ocarina, flute).
function playSequence(noteNames, onNote, interval = 0.4) {
  initAudio();
  interval *= speed;
  whenRunning(() => {
    const now = ctx.currentTime + START_OFFSET;
    noteNames.forEach((n, i) => {
      playFreq(noteToFreq(n), now + i * interval, interval * 0.92);
      if (onNote) setTimeout(() => onNote(n, i), Math.round(i * interval * 1000));
    });
  });
}

// A short metronome click for a count-in: higher on the first beat.
function playClick(accent = false) {
  initAudio();
  whenRunning(() => {
    const now = ctx.currentTime + START_OFFSET;
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = accent ? 1760 : 1320;
    env.gain.setValueAtTime(0, now);
    env.gain.linearRampToValueAtTime(accent ? 0.22 : 0.14, now + 0.002);
    env.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
    osc.connect(env);
    env.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.08);
    osc.onended = () => { osc.disconnect(); env.disconnect(); };
  });
}


// ── js/pan.js ──
const PAN_SVG_ID = 'handpan-svg';

// Physical handpan ring layout (confirmed from klangzeug.de for all scales).
// Notes sorted ascending (n1=lowest, nN=highest) placed clockwise from 12 o'clock.
// For 10-ring instruments, n9+n10 go on a separate inner ring (see renderPan).
function physicalOrder(n) {
  if (n === 7)  return [6,4,2,0,1,3,5];
  if (n === 8)  return [7,6,4,2,0,1,3,5];
  if (n === 9)  return [8,6,4,2,0,1,3,5,7];
  return null;
}

// Outer ring physical order for 10-ring instruments (n1-n8, same as 8-ring).
const OUTER_8_ORDER = [7,6,4,2,0,1,3,5];

// Inner ring note positions. 1-2 notes: symmetric at ±45° from top, r=100.
// 3-5 notes: evenly spread across an arc from -140° to -40°, r=95.
function innerRingPositions(cx, cy, count) {
  if (count <= 2) {
    const r = 100;
    const angles = [-Math.PI * 3 / 4, -Math.PI / 4]; // -135°, -45°
    return angles.slice(0, count).map(a => ({
      x: Math.round(cx + r * Math.cos(a)),
      y: Math.round(cy + r * Math.sin(a)),
    }));
  }
  const r = 95;
  const start = (-140 * Math.PI) / 180;
  const end   = (-40 * Math.PI) / 180;
  const step  = (end - start) / (count - 1);
  return Array.from({ length: count }, (_, i) => {
    const a = start + i * step;
    return { x: Math.round(cx + r * Math.cos(a)), y: Math.round(cy + r * Math.sin(a)) };
  });
}

function circlePositions(count, cx, cy, r, rotationOffset = 0) {
  return Array.from({ length: count }, (_, i) => {
    const angle = (i * 2 * Math.PI / count) - Math.PI / 2 + rotationOffset;
    return {
      x: Math.round(cx + r * Math.cos(angle)),
      y: Math.round(cy + r * Math.sin(angle)),
    };
  });
}

// All tone fields are circles. r controls size; lower notes get larger circles.
function noteSlotSvg(x, y, note, extraClasses, noteId, r = 24, useFlats = false, useSolfege = false) {
  const isEmpty = !note;
  const allClasses = ['pan-note', ...extraClasses.split(' ').filter(Boolean)].join(' ');
  const noteAttr = note ? ` data-note="${note}"` : '';

  let textHtml;
  if (isEmpty) {
    textHtml = `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central"
      font-family="system-ui,sans-serif" font-size="${Math.round(r * 0.7)}" font-weight="600"
      fill="var(--note-rest-text)">+</text>`;
  } else {
    const displayed = displayNote(note, useFlats, useSolfege);
    const name = displayed.replace(/\d+$/, '');
    const oct = (displayed.match(/\d+$/) ?? [''])[0];
    const nameFontSize = Math.max(8, Math.round((name.length > 1 ? 12 : 14) * r / 26));
    const octFontSize  = Math.max(6, Math.round(9 * r / 26));
    const nameY = y - Math.round(r * 0.14);
    const octY  = y + Math.round(r * 0.40);
    textHtml = `<text x="${x}" y="${nameY}" text-anchor="middle" dominant-baseline="auto"
      font-family="system-ui,sans-serif" font-size="${nameFontSize}" font-weight="600"
      fill="var(--note-rest-text)">${name}</text>
<text x="${x}" y="${octY}" text-anchor="middle" dominant-baseline="auto"
      font-family="system-ui,sans-serif" font-size="${octFontSize}" font-weight="400"
      fill="var(--note-rest-text)" opacity="0.5">${oct}</text>`;
  }

  return `<g class="${allClasses}" data-note-id="${noteId}"${noteAttr}>
  <circle cx="${x}" cy="${y}" r="${r}" fill="var(--note-rest-bg)" stroke="var(--pan-note-stroke)" stroke-width="1.5"/>
  ${textHtml}
</g>`;
}

// Radius for a ring note at sorted index i (0=lowest, n-1=highest).
// Lower notes are physically larger on a real handpan.
function ringNoteRadius(sortedIndex, total) {
  // 10+ ring instruments: keep smaller notes to avoid inner-ring overlap
  const minR = total >= 10 ? 18 : 22;
  const maxR = total >= 10 ? 26 : 30;
  const t = total <= 1 ? 0 : sortedIndex / (total - 1);
  return Math.round(maxR - (maxR - minR) * t);
}

// Bottom notes now rendered as outer ring in unified renderPan — this function is kept
// only for callers that may reference it directly (shellMode='bottom' handled inline).

// Strike-order badges (opts.strikeMarks, from a progression's play level):
// each note's strike numbers and hands, e.g. "2L 4L", in a tag at the
// note's top right, coloured by the hand of its first strike.
function strikeBadgesSvg(placed, strikeMarks) {
  let out = '';
  for (const { note, marks } of strikeMarks) {
    const at = placed.find(p => p.note === note);
    if (!at || !marks.length) continue;
    const label = marks.map(m => `${m.n}${m.hand}`).join(' ');
    const w = 14 + label.length * 13;
    const h = 30;
    // Just outside the note, away from the pan's centre (above the ding),
    // so the note's name stays readable.
    const dx = at.x - 250, dy = at.y - 250;
    const d = Math.hypot(dx, dy);
    const ux = d < 1 ? 0 : dx / d, uy = d < 1 ? -1 : dy / d;
    const off = at.r + 3 + Math.max(Math.abs(ux) * w / 2, Math.abs(uy) * h / 2);
    const x = Math.max(2, Math.min(500 - w - 2, Math.round(at.x + ux * off - w / 2)));
    const y = Math.max(2, Math.min(500 - h - 2, Math.round(at.y + uy * off - h / 2)));
    const hand = marks[0].hand === 'L' ? 'l' : 'r';
    out += `<g class="pan-strike pan-strike-${hand}" data-note="${note}" aria-hidden="true">
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>
  <text x="${x + w / 2}" y="${y + h / 2}" text-anchor="middle" dominant-baseline="central"
    font-family="system-ui,sans-serif" font-size="23" font-weight="700">${label}</text>
</g>`;
  }
  return out;
}

// opts.faintNotes (optional) draws notes faintly (the next chord), and
// opts.strikeMarks (optional) numbers notes in strike order with L/R; a pan
// rendered without them is exactly as before.
function renderPan(layout, opts = {}) {
  const { shellMode = 'both', highlightNotes = [], altHighlightNotes = [], rotated = false, useFlats = false, useSolfege = false,
    faintNotes = [], strikeMarks = [] } = opts;

  const cx = 250, cy = 250;
  const hlSet = new Set(highlightNotes);
  const altSet = new Set(altHighlightNotes);
  const faintSet = new Set(faintNotes);
  const placed = []; // { x, y, r, note } of every note drawn, for strike badges
  const place = (x, y, note, classes, id, r) => {
    if (note) placed.push({ x, y, r, note });
    return noteSlotSvg(x, y, note, classes, id, r, useFlats, useSolfege);
  };

  // Assign each unique pitch class in the chord its own color (0-3, root first),
  // cycling for chords with more than 4 distinct pitch classes.
  const pcColorIndex = new Map();
  highlightNotes.forEach(n => {
    const pc = notePC(n);
    if (!pcColorIndex.has(pc)) pcColorIndex.set(pc, pcColorIndex.size % 4);
  });

  const dimTop = shellMode === 'bottom';
  const dimBottom = shellMode === 'top';

  function noteClass(note, isTopShell) {
    const classes = [];
    if (!note) classes.push('empty');
    else if (hlSet.has(note)) classes.push(`highlight highlight-${pcColorIndex.get(notePC(note))}`);
    else if (altSet.has(note)) classes.push(`alt-highlight alt-highlight-${pcColorIndex.get(notePC(note))}`);
    else if (faintSet.has(note)) classes.push('faint');
    if (isTopShell && dimTop) classes.push('dimmed');
    if (!isTopShell && dimBottom) classes.push('dimmed');
    return classes.join(' ');
  }

  const totalRingSlots = layout.top.slots.length;
  const hasInnerRing = totalRingSlots >= 10 && totalRingSlots <= 13;
  const guCount = Math.max(layout.bottom.capacity, layout.bottom.slots.length);

  let svg = `<svg id="${PAN_SVG_ID}" viewBox="0 0 500 500" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="panGrad" cx="38%" cy="32%">
      <stop offset="0%" style="stop-color: var(--pan-g0)"/>
      <stop offset="60%" style="stop-color: var(--pan-g1)"/>
      <stop offset="100%" style="stop-color: var(--pan-g2)"/>
    </radialGradient>
    <radialGradient id="innerGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color: var(--pan-i0)"/>
      <stop offset="100%" style="stop-color: var(--pan-i1)"/>
    </radialGradient>
  </defs>

  <!-- Pan body -->
  <circle cx="${cx}" cy="${cy}" r="193" fill="url(#panGrad)" stroke="var(--pan-rim)" stroke-width="2"/>
  <!-- Outer groove ring -->
  <circle cx="${cx}" cy="${cy}" r="173" fill="none" stroke="var(--pan-groove)" stroke-width="1" stroke-dasharray="3 7"/>
  <!-- Inner center dome -->
  <circle cx="${cx}" cy="${cy}" r="66" fill="url(#innerGrad)" stroke="var(--pan-groove)" stroke-width="1.5"/>
  <!-- Tone field guide ring -->
  <circle cx="${cx}" cy="${cy}" r="142" fill="none" stroke="var(--pan-guide)" stroke-width="1" opacity="0.5"/>
  ${hasInnerRing ? `<circle cx="${cx}" cy="${cy}" r="${totalRingSlots >= 12 ? 95 : 100}" fill="none" stroke="var(--pan-guide)" stroke-width="1" stroke-dasharray="3 5" opacity="0.4"/>` : ''}
`;

  // Ding (center)
  const dingNote = layout.top.ding;
  const dingHighlighted = dingNote && hlSet.has(dingNote);
  const dingClass = [
    !dingNote ? 'empty' : '',
    dingHighlighted ? `highlight highlight-${pcColorIndex.get(notePC(dingNote))}` : '',
    dingNote && !dingHighlighted && faintSet.has(dingNote) ? 'faint' : '',
    dimTop ? 'dimmed' : '',
  ].filter(Boolean).join(' ');
  svg += place(cx, cy, dingNote, `ding ${dingClass}`, 'ding', 36);

  if (hasInnerRing) {
    const outerSlots = OUTER_8_ORDER.map(i => layout.top.slots[i] ?? { note: null });
    const rotationRad = rotated ? Math.PI * (8 - 9) / 8 : 0;
    const outerPos = circlePositions(8, cx, cy, 142, rotationRad);
    for (let i = 0; i < 8; i++) {
      const slot = outerSlots[i];
      const sortedIdx = OUTER_8_ORDER[i];
      const r = ringNoteRadius(sortedIdx, totalRingSlots);
      svg += place(outerPos[i].x, outerPos[i].y, slot.note,
        `ring ${noteClass(slot.note, true)}`, `ring-${sortedIdx}`, r);
    }
    const innerCount = Math.min(5, totalRingSlots - 8);
    const innerPos = innerRingPositions(cx, cy, innerCount);
    for (let i = 0; i < innerCount; i++) {
      const sortedIdx = 8 + i;
      const slot = layout.top.slots[sortedIdx] ?? { note: null };
      const r = ringNoteRadius(sortedIdx, totalRingSlots);
      svg += place(innerPos[i].x, innerPos[i].y, slot.note,
        `ring ${noteClass(slot.note, true)}`, `ring-${sortedIdx}`, r);
    }
  } else {
    const ringCount = Math.max(layout.top.capacity, totalRingSlots);
    const rotationRad = rotated ? Math.PI * (ringCount - 9) / ringCount : 0;
    const ringPos = circlePositions(ringCount, cx, cy, 142, rotationRad);

    let ringSlots = layout.top.slots;
    let sortedIndices = null;
    if (!layout.isCustom) {
      const order = physicalOrder(totalRingSlots);
      if (order) {
        ringSlots = order.map(i => layout.top.slots[i] ?? { note: null });
        sortedIndices = order;
      }
    }

    for (let i = 0; i < ringCount; i++) {
      const slot = ringSlots[i] ?? { note: null };
      const pos = ringPos[i];
      const r = sortedIndices ? ringNoteRadius(sortedIndices[i], totalRingSlots) : 22;
      svg += place(pos.x, pos.y, slot.note, `ring ${noteClass(slot.note, true)}`, `ring-${i}`, r);
    }
  }

  // Bottom shell — outer orbit circles around the pan body
  if (guCount > 0) {
    const guPos = circlePositions(guCount, cx, cy, 228, 0);
    for (let i = 0; i < guCount; i++) {
      const slot = layout.bottom.slots[i] ?? { note: null };
      svg += place(guPos[i].x, guPos[i].y, slot.note,
        `gu ${noteClass(slot.note, false)}`, `gu-${i}`, 16);
    }
  }

  if (strikeMarks.length) svg += strikeBadgesSvg(placed, strikeMarks);
  svg += '</svg>';
  return svg;
}

// Update highlight using full note strings (with octave)
function updatePanHighlight(noteNames, altNoteNames = []) {
  const svg = document.getElementById(PAN_SVG_ID);
  if (!svg) return;
  const nameSet = new Set(noteNames);
  const altSet = new Set(altNoteNames);
  svg.querySelectorAll('.pan-note').forEach(el => {
    if (el.classList.contains('empty')) return;
    const note = el.dataset.note;
    el.classList.toggle('highlight', !!(note && nameSet.has(note)));
    el.classList.toggle('alt-highlight', !!(note && !nameSet.has(note) && altSet.has(note)));
  });
}

function updatePanShellMode(mode) {
  const svg = document.getElementById(PAN_SVG_ID);
  if (!svg) return;
  svg.querySelectorAll('.pan-note').forEach(el => {
    const isTop = el.classList.contains('ding') || el.classList.contains('ring');
    const isBottom = el.classList.contains('gu');
    if (mode === 'top') el.classList.toggle('dimmed', isBottom);
    else if (mode === 'bottom') el.classList.toggle('dimmed', isTop);
    else el.classList.remove('dimmed');
  });
}

// Highlight the currently playing note(s). Clears any previous playing state
// so only the most-recently-requested notes are lit. Auto-clears after 2.2s.
let _playTimer = null;
function updatePanPlaying(noteNames) {
  const svg = document.getElementById(PAN_SVG_ID);
  if (!svg) return;
  if (_playTimer !== null) { clearTimeout(_playTimer); _playTimer = null; }
  svg.querySelectorAll('.pan-note.playing').forEach(el => el.classList.remove('playing'));
  const nameSet = new Set(noteNames);
  svg.querySelectorAll('.pan-note').forEach(el => {
    if (el.classList.contains('empty')) return;
    const note = el.dataset.note;
    if (note && nameSet.has(note)) el.classList.add('playing');
  });
  _playTimer = setTimeout(() => {
    svg.querySelectorAll('.pan-note.playing').forEach(el => el.classList.remove('playing'));
    _playTimer = null;
  }, 2200);
}


// ── js/ocarina-ui.js ──
// The fingering diagram: one SVG component that draws every ocarina (and
// later flute) fingering in the app, at three sizes. See docs/ocarina-mode.md,
// "The fingering diagram".
//
// renderFingering() returns an SVG string, like renderPan() does. The helpers
// above it (fingeringFor, fingeringMoves, describeFingering) are pure and unit
// tested in Node.

const FINGER_NAMES = {
  L1: 'left index', L2: 'left middle', L3: 'left ring', L4: 'left pinky', LT: 'left thumb',
  R1: 'right index', R2: 'right middle', R3: 'right ring', R4: 'right pinky', RT: 'right thumb',
};

// ── Pure helpers ─────────────────────────────────────────────────────────────

// Every note the instrument can play, ascending, with no duplicates.
function playableMidis(inst) {
  const set = new Set();
  for (const ch of inst.chambers ?? []) for (const m of Object.keys(ch.fingerings)) set.add(Number(m));
  return [...set].sort((a, b) => a - b);
}

// The chamber and hole states for a note: { chamberIndex, chamber, states }
// or null if the instrument can't play it. Lowest chamber wins if several can.
function fingeringFor(inst, midi) {
  const chambers = inst.chambers ?? [];
  for (let i = 0; i < chambers.length; i++) {
    const states = chambers[i].fingerings[midi];
    if (states) return { chamberIndex: i, chamber: chambers[i], states };
  }
  return null;
}

// What a hole is called in instructions: its finger, or "R2 sub-hole" for
// the small extra hole a finger covers by sliding forward.
function fgHoleName(h) { return h.sub ? `${h.finger} sub-hole` : h.finger; }

// Per finger (sub-holes separately), whether it is on a hole ('c' or 'h').
function fgFingersDown(chamber, states) {
  // Per finger: 'c' covered, 'h' half-covered, 'o' open (a finger with
  // several holes counts as its most covered one).
  const rank = { o: 0, h: 1, c: 2 };
  const down = {};
  chamber.holes.forEach((h, i) => {
    const k = fgHoleName(h);
    const st = states[i] === 'c' || states[i] === 'h' ? states[i] : 'o';
    if (!down[k] || rank[st] > rank[down[k]]) down[k] = st;
  });
  return down;
}

function fgJoinFingers(list) {
  if (list.length <= 1) return list.join('');
  return list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1];
}

// What moves from one note to the next: fingers to lift and to cover, a
// sentence for under the diagram ("Lift R3 and R2", "Cover L1, lift R4"), and
// whether the player switches chamber. Fingers that stay put aren't listed.
function fingeringMoves(inst, fromMidi, toMidi) {
  const a = fingeringFor(inst, fromMidi);
  const b = fingeringFor(inst, toMidi);
  if (!a || !b) return { lift: [], cover: [], switchChamber: false, text: '' };
  const before = fgFingersDown(a.chamber, a.states);
  const after = fgFingersDown(b.chamber, b.states);
  const fingers = Object.keys(after);
  const lift = fingers.filter(f => before[f] && before[f] !== 'o' && after[f] === 'o');
  const cover = fingers.filter(f => before[f] !== 'c' && after[f] === 'c');
  const half = fingers.filter(f => before[f] !== 'h' && after[f] === 'h');
  const switchChamber = a.chamberIndex !== b.chamberIndex;
  const parts = [];
  if (switchChamber) parts.push(`Blow chamber ${b.chamberIndex + 1}`);
  if (cover.length) parts.push(`cover ${fgJoinFingers(cover)}`);
  if (lift.length) parts.push(`lift ${fgJoinFingers(lift)}`);
  if (half.length) parts.push(`half-cover ${fgJoinFingers(half)}`);
  let text = parts.join(', ');
  text = text ? text[0].toUpperCase() + text.slice(1) : 'No change';
  return { lift, cover, half, switchChamber, text };
}

// Accessible label: "D4: R4 and R3 open, all others closed".
function describeFingering(inst, midi, noteLabel = midiToNoteName(midi)) {
  const f = fingeringFor(inst, midi);
  if (!f) return `${noteLabel}: not on this instrument`;
  const open = [], half = [];
  f.chamber.holes.forEach((h, i) => {
    const k = fgHoleName(h);
    if (f.states[i] === 'o' && !open.includes(k)) open.push(k);
    if (f.states[i] === 'h' && !half.includes(k)) half.push(k);
  });
  const chamber = (inst.chambers.length > 1) ? ` (chamber ${f.chamberIndex + 1})` : '';
  const parts = [];
  if (open.length) parts.push(`${fgJoinFingers(open)} open`);
  if (half.length) parts.push(`${fgJoinFingers(half)} half-covered`);
  const blow = f.chamber.overblow?.includes(midi) ? ', blow harder' : '';
  if (!parts.length) return `${noteLabel}${chamber}: all holes closed${blow}`;
  const rest = (open.length + half.length) < new Set(f.chamber.holes.map(fgHoleName)).size ? ', all others closed' : '';
  return `${noteLabel}${chamber}: ${parts.join(', ')}${rest}${blow}`;
}

// Hole sizes relative to the largest hole of the chamber (1 = largest).
// Uses calibrated or measured sizes when stored, otherwise (if fromNotes)
// the proportions from the target notes, otherwise all the same.
function relativeSizes(chamber, a4 = 440, { fromNotes = true } = {}) {
  if (chamber.holes.length && chamber.holes.every(h => h.rel > 0)) return chamber.holes.map(h => h.rel);
  const mm = chamber.holes.map(h => h.sizeMm);
  if (mm.every(x => x > 0)) {
    const max = Math.max(...mm);
    return mm.map(x => x / max);
  }
  if (fromNotes && chamber.notes?.length === chamber.holes.length + 1) {
    const [closed, ...rest] = chamber.notes;
    return relativeHoleSizes(midiToHz(closed, a4), rest.map(m => midiToHz(m, a4)));
  }
  return chamber.holes.map(() => 1);
}

// ── Chords ───────────────────────────────────────────────────────────────────

// The layout shape findAllChords() expects, from an ocarina's playable notes:
// lowest note as the "ding", the rest as ring notes. With a pitch-class set
// (a scale filter), only notes in it are kept.
function ocarinaToLayout(inst, pcs = null) {
  const names = playableMidis(inst)
    .filter(m => !pcs || pcs.has(((m % 12) + 12) % 12))
    .map(midiToNoteName);
  return {
    id: 'oc:' + inst.id,
    name: inst.name,
    isCustom: true,
    top: { ding: names[0] ?? null, slots: names.slice(1).map(note => ({ note })), capacity: Math.max(0, names.length - 1) },
    bottom: { slots: [], capacity: 0 },
  };
}

// A chord's notes in arpeggio order: the root first, then upward, then the
// notes below the root (still ascending). Returns MIDI numbers.
function arpeggioOrder(noteNames, rootNote) {
  const midis = noteNames.map(noteToMidi).sort((a, b) => a - b);
  const root = rootNote ? noteToMidi(rootNote) : midis[0];
  const rootIdx = Math.max(0, midis.indexOf(root));
  return [...midis.slice(rootIdx), ...midis.slice(0, rootIdx)];
}

// Fits a chord (note names, e.g. from a handpan scale) onto the instrument:
// each note as written if playable, else the nearest octave of the same
// pitch class that is. Returns { midis, missing } where missing lists the
// note names with no playable octave at all.
function fitChordToInstrument(inst, noteNames) {
  const playable = playableMidis(inst);
  const midis = [], missing = [];
  for (const n of noteNames) {
    const m = noteToMidi(n);
    if (playable.includes(m)) { midis.push(m); continue; }
    const same = playable.filter(p => ((p - m) % 12 + 12) % 12 === 0 && !midis.includes(p));
    if (same.length) midis.push(same.sort((a, b) => Math.abs(a - m) - Math.abs(b - m))[0]);
    else missing.push(n);
  }
  return { midis: midis.sort((a, b) => a - b), missing };
}

// Voicing swap: moves chord note `midi` to the next higher octave of the same
// pitch class the instrument has (wrapping to the lowest), skipping octaves
// the chord already uses. Returns the new ascending MIDI list.
function nextVoicing(inst, midis, midi) {
  const options = playableMidis(inst).filter(p => ((p - midi) % 12 + 12) % 12 === 0 && (p === midi || !midis.includes(p)));
  if (options.length < 2) return [...midis];
  const next = options[(options.indexOf(midi) + 1) % options.length];
  return midis.map(m => (m === midi ? next : m)).sort((a, b) => a - b);
}

// Diagram coordinates (viewBox units, 300 wide).

// Transverse ocarinas are traced from a published fingering chart (an alto C
// 12-hole chart the owner supplied): the body outline, the two thin lines
// on it, the windway (the beak at the lower left), and every hole's centre
// and size. The left hand's four holes run along the upper edge from the
// head; the right hand's four form the lower row towards the tail, where
// the right pinky covers a pair of small holes. Sub-holes are small holes
// beside a finger's main hole; thumb holes are drawn as dots outside the
// body (left thumb left of the head, right thumb below the belly), as
// printed charts do. Coordinates below are in the traced image's pixels;
// fgVesselPage() maps them onto the diagram.
//
// Multi-chamber ocarinas are traced from the owner's drawing of one: a
// single body, chamber 1 laid out like the transverse one, and each further
// chamber a row of holes below it, in the columns of the right-hand fingers
// that cover them.

// Smooth closed (or open) path through points: Catmull-Rom as cubic Béziers.
function fgSmoothPath(pts, closed = true) {
  const n = pts.length;
  const at = i => pts[closed ? (i + n) % n : Math.max(0, Math.min(n - 1, i))];
  const f = v => Math.round(v * 10) / 10;
  let d = `M ${f(pts[0][0])} ${f(pts[0][1])}`;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C ${f(c1[0])} ${f(c1[1])}, ${f(c2[0])} ${f(c2[1])}, ${f(p2[0])} ${f(p2[1])}`;
  }
  return closed ? d + ' Z' : d;
}

const FG_PENDANT = {
  bodyH: 170,
  pos: {
    L1: [112, 58], L2: [96, 92], L3: [96, 126], L4: [112, 156],
    R1: [188, 58], R2: [204, 92], R3: [204, 126], R4: [188, 156],
  },
};
const FG_THUMB_X = { LT: 100, RT: 200 };
// Flutes, seen from above with the mouth end on the left, the holes in the
// order the chart lists them (mouth end first) and a gap between the hands.
//
// Native American flute, after the High Spirits Flutes booklet's drawings
// ("Functional Parts of the Flute", p.11, and the flute on p.24): mouth end,
// the long plain slow air chamber, the fetish (the carved block) tied on
// with leather over the sound hole, then the finger holes in the lower half
// towards the open foot end. Tin whistle: a tapered mouthpiece with its
// sound window, then a plain tube with six holes.
const FG_TUBE = { bodyH: 70, pos: {} };
const FG_TUBE_CY = 40;   // tube centre line within the chamber block
const FG_TUBE_R = 14;    // tube half-height

function fgFluteStyle(inst) {
  return String(inst.type ?? '').startsWith('tin-whistle') ? 'whistle' : 'naf';
}

function fgTubePositions(holes, y0, style = 'naf') {
  const top = holes.map((h, i) => ({ h, i })).filter(x => x.h.side !== 'bottom');
  // NAF: the holes end well before the foot, as on a real flute.
  const [from, to] = style === 'whistle' ? [118, 272] : [172, 262];
  const xs = {};
  const gap = 12;
  const n = top.length;
  const step = n > 1 ? (to - from - (top.some(x => x.h.finger.startsWith('R')) ? gap : 0)) / (n - 1) : 0;
  top.forEach((x, k) => {
    const handGap = x.h.finger.startsWith('R') && top.some(t => t.h.finger.startsWith('L')) ? gap : 0;
    xs[x.i] = [n === 1 ? (from + to) / 2 : from + k * step + handGap, y0 + FG_TUBE_CY];
  });
  return xs;
}

function fgFluteBody(style, y0, blown) {
  const cy = y0 + FG_TUBE_CY, r = FG_TUBE_R;
  const g = [];
  if (style === 'whistle') {
    // Body tube, then the mouthpiece over its end: tapered to the lip,
    // with the sound window (the opening with the cut edge) on top.
    g.push(`<rect class="fg-metal" x="86" y="${cy - r + 2}" width="${FG_W - 92}" height="${r * 2 - 4}" rx="3"/>`);
    g.push(`<path class="fg-metal-shine" d="M 96 ${cy - 5} L ${FG_W - 14} ${cy - 5}"/>`);
    g.push(`<path class="fg-head" d="M 8 ${cy - 6} Q 6 ${cy}, 8 ${cy + 6} L 64 ${cy + r + 1} L 94 ${cy + r + 1} L 94 ${cy - r - 1} L 64 ${cy - r - 1} Z"/>`);
    g.push(`<rect class="fg-bore" x="70" y="${cy - 5}" width="13" height="10" rx="1.5"/>`);
    g.push(`<path class="fg-mouth-lip ${blown ? 'fg-blow' : ''}" d="M 8 ${cy - 6} Q 6 ${cy}, 8 ${cy + 6}"/>`);
  } else {
    // Wooden tube with nearly square-cut ends (slightly rounded corners);
    // the blowing end is a little narrower, as on a real flute.
    const L = FG_W - 6, rr = r - 2;
    g.push(`<path class="fg-wood" d="M 8 ${cy - rr + 2} Q 8 ${cy - rr}, 12 ${cy - rr} L 40 ${cy - rr - 1} L ${L - 4} ${cy - rr - 1} Q ${L} ${cy - rr - 1}, ${L} ${cy - rr + 3} L ${L} ${cy + rr - 3} Q ${L} ${cy + rr + 1}, ${L - 4} ${cy + rr + 1} L 40 ${cy + rr + 1} L 12 ${cy + rr} Q 8 ${cy + rr}, 8 ${cy + rr - 2} Z"/>`);
    g.push(`<path class="fg-wood-grain" d="M 20 ${cy - 4} L ${L - 10} ${cy - 5} M 30 ${cy + 3} L ${L - 16} ${cy + 4}"/>`);
    g.push(`<path class="fg-mouth-lip ${blown ? 'fg-blow' : ''}" d="M 9 ${cy - rr + 3} L 9 ${cy + rr - 3}"/>`);
    g.push(`<ellipse class="fg-bore" cx="${L - 3}" cy="${cy}" rx="2" ry="${rr - 4}"/>`);
    // Fetish: an angular carved block tied on with two flat leather wraps;
    // the loose ends lie along the tube. The sound hole sits just in front.
    g.push(`<path class="fg-block" d="M 78 ${cy - 8} L 132 ${cy - 8} L 142 ${cy - 4} L 142 ${cy + 4} L 132 ${cy + 8} L 78 ${cy + 8} Z"/>`);
    g.push(`<rect class="fg-tie" x="90" y="${cy - rr - 2}" width="6" height="${rr * 2 + 4}" rx="1.5"/>`);
    g.push(`<rect class="fg-tie" x="120" y="${cy - rr - 2}" width="6" height="${rr * 2 + 4}" rx="1.5"/>`);
    g.push(`<path class="fg-tie-end" d="M 96 ${cy + rr + 1} L 112 ${cy + rr + 1} M 126 ${cy + rr + 1} L 140 ${cy + rr + 1}"/>`);
    g.push(`<rect class="fg-bore" x="150" y="${cy - 3}" width="6" height="6" rx="1"/>`);
  }
  return g.join('');
}
const FG_STRIP_H = 34;

// Round pendant body only for small single-chamber ocarinas (4 holes or
// fewer, like the English-system pendants); everything else is transverse.
function fgIsPendant(inst) {
  const chambers = inst.chambers ?? [];
  const holes = Math.max(0, ...chambers.map(c => c.holes.length));
  return chambers.length === 1 && holes <= 4;
}

// ── Render ───────────────────────────────────────────────────────────────────

function fgHoleShape(x, y, r, state, cls) {
  if (state === 'c') return `<circle class="fg-hole fg-c ${cls}" cx="${x}" cy="${y}" r="${r}"/>`;
  if (state === 'o') return `<circle class="fg-hole fg-o ${cls}" cx="${x}" cy="${y}" r="${r}"/>`;
  // Half: ring with the lower half filled.
  return `<g class="fg-hole fg-h ${cls}">
    <circle class="fg-o" cx="${x}" cy="${y}" r="${r}"/>
    <path class="fg-c" d="M ${x - r} ${y} A ${r} ${r} 0 0 0 ${x + r} ${y} Z"/>
  </g>`;
}

function fgArrow(x, y, r, dir) {
  // Up arrow above the hole for "lift", down arrow for "cover".
  const top = y - r - 16, bot = y - r - 4;
  const [tip, tail] = dir === 'up' ? [top, bot] : [bot, top];
  const head = dir === 'up' ? tip + 5 : tip - 5;
  return `<g class="fg-arrow fg-arrow-${dir}">
    <line x1="${x}" y1="${tail}" x2="${x}" y2="${tip}"/>
    <polyline points="${x - 4},${head} ${x},${tip} ${x + 4},${head}"/>
  </g>`;
}

// renderFingering(instrument, midi, { size, previousMidi, showFingers, showSizes, useFlats, useSolfege, blowBoth })
//   size: 'large' | 'medium' | 'mini'
//   previousMidi: note played before, to mark the holes that change
//   blowBoth: a second MIDI note, on another chamber, for two-note harmony
function renderFingering(inst, midi, opts = {}) {
  const {
    size = 'medium', previousMidi = null, showFingers = false, showSizes = false,
    useFlats = false, useSolfege = false, blowBoth = null, a4 = 440, nextMidi = null, editable = false,
    noteLabel = true,
  } = opts;
  const tube = inst.family === 'flute';
  const pendant = !tube && fgIsPendant(inst);
  const chambers = inst.chambers ?? [];
  const main = fingeringFor(inst, midi);
  const second = blowBoth != null ? fingeringFor(inst, blowBoth) : null;
  // Arrows show either how this note was reached (previousMidi) or, in
  // practice mode, what to change next (nextMidi).
  const moves = nextMidi != null && nextMidi !== midi ? fingeringMoves(inst, midi, nextMidi)
    : previousMidi != null && previousMidi !== midi ? fingeringMoves(inst, previousMidi, midi) : null;
  const label = displayNote(midiToNoteName(midi), useFlats, useSolfege);
  const aria = describeFingering(inst, midi, label);
  const labelH = !noteLabel ? 6 : size === 'mini' ? 26 : 30;
  const ctx = { inst, chambers, main, second, moves, size, showFingers, showSizes, a4, editable };

  const { parts, bodyBottom } = usesHoleMap(inst) && chambers.length === 1 ? fgPhotoParts(ctx)
    : (tube || pendant) ? fgFlatParts(ctx, tube) : fgVesselParts(ctx);
  const H = bodyBottom + labelH;
  const noteY = bodyBottom + (size === 'mini' ? 14 : 16);
  const overblow = main && main.chamber.overblow?.includes(midi);
  if (noteLabel) parts.push(`<text class="fg-note" x="${FG_W / 2}" y="${noteY}">${main ? label : label + ' ✕'}${overblow ? '<tspan class="fg-overblow" dx="6">↑ blow harder</tspan>' : ''}</text>`);

  return `<svg class="fingering fingering-${size}${tube ? ' is-flute' : ''}" viewBox="0 0 ${FG_W} ${Math.round(H)}" role="img"
    aria-label="${aria.replace(/"/g, '&quot;')}" data-midi="${midi}">${parts.join('')}</svg>`;
}

// One hole with its state, change mark, arrow, finger label and size.
function fgHoleParts(g, opts) {
  const start = g.length;
  fgHolePartsInner(g, opts);
  // Editing a fingering: each hole is a tap target that cycles its state.
  if (opts.editable) {
    const inner = g.splice(start).join('');
    g.push(`<g class="fg-edit-hole" data-action="fg-edit-hole" data-index="${opts.index}"><circle class="fg-edit-target" cx="${opts.x}" cy="${opts.y}" r="${Math.max(opts.r + 4, 14)}"/>${inner}</g>`);
  }
}

function fgHolePartsInner(g, { x, y, r, state, hole, moves, changedOk, size, showFingers, showSizes, labelled, wood = false, photo = false }) {
  const hk = fgHoleName(hole);
  const changed = moves && changedOk && (moves.lift.includes(hk) || moves.cover.includes(hk) || moves.half?.includes(hk));
  g.push(fgHoleShape(x, y, r, state, `${changed ? 'fg-changed' : ''}${wood ? ' fg-on-wood' : ''}${photo ? ' fg-on-photo' : ''}`));
  if (changed && size !== 'mini' && labelled) g.push(fgArrow(x, y, r, moves.lift.includes(hk) ? 'up' : 'down'));
  if (showFingers && size !== 'mini' && labelled) {
    // Small flute holes can't hold a label: it goes under the hole.
    g.push(photo
      ? `<text class="fg-finger-photo" x="${x}" y="${y + r + 10}">${hole.finger}</text>`
      : wood
      ? `<text class="fg-finger-below" x="${x}" y="${y + r + 11}">${hole.sub ? '' : hole.finger}</text>`
      : `<text class="fg-finger ${state === 'c' ? 'on-dark' : ''}" x="${x}" y="${y}">${hole.sub ? '' : hole.finger}</text>`);
  }
  if (showSizes && size !== 'mini' && hole.sizeMm > 0) {
    g.push(`<text class="fg-size" x="${x}" y="${y + r + 9}">${hole.sizeMm.toFixed(1)}</text>`);
  }
}

// Which chamber is blown, and its hole states (all covered when not blown).
function fgChamberState(ctx, ci) {
  const { main, second } = ctx;
  const f = main?.chamberIndex === ci ? main : second?.chamberIndex === ci ? second : null;
  return { blown: !!f, f, states: f ? f.states : ctx.chambers[ci].holes.map(() => 'c') };
}

// Transverse ocarinas, one chamber or several, from the traced geometry.
function fgVesselParts(ctx) {
  const { chambers, size, inst } = ctx;
  const multi = chambers.length > 1;
  const G = multi ? FG_OC_MULTI : FG_OC_SINGLE;
  // Multi: the traced drawing has 4 chambers. With fewer, the rows stay
  // where they are and only the body below the last row used is pulled up,
  // keeping the same depth of body under it as the drawing has.
  const lastRow = multi ? G.rows[Math.min(chambers.length, 4) - 2] : 0;
  const k = multi ? (G.bottom - G.lastRow) / (G.bottom - lastRow) : 1;
  const fy = y => (multi && y > lastRow ? lastRow + (y - lastRow) * k : y);
  const pageX = x => (x - G.ox) * G.s;
  const pageY = y => (fy(y) - G.oy) * G.s;
  const pt = ([x, y]) => [pageX(x), pageY(y)];
  const parts = [];

  parts.push(`<path class="fg-body" d="${fgSmoothPath(G.outline.map(pt))}"/>`);
  for (const line of G.lines) parts.push(`<path class="fg-line" d="${fgSmoothPath(line.map(pt), false)}"/>`);

  // Windways: the beak's end, one mark per chamber, red where to blow.
  const blownIdx = chambers.map((_, ci) => fgChamberState(ctx, ci).blown);
  if (!multi) {
    const [p, q] = G.windway.map(pt);
    parts.push(`<path class="fg-windway ${blownIdx[0] ? 'fg-blow' : ''}" d="M ${p[0]} ${p[1]} L ${q[0]} ${q[1]}"/>`);
  } else {
    const [p, q] = G.beak.map(pt);
    const n = chambers.length;
    for (let i = 0; i < n; i++) {
      const t0 = (i + 0.15) / n, t1 = (i + 0.85) / n;
      const a = [p[0] + (q[0] - p[0]) * t0, p[1] + (q[1] - p[1]) * t0];
      const b = [p[0] + (q[0] - p[0]) * t1, p[1] + (q[1] - p[1]) * t1];
      parts.push(`<path class="fg-windway ${blownIdx[i] ? 'fg-blow' : ''}" d="M ${a[0]} ${a[1]} L ${b[0]} ${b[1]}"/>`);
    }
  }
  const blowing = blownIdx.map((b, i) => (b ? i : -1)).filter(i => i >= 0);
  if (blowing.length && multi && size !== 'mini') {
    const text = blowing.length > 1 ? 'blow both' : `blow ${blowing[0] + 1}`;
    const [bx, by] = pt(G.beak[1]);
    parts.push(`<text class="fg-blow-label" x="${bx + 8}" y="${by + 4}">${text}</text>`);
  }

  chambers.forEach((ch, ci) => {
    const { blown, f, states } = fgChamberState(ctx, ci);
    const rel = relativeSizes(ch, ctx.a4, { fromNotes: inst.kind === 'scale' });
    const sized = inst.kind === 'scale' || ch.holes.some(h => h.rel > 0 || h.sizeMm > 0);
    const g = [];
    const seen = {};
    if (multi && ci > 0 && size !== 'mini') {
      g.push(`<text class="fg-row-label" x="${pageX(424)}" y="${pageY(G.rows[Math.min(ci, 3) - 1])}">${ci + 1}</text>`);
    }
    ch.holes.forEach((h, i) => {
      const nth = h.sub ? 0 : (seen[h.finger] = (seen[h.finger] ?? -1) + 1);
      const group = ch.holes.filter(x => x.finger === h.finger && !x.sub && x.side === h.side);
      let x, y, slot;
      if (h.side === 'bottom') {
        [x, y, slot] = G.thumbs[h.finger] ?? G.thumbs.LT;
      } else if (h.sub) {
        [x, y, slot] = G.sub[h.finger] ?? (() => { const m = G.holes[h.finger] ?? G.holes.R1; return [m[0] + m[2] * 1.4, m[1] + m[2] * 1.2, m[2] * 0.5]; })();
      } else if (multi && ci > 0) {
        const c = G.col[h.finger] ?? G.col.R1;
        [x, y, slot] = [c[0], G.rows[Math.min(ci, 3) - 1], c[1]];
      } else {
        [x, y, slot] = G.holes[h.finger] ?? G.holes.R1;
      }
      // A finger with several holes (a hole split because it was too big, or
      // the pinky's pair on a chart): the traced pair spot if there is one,
      // else a small cluster around the finger's place.
      if (!h.sub && group.length > 1 && nth > 0) {
        const pair = !multi && ci === 0 ? G.pair?.[h.finger] : null;
        if (pair && nth === 1) [x, y, slot] = pair;
        else { x += nth * slot * 1.3; y += nth * slot * 0.6; }
      }
      let r = slot;
      if (sized) r = Math.max(2.5, Math.min(slot * 1.35, G.maxSlot * (rel[i] ?? 1) / Math.sqrt(group.length || 1)));
      fgHoleParts(g, {
        x: pageX(x), y: pageY(y), r: r * G.s, state: states[i], hole: h, index: i, editable: ctx.editable,
        moves: ctx.moves, changedOk: !!f, size, showFingers: ctx.showFingers, showSizes: ctx.showSizes,
        labelled: nth === 0,
      });
    });
    parts.push(`<g class="fg-chamber ${blown ? '' : 'fg-dim'}">${g.join('')}</g>`);
  });

  const bottom = pageY(G.bottom);
  return { parts, bodyBottom: bottom + 6 };
}

// A bought ocarina drawn on its own photo: each hole where it was marked,
// sized from its calibration, thumb holes in a strip underneath.
function fgPhotoParts(ctx) {
  const { chambers, size, inst } = ctx;
  const ch = chambers[0];
  const aspect = inst.photo?.aspect ?? 1.6;
  const pad = 14;
  let w = FG_W - 2 * pad, h = w / aspect;
  if (h > 230) { h = 230; w = h * aspect; }
  const x0 = (FG_W - w) / 2, y0 = pad;
  const hasThumbs = ch.holes.some(hh => hh.side === 'bottom');
  const { f, states } = fgChamberState(ctx, 0);
  const rel = relativeSizes(ch, ctx.a4, { fromNotes: false });
  const g = [];
  g.push(inst.photo?.src
    ? `<image class="fg-photo" href="${inst.photo.src}" x="${x0}" y="${y0}" width="${w}" height="${h}" preserveAspectRatio="none"/>`
      + `<rect class="fg-photo-frame" x="${x0}" y="${y0}" width="${w}" height="${h}" rx="8"/>`
    : `<rect class="fg-body" x="${x0}" y="${y0}" width="${w}" height="${h}" rx="24"/>`);
  const sy = y0 + h + 8;
  if (hasThumbs) {
    g.push(`<rect class="fg-strip" x="60" y="${sy}" width="${FG_W - 120}" height="${FG_STRIP_H - 6}" rx="6"/>`);
    if (size === 'large') g.push(`<text class="fg-strip-label" x="${FG_W / 2}" y="${sy + FG_STRIP_H / 2 - 2}">underside</text>`);
  }
  const under = ch.holes.filter(hh => hh.side === 'bottom');
  ch.holes.forEach((hole, i) => {
    let x, y;
    const spot = holeSpot(inst, i);
    if (hole.side === 'bottom' || !spot) {
      const k = under.indexOf(hole);
      x = FG_THUMB_X[hole.finger] ?? (FG_W / 2 + (k - (under.length - 1) / 2) * 40);
      y = sy + (FG_STRIP_H - 6) / 2;
    } else {
      x = x0 + spot.x * w;
      y = y0 + spot.y * h;
    }
    // Sizes from the calibration; a chart's holes have none: sub-holes small.
    const r = hole.rel > 0 ? Math.max(6, 13 * rel[i]) : hole.sub ? 6 : 10;
    fgHoleParts(g, { x, y, r, state: states[i], hole, index: i, editable: ctx.editable, moves: ctx.moves, changedOk: !!f, size, photo: hole.side !== 'bottom' && !!spot,
      showFingers: ctx.showFingers, showSizes: ctx.showSizes, labelled: true });
  });
  return { parts: [`<g class="fg-chamber">${g.join('')}</g>`], bodyBottom: sy + (hasThumbs ? FG_STRIP_H : 0) };
}

// Pendants and flutes (tube): the simpler flat layouts.
function fgFlatParts(ctx, tube) {
  const { chambers, size, inst } = ctx;
  const geo = tube ? FG_TUBE : FG_PENDANT;
  const hasThumbs = chambers.some(c => c.holes.some(h => h.side === 'bottom'));
  const pad = 22;
  const chamberH = geo.bodyH + (hasThumbs ? FG_STRIP_H : 0) + 14;
  const parts = [];
  chambers.forEach((ch, ci) => {
    const y0 = pad + ci * chamberH;
    const { blown, f, states } = fgChamberState(ctx, ci);
    const rel = relativeSizes(ch, ctx.a4, { fromNotes: inst.kind === 'scale' });
    const g = [];
    const style = tube ? fgFluteStyle(inst) : null;
    const tubeXY = tube ? fgTubePositions(ch.holes, y0, style) : null;
    if (tube) {
      g.push(fgFluteBody(style, y0, blown));
    } else {
      g.push(`<ellipse class="fg-body" cx="${FG_W / 2}" cy="${y0 + geo.bodyH / 2}" rx="${FG_W / 2 - 60}" ry="${geo.bodyH / 2}"/>`);
      g.push(`<rect class="fg-mouth ${blown ? 'fg-blow' : ''}" x="${FG_W / 2 - 13}" y="${y0 - 4}" width="26" height="18" rx="4"/>`);
    }
    if (hasThumbs) {
      const sy = y0 + geo.bodyH + 6;
      g.push(`<rect class="fg-strip" x="60" y="${sy}" width="${FG_W - 120}" height="${FG_STRIP_H - 6}" rx="6"/>`);
      if (size === 'large') g.push(`<text class="fg-strip-label" x="${FG_W / 2}" y="${sy + FG_STRIP_H / 2 - 2}">underside</text>`);
    }
    const seen = {};
    ch.holes.forEach((h, i) => {
      const nth = h.sub ? 0 : (seen[h.finger] = (seen[h.finger] ?? -1) + 1);
      const sameFinger = ch.holes.filter(x => x.finger === h.finger && !x.sub);
      const split = !h.sub && sameFinger.length > 1;
      let x, y;
      if (h.side === 'bottom') { x = FG_THUMB_X[h.finger] ?? FG_W / 2; y = y0 + geo.bodyH + 6 + (FG_STRIP_H - 6) / 2; }
      else if (tube) [x, y] = tubeXY[i];
      else { [x, y] = geo.pos[h.finger] ?? [FG_W / 2, geo.bodyH / 2]; y += y0; }
      if (h.x != null && h.y != null) { x = h.x; y = y0 + h.y; }
      if (split) y += (sameFinger.indexOf(h) - (sameFinger.length - 1) / 2) * (16 / Math.max(1, sameFinger.length - 1));
      if (h.sub) { x += 13; y += 15; }
      const r0 = Math.max(4, (split ? 18 / sameFinger.length : 13) * rel[i] * (h.sub && !(h.rel > 0) ? 0.5 : 1));
      // Flute holes sit inside the tube's width.
      // On a real flute the finger holes are about a third of the tube's width.
      const r = tube ? Math.min(r0, 5.5) : r0;
      fgHoleParts(g, { x, y, r, state: states[i], hole: h, index: i, editable: ctx.editable, moves: ctx.moves, changedOk: !!f, size, wood: tube,
        showFingers: ctx.showFingers, showSizes: ctx.showSizes, labelled: nth === 0 });
    });
    parts.push(`<g class="fg-chamber ${blown ? '' : 'fg-dim'}">${g.join('')}</g>`);
  });
  return { parts, bodyBottom: pad + chambers.length * chamberH };
}
