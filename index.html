<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handpan Chords</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Handpan">
  <meta name="theme-color" content="#1a3828">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

:root {
  --bg: #090f0d;
  --surface: #0d1a16;
  --card: #112018;
  --border: #1c3828;
  --muted: #4d7560;
  --text: #b8d0c4;
  --heading: #dff0e8;
  --primary: #CD4C38;
  --primary-hover: #d85a44;
  --primary-light: rgba(205,76,56,0.12);
  --note-rest-bg: #162c22;
  --note-rest-text: #5a9878;
  --note-active-bg: #CD4C38;
  --note-active-text: #fff;
  --note-playing-bg: #e8703a;
  --note-empty-border: #224838;
  --radius: 4px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Poppins', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  min-height: 100vh;
}

#app { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

/* Header */
.app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.app-title { font-size: 20px; font-weight: 700; color: var(--heading); letter-spacing: -0.02em; }
.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.breadcrumb a { color: var(--primary); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { color: var(--primary-hover); text-decoration: underline; }

/* Buttons */
.btn {
  padding: 8px 16px; border-radius: var(--radius); border: none;
  font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.12s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary {
  background: var(--card); color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon {
  padding: 4px 10px; background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer; color: var(--text);
  font-family: inherit; font-size: 16px; line-height: 1.4;
}
.btn-icon:hover { border-color: var(--primary); color: var(--primary); }

/* Filter chips — square-first (herbe design system) */
.pills { display: flex; flex-wrap: wrap; gap: 5px; }
.pill {
  padding: 4px 10px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--card); color: var(--muted); font-family: inherit; font-size: 12px;
  font-weight: 500; cursor: pointer; transition: all 0.12s;
}
.pill:hover { border-color: var(--primary); color: var(--primary); }
.pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }

/* Search input */
.scale-search {
  width: 100%; padding: 8px 12px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  font-family: inherit; font-size: 13px; outline: none; margin-bottom: 12px;
}
.scale-search:focus { border-color: var(--primary); }
.scale-search::placeholder { color: var(--muted); }

/* Scale selector */
.selector-controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
.scale-count { font-size: 12px; color: var(--muted); margin-top: 4px; }

.scale-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
}
.scale-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s;
}
.scale-card:hover {
  border-color: var(--primary);
  box-shadow: 0 2px 12px rgba(205,76,56,0.1);
}
.scale-card-name { font-size: 14px; font-weight: 600; color: var(--heading); margin-bottom: 2px; }
.scale-card-meta { font-size: 11px; color: var(--primary); margin-bottom: 6px; font-weight: 500; }
.scale-card-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }

/* Family badge */
.family-badge {
  display: inline-block; padding: 1px 6px; border-radius: 2px;
  background: var(--surface); border: 1px solid var(--border);
  font-size: 10px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
}

/* Layout editor */
.editor-layout {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 24px;
  align-items: start;
}
@media (max-width: 720px) { .editor-layout { grid-template-columns: 1fr; } }

.editor-sidebar { display: flex; flex-direction: column; gap: 10px; }
.editor-section {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px;
}
.editor-section-title {
  font-size: 10px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 10px;
}
.capacity-control { display: flex; align-items: center; gap: 8px; }
.capacity-val { font-size: 18px; font-weight: 700; color: var(--heading); min-width: 24px; text-align: center; }

/* Pan SVG container */
.pan-wrap { display: flex; justify-content: center; }
.pan-wrap svg { max-width: 100%; height: auto; }

/* SVG pan note base styles */
.pan-note { cursor: pointer; }
.pan-note rect, .pan-note circle, .pan-note ellipse { transition: fill 0.12s, opacity 0.12s; }
.pan-note text { pointer-events: none; transition: fill 0.12s; }
.pan-note.dimmed { opacity: 0.2; pointer-events: none; }

/* Empty slot */
.pan-note.empty rect, .pan-note.empty circle {
  fill: transparent !important;
  stroke: var(--note-empty-border) !important;
  stroke-dasharray: 5 4;
  stroke-width: 1.5;
}
.pan-note.empty text { fill: var(--note-empty-border) !important; font-size: 18px !important; }

/* Highlighted (in chord) */
.pan-note.highlight rect, .pan-note.highlight circle {
  fill: var(--note-active-bg) !important;
  stroke: #e8906e !important;
  stroke-width: 2;
}
.pan-note.highlight text { fill: var(--note-active-text) !important; font-weight: 700; }

/* Playing animation */
@keyframes noteplay { 0%,100% { opacity:1; } 50% { opacity:0.55; } }
.pan-note.playing rect, .pan-note.playing circle {
  fill: var(--note-playing-bg) !important;
  stroke: #fff !important;
  stroke-width: 2;
  filter: drop-shadow(0 0 8px rgba(232,112,58,0.6));
}
.pan-note.playing { animation: noteplay 0.3s ease-in-out 5; }
.pan-note.playing text { fill: #0a1510 !important; font-weight: 700; }

/* Chord explorer */
.explorer-layout {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 24px;
  align-items: start;
}
@media (max-width: 720px) { .explorer-layout { grid-template-columns: 1fr; } }

.chord-list {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  max-height: 75vh; overflow-y: auto;
}
.chord-list-header {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--card); z-index: 1;
}
.chord-item {
  padding: 9px 14px; display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.1s;
}
.chord-item:last-child { border-bottom: none; }
.chord-item:hover { background: var(--surface); }
.chord-item.selected {
  background: var(--primary-light);
  border-left: 3px solid var(--primary);
  padding-left: 11px;
}
.chord-item-name { font-weight: 600; color: var(--heading); font-size: 13px; }
.chord-item-type { font-size: 10px; color: var(--muted); margin-top: 1px; text-transform: uppercase; letter-spacing: 0.05em; }
.chord-count {
  font-size: 11px; background: var(--surface); color: var(--muted);
  padding: 2px 7px; border-radius: 2px; flex-shrink: 0;
}

.chord-panel {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px;
}
.chord-panel-title { font-size: 20px; font-weight: 700; color: var(--heading); margin-bottom: 3px; letter-spacing: -0.02em; }
.chord-panel-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.chord-actions { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }

.related-section { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
.related-title {
  font-size: 10px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 7px;
}
.related-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.related-chip {
  padding: 3px 9px; border-radius: var(--radius); font-size: 11px; font-weight: 600;
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.1s;
}
.related-chip:hover { border-color: var(--primary); color: var(--primary); }

/* Note picker modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 24px; max-width: 420px; width: 94%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.modal-title { font-size: 15px; font-weight: 700; color: var(--heading); margin-bottom: 4px; }
.modal-sub { font-size: 11px; color: var(--muted); margin-bottom: 14px; }
.note-octave-row { display: flex; align-items: center; gap: 4px; margin-bottom: 5px; }
.octave-label { font-size: 10px; color: var(--muted); width: 18px; text-align: right; flex-shrink: 0; }
.note-btn {
  flex: 1; padding: 6px 2px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-family: inherit; font-size: 11px; font-weight: 600;
  cursor: pointer; text-align: center; transition: all 0.1s; min-width: 0;
}
.note-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.note-btn.in-use { opacity: 0.25; cursor: not-allowed; }
.modal-actions { display: flex; justify-content: flex-end; margin-top: 14px; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--primary); color: #fff;
  padding: 9px 18px; border-radius: var(--radius);
  font-family: inherit; font-size: 13px; font-weight: 600;
  opacity: 0; transition: opacity 0.18s;
  pointer-events: none; z-index: 200;
}
.toast.show { opacity: 1; }

/* Custom name input */
.name-input {
  background: transparent; border: none; border-bottom: 1px solid var(--border);
  color: var(--heading); font-family: inherit; font-size: 14px; font-weight: 600;
  padding: 2px 4px; outline: none; min-width: 160px; max-width: 260px;
}
.name-input:focus { border-bottom-color: var(--primary); }

/* Select dropdown */
.select-input {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); font-family: inherit; font-size: 12px; padding: 5px 10px;
  cursor: pointer; outline: none;
}
.select-input:focus { border-color: var(--primary); }

/* Utility */
.flex-row { display: flex; align-items: center; gap: 8px; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.empty-state { text-align: center; padding: 32px 20px; color: var(--muted); line-height: 1.6; }
.hint { font-size: 11px; color: var(--muted); }

/* ── PWA: Saved Layouts + Favorites ──────────────────────────────────────── */
.pwa-section { margin-bottom: 20px; }
.pwa-section-title {
  font-size: 10px; font-weight: 600; color: var(--muted);
  letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px;
}
.pwa-scroll {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.pwa-scroll::-webkit-scrollbar { height: 3px; }
.pwa-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.saved-card {
  flex-shrink: 0; position: relative; min-width: 130px; max-width: 180px;
  padding: 9px 28px 9px 11px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer; transition: border-color 0.12s;
}
.saved-card:hover { border-color: var(--primary); }
.saved-card-name {
  font-size: 12px; font-weight: 600; color: var(--heading);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.saved-card-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
.saved-del {
  position: absolute; top: 5px; right: 5px;
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 13px; line-height: 1; padding: 2px 4px; border-radius: 2px;
  transition: color 0.1s;
}
.saved-del:hover { color: var(--primary); }

.fav-chip {
  flex-shrink: 0; padding: 8px 11px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer; transition: border-color 0.12s;
}
.fav-chip:hover { border-color: var(--primary); }
.fav-chip-chord { font-size: 12px; font-weight: 600; color: var(--heading); white-space: nowrap; }
.fav-chip-scale { font-size: 10px; color: var(--muted); margin-top: 1px; white-space: nowrap; }

/* Heart button in chord list */
.chord-item-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.fav-btn {
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 13px; padding: 3px; line-height: 1;
  transition: color 0.12s; flex-shrink: 0; opacity: 0.5;
}
.fav-btn:hover { color: var(--primary); opacity: 1; }
.fav-btn.active { color: var(--primary); opacity: 1; }

  </style>
</head>

// ── js/data.js ──
// Note name → semitone offset (0–11)
const NOTE_TO_SEMI = {
  'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'F':5,
  'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11
};

// Normalize to preferred flat/sharp spelling
const ENHARMONIC = { 'D#':'Eb','A#':'Bb','G#':'Ab','Db':'C#','Gb':'F#' };

const SHARP_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_NAMES  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

// Display a note using sharp or flat spelling. Accepts 'G#3' or 'G#'.
function displayNote(note, useFlats) {
  const m = note.match(/^([A-G][#b]?)(\d*)$/);
  if (!m) return note;
  const pc = NOTE_TO_SEMI[m[1]];
  if (pc === undefined) return note;
  return (useFlats ? FLAT_NAMES : SHARP_NAMES)[pc] + m[2];
}

function normalizeNote(note) {
  const m = note.match(/^([A-G][#b]?)(\d)$/);
  if (!m) return note;
  const name = ENHARMONIC[m[1]] ?? m[1];
  return name + m[2];
}

function noteToMidi(note) {
  const m = note.match(/^([A-G][#b]?)(\d)$/);
  if (!m) return 0;
  return (parseInt(m[2]) + 1) * 12 + NOTE_TO_SEMI[m[1]];
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function noteToFreq(note) { return midiToFreq(noteToMidi(note)); }

function getNoteName(note) {
  const m = note.match(/^([A-G][#b]?)/);
  return m ? m[1] : note;
}

function notePC(note) { return noteToMidi(note) % 12; }

// 12 preferred note names in chromatic order
const NOTE_NAMES = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];

// ── Chord type catalog ───────────────────────────────────────────────────────
const CHORD_TYPES = [
  // Dyads / intervals
  { id:'p5',    name:'Perfect 5th',         category:'Interval',   intervals:[0,7] },
  { id:'m3i',   name:'Minor 3rd',           category:'Interval',   intervals:[0,3] },

  { id:'hdim7', name:'Half-Dim 7th',        category:'Diminished', intervals:[0,3,6,10] },
  { id:'mmaj7', name:'Minor-Major 7th',     category:'Minor',      intervals:[0,3,7,11] },
  { id:'augM7', name:'Augmented Maj 7th',   category:'Augmented',  intervals:[0,4,8,11] },
  // 6th chords
  { id:'maj6',  name:'Major 6th',           category:'Major',      intervals:[0,4,7,9] },
  { id:'min6',  name:'Minor 6th',           category:'Minor',      intervals:[0,3,7,9] },
  // Add/extended chords
  { id:'add9',  name:'Add9',                category:'Extended',   intervals:[0,4,7,2] },
  { id:'madd9', name:'Minor Add9',          category:'Extended',   intervals:[0,3,7,2] },

  { id:'dom9',  name:'Dominant 9th',        category:'Dominant',   intervals:[0,4,7,10,2] },
];

const CHORD_CATEGORIES = ['All','Major','Minor','Suspended','Diminished','Augmented','Dominant','Extended','Interval'];

// ── Scale definitions ────────────────────────────────────────────────────────
// Confirmed by cross-referencing 2+ independent sources per scale.
// Sources: Saraz Handpans, PANArt, Planet Handpan, Xenith Handpans, Haganenote,
//          Cosmos Handpan, Isthmus Instruments, cr-sound-tech.de, healing-sounds.com
//
// Notes: standard octave convention (C4 = middle C).
// Enharmonic preference: flats for Bb Eb Ab; sharps for C# F# G#.
//
// top.notes = ring notes (tone fields), arranged as they appear on the instrument.
// bottom.notes = gu notes (typically empty in standard tuning; users add them).

const SCALES = [

  // ── KURD (Natural Minor / Aeolian: 1 2 b3 4 5 b6 b7) ────────────────────

    bottom:{ notes:[], capacity:3 } },

  { id:'G-Kurd', name:'G Kurd', family:'Kurd',
    desc:'Rich, full-bodied natural minor. Earthy and grounding.',

  { id:'A-Kurd', name:'A Kurd', family:'Kurd',
    desc:'High-pitched Kurd with a radiant, open character.',
    top:{ ding:'A3', notes:['E4','F4','G4','A4','B4','C5','D5','E5'], capacity:8 },
    bottom:{ notes:[], capacity:3 } },

  { id:'B-Kurd', name:'B Kurd', family:'Kurd',
    desc:'Low, grounding Kurd with exceptionally deep resonance.',
    top:{ ding:'B2', notes:['F#3','G3','A3','B3','C#4','D4','E4','F#4'], capacity:8 },

  { id:'C#-Kurd', name:'C# Kurd / Annaziska', family:'Kurd',
    desc:'Also sold as Annaziska. Deeply resonant with a mysterious, exotic character.',

// Build a mutable Layout from a Scale (deep copy with slot wrapping)
function createLayoutFromScale(scale) {
  return {
    id: scale.id,
    name: scale.name,
    isCustom: false,
    top: {
      ding: scale.top.ding,
      slots: scale.top.notes.map(n => ({ note: n })),
      capacity: scale.top.capacity,
    },
    bottom: {
      slots: Array.from({ length: scale.bottom.capacity }, (_, i) => ({
        note: scale.bottom.notes[i] ?? null,
      })),
      capacity: scale.bottom.capacity,
    },
  };
}

// Collect all non-null notes from a layout (ding + ring + gu)
function getAllNotes(layout) {
  const notes = [layout.top.ding];
  layout.top.slots.forEach(s => { if (s.note) notes.push(s.note); });
  layout.bottom.slots.forEach(s => { if (s.note) notes.push(s.note); });
  return notes;
}


// ── js/chords.js ──
// Returns all chords playable on this layout, deduped by root + type
function findAllChords(layout) {
  const allNotes = getAllNotes(layout);
  const pcs = allNotes.map(notePC);
  const uniquePCs = [...new Set(pcs)];
  const results = [];
  const seen = new Set();

  for (const rootPC of uniquePCs) {
    for (const type of CHORD_TYPES) {
      const key = `${rootPC}-${type.id}`;
      if (seen.has(key)) continue;

      // Octave dyad: same pitch class, different octave
      if (type.id === 'oct') {
        const rootNotes = allNotes.filter(n => notePC(n) === rootPC);
        if (rootNotes.length >= 2) {
          const sorted = [...rootNotes].sort((a, b) => noteToMidi(a) - noteToMidi(b));
          seen.add(key);
          results.push({
            id: `${getNoteName(sorted[0])}-oct`,
            rootName: getNoteName(sorted[0]),
            rootNote: sorted[0],
            type,
            notes: sorted,
            noteCount: 2,
          });
        }
        continue;
      }

      const requiredPCs = type.intervals.map(i => (rootPC + i) % 12);
      if (!requiredPCs.every(pc => uniquePCs.includes(pc))) continue;

      // Pick one representative note per required PC (lowest pitch on instrument)
      const chordNotes = requiredPCs.map(pc => {
        const matches = allNotes.filter(n => notePC(n) === pc);
        return matches.sort((a, b) => noteToMidi(a) - noteToMidi(b))[0];
      });

      const rootNote = allNotes
        .filter(n => notePC(n) === rootPC)
        .sort((a, b) => noteToMidi(a) - noteToMidi(b))[0];

      seen.add(key);
      results.push({
        id: `${getNoteName(rootNote)}-${type.id}`,
        rootName: getNoteName(rootNote),
        rootNote,
        type,
        notes: chordNotes,
        noteCount: type.intervals.length,
      });
    }
  }

  return results;
}

// Returns related chords: same type / other roots, and chords sharing 2+ notes
function getRelatedChords(chord, allChords) {
  const sameType = allChords.filter(c =>
    c.type.id === chord.type.id && c.id !== chord.id
  );

  const chordPCs = new Set(chord.notes.map(notePC));
  const sharedNotes = allChords.filter(c => {
    if (c.id === chord.id || c.type.id === chord.type.id) return false;
    const sharedCount = c.notes.filter(n => chordPCs.has(notePC(n))).length;
    return sharedCount >= 2;
  });

  return { sameType, sharedNotes };
}


// ── js/audio.js ──
let ctx = null;
let masterGain = null;

function initAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = ctx.createGain();
  masterGain.gain.value = 0.65;
  masterGain.connect(ctx.destination);
}

function playFreq(freq, startTime) {
  if (!ctx) return;
  const now = startTime ?? ctx.currentTime;

  // Fundamental + 2nd harmonic + 3rd harmonic with individual decay envelopes
  const harmonics = [
    { mult: 1,   gain: 0.65, decay: 5.0 },
    { mult: 2,   gain: 0.30, decay: 2.8 },
    { mult: 3,   gain: 0.10, decay: 1.4 },
  ];

  const reverbSend = ctx.createGain();
  reverbSend.gain.value = 0;
  reverbSend.connect(masterGain);

  harmonics.forEach(({ mult, gain, decay }) => {
    const osc = ctx.createOscillator();
    const env = ctx.createGain();

    osc.type = 'sine';
    osc.frequency.value = freq * mult;

    env.gain.setValueAtTime(0, now);
    env.gain.linearRampToValueAtTime(gain, now + 0.003);
    env.gain.exponentialRampToValueAtTime(0.0001, now + decay);

    osc.connect(env);
    env.connect(masterGain);

    // Reverb: feed fundamental into delay loop
    if (mult === 1) {
      const delayNode = ctx.createDelay(0.7);
      const feedbackGain = ctx.createGain();
      const delayEnv = ctx.createGain();

      delayNode.delayTime.value = 0.24;
      feedbackGain.gain.value = 0.26;

      delayEnv.gain.setValueAtTime(0.14, now + 0.003);
      delayEnv.gain.exponentialRampToValueAtTime(0.0001, now + 4);

      env.connect(delayNode);
      delayNode.connect(feedbackGain);
      feedbackGain.connect(delayNode);
      delayNode.connect(delayEnv);
      delayEnv.connect(masterGain);

      osc.start(now);
      osc.stop(now + 5);
    } else {
      osc.start(now);
      osc.stop(now + decay + 0.1);
    }
  });
}

function playNote(noteName) {
  if (!ctx) initAudio();
  if (ctx.state === 'suspended') ctx.resume();
  playFreq(noteToFreq(noteName));
}

function playChord(noteNames) {
  if (!ctx) initAudio();
  if (ctx.state === 'suspended') ctx.resume();
  const sorted = [...noteNames].sort((a, b) => noteToMidi(a) - noteToMidi(b));
  const now = ctx.currentTime;
  sorted.forEach((n, i) => playFreq(noteToFreq(n), now + i * 0.3));
  // Strike all together after arpeggiation
  const together = now + sorted.length * 0.3 + 0.35;
  sorted.forEach(n => playFreq(noteToFreq(n), together));
}

function playScale(noteNames) {
  if (!ctx) initAudio();
  if (ctx.state === 'suspended') ctx.resume();
  const sorted = [...noteNames].sort((a, b) => noteToMidi(a) - noteToMidi(b));
  const now = ctx.currentTime;
  sorted.forEach((n, i) => playFreq(noteToFreq(n), now + i * 0.15));
}


// ── js/pan.js ──
const PAN_SVG_ID = 'handpan-svg';

// Physical handpan ring layout (confirmed from klangzeug.de for all scales).
// Notes sorted ascending (n1=lowest, nN=highest) placed clockwise from 12 o'clock.
// For 10-ring instruments, n9+n10 go on a separate inner ring (see renderPan).
function physicalOrder(n) {
  if (n === 7)  return [6,4,2,0,1,3,5];
  if (n === 8)  return [7,6,4,2,0,1,3,5];
  if (n === 9)  return [8,6,4,2,0,1,3,5,7];
  return null;
}

// Outer ring physical order for 10-ring instruments (n1-n8, same as 8-ring).
const OUTER_8_ORDER = [7,6,4,2,0,1,3,5];

// Positions for inner ring notes — symmetric around 12 o'clock at ±45°.
function innerRingPositions(cx, cy, r) {
  const angles = [-Math.PI / 2 - Math.PI / 4, -Math.PI / 2 + Math.PI / 4];
  return angles.map(a => ({
    x: Math.round(cx + r * Math.cos(a)),
    y: Math.round(cy + r * Math.sin(a)),
  }));
}

function circlePositions(count, cx, cy, r, rotationOffset = 0) {
  return Array.from({ length: count }, (_, i) => {
    const angle = (i * 2 * Math.PI / count) - Math.PI / 2 + rotationOffset;
    return {
      x: Math.round(cx + r * Math.cos(angle)),
      y: Math.round(cy + r * Math.sin(angle)),
    };
  });
}

// All tone fields are circles. r controls size; lower notes get larger circles.
function noteSlotSvg(x, y, note, extraClasses, noteId, r = 24, useFlats = false) {
  const isEmpty = !note;
  const allClasses = ['pan-note', ...extraClasses.split(' ').filter(Boolean)].join(' ');
  const noteAttr = note ? ` data-note="${note}"` : '';

  let textHtml;
  if (isEmpty) {
    textHtml = `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central"
      font-family="system-ui,sans-serif" font-size="${Math.round(r * 0.7)}" font-weight="600"
      fill="var(--note-rest-text)">+</text>`;
  } else {
    const displayed = displayNote(note, useFlats);
    const name = displayed.replace(/\d+$/, '');
    const oct = (displayed.match(/\d+$/) ?? [''])[0];
    const nameFontSize = Math.max(8, Math.round((name.length > 1 ? 12 : 14) * r / 26));
    const octFontSize  = Math.max(6, Math.round(9 * r / 26));
    const nameY = y - Math.round(r * 0.14);
    const octY  = y + Math.round(r * 0.40);
    textHtml = `<text x="${x}" y="${nameY}" text-anchor="middle" dominant-baseline="auto"
      font-family="system-ui,sans-serif" font-size="${nameFontSize}" font-weight="600"
      fill="var(--note-rest-text)">${name}</text>
<text x="${x}" y="${octY}" text-anchor="middle" dominant-baseline="auto"
      font-family="system-ui,sans-serif" font-size="${octFontSize}" font-weight="400"
      fill="var(--note-rest-text)" opacity="0.5">${oct}</text>`;
  }

  return `<g class="${allClasses}" data-note-id="${noteId}"${noteAttr}>
  <circle cx="${x}" cy="${y}" r="${r}" fill="var(--note-rest-bg)" stroke="var(--border)" stroke-width="1.5"/>
  ${textHtml}
</g>`;
}

// Radius for a ring note at sorted index i (0=lowest, n-1=highest).
// Lower notes are physically larger on a real handpan.
function ringNoteRadius(sortedIndex, total) {
  const minR = 18, maxR = 26;
  const t = total <= 1 ? 0 : sortedIndex / (total - 1);
  return Math.round(maxR - (maxR - minR) * t);
}

function renderBottomShell(layout, opts = {}) {
  const { highlightNotes = [], useFlats = false } = opts;
  const cx = 250, cy = 240;
  const hlSet = new Set(highlightNotes);
  const guCount = Math.max(layout.bottom.capacity, layout.bottom.slots.length);

  let svg = `<svg id="${PAN_SVG_ID}" viewBox="0 0 500 490" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="panGrad" cx="38%" cy="32%">
      <stop offset="0%" stop-color="#1a3828"/>
      <stop offset="60%" stop-color="#0d2018"/>
      <stop offset="100%" stop-color="#060f0c"/>
    </radialGradient>
  </defs>
  <!-- Pan body -->
  <circle cx="${cx}" cy="${cy}" r="220" fill="url(#panGrad)" stroke="#2a5040" stroke-width="2"/>
  <!-- Outer groove ring -->
  <circle cx="${cx}" cy="${cy}" r="195" fill="none" stroke="#1c3828" stroke-width="1" stroke-dasharray="3 7"/>
  <!-- Gu ring guide -->
  <circle cx="${cx}" cy="${cy}" r="145" fill="none" stroke="#183028" stroke-width="1" opacity="0.5"/>
  <!-- Inner groove ring -->
  <circle cx="${cx}" cy="${cy}" r="80" fill="none" stroke="#1c3828" stroke-width="1" stroke-dasharray="2 5" opacity="0.6"/>
  <!-- Center hole -->
  <circle cx="${cx}" cy="${cy}" r="50" fill="#030a06" stroke="#1c3828" stroke-width="2"/>
  <circle cx="${cx}" cy="${cy}" r="47" fill="none" stroke="#0a1a12" stroke-width="2" opacity="0.7"/>
`;

  if (guCount > 0) {
    const guPos = circlePositions(guCount, cx, cy, 145, 0);
    for (let i = 0; i < guCount; i++) {
      const slot = layout.bottom.slots[i] ?? { note: null };
      const isHighlighted = !!(slot.note && hlSet.has(slot.note));
      const cls = ['gu', !slot.note ? 'empty' : '', isHighlighted ? 'highlight' : ''].filter(Boolean).join(' ');
      svg += noteSlotSvg(guPos[i].x, guPos[i].y, slot.note, cls, `gu-${i}`, 24, useFlats);
    }
  }

  svg += '</svg>';
  return svg;
}

function renderPan(layout, opts = {}) {
  const { shellMode = 'both', highlightNotes = [], rotated = false, useFlats = false } = opts;

  // Bottom shell gets its own dedicated view.
  if (shellMode === 'bottom') return renderBottomShell(layout, opts);

  const cx = 250, cy = 240;
  const hlSet = new Set(highlightNotes);

  const dimTop = shellMode === 'bottom';
  const dimBottom = shellMode === 'top';

  function noteClass(note, isTopShell) {
    const classes = [];
    if (!note) classes.push('empty');
    else if (hlSet.has(note)) classes.push('highlight');
    if (isTopShell && dimTop) classes.push('dimmed');
    if (!isTopShell && dimBottom) classes.push('dimmed');
    return classes.join(' ');
  }

  // 10-ring scales split into outer (n1-n8) + inner (n9, n10) rings.
  const totalRingSlots = layout.top.slots.length;
  const hasInnerRing = !layout.isCustom && totalRingSlots >= 10;

  let svg = `<svg id="${PAN_SVG_ID}" viewBox="0 0 500 490" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="panGrad" cx="38%" cy="32%">
      <stop offset="0%" stop-color="#1a3828"/>
      <stop offset="60%" stop-color="#0d2018"/>
      <stop offset="100%" stop-color="#060f0c"/>
    </radialGradient>
    <radialGradient id="innerGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#183028"/>
      <stop offset="100%" stop-color="#0d1e18"/>
    </radialGradient>
    <clipPath id="panClip">
      <circle cx="${cx}" cy="${cy}" r="218"/>
    </clipPath>
  </defs>

  <!-- Pan body -->
  <circle cx="${cx}" cy="${cy}" r="220" fill="url(#panGrad)" stroke="#2a5040" stroke-width="2"/>
  <!-- Outer groove ring -->
  <circle cx="${cx}" cy="${cy}" r="195" fill="none" stroke="#1c3828" stroke-width="1" stroke-dasharray="3 7"/>
  <!-- Gu separator groove -->
  <path d="M ${cx - 90},${cy + 175} A 195,195 0 0,1 ${cx + 90},${cy + 175}"
    fill="none" stroke="#2a5040" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.9"/>
  <!-- Inner center dome -->
  <circle cx="${cx}" cy="${cy}" r="68" fill="url(#innerGrad)" stroke="#1c3828" stroke-width="1.5"/>
  <!-- Outer tone field guide ring -->
  <circle cx="${cx}" cy="${cy}" r="145" fill="none" stroke="#183028" stroke-width="1" opacity="0.5"/>
  ${hasInnerRing ? `<!-- Inner tone field guide ring -->
  <circle cx="${cx}" cy="${cy}" r="100" fill="none" stroke="#183028" stroke-width="1" stroke-dasharray="3 5" opacity="0.4"/>` : ''}
`;

  // Ding (center)
  const dingNote = layout.top.ding;
  const dingClass = [
    !dingNote ? 'empty' : '',
    dingNote && hlSet.has(dingNote) ? 'highlight' : '',
    dimTop ? 'dimmed' : '',
  ].filter(Boolean).join(' ');
  svg += noteSlotSvg(cx, cy, dingNote, `ding ${dingClass}`, 'ding', 30, useFlats);

  if (hasInnerRing) {
    // 10-ring: outer ring gets 8 lower notes (n1-n8), inner ring gets n9 and n10.
    const outerSlots = OUTER_8_ORDER.map(i => layout.top.slots[i] ?? { note: null });
    const rotationRad = rotated ? Math.PI * (8 - 9) / 8 : 0;
    const outerPos = circlePositions(8, cx, cy, 145, rotationRad);
    for (let i = 0; i < 8; i++) {
      const slot = outerSlots[i];
      const sortedIdx = OUTER_8_ORDER[i]; // position in original slots array (0-7)
      const r = ringNoteRadius(sortedIdx, totalRingSlots);
      svg += noteSlotSvg(outerPos[i].x, outerPos[i].y, slot.note,
        `ring ${noteClass(slot.note, true)}`, `ring-${sortedIdx}`, r, useFlats);
    }
    // Inner ring: n9 (index 8) and n10 (index 9)
    const innerPos = innerRingPositions(cx, cy, 100);
    for (let i = 0; i < Math.min(2, totalRingSlots - 8); i++) {
      const sortedIdx = 8 + i;
      const slot = layout.top.slots[sortedIdx] ?? { note: null };
      const r = ringNoteRadius(sortedIdx, totalRingSlots);
      svg += noteSlotSvg(innerPos[i].x, innerPos[i].y, slot.note,
        `ring ${noteClass(slot.note, true)}`, `ring-${sortedIdx}`, r, useFlats);
    }
  } else {
    // Standard: all ring slots on one ring.
    const ringCount = Math.max(layout.top.capacity, totalRingSlots);
    const rotationRad = rotated ? Math.PI * (ringCount - 9) / ringCount : 0;
    const ringPos = circlePositions(ringCount, cx, cy, 145, rotationRad);

    let ringSlots = layout.top.slots;
    let sortedIndices = null;
    if (!layout.isCustom) {
      const order = physicalOrder(totalRingSlots);
      if (order) {
        ringSlots = order.map(i => layout.top.slots[i] ?? { note: null });
        sortedIndices = order;
      }
    }

    for (let i = 0; i < ringCount; i++) {
      const slot = ringSlots[i] ?? { note: null };
      const pos = ringPos[i];
      const r = sortedIndices
        ? ringNoteRadius(sortedIndices[i], totalRingSlots)
        : 22;
      svg += noteSlotSvg(pos.x, pos.y, slot.note, `ring ${noteClass(slot.note, true)}`, `ring-${i}`, r, useFlats);
    }
  }

  // Gu (bottom shell) — placed inside the pan body, lower zone
  const guCount = Math.max(layout.bottom.capacity, layout.bottom.slots.length);
  if (guCount > 0) {
    const guR = 20;
    const guY = cy + 197; // inside the pan (pan bottom edge = cy+220)
    const guSpacing = Math.min(60, guCount > 1 ? 180 / (guCount - 1) : 0);
    const guStartX = guCount === 1 ? cx : cx - ((guCount - 1) * guSpacing) / 2;

    // Clip group so circles don't bleed outside the pan body
    svg += `<g clip-path="url(#panClip)">`;
    for (let i = 0; i < guCount; i++) {
      const slot = layout.bottom.slots[i] ?? { note: null };
      const gx = guCount === 1 ? cx : guStartX + i * guSpacing;
      svg += noteSlotSvg(gx, guY, slot.note, `gu ${noteClass(slot.note, false)}`, `gu-${i}`, guR, useFlats);
    }
    svg += `</g>`;
  }

  svg += '</svg>';
  return svg;
}

// Update highlight using full note strings (with octave)
function updatePanHighlight(noteNames) {
  const svg = document.getElementById(PAN_SVG_ID);
  if (!svg) return;
  const nameSet = new Set(noteNames);
  svg.querySelectorAll('.pan-note').forEach(el => {
    if (el.classList.contains('empty')) return;
    const note = el.dataset.note;
    el.classList.toggle('highlight', !!(note && nameSet.has(note)));
  });
}

function updatePanShellMode(mode) {
  const svg = document.getElementById(PAN_SVG_ID);
  if (!svg) return;
  svg.querySelectorAll('.pan-note').forEach(el => {
    const isTop = el.classList.contains('ding') || el.classList.contains('ring');
    const isBottom = el.classList.contains('gu');
    if (mode === 'top') el.classList.toggle('dimmed', isBottom);
    else if (mode === 'bottom') el.classList.toggle('dimmed', isTop);
    else el.classList.remove('dimmed');
  });
}

// Briefly add 'playing' class — matches against full note strings (with octave)
function updatePanPlaying(noteNames) {
  const svg = document.getElementById(PAN_SVG_ID);
  if (!svg) return;
  const nameSet = new Set(noteNames);
  svg.querySelectorAll('.pan-note').forEach(el => {
    if (el.classList.contains('empty')) return;
    const note = el.dataset.note;
    if (note && nameSet.has(note)) {
      el.classList.add('playing');
      setTimeout(() => el.classList.remove('playing'), 2200);
    }
  });
}


// ── js/storage.js ──
const LAYOUTS_KEY = 'hp-layouts';
const FAVS_KEY = 'hp-favorites';

function safeParse(key) {
  try { return JSON.parse(localStorage.getItem(key) || '[]'); }
  catch { return []; }
}

function getSavedLayouts() { return safeParse(LAYOUTS_KEY); }

function saveLayout(entry) {
  const all = getSavedLayouts();
  const idx = all.findIndex(l => l.id === entry.id);
  if (idx >= 0) all[idx] = entry;
  else all.unshift(entry);
  localStorage.setItem(LAYOUTS_KEY, JSON.stringify(all));
}

function deleteLayout(id) {
  localStorage.setItem(LAYOUTS_KEY,
    JSON.stringify(getSavedLayouts().filter(l => l.id !== id)));
}

function getFavorites() { return safeParse(FAVS_KEY); }

// Adds if not present, removes if present. Returns true = added.
function toggleFavorite(fav) {
  const all = getFavorites();
  const idx = all.findIndex(f => f.id === fav.id);
  if (idx >= 0) all.splice(idx, 1);
  else all.unshift(fav);
  localStorage.setItem(FAVS_KEY, JSON.stringify(all));
  return idx < 0;
}

function isFavorite(id) {
  return getFavorites().some(f => f.id === id);
}

// ── State ────────────────────────────────────────────────────────────────────
const state = {
  view: 'selector',        // 'selector' | 'editor' | 'chords'
  layout: null,            // current Layout object
  shellMode: 'both',       // 'top' | 'bottom' | 'both'
  ringRotated: false,      // false = standard; true = rotated half-slot
  noteCountFilter: 'all',     // 'all' | '9' | '10' | '11+'
  scaleSearch: '',            // filter text for scale selector
  selectedChord: null,        // ChordResult or null
  chords: [],                 // computed from layout
  chordFilter: { category: 'All', root: 'All' },
  useFlats: false,           // false = sharp (C#, F#, G#…); true = flat (Db, Gb, Ab…)
  savedLayouts: getSavedLayouts(),
  favorites: getFavorites(),
  chordCountFilter: 'simple', // 'simple' (≤3 notes) | 'all'
  pendingSlot: null,       // { shell: 'top'|'bottom'|'ding', index: number }
};

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (state.view === 'selector') app.innerHTML = viewSelector();
  else if (state.view === 'editor') app.innerHTML = viewEditor();
  else if (state.view === 'chords') app.innerHTML = viewChords();
}

// ── View 1: Scale Selector ───────────────────────────────────────────────────
function viewSelector() {
  const q = state.scaleSearch.trim().toLowerCase();
  const filtered = SCALES.filter(s => {
    const total = 1 + s.top.notes.length + s.bottom.notes.length;
    if (state.noteCountFilter === '9' && total !== 9) return false;
    if (state.noteCountFilter === '10' && total !== 10) return false;
    if (state.noteCountFilter === '11+' && total < 11) return false;
    if (q && !s.name.toLowerCase().includes(q) && !s.family.toLowerCase().includes(q) && !s.desc.toLowerCase().includes(q)) return false;
    return true;
  });

  const { savedLayouts, favorites, useFlats } = state;

  const savedSection = savedLayouts.length === 0 ? '' : `
    <div class="pwa-section">
      <div class="pwa-section-title">My Layouts</div>
      <div class="pwa-scroll">
        ${savedLayouts.map(l => `
          <div class="saved-card" data-action="load-saved" data-id="${escHtml(l.id)}">
            <div class="saved-card-name">${escHtml(l.name)}</div>
            <div class="saved-card-meta">${l.noteCount} notes</div>
            <button class="saved-del" data-action="delete-saved" data-id="${escHtml(l.id)}" title="Remove">×</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  const favsSection = favorites.length === 0 ? '' : `
    <div class="pwa-section">
      <div class="pwa-section-title">My Chords</div>
      <div class="pwa-scroll">
        ${favorites.map(f => `
          <div class="fav-chip" data-action="open-favorite" data-id="${escHtml(f.id)}">
            <div class="fav-chip-chord">${escHtml(displayNote(f.rootName, useFlats))} ${escHtml(f.typeName)}</div>
            <div class="fav-chip-scale">${escHtml(f.scaleName)}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  return `
    <div class="app-header">
      <div class="app-title">Handpan Chords</div>
    </div>
    <div class="selector-controls">
      <input class="scale-search" id="scale-search-input" type="text"
        placeholder="Search scales by name or family…"
        value="${escHtml(state.scaleSearch)}">
      <div class="pills">
        ${['all', '9', '10', '11+'].map(f => `
          <button class="pill ${state.noteCountFilter === f ? 'active' : ''}"
            data-action="filter-notes" data-val="${f}">
            ${f === 'all' ? 'All' : f + ' notes'}
          </button>
        `).join('')}
        <button class="pill ${useFlats ? 'active' : ''}"
          data-action="toggle-flats" title="Switch between sharp (C#) and flat (Db) notation">
          ♭ Flats
        </button>
      </div>
    </div>
    ${savedSection}${favsSection}
    <div class="scale-grid">
      ${filtered.length === 0
        ? '<div class="empty-state">No scales match your search</div>'
        : filtered.map(s => `
          <div class="scale-card" data-action="select-scale" data-id="${s.id}">
            <div class="family-badge">${s.family}</div>
            <div class="scale-card-name">${s.name}</div>
            <div class="scale-card-meta">${1 + s.top.notes.length} notes · ${displayNote(s.top.ding, useFlats)} ding</div>
            <div class="scale-card-desc">${s.desc}</div>
          </div>
        `).join('')
      }
    </div>
  `;
}

          <div class="hint" style="margin-top:6px">
            ${topFilled + 1} notes total (incl. ding) · ${topEmpty} empty slot${topEmpty !== 1 ? 's' : ''}
          </div>
        </div>

        <div class="editor-section">
          <div class="editor-section-title">Bottom shell — gu</div>
          <div class="capacity-control">
            <button class="btn-icon" data-action="adjust-capacity" data-shell="bottom" data-delta="-1"
              ${layout.bottom.slots.every(s => !s.note) && layout.bottom.capacity === 0 ? 'disabled' : ''}>−</button>
            <span class="capacity-val">${layout.bottom.capacity}</span>
            <button class="btn-icon" data-action="adjust-capacity" data-shell="bottom" data-delta="1">+</button>
          </div>
          <div class="hint" style="margin-top:6px">
            ${bottomFilled} note${bottomFilled !== 1 ? 's' : ''} · ${layout.bottom.capacity - bottomFilled} empty
          </div>
        </div>

        <button class="btn btn-primary" data-action="go-chords" style="width:100%;margin-top:4px">
          Find Chords →
        </button>
      </div>
    </div>

    ${state.pendingSlot ? renderNotePicker() : ''}
  `;
}

function renderNotePicker() {
  const allNotes = getAllNotes(state.layout);
  const usedPCs = new Set(allNotes.map(notePC));
  const octaves = [2, 3, 4, 5];

  const rows = octaves.map(oct => {
    const cols = NOTE_NAMES.map((name, i) => {
      const noteStr = `${name}${oct}`;
      const inUse = usedPCs.has(i); // NOTE_NAMES index = pitch class
      const label = displayNote(name, state.useFlats);
      return `<button class="note-btn ${inUse ? 'in-use' : ''}"
        data-action="pick-note" data-note="${noteStr}"
        ${inUse ? 'disabled' : ''}>${label}</button>`;
    }).join('');
    return `<div class="note-octave-row">
      <span class="octave-label">${oct}</span>
      ${cols}
    </div>`;
  }).join('');

  const slotLabel = state.pendingSlot.shell === 'ding'
    ? 'ding (center)'
    : `${state.pendingSlot.shell === 'top' ? 'ring' : 'gu'} slot ${state.pendingSlot.index + 1}`;

  return `
    <div class="modal-overlay" data-action="close-picker">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-title">Choose a note</div>
        <div class="modal-sub">For ${slotLabel} · Grayed notes already on instrument</div>
        ${rows}
        <div class="modal-actions">
          <button class="btn btn-secondary btn-sm" data-action="close-picker">Cancel</button>
        </div>
      </div>
    </div>
  `;
}

// ── View 3: Chord Explorer ───────────────────────────────────────────────────
function viewChords() {
  const { chords, chordFilter, selectedChord, layout } = state;
  const uf = state.useFlats;

  // Root options: NOTE_NAMES[i] is at PC i — filter by which PCs have chords.
  const ROOT_ORDER = NOTE_NAMES;
  const usedRootPCs = new Set(chords.map(c => notePC(c.rootNote)));
  const roots = ['All', ...ROOT_ORDER.filter((_, i) => usedRootPCs.has(i))];

  // Apply filters — compare root by PC to handle G# ↔ Ab equivalence.
  const filtered = chords.filter(c => {
    if (state.chordCountFilter === 'simple' && c.noteCount > 3) return false;
    if (chordFilter.category !== 'All' && c.type.category !== chordFilter.category) return false;
    if (chordFilter.root !== 'All') {
      const filterPC = ROOT_ORDER.indexOf(chordFilter.root);
      if (notePC(c.rootNote) !== filterPC) return false;
    }
    return true;
  }).sort((a, b) => {
    const rA = notePC(a.rootNote), rB = notePC(b.rootNote);
    return rA !== rB ? rA - rB : b.noteCount - a.noteCount;
  });

  const highlightNotes = selectedChord ? selectedChord.notes : [];
  const panSvg = renderPan(layout, { shellMode: 'both', highlightNotes, rotated: state.ringRotated, useFlats: uf });

  let relatedHtml = '';
  if (selectedChord) {
    const { sameType, sharedNotes } = getRelatedChords(selectedChord, chords);
    const sameTypeChips = sameType.map(c =>
      `<span class="related-chip" data-action="select-chord" data-id="${c.id}">
        ${displayNote(c.rootName, uf)} ${c.type.name}
      </span>`
    ).join('');
    const sharedChips = sharedNotes.slice(0, 10).map(c =>
      `<span class="related-chip" data-action="select-chord" data-id="${c.id}">
        ${displayNote(c.rootName, uf)} ${c.type.name}
      </span>`
    ).join('');

    relatedHtml = `
      <div class="related-section">
        ${sameType.length > 0 ? `
          <div class="related-title">Same type, other roots</div>
          <div class="related-chips">${sameTypeChips}</div>
        ` : ''}
        ${sharedNotes.length > 0 ? `
          <div class="related-title mt-12">Shares 2+ notes</div>
          <div class="related-chips">${sharedChips}</div>
        ` : ''}
      </div>
    `;
  }

  return `
    <div class="app-header">
      <div class="breadcrumb">
        <a data-action="back-selector">← Scales</a>
        <span>/</span>
        <a data-action="back-editor">← ${escHtml(layout.name)}</a>
        <span>/</span>
        <span>Chords</span>
      </div>
      <button class="btn btn-secondary btn-sm" data-action="copy-url"
        style="margin-left:auto;flex-shrink:0">
        Copy URL
      </button>
    </div>

    <div class="explorer-layout">
      <div class="chord-list">
        <div class="chord-list-header">
          <div class="pills" style="margin-bottom:8px">
            <button class="pill ${state.chordCountFilter === 'simple' ? 'active' : ''}"
              data-action="filter-chord-count" data-val="simple">2–3 notes</button>
            <button class="pill ${state.chordCountFilter === 'all' ? 'active' : ''}"
              data-action="filter-chord-count" data-val="all">All</button>
            <button class="pill ${uf ? 'active' : ''}"
              data-action="toggle-flats" title="Switch between sharp (C#) and flat (Db) notation">
              ♭ Flats
            </button>
          </div>
          <div class="pills" style="margin-bottom:8px">
            ${CHORD_CATEGORIES.map(cat => `
              <button class="pill ${chordFilter.category === cat ? 'active' : ''}"
                data-action="filter-category" data-cat="${cat}">${cat}</button>
            `).join('')}
          </div>
          <div class="flex-row" style="margin-top:8px">
            <select class="select-input" data-action="filter-root">
              ${roots.map(r => `<option value="${r}" ${chordFilter.root === r ? 'selected' : ''}>
                ${r === 'All' ? 'All' : displayNote(r, uf)}
              </option>`).join('')}
            </select>
            <span class="hint">${filtered.length} chord${filtered.length !== 1 ? 's' : ''}</span>
          </div>
        </div>
        ${(() => {
          const layoutId = layout.isCustom ? (layout.savedId || layout.id) : layout.id;
          const favIds = new Set(state.favorites.map(f => f.id));
          return filtered.length === 0
            ? '<div class="empty-state">No chords match these filters</div>'
            : filtered.map(c => {
              const favId = `${layoutId}-${c.id}`;
              return `<div class="chord-item ${selectedChord?.id === c.id ? 'selected' : ''}"
                data-action="select-chord" data-id="${c.id}">
                <div>
                  <div class="chord-item-name">${displayNote(c.rootName, uf)} ${c.type.name}</div>
                  <div class="chord-item-type">${c.type.category}</div>
                </div>
                <div class="chord-item-right">
                  <button class="fav-btn ${favIds.has(favId) ? 'active' : ''}"
                    data-action="toggle-favorite" data-chord-id="${c.id}" title="Save to My Chords">♥</button>
                  <span class="chord-count">${c.noteCount}</span>
                </div>
              </div>`;
            }).join('');
        })()}
      </div>

      <div>
        <div class="pan-wrap" style="margin-bottom:8px">
          ${panSvg}
        </div>
        <div style="text-align:center;margin-bottom:16px">
          <button class="btn btn-secondary btn-sm" data-action="toggle-rotation"
            title="Rotate the ring so two lowest notes face you instead of one">
            ${state.ringRotated ? '⟳ Standard' : '⟳ Rotate'}
          </button>
        </div>
        <div class="chord-panel">
          ${selectedChord ? `
            <div class="chord-panel-title">${displayNote(selectedChord.rootName, uf)} ${selectedChord.type.name}</div>
            <div class="chord-panel-sub">
              ${selectedChord.type.category} · ${selectedChord.noteCount} notes:
              ${selectedChord.notes.map(n => displayNote(n, uf)).join(', ')}
            </div>
            <div class="chord-actions">
              <button class="btn btn-primary" data-action="play-chord">▶ Play Chord</button>
              <button class="btn btn-secondary" data-action="play-scale">▶ Play Scale</button>
            </div>
            ${relatedHtml}
          ` : `
            <div class="empty-state">
              Select a chord from the list<br>to see and hear it on the pan
            </div>
            <div class="chord-actions" style="margin-top:16px">
              <button class="btn btn-secondary" data-action="play-scale">▶ Play Scale</button>
            </div>
          `}
        </div>
      </div>
    </div>
  `;
}

// ── URL serialization ────────────────────────────────────────────────────────
function stateToHash() {
  if (!state.layout) return '';
  const chordSuffix = state.selectedChord ? `&chord=${state.selectedChord.id}` : '';

  if (!state.layout.isCustom) {
    return `#scale=${state.layout.id}${chordSuffix}`;
  }

  const topSlots = state.layout.top.slots.map(s => s.note ?? 'null').join(',');
  const bottomSlots = state.layout.bottom.slots.map(s => s.note ?? 'null').join(',');
  const params = new URLSearchParams({
    ding: state.layout.top.ding,
    top: topSlots,
    bottom: bottomSlots,
    tc: state.layout.top.capacity,
    bc: state.layout.bottom.capacity,
    name: state.layout.name,
  });
  return `#custom?${params}${chordSuffix}`;
}

function loadFromHash() {
  const hash = window.location.hash;
  if (!hash || hash === '#') return;

  let chordId = null;

  if (hash.startsWith('#scale=')) {
    const raw = hash.slice(7);
    const [scaleId, ...rest] = raw.split('&chord=');
    chordId = rest[0] || null;
    const scale = SCALES.find(s => s.id === scaleId);
    if (scale) {
      state.layout = createLayoutFromScale(scale);
      state.chords = findAllChords(state.layout);
      state.view = chordId ? 'chords' : 'editor';
    }
  } else if (hash.startsWith('#custom?')) {
    const rawParams = hash.slice(8);
    const chordMarker = rawParams.indexOf('&chord=');
    const paramStr = chordMarker >= 0 ? rawParams.slice(0, chordMarker) : rawParams;
    chordId = chordMarker >= 0 ? rawParams.slice(chordMarker + 7) : null;

    const params = new URLSearchParams(paramStr);
    const topSlots = (params.get('top') || '').split(',').map(n => ({ note: n === 'null' ? null : n }));
    const bottomSlots = (params.get('bottom') || '').split(',').map(n => ({ note: n === 'null' ? null : n }));
    state.layout = {
      id: 'custom',
      name: params.get('name') || 'Custom Layout',
      isCustom: true,
      top: {
        ding: params.get('ding') || 'D3',
        slots: topSlots,
        capacity: parseInt(params.get('tc') || '8'),
      },
      bottom: {
        slots: bottomSlots,
        capacity: parseInt(params.get('bc') || '3'),
      },
    };
    state.chords = findAllChords(state.layout);
    state.view = chordId ? 'chords' : 'editor';
  }

  if (chordId && state.chords.length) {
    state.selectedChord = state.chords.find(c => c.id === chordId) || null;
  }
}

// ── Utilities ────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function showToast(msg) {
  let toast = document.querySelector('.toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ── Bootstrap ────────────────────────────────────────────────────────────────
loadFromHash();
render();

// ── Global click delegation ───────────────────────────────────────────────────
document.addEventListener('click', e => {
  // ── Pan note click — must be checked BEFORE the data-action early return ──
  const noteEl = e.target.closest('.pan-note');
  if (noteEl && state.layout) {
    const noteId = noteEl.dataset.noteId;
    const isEmpty = noteEl.classList.contains('empty');
    const isCustom = state.layout.isCustom;

    if (!isEmpty) {
      const noteToPlay = noteEl.dataset.note;
      if (noteToPlay) {
        initAudio();
        playNote(noteToPlay);
        setTimeout(() => updatePanPlaying([noteToPlay]), 0);
      }
    }

    if (!isCustom) return;

    if (isEmpty) {
      if (noteId === 'ding') state.pendingSlot = { shell: 'ding', index: -1 };
      else if (noteId?.startsWith('ring-')) state.pendingSlot = { shell: 'top', index: parseInt(noteId.split('-')[1]) };
      else if (noteId?.startsWith('gu-')) state.pendingSlot = { shell: 'bottom', index: parseInt(noteId.split('-')[1]) };
      render();
      return;
    }

    if (noteId === 'ding') { state.pendingSlot = { shell: 'ding', index: -1 }; render(); return; }
    if (noteId?.startsWith('ring-') && (state.shellMode === 'top' || state.shellMode === 'both')) {
      const idx = parseInt(noteId.split('-')[1]);
      state.layout.top.slots[idx].note = null;
      state.chords = findAllChords(state.layout);
      render();
      return;
    }
    if (noteId?.startsWith('gu-') && (state.shellMode === 'bottom' || state.shellMode === 'both')) {
      const idx = parseInt(noteId.split('-')[1]);
      if (state.layout.bottom.slots[idx]) { state.layout.bottom.slots[idx].note = null; state.chords = findAllChords(state.layout); render(); }
      return;
    }
    return;
  }

  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  // ── Selector ──────────────────────────────────────────────────────────────
  if (action === 'filter-notes') {
    state.noteCountFilter = el.dataset.val;
    render();
    return;
  }

  if (action === 'select-scale') {
    const scale = SCALES.find(s => s.id === el.dataset.id);
    if (!scale) return;
    state.layout = createLayoutFromScale(scale);
    state.chords = findAllChords(state.layout);
    state.selectedChord = null;
    state.shellMode = 'both';
    state.chordFilter = { category: 'All', root: 'All' };
    state.view = 'editor';
    history.pushState(null, '', stateToHash());
    render();
    return;
  }

  // ── Saved layouts ─────────────────────────────────────────────────────────
  if (action === 'save-layout') {
    if (state.layout.isCustom && !state.layout.savedId) {
      state.layout.savedId = 'c-' + Date.now();
    }
    const id = state.layout.isCustom ? state.layout.savedId : state.layout.id;
    const total = 1 + state.layout.top.slots.filter(s => s.note).length
                    + state.layout.bottom.slots.filter(s => s.note).length;
    saveLayout({
      id,
      name: state.layout.name,
      noteCount: total,
      layout: JSON.parse(JSON.stringify(state.layout)),
      savedAt: Date.now(),
    });
    state.savedLayouts = getSavedLayouts();
    showToast('Saved to My Layouts');
    render();
    return;
  }

  if (action === 'load-saved') {
    const saved = state.savedLayouts.find(l => l.id === el.dataset.id);
    if (!saved) return;
    state.layout = saved.layout;
    state.chords = findAllChords(state.layout);
    state.selectedChord = null;
    state.shellMode = 'both';
    state.chordFilter = { category: 'All', root: 'All' };
    state.view = 'editor';
    render();
    return;
  }

  if (action === 'delete-saved') {
    deleteLayout(el.dataset.id);
    state.savedLayouts = getSavedLayouts();
    render();
    return;
  }

  // ── Favorites ─────────────────────────────────────────────────────────────
  if (action === 'toggle-favorite') {
    const chordId = el.dataset.chordId;
    const chord = state.chords.find(c => c.id === chordId);
    if (!chord || !state.layout) return;
    const layoutId = state.layout.isCustom ? (state.layout.savedId || state.layout.id) : state.layout.id;
    const favId = `${layoutId}-${chord.id}`;
    const added = toggleFavorite({
      id: favId,
      layoutId,
      layoutData: state.layout.isCustom ? JSON.parse(JSON.stringify(state.layout)) : null,
      scaleName: state.layout.name,
      chordId: chord.id,
      rootName: chord.rootName,
      typeName: chord.type.name,
      category: chord.type.category,
      notes: chord.notes,
      noteCount: chord.noteCount,
    });
    state.favorites = getFavorites();
    showToast(added ? '♥ Added to My Chords' : 'Removed from My Chords');
    render();
    return;
  }

  if (action === 'open-favorite') {
    const fav = state.favorites.find(f => f.id === el.dataset.id);
    if (!fav) return;
    if (fav.layoutData) {
      state.layout = fav.layoutData;
    } else {
      const saved = state.savedLayouts.find(l => l.id === fav.layoutId);
      if (saved) {
        state.layout = saved.layout;
      } else {
        const scale = SCALES.find(s => s.id === fav.layoutId);
        if (!scale) { showToast('Scale not found'); return; }
        state.layout = createLayoutFromScale(scale);
      }
    }
    state.chords = findAllChords(state.layout);
    state.selectedChord = state.chords.find(c => c.id === fav.chordId) || null;
    state.shellMode = 'both';
    state.chordFilter = { category: 'All', root: 'All' };
    state.view = 'chords';
    history.pushState(null, '', stateToHash());
    render();
    return;
  }

  // ── Navigation ────────────────────────────────────────────────────────────
  if (action === 'back-selector') {
    state.view = 'selector';
    state.layout = null;
    state.selectedChord = null;
    state.pendingSlot = null;
    history.pushState(null, '', location.pathname);
    render();
    return;
  }

  if (action === 'back-editor') {
    state.view = 'editor';
    state.selectedChord = null;
    history.replaceState(null, '', stateToHash());
    render();
    return;
  }

  // ── Pan rotation ──────────────────────────────────────────────────────────
  if (action === 'toggle-rotation') {
    state.ringRotated = !state.ringRotated;
    render();
    return;
  }

  if (action === 'toggle-flats') {
    state.useFlats = !state.useFlats;
    render();
    return;
  }

  // ── Editor ────────────────────────────────────────────────────────────────
  if (action === 'shell-mode') {
    state.shellMode = el.dataset.mode;
    render();
    return;
  }

  if (action === 'clone-layout') {
    state.layout = {
      ...state.layout,
      isCustom: true,
      id: 'custom',
      name: state.layout.name + ' (Custom)',
      top: {
        ...state.layout.top,
        slots: state.layout.top.slots.map(s => ({ ...s })),
      },
      bottom: {
        ...state.layout.bottom,
        slots: state.layout.bottom.slots.map(s => ({ ...s })),
      },
    };
    render();
    return;
  }

  if (action === 'go-chords') {
    state.chords = findAllChords(state.layout);
    state.selectedChord = null;
    state.chordFilter = { category: 'All', root: 'All' };
    state.view = 'chords';
    history.pushState(null, '', stateToHash());
    render();
    return;
  }

  if (action === 'adjust-capacity') {
    const shell = el.dataset.shell;
    const delta = parseInt(el.dataset.delta);
    const target = state.layout[shell];
    const newCap = Math.max(0, Math.min(12, target.capacity + delta));
    if (newCap === target.capacity) return;

    if (delta > 0) {
      target.slots.push({ note: null });
    } else {
      // Only remove last slot if it's empty
      const lastIdx = target.slots.length - 1;
      if (lastIdx >= 0 && target.slots[lastIdx].note === null) {
        target.slots.pop();
      } else {
        showToast('Remove the last note first');
        return;
      }
    }
    target.capacity = newCap;
    state.chords = findAllChords(state.layout);
    render();
    return;
  }

  // Note picker: cancel
  if (action === 'close-picker') {
    state.pendingSlot = null;
    render();
    return;
  }

  // Note picker: pick a note
  if (action === 'pick-note') {
    const note = el.dataset.note;
    const slot = state.pendingSlot;
    if (!slot) return;

    if (slot.shell === 'ding') {
      state.layout.top.ding = note;
    } else if (slot.shell === 'top') {
      while (state.layout.top.slots.length <= slot.index) {
        state.layout.top.slots.push({ note: null });
      }
      state.layout.top.slots[slot.index].note = note;
    } else {
      while (state.layout.bottom.slots.length <= slot.index) {
        state.layout.bottom.slots.push({ note: null });
      }
      state.layout.bottom.slots[slot.index].note = note;
    }

    state.pendingSlot = null;
    state.chords = findAllChords(state.layout);
    initAudio();
    playNote(note);
    render();
    return;
  }

  // ── Chord explorer ─────────────────────────────────────────────────────────
  if (action === 'filter-category') {
    state.chordFilter.category = el.dataset.cat;
    render();
    return;
  }

  if (action === 'select-chord') {
    const chord = state.chords.find(c => c.id === el.dataset.id);
    if (!chord) return;
    state.selectedChord = chord;
    history.replaceState(null, '', stateToHash());
    // Preserve chord list scroll position across render
    const chordList = document.querySelector('.chord-list');
    const savedScroll = chordList?.scrollTop ?? 0;
    render();
    const newChordList = document.querySelector('.chord-list');
    if (newChordList) newChordList.scrollTop = savedScroll;
    // Arpeggiate then play together; show playing animation at the "together" moment
    initAudio();
    playChord(chord.notes);
    const arpMs = chord.notes.length * 300 + 350;
    setTimeout(() => updatePanPlaying(chord.notes), arpMs);
    return;
  }

  if (action === 'play-chord') {
    if (!state.selectedChord) return;
    initAudio();
    playChord(state.selectedChord.notes);
    const arpMs = state.selectedChord.notes.length * 300 + 350;
    setTimeout(() => updatePanPlaying(state.selectedChord.notes), arpMs);
    return;
  }

  if (action === 'play-scale') {
    const allNotes = getAllNotes(state.layout);
    initAudio();
    playScale(allNotes);
    updatePanPlaying(allNotes);
    return;
  }

  if (action === 'filter-chord-count') {
    state.chordCountFilter = el.dataset.val;
    render();
    return;
  }

  if (action === 'copy-url') {
    const url = location.origin + location.pathname + stateToHash();
    navigator.clipboard.writeText(url).then(() => showToast('URL copied!'));
    return;
  }
});

// ── Change delegation (select dropdowns) ─────────────────────────────────────
document.addEventListener('change', e => {
  if (e.target.dataset.action === 'filter-root') {
    state.chordFilter.root = e.target.value;
    render();
  }
});

// ── Input delegation ──────────────────────────────────────────────────────────
document.addEventListener('input', e => {
  if (e.target.id === 'scale-search-input') {
    state.scaleSearch = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const input = document.getElementById('scale-search-input');
    if (input) { input.focus(); input.setSelectionRange(pos, pos); }
    return;
  }
  if (e.target.id === 'custom-name-input' && state.layout) {
    state.layout.name = e.target.value;
  }
});

// ── Browser back/forward ──────────────────────────────────────────────────────
window.addEventListener('popstate', () => {
  Object.assign(state, {
    view: 'selector', layout: null, selectedChord: null,
    pendingSlot: null, chords: [], shellMode: 'both',
    chordFilter: { category: 'All', root: 'All' },
  });
  loadFromHash();
  render();
});

  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
