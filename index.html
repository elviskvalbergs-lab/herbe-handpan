  margin: 0 calc(-1 * var(--gutter)); padding: var(--space-2) var(--gutter) var(--space-3);
  background: var(--bg);
}
.search-field { position: relative; }
.search-field > .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--text-3); pointer-events: none; }
.search-field .input { padding-left: 40px; }
.scale-tools + .list-title { margin-top: var(--space-3); }
.scale-row .row-meta + .row-meta { -webkit-line-clamp: 1; }
.scale-row { min-height: 64px; }
@media (min-width: 1024px) {
  .scale-tools { flex-direction: row; align-items: center; }
  .scale-tools .search-field { flex: 0 1 420px; }
  .scale-tools .chips-scroll { margin: 0; padding: 0; }
  .scale-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--space-3); background: none; border: 0; overflow: visible; }
  .scale-list > .row { align-items: start; background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r-md); padding: var(--space-4); }
  .scale-list > .row::before { display: none; }
  @media (hover: hover) { .scale-list > .row:hover { border-color: var(--border-strong); background: var(--surface-1); } }
  .scale-list .row-meta + .row-meta { -webkit-line-clamp: 3; }
}

/* Listen: find a handpan scale by ear (Try a scale, wizard) */
.listen { margin: var(--space-1) 0 var(--space-4); }
.listen.is-idle { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); }
.listen.is-idle .btn { flex: none; }
.listen.is-idle .listen-hint { flex: 1 1 200px; margin: 0; }
.listen-hint { margin: var(--space-3) 0 0; font-size: var(--fs-13); line-height: var(--lh-13); color: var(--text-3); }
.listen-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2) var(--space-3); }
.listen-status { margin: 0; flex: 1 1 200px; min-width: 0; color: var(--text-1); font-weight: var(--fw-semibold); display: flex; align-items: center; gap: var(--space-2); }
.listen-status .is-danger { color: var(--danger); font-weight: var(--fw-medium); }
.listen-actions { display: flex; gap: var(--space-2); flex: none; margin-left: auto; }
.listen-dot { flex: none; width: 8px; height: 8px; border-radius: var(--r-full); background: var(--accent); animation: rec-pulse 1s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .listen-dot { animation: none; } }
.listen-notes { margin-top: var(--space-3); }
.listen-chip { min-height: var(--touch); padding: 0 10px 0 14px; font-variant-numeric: tabular-nums; }
.listen-chip .ico { width: 16px; height: 16px; color: var(--text-3); }
.listen-ding { font-size: var(--fs-12); color: var(--text-3); font-weight: var(--fw-medium); }
.listen + .list-title { margin-top: 0; }

/* Home: My instruments (§6.5) */
.home { display: flex; flex-direction: column; gap: var(--space-4); }
.home-main { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
.home-side { min-width: 0; display: flex; flex-direction: column; gap: var(--space-4); }
.home-side .list-title { margin: var(--space-2) 0 var(--space-2); }
.home .row-meta .badge { margin-right: var(--space-1); vertical-align: 1px; }
.tip-card { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-2) var(--space-3) var(--space-4); }
.tip-title { font-weight: var(--fw-semibold); color: var(--text-1); }
.tip-body { font-size: var(--fs-13); line-height: var(--lh-13); color: var(--text-3); }
@media (min-width: 1024px) {
  .home { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--space-6); align-items: start; }
  .home-instruments { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .home-instruments > .row::before { display: none; }
  .home-add { justify-self: start; width: auto; }
  .home-side .list-title:first-child { margin-top: 0; }
}

/* Home row menu: a sheet on phones, a small modal from 600px */
.sheet-rowmenu .row.is-danger .row-lead { color: var(--danger); }
@media (min-width: 600px) { .sheet-rowmenu .sheet { width: min(360px, 100%); } }

/* Add-instrument wizard (§6.1–6.4) */
.wizard { max-width: var(--reading-max); margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-4); }
.wizard-count { font-size: var(--fs-13); line-height: var(--lh-13); color: var(--text-3); margin-bottom: calc(-1 * var(--space-3)); }
.wizard .wizard-title { font: var(--fw-semibold) var(--fs-24)/var(--lh-24) var(--font); color: var(--text-1); }
.wizard-sub { color: var(--text-2); }
.wizard-title + .wizard-sub { margin-top: calc(-1 * var(--space-3)); }
.wizard-notice { display: flex; align-items: center; gap: var(--space-2); color: var(--success); font-weight: var(--fw-semibold); }
.wizard-notice .ico { width: 20px; height: 20px; }
.wizard-foot, .wizard-summary { font-size: var(--fs-13); line-height: var(--lh-13); color: var(--text-3); }
.wizard-form { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.wizard .scale-tools { margin-bottom: calc(-1 * var(--space-3)); }
.wizard .list-title { margin: 0 0 calc(-1 * var(--space-2)); }
.family-tile { min-height: 72px; }
.family-tile.is-on { background: var(--surface-2); }
.checkbox {
  display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; margin-right: var(--space-2);
  border: 2px solid var(--border-strong); border-radius: var(--r-sm); color: var(--on-selected);
}
.family-tile.is-on .checkbox { background: var(--selected-bg); border-color: var(--selected-bg); }
.checkbox .ico { width: 16px; height: 16px; stroke-width: 3; }
.family-tile .badge { margin-right: var(--space-2); }
.wizard-paths .row { min-height: 80px; }
.note-strip { gap: 6px; }
.note-strip .chip { height: 36px; padding: 0 10px; cursor: default; }
.window-nav { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.window-nav .chip { grid-column: 1 / -1; order: 3; }
.window-nav .btn .ico { width: 16px; height: 16px; }
.wizard-preview { display: none; }
@media (min-width: 1024px) {
  .wizard-design { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: var(--space-6); align-items: start; }
  .wizard-preview { display: block; position: sticky; top: calc(var(--appbar-h) + var(--space-4)); padding: var(--space-4); background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r-md); }
}

/* Wizard action bar: fixed at the bottom on phones and tablets, inline on desktop */
.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-tabbar);
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
  padding: var(--space-3) var(--space-4) calc(var(--space-3) + env(safe-area-inset-bottom));
  background: var(--bg); border-top: 1px solid var(--border);
}
.actionbar-start, .actionbar-end { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.actionbar-end { margin-left: auto; }
.actionbar .btn-lg .ico { width: 20px; height: 20px; }
.actionbar-help {
  position: absolute; left: 0; right: 0; bottom: 100%; padding: var(--space-2) var(--space-4);
  background: var(--bg); color: var(--text-3); font-size: var(--fs-13); line-height: var(--lh-13); text-align: right;
}
body.has-actionbar .main { padding-bottom: calc(var(--actionbar-h) + env(safe-area-inset-bottom) + var(--space-10)); }
@media (min-width: 1024px) {
  .actionbar { position: static; padding: var(--space-4) 0 0; margin-top: var(--space-2); }
  .actionbar-help { position: static; order: 2; padding: 0; background: none; }
  body.has-actionbar .main { padding-bottom: var(--space-8); }
}

/* Handpan Chords (§6.7). Phone: the pan and the selected-chord bar stick
   under the app bar while the page (the chord list) scrolls under them.
   ≥600px: list column at the left with its own scroll, pan and chord card
   at the right. */
.hp-chords { display: flex; flex-direction: column; gap: var(--space-4); }
.hp-stage {
  position: sticky; top: calc(var(--appbar-h) + env(safe-area-inset-top)); z-index: 5;
  display: flex; flex-direction: column; gap: var(--space-2);
  margin: calc(-1 * var(--space-3)) calc(-1 * var(--gutter)) 0;
  padding: var(--space-3) var(--gutter); background: var(--bg); border-bottom: 1px solid var(--border);
}
.hp-pan svg { width: min(100%, calc(100vw - 2 * var(--gutter)), 36dvh); max-width: none; height: auto; }
.hp-card {
  display: flex; flex-direction: column; gap: var(--space-3); min-height: 64px;
  padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3);
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r-md);
}
.hp-card.is-empty { flex-direction: row; align-items: center; justify-content: space-between; gap: var(--space-3); }
.hp-card-hint { color: var(--text-2); }
.hp-card-head { display: flex; align-items: center; gap: var(--space-2); min-height: 46px; }
.hp-card-text { flex: 1; min-width: 0; }
.hp-card-title {
  font: var(--fw-semibold) var(--fs-17)/var(--lh-17) var(--font); color: var(--text-1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hp-card-meta {
  font-size: var(--fs-13); line-height: var(--lh-13); color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hp-card-actions { display: flex; align-items: center; gap: var(--space-1); flex-shrink: 0; }
.hp-play { padding: 0 var(--space-3); }
.hp-related .overline { margin: var(--space-3) 0 var(--space-2); }
.hp-related .overline:first-child { margin-top: 0; }
.sheet .hp-related { padding: var(--space-4) 0 var(--space-2); }
.hp-heart.is-on { color: var(--accent-text); }
.hp-heart.is-on .ico { fill: currentColor; }
.hp-list { min-width: 0; }
.hp-list-head { display: flex; flex-direction: column; gap: var(--space-3); margin-bottom: var(--space-3); }
.hp-filter-row { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.hp-filter-btn { flex-shrink: 0; padding: 0 var(--space-3); }
.hp-roots { flex: 1; min-width: 0; margin-left: 0; padding-left: 0; }
.hp-count, .hp-hint { font-size: var(--fs-13); line-height: var(--lh-13); color: var(--text-3); }
.hp-hint { color: var(--text-2); }
.hp-identify { display: flex; flex-direction: column; gap: var(--space-3); }
.hp-identify-notes { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); flex-wrap: wrap; }
.hp-note-chip { cursor: default; height: 36px; }
.chord-row .row-trail { gap: 0; }
.hp-now {
  display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3);
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r-md);
}
.hp-now-top { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.hp-now-top > .ico { width: 20px; height: 20px; color: var(--text-3); }
.hp-now-name { flex: 1; min-width: 0; font-weight: var(--fw-semibold); color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hp-now-pos { font-size: var(--fs-13); font-weight: var(--fw-semibold); color: var(--text-2); }
.hp-now-ctl { display: flex; gap: var(--space-2); }
.hp-now-ctl .btn { flex: 1; }
.hp-secs { width: 96px; flex-shrink: 0; }
.hp-sheet-form { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-1) 0 var(--space-4); }
.hp-sheet-form .list .row { min-height: 52px; }
@media (max-width: 599px) {
  .hp-wide { display: none !important; }
  .hp-chords.is-identify .hp-stage { padding-bottom: var(--space-3); }
}
@media (min-width: 600px) {
  .hp-narrow { display: none !important; }
  .hp-chords {
    --hp-top: calc(var(--appbar-h) + env(safe-area-inset-top) + var(--space-4));
    --hp-list-h: calc(100dvh - var(--hp-top) - var(--tabbar-h) - env(safe-area-inset-bottom) - var(--space-4));
    display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: var(--space-4); align-items: start;
  }
  body.tuner-on .hp-chords { --hp-list-h: calc(100dvh - var(--hp-top) - var(--tabbar-h) - var(--tuner-h) - env(safe-area-inset-bottom) - var(--space-4)); }
  .hp-list {
    grid-column: 1; grid-row: 1; position: sticky; top: var(--hp-top);
    max-height: var(--hp-list-h); overflow-y: auto; overscroll-behavior: contain;
  }
  .hp-list-head { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-bottom: var(--space-3); margin-bottom: 0; }
  .hp-filter-row { flex-direction: column; align-items: stretch; }
  .hp-filter-btn { align-self: flex-start; }
  .hp-roots { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
  .hp-stage {
    grid-column: 2; grid-row: 1; top: var(--hp-top); z-index: 1;
    margin: 0; padding: 0; border: 0; background: none; gap: var(--space-4);
    /* Taller than the window (a small window, many related chords): it scrolls. */
    max-height: var(--hp-list-h); overflow-y: auto; overscroll-behavior: contain;
  }
  .hp-pan svg { width: min(100%, 60dvh); }
  .hp-card { padding: var(--space-4); }
  .hp-card-head { flex-wrap: wrap; }
  .hp-card-title { font-size: var(--fs-20); line-height: var(--lh-20); }
}
@media (min-width: 1024px) {
  .hp-chords {
    --hp-list-h: calc(100dvh - var(--hp-top) - var(--space-4));
    grid-template-columns: 340px minmax(0, 1fr); gap: var(--space-6);
  }
  body.tuner-on .hp-chords { --hp-list-h: calc(100dvh - var(--hp-top) - var(--tuner-h) - var(--space-8)); }
  /* The pan leaves room for the chord card and its related chords below it. */
  .hp-pan svg { width: min(100%, 64dvh, max(240px, calc(100dvh - 400px))); }
  .hp-card { padding: var(--space-5); }
}
/* Short landscape (phone on its side): list | chord card | pan */
@media (max-height: 500px) and (min-width: 620px) {
  .main { padding-top: 6px; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  body.has-tabbar .main { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 6px); }
  .hp-chords { --hp-top: calc(var(--appbar-h) + env(safe-area-inset-top) + 6px); grid-template-columns: 220px minmax(0, 1fr); gap: var(--space-2); }
  .hp-stage { display: grid; grid-template-columns: minmax(170px, 240px) minmax(0, 1fr); gap: var(--space-2); align-items: start; }
  .hp-stage .hp-card { grid-column: 1; grid-row: 1; padding: var(--space-3); }
  .hp-stage .hp-pan { grid-column: 2; grid-row: 1; }
  .hp-pan svg { width: min(100%, var(--hp-list-h)); }
  .hp-card-title { font-size: var(--fs-17); line-height: var(--lh-17); }
  /* The list head scrolls away with the list, roots on one scrolling line. */
  .hp-list-head { position: static; gap: var(--space-2); }
  .hp-filter-row { flex-direction: row; align-items: center; }
  .hp-roots { flex-wrap: nowrap; overflow-x: auto; }
}
@media (max-width: 599px) {
  /* Keyboard focus and in-page scrolling keep list rows clear of the sticky stage and the tab bar. */
  html:has(.hp-stage) { scroll-padding-top: calc(var(--appbar-h) + 36dvh + 120px); scroll-padding-bottom: calc(var(--tabbar-h) + 16px); }
}
@media (min-width: 1024px) {
  /* Back and Next stay in reach under a tall diagram. */
  .practice-bar { position: sticky; bottom: 0; z-index: 5; margin-top: 0; padding: var(--space-3) 0 var(--space-4); background: var(--bg); }
  body.tuner-on .practice-bar { bottom: calc(var(--tuner-h) + var(--space-6)); }
}

/* No browser zoom: the layout is built for phones. Double-tap zoom is off
   (fast taps on pan notes and buttons never zoom), and on touch screens
   every field uses at least 16px text so iOS never zooms in on focus. The
   viewport meta in build.py also caps the scale at 1. */
html { touch-action: manipulation; }
@media (pointer: coarse) {
  input, select, textarea { font-size: max(16px, 1em) !important; }
}

/* Flute: key and octave of an any-key chart, Detect with tuner, recorded steps */
.fl-key { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-4); }
@media (min-width: 600px) { .fl-key { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.fl-detect { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); }
.fl-detect .btn { flex: none; }
.fl-detect-status { margin: 0; flex: 1 1 200px; min-width: 0; }
.fl-detect-status .ico { width: 16px; height: 16px; vertical-align: -3px; }
.fl-pattern { letter-spacing: 0.05em; color: var(--text-2); }
.fl-recorded { margin: var(--space-2) 0 0; text-align: center; }
.fl-detect-status .is-warning, .fl-step .is-warning { color: var(--warning); }
.rec-help .rec-hz { color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ── Instrument photo and hole layout (bought ocarinas) ─────────────────── */
.row-lead .row-avatar { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; display: block; }
.ie-photo { display: flex; align-items: center; gap: var(--space-3); }
.ie-photo-img, .ie-photo-empty { width: 88px; height: 88px; border-radius: 12px; object-fit: cover; flex: none;
  background: var(--surface-2); display: grid; place-items: center; color: var(--text-3); }
.ie-photo-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.ie-photo-actions label { cursor: pointer; }
.btn-link { background: none; border: 0; padding: 0; color: var(--text-1); text-decoration: underline; font: inherit; cursor: pointer; }
.hm-svg { width: 100%; height: auto; display: block; border-radius: 12px; }
.hm-svg .hm-blank { fill: var(--surface-2); stroke: var(--border); stroke-width: 4; }
.hm-spot circle { fill: rgba(255, 255, 255, 0.18); stroke: #fff; stroke-width: 6; }
.hm-spot.is-sel circle { stroke: var(--accent); stroke-width: 10; fill: rgba(205, 76, 56, 0.25); }
.hm-spot.is-closed circle { fill: rgba(0, 0, 0, 0.75); stroke: #fff; stroke-width: 8; }
.hm-spot.is-open circle { fill: #fff; stroke: var(--accent); stroke-width: 16; }
.hm-num { fill: #fff; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: central;
  paint-order: stroke; stroke: rgba(0, 0, 0, 0.7); stroke-width: 6px; }
.hm-under { fill: #fff; font-size: 34px; paint-order: stroke; stroke: rgba(0, 0, 0, 0.7); stroke-width: 6px; }
.hm-stage { cursor: crosshair; margin: var(--space-3) 0; touch-action: manipulation; }
.hm-preview { display: block; width: 100%; padding: 0; border: 0; background: none; margin-top: var(--space-3); cursor: pointer; }
.hm-chips { margin: var(--space-2) 0; }
.hm-chip svg { width: 14px; height: 14px; vertical-align: -2px; }
.s-reading-map { width: 64px; flex: none; }
.s-reading-map .hm-svg { border-radius: 6px; }
.s-reading-head:has(.s-reading-map) .s-reading-label { flex: 1; }
/* Fingering diagram drawn on the instrument's own photo */
.fingering .fg-photo { opacity: 0.85; }
.fingering .fg-photo-frame { fill: none; stroke: var(--border); stroke-width: 1; }
.scale-row.listen-match .row-meta + .row-meta { -webkit-line-clamp: 3; }

.oc-steps-legend { margin-top: var(--space-3); flex-wrap: wrap; }
.oc-steps-legend .icon-btn, .oc-steps-legend .btn-icon { margin-left: auto; }
/* Holes drawn on a photo: white outline so they read on dark clay, finger name under the hole */
.fingering .fg-on-photo .fg-c, .fingering .fg-on-photo.fg-c { fill: #111; stroke: #fff; stroke-width: 2; }
.fingering .fg-on-photo .fg-o, .fingering .fg-on-photo.fg-o { fill: #fff; stroke: #111; stroke-width: 1.5; }
.fingering .fg-finger-photo { fill: #fff; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central;
  paint-order: stroke; stroke: rgba(0, 0, 0, 0.8); stroke-width: 3px; }
.fingering .fg-on-photo.fg-changed, .fingering .fg-on-photo.fg-changed circle { stroke: var(--accent); stroke-width: 4; }

/* Changing a note's fingering by hand */
.fingering .fg-edit-hole { cursor: pointer; }
.fingering .fg-edit-target { fill: transparent; stroke: none; }
.fg-stage.is-editing { padding: var(--space-3); border: 2px dashed var(--border-strong, var(--border)); border-radius: var(--r-md, 12px); }
.fg-stage.is-editing .fingering { width: 100%; height: auto; }
.fg-edit-help { font-size: var(--fs-13); color: var(--text-2); margin: var(--space-2) 0 0; }
.fg-edit-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-3); }
.fg-edit-open { margin: var(--space-2) auto 0; display: flex; }
.fg-edit-rec { margin-top: var(--space-3); }
.s-reverse { display: flex; width: 100%; justify-content: flex-start; text-align: left; margin-bottom: var(--space-2); white-space: normal; }
.ie-fingers { margin: var(--space-2) 0 var(--space-3); }
.fg-yours { text-align: center; margin: var(--space-2) 0 0; }

/* Chord player: one picture at a time, so a whole chord fits on a phone screen */
.oc-voicing.is-inline { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.oc-voicing.is-inline .oc-label { margin: 0; }
.chip.is-dense { min-height: 32px; padding: 2px 10px; font-size: var(--fs-13); }
.oc-player { margin-top: var(--space-3); }
.oc-player-notes { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }
.oc-pnote { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 6px 12px; border-radius: 22px;
  border: 1px solid var(--border); background: var(--surface-1); color: var(--text-1); font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; }
.oc-pnote-num { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-3); color: var(--text-2); font-size: 12px; }
.oc-pnote.is-current { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.oc-pnote.is-current .oc-pnote-num { background: var(--accent); color: var(--on-accent, #fff); }
.oc-player.is-playing .oc-pnote.is-current { background: var(--accent-soft); }
.oc-pnote-sep { color: var(--text-3); display: inline-flex; }
.oc-pnote-sep svg { width: 16px; height: 16px; }
.oc-pstage { display: none; margin-top: var(--space-2); }
.oc-pstage.is-current { display: block; }
.oc-pstage-fg { display: block; width: 100%; max-width: 420px; margin: 0 auto; padding: 6px; border: 1px solid var(--border);
  border-radius: var(--r-sm); background: var(--surface-1); color: inherit; cursor: pointer; }
.oc-player.is-playing .oc-pstage.is-current .oc-pstage-fg { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.oc-pstage-fg .fingering { width: 100%; height: auto; display: block; max-height: 42vh; }
.oc-pstage-move { margin-top: var(--space-2); font-size: 17px; line-height: 1.35; color: var(--text-2); text-align: center; min-height: 2.7em; }
.oc-pstage-move strong { color: var(--text-1); }

// Note name → semitone offset (0–11)
const NOTE_TO_SEMI = {
  'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'F':5,
  'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11
};

// Normalize to preferred flat/sharp spelling
const ENHARMONIC = { 'D#':'Eb','A#':'Bb','G#':'Ab','Db':'C#','Gb':'F#' };

const SHARP_NAMES   = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_NAMES    = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const SOLFEGE_SHARP = ['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const SOLFEGE_FLAT  = ['Do','Reb','Re','Mib','Mi','Fa','Solb','Sol','Lab','La','Sib','Si'];

// Display a note. Accepts 'G#3' or 'G#'. useFlats picks flat/sharp spelling;
// useSolfege switches to fixed-do solfège (Do/Re/Mi…) instead of letters.
function displayNote(note, useFlats, useSolfege = false) {
  const m = note.match(/^([A-G][#b]?)(\d*)$/);
  if (!m) return note;
  const pc = NOTE_TO_SEMI[m[1]];
  if (pc === undefined) return note;
  if (useSolfege) return (useFlats ? SOLFEGE_FLAT : SOLFEGE_SHARP)[pc] + m[2];
  return (useFlats ? FLAT_NAMES : SHARP_NAMES)[pc] + m[2];
}

function normalizeNote(note) {
  const m = note.match(/^([A-G][#b]?)(\d)$/);
  if (!m) return note;
  const name = ENHARMONIC[m[1]] ?? m[1];
  return name + m[2];
}

function noteToMidi(note) {
  const m = note.match(/^([A-G][#b]?)(\d)$/);
  if (!m) return 0;
  return (parseInt(m[2]) + 1) * 12 + NOTE_TO_SEMI[m[1]];
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function noteToFreq(note) { return midiToFreq(noteToMidi(note)); }

function getNoteName(note) {
  const m = note.match(/^([A-G][#b]?)/);
  return m ? m[1] : note;
}

function notePC(note) { return noteToMidi(note) % 12; }

// Build a mutable Layout from a Scale (deep copy with slot wrapping)
function createLayoutFromScale(scale) {
  return {
    id: scale.id,
    name: scale.name,
    isCustom: false,
    top: {
      ding: scale.top.ding,
      slots: scale.top.notes.map(n => ({ note: n })),
      capacity: scale.top.capacity,
    },
    bottom: {
      slots: Array.from({ length: scale.bottom.capacity }, (_, i) => ({
        note: scale.bottom.notes[i] ?? null,
      })),
      capacity: scale.bottom.capacity,
    },
  };
}

// Collect all non-null notes from a layout (ding + ring + gu)
function getAllNotes(layout) {
  const notes = [layout.top.ding];
  layout.top.slots.forEach(s => { if (s.note) notes.push(s.note); });
  layout.bottom.slots.forEach(s => { if (s.note) notes.push(s.note); });
  return notes;
}


// ── js/pickmatch.js ──
// Matching for the searchable picker (uiPicker in app.js): which options a
// typed query keeps. Every word of the query must match a word of the
// option's label, group or keywords, in any order, ignoring case and
// diacritics ("kurd 10", "d k", "pygmy 17", "f#", "fa#", "re4").
//
// Pure functions; unit tested in Node (tests/pickmatch.test.mjs).

// Lower case, without diacritics, ♯ → #, ♭ → b.
function pickFold(s) {
  return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/♯/g, '#').replace(/♭/g, 'b').toLowerCase();
}

// The words of a text: letters, digits and #, split on anything else.
function pickWords(s) {
  return pickFold(s).split(/[^a-z0-9#]+/).filter(Boolean);
}

// What a query is matched against for one option { label, group, keywords }.
function pickIndex(opt) {
  const text = [opt.label, opt.group, ...(opt.keywords ?? [])].filter(Boolean).join(' ');
  return { words: pickWords(text), text: pickFold(text) };
}

// A note as a word: name (letter or solfège), accidental, octave.
const PICK_NOTE = /^([a-g]|do|re|mi|fa|sol|la|si)(#|b)?(\d*)$/;

// A query word matches the start of a word ("pyg" → "Pygmy", "e4" → "E4");
// one of three or more letters also matches inside a word ("ziska"). A note
// matches only the same note: "d" finds D and D3 but not Db or Do#, "fa#"
// finds Fa#3.
function pickWordMatch(t, words, text) {
  const tn = t.match(PICK_NOTE);
  return words.some(w => {
    const wn = tn && w.match(PICK_NOTE);
    if (wn) return tn[1] === wn[1] && (tn[2] ?? '') === (wn[2] ?? '') && wn[3].startsWith(tn[3]);
    return w.startsWith(t);
  }) || (!tn && t.length >= 3 && text.includes(t));
}

function pickMatches(query, index) {
  return pickWords(query).every(t => pickWordMatch(t, index.words, index.text));
}

// The options a query keeps, in their order.
function pickFilter(options, query) {
  if (!pickWords(query).length) return options.slice();
  return options.filter(o => pickMatches(query, pickIndex(o)));
}

// A note in every spelling a user might type: sharps, flats and solfège
// ('F#3' → F#3, Gb3, Fa#3, Solb3), so a search finds it whatever notation
// the app shows.
function noteSearchWords(note) {
  const out = [];
  for (const us of [false, true]) {
    for (const uf of [false, true]) {
      const n = displayNote(note, uf, us);
      if (!out.includes(n)) out.push(n);
    }
  }
  return out;
}
