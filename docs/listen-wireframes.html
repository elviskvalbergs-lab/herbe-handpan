<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listen wireframes</title>
<style>
  :root { --ink: #1d2b24; --mute: #6b7d74; --line: #b9c6be; --soft: #eef2ef; --bg: #f6f8f6; --acc: #c2412e; --ok: #17734e; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .intro { color: var(--mute); max-width: 760px; margin: 0 0 24px; }
  .grid { display: flex; flex-wrap: wrap; gap: 28px; }
  figure { margin: 0; width: 300px; }
  figcaption { font-weight: 600; margin-bottom: 8px; }
  figcaption small { display: block; font-weight: 400; color: var(--mute); }
  .phone { width: 300px; height: 600px; border: 2px solid var(--ink); border-radius: 28px; background: #fff; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .bar { height: 44px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 14px; font-weight: 600; }
  .bar .sp { flex: 1; }
  .mic { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); }
  .body { flex: 1; overflow: hidden; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .tabs { height: 46px; border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; color: var(--mute); font-size: 11px; }
  .tabs b { color: var(--ink); border-top: 2px solid var(--acc); padding-top: 4px; }
  .pic { border: 1px dashed var(--line); border-radius: 12px; background: var(--soft); display: grid; place-items: center; color: var(--mute); font-size: 12px; }
  .pan { width: 150px; height: 150px; border-radius: 50%; border: 2px solid var(--line); position: relative; background: #fff; margin: auto; }
  .pan i { position: absolute; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; font: 9px/22px system-ui; text-align: center; font-style: normal; }
  .pan i.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  .pan i.on2 { background: #d9a62e; border-color: #d9a62e; color: #241c05; }
  .pan i.on3 { background: #3fa7a6; border-color: #3fa7a6; color: #04211f; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .big { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .huge { font-size: 56px; font-weight: 800; line-height: 1; }
  .meta { color: var(--mute); font-size: 12px; }
  .btn { border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 600; background: #fff; }
  .btn.p { background: var(--acc); border-color: var(--acc); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { border: 1px solid var(--line); border-radius: 14px; padding: 3px 9px; font-size: 12px; font-weight: 600; background: #fff; }
  .chip.cur { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
  .chip.unsure { border-style: dashed; color: var(--mute); }
  .chip.faint { opacity: .45; }
  .meter { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--ok); }
  .loop { border: 2px solid var(--ink); border-radius: 12px; padding: 8px; }
  .banner { background: #fdf0ed; border: 1px solid #f0c8bf; border-radius: 10px; padding: 8px; display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-top: 2px solid var(--ink); border-radius: 18px 18px 0 0; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .scrim { position: absolute; inset: 0; background: rgba(20, 30, 25, .35); }
  .fg { display: inline-grid; place-items: center; width: 56px; height: 38px; border: 1px solid var(--line); border-radius: 8px; font-size: 11px; font-weight: 700; background: #fff; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 70px; }
  .bars span { flex: 1; background: var(--ink); border-radius: 2px 2px 0 0; }
  .bars + .labels { display: flex; gap: 3px; font-size: 9px; color: var(--mute); }
  .bars + .labels span { flex: 1; text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 2px 0; border-bottom: 1px solid var(--soft); }
  td:last-child { text-align: right; }
  .slider { height: 4px; background: var(--line); border-radius: 2px; position: relative; margin: 8px 0; }
  .slider::after { content: ''; position: absolute; left: 40%; top: -5px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); }
</style>
</head>
<body>
<h1>Listen: low-fidelity wireframes</h1>
<p class="intro">Phone size (390 px wide, drawn at 300). Built from the shared Chords screen parts: instrument picture on top, a chord card, the rest below. Grey is structure, red is "now". These are for discussing layout and flow, not the final look. See <code>docs/listen-mode.md</code>.</p>

<div class="grid">

<figure>
  <figcaption>0 · Before the mic opens<small>One sentence, then the browser's own permission prompt.</small></figcaption>
  <div class="phone">
    <div class="bar">D Kurd<span class="sp"></span>⋯</div>
    <div class="body">
      <div class="pic" style="height:170px">pan picture</div>
      <div class="card">
        <div style="font-weight:700">Listen to someone playing</div>
        <p class="meta" style="margin:6px 0">Listen uses the microphone to hear the chords nearby; the sound stays on this phone and isn't recorded.</p>
        <div class="row"><span class="btn p">🎤 Start listening</span><span class="btn">Not now</span></div>
      </div>
      <p class="meta">Works best: one instrument, phone 1–2 m from it. Chords, single notes and whole songs.</p>
    </div>
    <div class="tabs"><span>Chords</span><span>Pan</span><b>Listen</b><span>Playlists</span></div>
  </div>
</figure>

<figure>
  <figcaption>1 · Now: one chord (case a)<small>The detected chord lit on my pan, second guess small. ♡ saves it.</small></figcaption>
  <div class="phone">
    <div class="bar">D Kurd<span class="sp"></span><span class="mic"></span>⋯</div>
    <div class="body">
      <div class="pic" style="height:190px"><div class="pan">
        <i style="left:63px;top:63px">D</i><i class="on" style="left:63px;top:6px">G</i><i style="left:112px;top:28px">A</i>
        <i class="on3" style="left:120px;top:80px">D</i><i style="left:95px;top:118px">E</i><i style="left:30px;top:118px">C</i>
        <i style="left:6px;top:80px">E</i><i style="left:14px;top:28px">F</i>
      </div></div>
      <div class="card">
        <div class="row"><div><div class="big">G</div><div class="meta">G · B · D &nbsp;·&nbsp; or Em7?</div></div><span class="sp" style="flex:1"></span><span class="btn">♡</span><span class="btn p">▶</span></div>
        <div class="meta" style="margin-top:6px">No B on this pan: plays as <b>G – D</b> (root and fifth).</div>
      </div>
      <div class="row meta"><span>Level</span><div class="meter" style="flex:1"><span style="width:62%"></span></div><span>Chords ▾</span></div>
      <div class="meta" style="font-weight:600">Song so far</div>
      <div class="chips"><span class="chip cur">G</span></div>
    </div>
    <div class="tabs"><span>Chords</span><span>Pan</span><b>Listen</b><span>Playlists</span></div>
  </div>
</figure>

<figure>
  <figcaption>2 · Listen phase: a song building up (case b)<small>Timeline live; key with confidence; the loop once it repeats.</small></figcaption>
  <div class="phone">
    <div class="bar">D Kurd<span class="sp"></span><span class="mic"></span>⋯</div>
    <div class="body">
      <div class="pic" style="height:120px">pan, current chord lit</div>
      <div class="card"><div class="row"><div><div class="big">Em</div><div class="meta">E · G · B</div></div><span style="flex:1"></span><span class="btn">♡</span></div></div>
      <div class="row"><b>Key</b><span>G major</span><span class="meta">(or E minor)</span><div class="meter" style="flex:1"><span style="width:78%"></span></div></div>
      <div class="meta">Scale: G A B C D E F#</div>
      <div class="meta" style="font-weight:600">Timeline</div>
      <div class="chips"><span class="chip">G</span><span class="chip">Em</span><span class="chip">C</span><span class="chip">D</span><span class="chip">G</span><span class="chip cur">Em</span><span class="chip unsure">C?</span></div>
      <div class="banner">Loop found: <b>G · Em · C · D</b>, 96 bpm<span style="flex:1"></span><span class="btn p">Play along</span></div>
      <div class="row"><span class="btn">Save progression</span><span class="btn">Pause</span><span class="btn">Clear</span></div>
    </div>
    <div class="tabs"><span>Chords</span><span>Pan</span><b>Listen</b><span>Playlists</span></div>
  </div>
</figure>

<figure>
  <figcaption>3 · Play along: focus view<small>Readable from 1–2 m. Follows the locked loop by the clock; tap to pause.</small></figcaption>
  <div class="phone">
    <div class="bar">Play along<span class="sp"></span><span class="meta">G major · 96</span><span class="mic"></span></div>
    <div class="body" style="gap:12px">
      <div class="pic" style="height:220px">pan, big, Now lit, Next faint</div>
      <div class="row" style="align-items:flex-end"><div><div class="meta">Now</div><div class="huge">C</div></div><span style="flex:1"></span><div style="text-align:right"><div class="meta">Next</div><div class="big" style="color:var(--mute)">D</div></div></div>
      <div class="meter"><span style="width:55%;background:var(--acc)"></span></div>
      <div class="loop chips"><span class="chip">G</span><span class="chip">Em</span><span class="chip cur">C</span><span class="chip">D</span></div>
      <div class="row"><span class="btn">◀ Back to Listen</span><span style="flex:1"></span><span class="btn">❚❚</span></div>
    </div>
  </div>
</figure>

<figure>
  <figcaption>4 · Ocarina: notes for this chord (case c)<small>The chord's notes I can play, then the notes that fit the song.</small></figcaption>
  <div class="phone">
    <div class="bar">Alto C ocarina<span class="sp"></span><span class="mic"></span>⋯</div>
    <div class="body">
      <div class="pic" style="height:130px">fingering of the selected note</div>
      <div class="card">
        <div class="row"><div class="big">Am</div><span class="meta">A · C · E</span><span style="flex:1"></span><span class="btn">♡</span></div>
        <div class="meta" style="margin:6px 0 4px">Notes you can play now</div>
        <div class="row"><span class="fg" style="border-color:var(--acc)">A4 ●</span><span class="fg">C5</span><span class="fg">E5</span><span class="fg">A5</span></div>
      </div>
      <div class="meta" style="font-weight:600">Fits the song (C major)</div>
      <div class="chips"><span class="chip">C</span><span class="chip">D</span><span class="chip">E</span><span class="chip">F</span><span class="chip">G</span><span class="chip">A</span><span class="chip">B</span><span class="chip faint">F# avoid</span></div>
      <div class="meta" style="font-weight:600">Timeline</div>
      <div class="chips"><span class="chip">C</span><span class="chip">G</span><span class="chip cur">Am</span><span class="chip">F</span></div>
    </div>
    <div class="tabs"><span>Notes</span><span>Chords</span><b>Listen</b><span>Set up</span></div>
  </div>
</figure>

<figure>
  <figcaption>5 · Notes: a melody (case d)<small>Switches by itself when it hears one note at a time; "Chords / Notes" overrides.</small></figcaption>
  <div class="phone">
    <div class="bar">D Kurd<span class="sp"></span><span class="mic"></span>⋯</div>
    <div class="body">
      <div class="pic" style="height:190px"><div class="pan">
        <i style="left:63px;top:63px">D</i><i style="left:63px;top:6px">G</i><i class="on" style="left:112px;top:28px">A</i>
        <i style="left:120px;top:80px">D</i><i style="left:95px;top:118px">E</i><i style="left:30px;top:118px">C</i>
        <i style="left:6px;top:80px">Bb</i><i style="left:14px;top:28px">F</i>
      </div></div>
      <div class="card"><div class="row"><div class="huge" style="font-size:44px">A4</div><span class="meta">+4 ¢</span><span style="flex:1"></span><span class="meta">Notes ▾</span></div></div>
      <div class="meta" style="font-weight:600">Last notes</div>
      <div class="chips"><span class="chip">D4</span><span class="chip">E4</span><span class="chip">F4</span><span class="chip">G4</span><span class="chip cur">A4</span></div>
      <div class="meta">Likely scale: <b>D minor</b> · all on your pan</div>
      <div class="row"><span class="btn">▶ Replay</span><span class="btn">Clear</span></div>
    </div>
    <div class="tabs"><span>Chords</span><span>Pan</span><b>Listen</b><span>Playlists</span></div>
  </div>
</figure>

<figure>
  <figcaption>6 · Correct an unsure chord<small>Tap a dashed "?" chip: top guesses, or pick another.</small></figcaption>
  <div class="phone">
    <div class="bar">D Kurd<span class="sp"></span><span class="mic"></span>⋯</div>
    <div class="body"><div class="pic" style="height:150px"></div><div class="chips"><span class="chip">G</span><span class="chip">Em</span><span class="chip unsure">C?</span></div></div>
    <div class="scrim"></div>
    <div class="sheet">
      <div class="row"><b>Which chord was it?</b><span style="flex:1"></span>✕</div>
      <div class="meta">Heard at 0:14, 2 bars. Not sure between these:</div>
      <div class="chips"><span class="chip cur">C</span><span class="chip">Am7</span><span class="chip">Cmaj7</span></div>
      <div class="row"><span class="btn">Pick another chord…</span></div>
      <div class="meta">Your choice is kept for the rest of the song; the key and loop update.</div>
      <div class="row"><span style="flex:1"></span><span class="btn p">Done</span></div>
    </div>
  </div>
</figure>

<figure>
  <figcaption>7 · Debug view<small>For tuning detection with real instruments (Settings › Listen debug).</small></figcaption>
  <div class="phone">
    <div class="bar">Listen debug<span class="sp"></span><span class="mic"></span></div>
    <div class="body">
      <div class="meta" style="font-weight:600">Chroma (smoothed)</div>
      <div class="bars"><span style="height:90%"></span><span style="height:8%"></span><span style="height:20%"></span><span style="height:6%"></span><span style="height:70%"></span><span style="height:12%"></span><span style="height:5%"></span><span style="height:85%"></span><span style="height:9%"></span><span style="height:14%"></span><span style="height:6%"></span><span style="height:18%"></span></div>
      <div class="labels"><span>C</span><span>C#</span><span>D</span><span>Eb</span><span>E</span><span>F</span><span>F#</span><span>G</span><span>Ab</span><span>A</span><span>Bb</span><span>B</span></div>
      <table>
        <tr><td><b>C</b></td><td>0.91</td></tr><tr><td>Cmaj7</td><td>0.74</td></tr><tr><td>Am7</td><td>0.69</td></tr><tr><td>Em</td><td>0.52</td></tr><tr><td>C6</td><td>0.49</td></tr>
      </table>
      <div class="meta">Pitch (YIN): 130.8 Hz · C3 · conf 0.82 · single note? no</div>
      <div class="meta">Noise floor −52 dB · level −18 dB · stable 4/4 frames</div>
      <div class="meta">Peak threshold ×3</div><div class="slider"></div>
      <div class="meta">Smoothing 0.4 s</div><div class="slider"></div>
    </div>
  </div>
</figure>

</div>
</body>
</html>
