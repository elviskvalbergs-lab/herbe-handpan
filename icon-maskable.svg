  <circle cx="96" cy="96" r="80" fill="url(#body)" stroke="#4a8060" stroke-width="2"/>
  <circle cx="96" cy="96" r="68" fill="none" stroke="#2d5a42" stroke-width="1.5" stroke-dasharray="3 5"/>
  <!-- Dome -->
  <circle cx="96" cy="96" r="20" fill="url(#dome)" stroke="#c8a030" stroke-width="1.5"/>
  <!-- Tone fields -->
  <circle cx="96" cy="44"  r="9" fill="#2a7a52" stroke="#50c080" stroke-width="2"/>
  <circle cx="132" cy="60" r="9" fill="#2a7a52" stroke="#50c080" stroke-width="2"/>
  <circle cx="148" cy="96" r="9" fill="#2a7a52" stroke="#50c080" stroke-width="2"/>
  <circle cx="132" cy="132" r="9" fill="#2a7a52" stroke="#50c080" stroke-width="2"/>
  <circle cx="96" cy="148" r="9" fill="#2a7a52" stroke="#50c080" stroke-width="2"/>
  <circle cx="60" cy="132" r="9" fill="#2a7a52" stroke="#50c080" stroke-width="2"/>
  <circle cx="44" cy="96"  r="9" fill="#2a7a52" stroke="#50c080" stroke-width="2"/>
  <circle cx="60" cy="60"  r="9" fill="#2a7a52" stroke="#50c080" stroke-width="2"/>
</svg>
